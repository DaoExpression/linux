.\n3. **Reviewed like code.** These files are in the AIDE and auditd watches\n   (`-w /etc/nftables.conf -p wa`; add `-w /etc/nftables.d/ -p wa -k firewall` if you use fragments).\n4. **Load-test before applying:** `sudo nft -c -f /etc/nftables.conf`.\n\nExample - allow a container's published port from the LAN only:\n\n```nft\n# 2026-10-14: allow the app01 container's metrics port from the WireGuard admin subnet only.\n# Authorised by docs/08 §2. Do not broaden this without a new entry in /etc/paranoid/local-overrides.md\ntable inet filter {\n    chain input {\n        iifname \"lo\" tcp dport 9100 ip saddr 10.66.0.0/24 accept\n    }\n}\n```\n\nRemember: the main input chain already accepts `iif \"lo\"` and drops everything else, so a fragment\nthat re-opens loopback (as above) is only safe because the source is restricted to the admin subnet.\n", "lines": 34, "purpose": "Rules for extending the firewall without silently weakening it.", "notes": [], "annPrefix": "#", "isDoc": true}, "etc/pam.d/README.md": {"path": "etc/pam.d/README.md", "content": "# Wiring pam_faillock and pwquality into Debian's PAM stack\n\nDebian manages `common-auth`, `common-account`, and `common-password` through `pam-auth-update`.\n**Do not hand-edit those files** — the changes will be overwritten by the next `libpam-*` upgrade.\nInstead register the modules with `pam-auth-update` and then enable them.\n\n## 1. faillock (account lockout after failures)\n\nCreate `/usr/share/pam-configs/paranoid-faillock`:\n\n```\nName: Paranoid lockout policy (pam_faillock)\nDefault: yes\nPriority: 300\nAuth-Type: Primary\nAuth:\n\t[default=die]\tpam_faillock.so authfail\n\tauth-sufficient\tpam_faillock.so authsucc\nAccount-Type: Primary\nAccount:\n\trequired\tpam_faillock.so\n```\n\nThen:\n\n```bash\nsudo cp files/etc/security/faillock.conf /etc/security/faillock.conf\nsudo pam-auth-update --enable paranoid-faillock\nsudo grep -n faillock /etc/pam.d/common-auth /etc/pam.d/common-account   # confirm the wiring\nsudo faillock --user admin        # inspect the counter; --reset clears it\n```\n\nNotes that matter on a real machine:\n\n- `pam_faillock` counts failures from `sudo`, `login`, and `su`. It is the console/sudo brute-force\n  control; SSH passwords are already disabled entirely (`docs/04` §2), so there is nothing to brute\n  force over the network.\n- **Keep a console recovery path in mind.** `docs/04` sets `root_unlock_time=60` explicitly so a\n  lockout of root clears quickly. The admin account clears after `unlock_time=900`.\n- If you lock yourself out: boot the rescue ISO (`docs/03` §4 recovery), mount the encrypted root, and\n  remove the `paranoid-faillock` entry from `/etc/pam.d/common-auth`/`common-account` offline.\n\n## 2. pwquality (password policy)\n\nThe Debian `libpam-pwquality` package already ships a `pam-auth-update` profile that reads\n`/etc/security/pwquality.conf` (and `pwquality.conf.d/*.conf`):\n\n```bash\nsudo apt-get install --no-install-recommends libpam-pwquality\nsudo cp files/etc/security/pwquality.conf.d/99-paranoid.conf /etc/security/pwquality.conf.d/\nsudo pam-auth-update --enable pwquality\n# test without changing a real password:\npython3 -c \"import ctypes;l=ctypes.CDLL('libpwquality.so.1');print(l.pwquality_check('aaaaaaaaaaaaaaa'))\" 2>/dev/null || \\\n  echo \"check rules are applied with: sudo passwd admin  (and then abort with Ctrl-C)\"\n```\n\n## 3. Verify the whole stack\n\n```bash\nsudo pam-auth-update --package        # shows the active module set\nsudo faillock --user admin\nsudo pwck ; sudo grpck                 # account/group integrity\nsudo grep -c 'pam_unix\\|pam_faillock' /etc/pam.d/common-auth\n# end-to-end: from a console, fail the password 5 times and confirm the lockout message,\n# then clear it with:  sudo faillock --user admin --reset\n```\n", "lines": 67, "purpose": "How to wire lockout and password policy through pam-auth-update so package upgrades do not erase them.", "notes": [], "annPrefix": "#", "isDoc": true}, "etc/paranoid/README.md": {"path": "etc/paranoid/README.md", "content": "# /etc/paranoid — the state and policy directory for this build\n\nEverything here is created and read by the artefacts in this repo. It exists so the machine's\nsecurity posture is **inspectable**: you can read, in one place, what has been decided and what has\ndrifted.\n\n| Path | Purpose | Mode |\n|---|---|---|\n| `README.md` | this file | 0644 |\n| `package-justifications` | one line per package that is not obviously load-bearing, with the reason and date (docs/09 §1) | 0600 |\n| `modules-lock` | if this file exists, `kernel-modules-lock.service` freezes the module table at boot (Tier 3). Touch to arm, remove to disarm | 0600 |\n| `backup.env` | repository URL + where the restic password file lives (never the password itself) | 0600 |\n| `restic-pass` | the restic repository password. Copy it OFFLINE too. | 0600 |\n| `tier` | the tier you chose (`1`, `2`, or `3`) — read by `scripts/install-hardening.sh --tier auto` and by `verify-hardening.sh` | 0644 |\n| `baseline/` | saved \"healthy\" snapshots (docs/10 §7), the output of `verify-hardening.sh`, and firmware state dumps | 0700 |\n| `lsmod-baseline` | module list captured when you decided to arm `modules-lock` | 0600 |\n| `local-overrides.md` | **your** notes: what you changed from this repo and why. If `verify-hardening.sh` fails and this file explains it, that is a legitimate answer — but it must be written down here, not remembered | 0600 |\n\n## Files that must NEVER live here\n\n- Private keys (Secure Boot, TLS, WireGuard, SSH). Keys live where their daemon requires them, with\n  0600 root:root and, for the highest-value ones, an offline copy.\n- Passwords in plaintext other than `restic-pass` (which is itself a key, and the documented reason\n  it exists is that backups must be restorable without any single other secret).\n- The LUKS header backup. That stays on offline media; the recovery procedure is in docs/03 §4 and\n  docs/10 §6.\n\n## Conventions\n\n- `tier` is authoritative. Run `bash scripts/install-hardening.sh --tier auto` to apply the tier this\n  machine already documents, so a rebuild cannot silently drop to Tier 1.\n- Every change made by `install-hardening.sh` is backed up to `/var/backups/paranoid/<timestamp>/`\n  before it is applied, and the script prints how to roll back. Use it.\n- If a control here conflicts with something you need, change it **in this repo** and re-run\n  `install-hardening.sh`, then `verify-hardening.sh`. Editing files in `/etc` directly is how a\n  hardened machine becomes an undocumented one.\n", "lines": 37, "purpose": "The state directory: what has been decided on this machine, and what must never live in it.", "notes": [], "annPrefix": "#", "isDoc": true}, "etc/profile.d/99-hardening.sh": {"path": "etc/profile.d/99-hardening.sh", "content": "# /etc/profile.d/99-hardening.sh\n# Session hygiene for interactive logins. Sourced by /etc/profile via /etc/profile.d.\n# Deliberately short: nothing here should surprise someone unfamiliar with the machine.\n\n# New files are not world-readable by default.\numask 027\n\n# Do not sit on an unattended root/admin shell forever.\nTMOUT=600\nreadonly TMOUT\nexport TMOUT\n\n# History: no duplicates, no leading-space commands, and never record obvious secrets.\nHISTCONTROL=ignoreboth:erasedups\nHISTIGNORE='ls:ll:cd:pwd:exit:history:clear'\nHISTFILESIZE=5000\nHISTSIZE=5000\n# Commands containing these strings are not written to history at all.\nexport HISTIGNORE=\"$HISTIGNORE:*passwd*:*--password*:*token*:*secret*:*apikey*:*api_key*:*PRIVATE*:*wireguard*:*wg genkey*\"\nshopt -s histappend cmdhist checkwinsize\nexport PROMPT_COMMAND=\"history -a; history -n\"\n\n# Do not send commands to an X server (there should not be one, but be explicit).\n[ -n \"$DISPLAY\" ] && unset DISPLAY\n\n# No mail-check surprises from a mail daemon that is not installed.\nunset MAILCHECK\n\ncase \"$-\" in\n  *i*) : ;;\nesac\n", "lines": 32, "purpose": "Session hygiene: restrictive umask, an idle timeout, and secrets kept out of shell history.", "notes": [{"n": 5, "why": "Anything created in an admin session is not world-readable by default."}, {"n": 8, "why": "An unattended privileged shell closes itself after ten minutes."}, {"n": 9, "why": "The value cannot be unset by the session it protects."}, {"n": 13, "why": "History is bounded and de-duplicated, so it stays useful instead of becoming a data dump."}, {"n": 14, "why": "Commands containing tokens, keys and passwords are never written to shell history at all."}, {"n": 15, "why": "History is bounded and de-duplicated, so it stays useful instead of becoming a data dump."}, {"n": 16, "why": "History is bounded and de-duplicated, so it stays useful instead of becoming a data dump."}, {"n": 18, "why": "Commands containing tokens, keys and passwords are never written to shell history at all."}, {"n": 19, "why": "History is flushed per command, so a session that is killed still leaves a record."}, {"n": 20, "why": "History is flushed per command, so a session that is killed still leaves a record."}, {"n": 23, "why": "No X11 display is exported on a headless server."}], "annPrefix": "#", "isDoc": false}, "etc/security/faillock.conf": {"path": "etc/security/faillock.conf", "content": "# /etc/security/faillock.conf\n# Lockout policy enforced by pam_faillock (see docs/04 §1 for the PAM wiring).\n# Kept deliberately non-permanent so a fat-fingered admin is not locked out of their own server\n# permanently; root_unlock_time is short because root is already password-locked.\n\ndeny = 5\nfail_interval = 900\nunlock_time = 900\nroot_unlock_time = 60\nsilent\naudit\ndir = /var/run/faillock\n", "lines": 13, "purpose": "Turns a password prompt into a dead end after a handful of failures, without permanently bricking admin access.", "notes": [{"n": 5, "why": "Five failures and the account stops accepting guesses."}, {"n": 6, "why": "Only failures inside a 15-minute window count, so an attacker cannot accumulate them slowly over days."}, {"n": 7, "why": "Automatic recovery after 15 minutes - deliberate, so a lockout is not a permanent denial of your own admin access."}, {"n": 8, "why": "Automatic recovery after 15 minutes - deliberate, so a lockout is not a permanent denial of your own admin access."}, {"n": 9, "why": "No indication of whether the account exists or how many tries remain."}, {"n": 10, "why": "Lockouts go into the audit trail, which is a real intrusion signal."}], "annPrefix": "#", "isDoc": false}, "etc/security/limits.d/99-paranoid.conf": {"path": "etc/security/limits.d/99-paranoid.conf", "content": "# /etc/security/limits.d/99-paranoid.conf\n# A core dump of a privileged process is a credential/key leak. No core dumps, ever.\n*       hard    core            0\n*       soft    core            0\nroot    hard    core            0\nroot    soft    core            0\n\n# Reasonable ceilings that stop a runaway service from eating the machine.\n# Tune to your workload - these are deliberately generous enough for Apache mpm_event defaults.\n*       soft    nofile          4096\n*       hard    nofile          16384\nroot    soft    nofile          4096\nroot    hard    nofile          16384\n\n# Fork-bomb ceiling per user (systemd units have their own TasksMax).\n*       soft    nproc           1024\n*       hard    nproc           4096\n\n# Only two concurrent logins as any one user; blocks \"many parallel sessions\" abuse.\n*       hard    maxlogins       2\n\n# Never dump core to a pipe program.\n*       hard    core            0\n", "lines": 24, "purpose": "Stops privileged memory (keys, passwords, heap data) ever reaching a core dump file on disk.", "notes": [{"n": 2, "why": "Root or any daemon must not be able to write a core file: it contains keys, tokens and heap data."}, {"n": 3, "why": "Root or any daemon must not be able to write a core file: it contains keys, tokens and heap data."}, {"n": 4, "why": "Root or any daemon must not be able to write a core file: it contains keys, tokens and heap data."}, {"n": 5, "why": "Root or any daemon must not be able to write a core file: it contains keys, tokens and heap data."}, {"n": 9, "why": "Bounded file descriptors stop a connection flood from exhausting the kernel's file table."}, {"n": 10, "why": "Bounded file descriptors stop a connection flood from exhausting the kernel's file table."}, {"n": 11, "why": "Bounded file descriptors stop a connection flood from exhausting the kernel's file table."}, {"n": 12, "why": "Bounded file descriptors stop a connection flood from exhausting the kernel's file table."}, {"n": 15, "why": "Fork-bomb ceiling per user, complementing the per-unit TasksMax."}, {"n": 16, "why": "Fork-bomb ceiling per user, complementing the per-unit TasksMax."}, {"n": 19, "why": "Two concurrent sessions per account: enough for an admin, not enough for parallel abuse."}, {"n": 22, "why": "Root or any daemon must not be able to write a core file: it contains keys, tokens and heap data."}], "annPrefix": "#", "isDoc": false}, "etc/security/pwquality.conf.d/99-paranoid.conf": {"path": "etc/security/pwquality.conf.d/99-paranoid.conf", "content": "# /etc/security/pwquality.conf.d/99-paranoid.conf\n# Password quality for the one interactive account. Passphrases, not passwords: length first.\nminlen = 16\nminclass = 3\nmaxrepeat = 2\nmaxclassrepeat = 4\nmaxsequence = 4\ngecoscheck = 1\ndictcheck = 1\nusercheck = 1\nenforcing = 1\nretry = 3\nbadwords = admin root localhost debian apache server srv-01\n", "lines": 14, "purpose": "Forces passphrases, not passwords, on the one interactive account.", "notes": [{"n": 2, "why": "Length is the only parameter that reliably resists offline cracking; 16 is the floor, not the target."}, {"n": 3, "why": "Requires mixed character classes so a long, single-class string is not accepted."}, {"n": 4, "why": "Rejects 'aaaaaaaa' and 'abcd1234' shapes that dictionary and pattern attacks eat for breakfast."}, {"n": 5, "why": "Rejects 'aaaaaaaa' and 'abcd1234' shapes that dictionary and pattern attacks eat for breakfast."}, {"n": 6, "why": "Rejects 'aaaaaaaa' and 'abcd1234' shapes that dictionary and pattern attacks eat for breakfast."}, {"n": 8, "why": "Refuses dictionary words and anything containing the username."}, {"n": 9, "why": "Refuses dictionary words and anything containing the username."}, {"n": 10, "why": "Makes the policy enforceable rather than advisory."}, {"n": 11, "why": "Three attempts, matching the rest of the account policy."}, {"n": 12, "why": "Explicitly blacklists the words every attacker tries first on a server like this."}], "annPrefix": "#", "isDoc": false}, "etc/ssh/sshd_config.d/00-paranoid.conf": {"path": "etc/ssh/sshd_config.d/00-paranoid.conf", "content": "# /etc/ssh/sshd_config.d/00-paranoid.conf\n# Debian's /etc/ssh/sshd_config already starts with: Include /etc/ssh/sshd_config.d/*.conf\n# Files are read in lexicographic order and the FIRST value wins for most keywords, so this\n# 00- file takes precedence over anything Debian ships later.\n# Validate:  sudo sshd -t  &&  sudo sshd -T | grep -E 'permitrootlogin|ciphers|kexalgorithms'\n\n# ---------------------------------------------------------------------------\n# Who may log in\n# ---------------------------------------------------------------------------\n# Replace 'admin' with your username. This is a second lock on the door: an account that\n# appears (by mistake or by an attacker adding it) still cannot reach sshd.\nAllowUsers admin\nDenyUsers root\n\nPermitRootLogin no\nPasswordAuthentication no\nKbdInteractiveAuthentication no\nChallengeResponseAuthentication no\nPubkeyAuthentication yes\nPermitEmptyPasswords no\nAuthenticationMethods publickey\nAuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2\nStrictModes yes\nMaxAuthTries 3\nMaxSessions 4\nMaxStartups 10:30:60\nLoginGraceTime 20\n\n# ---------------------------------------------------------------------------\n# What a session may do\n# ---------------------------------------------------------------------------\nPermitUserEnvironment no\nPermitTunnel no\nAllowAgentForwarding no\nAllowTcpForwarding no\nAllowStreamLocalForwarding no\nX11Forwarding no\nGatewayPorts no\nPermitListen none\nPermitOpen none\nDisableForwarding yes\nRekeyLimit 512M 1h\nCompression no\n\n# ---------------------------------------------------------------------------\n# Cryptography - pin everything; never rely on distro \"defaults\" here\n# ---------------------------------------------------------------------------\n# Delete /etc/ssh/ssh_host_rsa_key* and ssh_host_ecdsa_key* once you have confirmed clients work.\nHostKey /etc/ssh/ssh_host_ed25519_key\nHostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com\nPubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com\n# sntrup761x25519 is the post-quantum hybrid; keep it first.\nKexAlgorithms sntrup761x25519-sha512@openssh.com,mlkem768x25519-sha256,curve25519-sha256\nCiphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com\nMACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com\n\n# ---------------------------------------------------------------------------\n# Logging and PAM\n# ---------------------------------------------------------------------------\nLogLevel VERBOSE          # logs the fingerprint of the key/host used on each auth attempt\nSyslogFacility AUTH\nUsePAM yes\nPidFile /run/sshd.pid\nPrintLastLog yes\nPrintMotd no\nBanner none               # do not advertise anything, including an \"authorized use\" banner\nUseDNS no                 # no reverse DNS: no latency, no DNS traffic out of a pre-auth session\n\n# ---------------------------------------------------------------------------\n# Tier 2: reachable ONLY over the WireGuard admin plane (see docs/05 §5).\n# Uncomment after you have verified SSH over the tunnel from a client, and drop 22 from nftables.\n# ---------------------------------------------------------------------------\n#ListenAddress 10.66.0.1\n", "lines": 74, "purpose": "The admin plane: keys only, pinned modern crypto (post-quantum KEX), no forwarding, no root, minimal information disclosure.", "notes": [{"n": 11, "why": "A second lock on the door: even an account that appears by mistake cannot authenticate."}, {"n": 12, "why": "Belt and braces with PermitRootLogin - root is not a valid SSH identity at all."}, {"n": 14, "why": "No direct root over the wire means every action is attributable to a named admin account."}, {"n": 15, "why": "What cannot be guessed cannot be brute-forced: keys only, so no password spray is even possible."}, {"n": 16, "why": "Closes the interactive-auth path that would otherwise re-open password-style authentication."}, {"n": 17, "why": "Closes the interactive-auth path that would otherwise re-open password-style authentication."}, {"n": 19, "why": "An empty password must never authenticate, whatever PAM might think."}, {"n": 20, "why": "Exactly one acceptable method, so no fallback can be negotiated by an attacker."}, {"n": 22, "why": "Refuses to use authorized_keys when the permissions would let another local user modify it."}, {"n": 23, "why": "Shrinks the guessing window per connection and cuts log noise from scanners."}, {"n": 24, "why": "Bounds how many concurrent channels one authenticated key can hold open."}, {"n": 25, "why": "Bounds unauthenticated connections, which is the actual SSH DoS surface."}, {"n": 26, "why": "A connection that does not authenticate promptly is closed, freeing the pre-auth slot (a deliberate availability trade-off)."}, {"n": 31, "why": "Stops ~/.ssh/environment from injecting LD_PRELOAD and friends into a session."}, {"n": 32, "why": "Removes SSH as a pivot: no tunnels, no forwarding, no proxying through your server."}, {"n": 33, "why": "Stops a compromised server from using your forwarded agent key to reach other machines."}, {"n": 34, "why": "No tunnelling, so a foothold here cannot become a network bridge."}, {"n": 35, "why": "No tunnelling, so a foothold here cannot become a network bridge."}, {"n": 36, "why": "There is no X server; enabling the path only creates a way to run code remotely."}, {"n": 37, "why": "Prevents a forwarded port from binding on all interfaces and becoming publicly reachable."}, {"n": 38, "why": "Removes SSH as a pivot: no tunnels, no forwarding, no proxying through your server."}, {"n": 39, "why": "Removes SSH as a pivot: no tunnels, no forwarding, no proxying through your server."}, {"n": 40, "why": "Removes SSH as a pivot: no tunnels, no forwarding, no proxying through your server."}, {"n": 41, "why": "Forces periodic rekeying, limiting how much traffic a single key stream can cover."}, {"n": 42, "why": "Compression before authentication is a CRIME-style oracle; there is no benefit here."}, {"n": 48, "why": "One modern host key instead of a pile of legacy algorithms to keep patched."}, {"n": 49, "why": "Pins the host-key algorithms to Ed25519 - no RSA/DSA downgrade, no weak signature."}, {"n": 50, "why": "Pins user keys to Ed25519 (including FIDO2 security keys), rejecting legacy key types outright."}, {"n": 52, "why": "Post-quantum hybrid key exchange: recorded sessions cannot be decrypted later by a quantum adversary."}, {"n": 53, "why": "AEAD-only ciphers (ChaCha20-Poly1305 / AES-GCM): authenticated encryption, no CBC, no padding-oracle class."}, {"n": 54, "why": "Encrypt-then-MAC only, which is the construction that does not leak plaintext on a bad MAC."}, {"n": 59, "why": "Records which key authenticated, so 'someone logged in' becomes 'key X logged in from here'."}, {"n": 61, "why": "Keeps lockout and account policy centralised in PAM instead of duplicated here."}, {"n": 65, "why": "Discloses nothing about what this machine is to an unauthenticated visitor."}, {"n": 66, "why": "No reverse DNS before authentication: no latency, no pre-auth DNS traffic to leak intent."}], "annPrefix": "#", "isDoc": false}, "etc/sudoers.d/00-paranoid": {"path": "etc/sudoers.d/00-paranoid", "content": "# /etc/sudoers.d/00-paranoid\n# Installed with mode 0440, root:root. Validate with: visudo -c\n# See docs/04-base-hardening.md §1.\n\nDefaults  env_reset\nDefaults  secure_path=\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\nDefaults  use_pty\nDefaults  logfile=\"/var/log/sudo.log\"\nDefaults  log_input, log_output          # full session transcript for root actions\nDefaults  iolog_dir=\"/var/log/sudo-io\"\nDefaults  timestamp_timeout=0            # always re-authenticate, every time\nDefaults  passwd_tries=3\nDefaults  badpass_message=\"Authentication failure.\"\nDefaults  lecture=never\nDefaults  !visiblepw\nDefaults  umask=0027\nDefaults  requiretty\nDefaults  !fqdn\nDefaults  env_keep -= \"SSH_AUTH_SOCK\"    # do not carry agent forwarding into root shells\nDefaults  env_keep -= \"DISPLAY\"\n\n# The one human admin account. Replace 'admin' with your username.\nadmin ALL=(ALL:ALL) ALL\n\n# Everything else is denied by not existing. Do not add NOPASSWD rules: they convert\n# \"compromised shell as admin\" into \"root\" with one command.\n", "lines": 27, "purpose": "Makes every privilege escalation attributable, time-bounded and transcript-logged.", "notes": [{"n": 4, "why": "Every sudo session starts from a clean environment: no poisoned PATH, no LD_PRELOAD."}, {"n": 5, "why": "sudo uses a known-good PATH, so a writable directory cannot be slipped in front of a system binary."}, {"n": 6, "why": "Runs the command on a pseudo-terminal, which defeats TIOCSTI-style injection into the parent shell."}, {"n": 7, "why": "Privileged actions get their own log, not just whatever the shell happened to record."}, {"n": 8, "why": "Full session transcripts: you can reconstruct exactly what a privileged session did."}, {"n": 10, "why": "Re-authenticates every time, so an unlocked terminal is not a 15-minute root window."}, {"n": 11, "why": "Fewer guesses per invocation, pairing with the PAM lockout policy."}, {"n": 12, "why": "A generic failure message discloses nothing about why authentication failed."}, {"n": 13, "why": "No hints about sudoers rules or syntax on failure."}, {"n": 14, "why": "Refuses to echo a password on the terminal; it would otherwise be captured by anyone watching or by the scrollback."}, {"n": 15, "why": "Anything created by a privileged command is not world-readable."}, {"n": 16, "why": "Privileged commands must come from a real terminal, which raises the bar for scripted abuse."}, {"n": 17, "why": "Avoids a DNS lookup (and its failure modes) on every sudo invocation."}, {"n": 18, "why": "Agent keys do not follow you into a root shell - no pivoting from a compromised server with your key."}, {"n": 19, "why": "No X11 display handed to root on a headless box."}, {"n": 22, "why": "The single, named admin account; there is no NOPASSWD rule anywhere, so a compromised shell is not instant root."}], "annPrefix": "#", "isDoc": false}, "etc/sysctl.d/99-paranoid.conf": {"path": "etc/sysctl.d/99-paranoid.conf", "content": "# /etc/sysctl.d/99-paranoid.conf\n# Hardened kernel parameters for a paranoid single-purpose HTTPS server.\n# Installed by scripts/install-hardening.sh --tier {1|2|3}\n# See docs/04-base-hardening.md §3 for the reasoning behind every block.\n# Files in /etc/sysctl.d are applied in lexicographic order; 99-* is last on purpose.\n\n# ============================================================================\n# Information leaks\n# ============================================================================\nkernel.dmesg_restrict = 1          # only root may read the kernel ring buffer\nkernel.kptr_restrict = 2           # %pK prints 0 for everyone\nkernel.perf_event_paranoid = 3     # perf_events is a side-channel/info-leak tool\nkernel.unprivileged_bpf_disabled = 2\nnet.core.bpf_jit_harden = 2\nvm.unprivileged_userfaultfd = 0\nkernel.yama.ptrace_scope = 2       # only root may ptrace a non-child\nkernel.io_uring_disabled = 2       # io_uring: heavy CVE history, unused here\ndev.tty.ldisc_autoload = 0\n\n# ============================================================================\n# Execution / memory integrity\n# ============================================================================\nkernel.randomize_va_space = 2\nkernel.kexec_load_disabled = 1     # kexec is a boot-integrity bypass\nkernel.sysrq = 0\nfs.protected_hardlinks = 1\nfs.protected_symlinks = 1\nfs.protected_fifos = 2\nfs.protected_regular = 2\nfs.suid_dumpable = 0\n\n# ============================================================================\n# Network stack\n# ============================================================================\nnet.ipv4.tcp_syncookies = 1\nnet.ipv4.conf.all.rp_filter = 1\nnet.ipv4.conf.default.rp_filter = 1\nnet.ipv4.conf.all.accept_redirects = 0\nnet.ipv4.conf.default.accept_redirects = 0\nnet.ipv4.conf.all.secure_redirects = 0\nnet.ipv4.conf.all.send_redirects = 0\nnet.ipv4.conf.default.send_redirects = 0\nnet.ipv4.conf.all.accept_source_route = 0\nnet.ipv4.conf.default.accept_source_route = 0\nnet.ipv4.conf.all.log_martians = 1\nnet.ipv4.icmp_echo_ignore_broadcasts = 1\nnet.ipv4.icmp_ignore_bogus_error_responses = 1\nnet.ipv4.conf.all.arp_ignore = 1\nnet.ipv4.conf.all.arp_announce = 2\nnet.ipv4.tcp_rfc1337 = 1           # drop RST in TIME_WAIT (RFC 1337)\nnet.ipv4.tcp_max_syn_backlog = 1024\n\n# IPv6: we do not use SLAAC or redirects. Comment this whole block out if you set\n# net.ipv6.conf.all.disable_ipv6 = 1 and remove the IPv6 lines from /etc/nftables.conf.\nnet.ipv6.conf.all.accept_redirects = 0\nnet.ipv6.conf.default.accept_redirects = 0\nnet.ipv6.conf.all.accept_ra = 0\nnet.ipv6.conf.default.accept_ra = 0\nnet.ipv6.conf.all.accept_source_route = 0\nnet.ipv6.conf.all.router_solicitations = 0\nnet.ipv6.conf.all.autoconf = 0\nnet.ipv6.conf.all.use_tempaddr = 2   # irrelevant without SLAAC; harmless if IPv6 is routed\n\n# Forwarding stays OFF unless docs/08 gives you a deliberate VM/container bridge.\nnet.ipv4.ip_forward = 0\nnet.ipv4.conf.all.forwarding = 0\nnet.ipv6.conf.all.forwarding = 0\n\n# ** TIER 2 ** egress is filtered in nftables, not here. Keep this at 1 so that\n# Reverse Path Filtering can actually drop spoofed reply traffic.\nnet.ipv4.conf.all.route_localnet = 0\n\n# ============================================================================\n# Deliberately NOT set (see docs/04 §3 - read before \"improving\" this file)\n# ============================================================================\n# kernel.unprivileged_userns_clone = 0   / user.max_user_namespaces = 0\n#   -> breaks rootless podman/nspawn and systemd's PrivateUsers, which docs/08 depends on.\n#      If you choose Tier 3 \"no unprivileged namespaces\", you must give up rootless isolation;\n#      verify-hardening.sh enforces that the two decisions stay consistent.\n# net.ipv4.tcp_timestamps = 0\n#   -> breaks PAWS and makes retransmits worse for negligible gain.\n# net.ipv6.conf.all.disable_ipv6 = 1\n#   -> only if you truly have no IPv6 clients; then also strip the ip6 rules.\n# kernel.modules_disabled = 1\n#   -> applied late in boot by kernel-modules-lock.service (Tier 3), never from sysctl.\nkernel.core_pattern = |/bin/false\n", "lines": 87, "purpose": "Kernel attack-surface reduction, memory-safety hardening and network stack hygiene - the cheapest security return in the whole build.", "notes": [{"n": 9, "why": "The kernel ring buffer leaks addresses, module names and device details an attacker uses to aim an exploit - root only now."}, {"n": 10, "why": "%pK prints nothing to unprivileged readers, so kernel pointers cannot be harvested from /proc."}, {"n": 11, "why": "perf_events can sample memory and is a known side-channel/info-leak primitive; nothing on a web server legitimately needs it."}, {"n": 12, "why": "eBPF is a powerful in-kernel VM; disabling it for unprivileged users removes a whole exploit class (and an easy rootkit hook)."}, {"n": 13, "why": "Hardens the BPF JIT against spraying attacks that turn a BPF bug into reliable code execution."}, {"n": 14, "why": "userfaultfd is a race-condition primitive used by many public kernel exploits; unprivileged users do not need it."}, {"n": 15, "why": "Only root may ptrace a process it did not start - stops one compromised service from injecting into another."}, {"n": 16, "why": "io_uring has produced a steady stream of privilege-escalation bugs and nothing here uses it."}, {"n": 17, "why": "Blocks on-demand loading of TTY line disciplines, a rare but real local privilege-escalation vector."}, {"n": 22, "why": "Full address-space randomisation, the baseline mitigation against memory-corruption exploits."}, {"n": 23, "why": "kexec can boot an unsigned kernel from a running system - a direct boot-integrity bypass."}, {"n": 24, "why": "Magic SysRq lets anyone at a keyboard reboot, dump memory or kill processes; a server does not need it."}, {"n": 25, "why": "Stops the classic /tmp hardlink attack: a user cannot link to a file they do not own and then trick root into writing it."}, {"n": 26, "why": "Stops a symlink planted in a world-writable directory from being followed by a privileged process."}, {"n": 27, "why": "Refuses to open a FIFO in a sticky world-writable directory that the opener does not own - blocks the pipe-based privilege-escalation trick."}, {"n": 28, "why": "Same protection for regular files written to, closing the write-to-someone-else's-file class."}, {"n": 29, "why": "A setuid process must never be able to dump core: the dump is a memory disclosure with the privileged process's credentials."}, {"n": 34, "why": "Keeps the server answering under SYN-flood without letting half-open connections exhaust the backlog."}, {"n": 35, "why": "Reverse-path filtering drops packets whose source address could not have arrived on that interface - basic anti-spoofing."}, {"n": 36, "why": "Reverse-path filtering drops packets whose source address could not have arrived on that interface - basic anti-spoofing."}, {"n": 37, "why": "ICMP redirects can silently reroute your traffic through an attacker; a server has no reason to accept them."}, {"n": 38, "why": "ICMP redirects can silently reroute your traffic through an attacker; a server has no reason to accept them."}, {"n": 39, "why": "Closes the 'redirect from a known gateway' loophole left open by accept_redirects alone."}, {"n": 40, "why": "A server should never tell other hosts to reroute through it."}, {"n": 41, "why": "A server should never tell other hosts to reroute through it."}, {"n": 42, "why": "Source routing lets a sender dictate the path - a routing-spoofing primitive."}, {"n": 43, "why": "Source routing lets a sender dictate the path - a routing-spoofing primitive."}, {"n": 44, "why": "Makes packets with impossible source addresses visible in the logs, which is how you notice probing and misconfiguration."}, {"n": 45, "why": "Refuses broadcast pings, removing a trivial amplification/smurf vector."}, {"n": 46, "why": "Ignores forged ICMP errors, which are used to tear down connections."}, {"n": 47, "why": "Only answer ARP for the address that arrived on that interface - defeats ARP cache poisoning on multi-homed hosts."}, {"n": 48, "why": "Announce only locally relevant source addresses, limiting address leakage and poisoning."}, {"n": 49, "why": "Drops RSTs aimed at TIME_WAIT sockets, which are used to kill long-lived connections."}, {"n": 50, "why": "A larger backlog absorbs bursts without dropping legitimate connections."}, {"n": 54, "why": "ICMP redirects can silently reroute your traffic through an attacker; a server has no reason to accept them."}, {"n": 55, "why": "ICMP redirects can silently reroute your traffic through an attacker; a server has no reason to accept them."}, {"n": 56, "why": "No router advertisements: no rogue RA can hand this server a new default route or DNS server."}, {"n": 57, "why": "No router advertisements: no rogue RA can hand this server a new default route or DNS server."}, {"n": 58, "why": "Source routing lets a sender dictate the path - a routing-spoofing primitive."}, {"n": 60, "why": "No stateless address autoconfiguration: addresses are deliberate, not learned from the wire."}, {"n": 64, "why": "This host is not a router. Forwarding off means it cannot be abused as one."}, {"n": 65, "why": "Same for IPv6: no forwarding, no accidental router behaviour."}, {"n": 66, "why": "Same for IPv6: no forwarding, no accidental router behaviour."}, {"n": 70, "why": "Stops loopback addresses being treated as routable - a classic trick for reaching localhost-only services."}, {"n": 85, "why": "Last line of defence on core dumps: even if something requests one, the 'handler' discards it."}], "annPrefix": "#", "isDoc": false}, "etc/systemd/coredump.conf.d/99-paranoid.conf": {"path": "etc/systemd/coredump.conf.d/99-paranoid.conf", "content": "# /etc/systemd/coredump.conf.d/99-paranoid.conf\n# A core dump of a privileged process contains keys, passwords and heap data. We do not want any,\n# anywhere, ever. Combined with /etc/security/limits.d/99-paranoid.conf and fs.suid_dumpable=0.\n# Reload: systemctl daemon-reexec\n\n[Coredump]\nStorage=none\nProcessSizeMax=0\nExternalSizeMax=0\nJournalSizeMax=1M\nMaxUse=0\nKeepFree=0\n", "lines": 13, "purpose": "No core dumps anywhere: a crashed privileged process must not write its memory to disk.", "notes": [{"n": 6, "why": "No core dump is ever written anywhere - not to disk, not to the journal."}, {"n": 7, "why": "A size ceiling of zero refuses every dump rather than truncating it."}, {"n": 8, "why": "There is no path left by which a crash can emit a memory image."}, {"n": 9, "why": "There is no path left by which a crash can emit a memory image."}], "annPrefix": "#", "isDoc": false}, "etc/systemd/journald.conf.d/99-paranoid.conf": {"path": "etc/systemd/journald.conf.d/99-paranoid.conf", "content": "# /etc/systemd/journald.conf.d/99-paranoid.conf\n# Persistent, size-bounded, rate-limited and (where a TPM is present) sealed journal.\n# See docs/04 §10. Reload with: systemctl restart systemd-journald\n\n[Journal]\nStorage=persistent\nCompress=yes\nSeal=yes                     # FSS sealing: detects tampering with the journal. Degrades safely\n                             # (no sealing) if there is no usable TPM - it does not block boot.\nSplitMode=uid\nSystemMaxUse=512M\nSystemMaxFileSize=64M\nSystemMaxFiles=20\nRuntimeMaxUse=64M\nMaxRetentionSec=3month\nMaxFileSec=1month\nMaxLevelStore=info\nMaxLevelSyslog=info\nMaxLevelKMsg=notice\nMaxLevelConsole=notice\nMaxLevelWall=emerg\nForwardToSyslog=no           # no rsyslog on this host; ship off-box with journal-upload instead\nForwardToKMsg=no\nForwardToConsole=no\nForwardToWall=yes\nAudit=yes\nReadKMsg=yes\nLineMax=48K\nRateLimitIntervalSec=30s\nRateLimitBurst=2000\n# Do not accept client-sent data: nothing should be sending journal entries to us over the network.\n# (Port 19532 is not open in nftables either - belt and braces.)\n", "lines": 33, "purpose": "Makes the audit log persistent, bounded, rate-limited and (where a TPM exists) tamper-evident.", "notes": [{"n": 5, "why": "Boot-to-boot continuity: evidence of yesterday's incident is not in RAM that vanishes on reboot."}, {"n": 7, "why": "FSS sealing makes tampering with the journal detectable; it degrades safely to no sealing when no TPM is usable."}, {"n": 10, "why": "Bounded storage: a log flood cannot fill /var/log and take the server down."}, {"n": 11, "why": "Bounded storage: a log flood cannot fill /var/log and take the server down."}, {"n": 14, "why": "Bounded storage: a log flood cannot fill /var/log and take the server down."}, {"n": 16, "why": "Stores what matters without recording every trivial debug line from every service."}, {"n": 21, "why": "No second copy handled by a daemon we do not run, so there is one authoritative log path."}, {"n": 25, "why": "Kernel audit messages land in the journal alongside everything else, so one timeline exists."}, {"n": 28, "why": "Rate-limiting means a log-flood cannot evict the evidence you actually need."}, {"n": 29, "why": "Rate-limiting means a log-flood cannot evict the evidence you actually need."}], "annPrefix": "#", "isDoc": false}, "etc/systemd/nspawn/app01.nspawn": {"path": "etc/systemd/nspawn/app01.nspawn", "content": "# /etc/systemd/nspawn/app01.nspawn\n# Isolation policy for one small service in its own container (docs/08 §2).\n# This is the file that makes the difference between \"a chroot with extra steps\" and real isolation.\n\n[Exec]\nBoot=yes\n# Only the capabilities the service actually needs. Everything else is dropped.\nCapability=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_KILL\n# Map the container's root to an unprivileged host uid. This is the key isolation property.\nPrivateUsers=pick\nNotifyReady=yes\nSystemCallFilter=@system-service\nSystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-raw-io\nRestrictNamespaces=~user\n# No host time/keyring/hostname influence.\nNoNewPrivileges=yes\n\n[Files]\n# The container cannot see the host filesystem at all...\nPrivate=yes\n# ...and its own root filesystem is read-only. Writable state lives in Volatile= below.\nReadOnly=yes\nVolatile=state\n# Bind ONLY the specific paths it needs, read-only where possible.\nBindReadOnly=/etc/ssl/certs:/etc/ssl/certs\nBindReadOnly=/etc/localtime:/etc/localtime\n# Example of giving a container its data directory (create it owned by the mapped uid first):\n#Bind=/srv/app01-data:/srv/data\n\n[Network]\n# Own network namespace. No address, no ports, no route out - until you deliberately add one.\nPrivate=yes\n# Zone=trusted\n# To publish a port (prefer a high port + an nftables redirect over exposing it directly):\n#Port=tcp:8443:443\n\n[Security]\nNoNewPrivileges=yes\n# Keep the host's AppArmor/LSM policy in effect for the container.\n# (systemd-nspawn applies a default policy; add explicit profile names here if you write them.)\n\n# REMINDERS (docs/08 §2):\n#  * The container has its OWN update cycle. A container nobody patches is a vulnerable service.\n#    Weekly:  sudo systemd-nspawn -D /var/lib/machines/app01 -- bash -c 'apt-get update && apt-get -y upgrade'\n#  * Never add 'Port=' for a management interface. Admin access goes over the WireGuard plane.\n#  * PrivateUsers=pick means the container's root is NOT host root. Verify from inside with\n#    'id' (uid 0 inside) and outside with 'ps -o user= -p <pid>' (an unprivileged uid).\n", "lines": 48, "purpose": "A daemon-free container policy: user namespace, read-only root, private network, only the capabilities the service needs.", "notes": [{"n": 7, "why": "Only the capabilities the service actually needs are handed over."}, {"n": 9, "why": "Maps the container's root to an unprivileged host UID: root inside is not root outside."}, {"n": 11, "why": "A syscall allowlist: mount, module loading, debug and raw-I/O classes are unavailable inside."}, {"n": 12, "why": "A syscall allowlist: mount, module loading, debug and raw-I/O classes are unavailable inside."}, {"n": 13, "why": "Stops the container from creating further user namespaces to escape its own confinement."}, {"n": 15, "why": "Setuid binaries inside cannot gain privileges - even if one exists in the image."}, {"n": 19, "why": "The container cannot see the host filesystem at all - only the binds you name."}, {"n": 21, "why": "Its root filesystem is read-only, so nothing dropped at runtime persists."}, {"n": 22, "why": "Writable state is volatile, so a compromise does not survive a restart."}, {"n": 24, "why": "Read-only, narrowly scoped access instead of a writable host mount."}, {"n": 25, "why": "Read-only, narrowly scoped access instead of a writable host mount."}, {"n": 31, "why": "The container cannot see the host filesystem at all - only the binds you name."}, {"n": 37, "why": "Setuid binaries inside cannot gain privileges - even if one exists in the image."}], "annPrefix": "#", "isDoc": false}, "etc/systemd/system.conf.d/99-paranoid.conf": {"path": "etc/systemd/system.conf.d/99-paranoid.conf", "content": "# /etc/systemd/system.conf.d/99-paranoid.conf\n# Manager-level defaults. Reload: systemctl daemon-reexec\n# See docs/04 §10 and docs/07 §7 (watchdog).\n\n[Manager]\nDumpCore=no\nCrashShell=no\nCtrlAltDelBurstAction=none      # an attached keyboard cannot reboot the machine by mashing keys\nShowStatus=yes\nDefaultTimeoutStartSec=60s\nDefaultTimeoutStopSec=20s\nDefaultRestartSec=2s\nDefaultTasksMax=512             # per-unit ceiling; a runaway service cannot fork-bomb the box\nUnitPath=/etc/systemd/system /run/systemd/system /usr/local/lib/systemd/system /usr/lib/systemd/system\n\n# Hardware watchdog: enable ONLY if your platform supports it reliably (spurious resets on\n# unsupported hardware are a self-inflicted outage). A watchdog gives you \"server recovers from a\n# kernel hang\" - at the cost of rebooting without your passphrase being entered. Since this machine\n# requires an interactive LUKS passphrase to boot, a watchdog reboot can leave it sitting at the\n# initramfs prompt. That is a deliberate trade-off; see docs/10 §6.\n#RuntimeWatchdogSec=20\n#RebootWatchdogSec=5min\n", "lines": 23, "purpose": "Manager-level defaults: no crash shell, no accidental keyboard reboot, bounded per-unit tasks.", "notes": [{"n": 6, "why": "No interactive emergency shell at boot: a physical intruder cannot get a shell by breaking the boot."}, {"n": 7, "why": "An attached keyboard cannot reboot the machine by mashing keys."}, {"n": 10, "why": "Services are stopped promptly, which keeps shutdowns predictable."}, {"n": 12, "why": "A per-unit fork limit, so one runaway service cannot exhaust the process table."}], "annPrefix": "#", "isDoc": false}, "etc/systemd/system/aide-check.service": {"path": "etc/systemd/system/aide-check.service", "content": "# /etc/systemd/system/aide-check.service\n# Daily file-integrity check. See docs/04 §8 and docs/10 §1.\n# Baseline rules: take the AIDE baseline LAST, after every config change is final.\n\n[Unit]\nDescription=AIDE file integrity check\nDocumentation=man:aide(1) file:///etc/aide/aide.conf\nAfter=local-fs.target\n# Do not fight with the weekly apt run or with each other.\nConflicts=aide-check.timer\n\n[Service]\nType=oneshot\nNice=19\nIOSchedulingClass=idle\n# AIDE needs to read everything and write only its database + report.\nProtectSystem=strict\nProtectHome=read-only\nPrivateTmp=yes\nPrivateDevices=yes\nProtectKernelTunables=yes\nProtectKernelModules=yes\nProtectKernelLogs=yes\nProtectControlGroups=yes\nProtectClock=yes\nRestrictNamespaces=yes\nRestrictRealtime=yes\nRestrictSUIDSGID=yes\nLockPersonality=yes\nNoNewPrivileges=yes\nCapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_CHOWN CAP_FOWNER\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-emulation @swap @keyring\nReadWritePaths=/var/lib/aide /var/log/paranoid\nUMask=0027\n\nExecStartPre=/bin/mkdir -p /var/log/paranoid\nExecStart=/usr/bin/aide --check --config /etc/aide/aide.conf\n# --check exits non-zero when it finds changes. That is a *finding*, not a service failure we want\n# to hide behind SuccessExitStatus: keep the non-zero status so `systemctl --failed` shows it, and\n# make sure someone reads /var/log/paranoid/aide.log (or the shipped journal record).\nStandardOutput=append:/var/log/paranoid/aide.log\nStandardError=append:/var/log/paranoid/aide.log\n\n[Install]\nWantedBy=multi-user.target\n", "lines": 48, "purpose": "Daily file-integrity check, sandboxed, appending to a log the attacker cannot quietly edit.", "notes": [{"n": 7, "why": "Ordering only - it does not grant any privilege."}, {"n": 9, "why": "Prevents two instances of the same heavy check running at once."}, {"n": 12, "why": "Runs to completion and exits: nothing lingers listening for input."}, {"n": 13, "why": "Runs at idle priority: a security check must never become the reason a request is slow."}, {"n": 14, "why": "Runs at idle priority: a security check must never become the reason a request is slow."}, {"n": 16, "why": "The integrity checker is itself sandboxed - it reads widely but writes only its own evidence."}, {"n": 17, "why": "The integrity checker is itself sandboxed - it reads widely but writes only its own evidence."}, {"n": 18, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 19, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 20, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 21, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 22, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 23, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 24, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 25, "why": "Removes namespace creation, realtime priority, setuid/guid files, personality changes and non-native syscalls."}, {"n": 26, "why": "Removes namespace creation, realtime priority, setuid/guid files, personality changes and non-native syscalls."}, {"n": 27, "why": "Removes namespace creation, realtime priority, setuid/guid files, personality changes and non-native syscalls."}, {"n": 28, "why": "Removes namespace creation, realtime priority, setuid/guid files, personality changes and non-native syscalls."}, {"n": 29, "why": "The unit can never gain privileges through a setuid binary."}, {"n": 30, "why": "Only read-search and ownership checks: no way to modify anything."}, {"n": 31, "why": "Removes namespace creation, realtime priority, setuid/guid files, personality changes and non-native syscalls."}, {"n": 32, "why": "A syscall allowlist with the dangerous classes (~) removed - this is what limits the blast radius of a service bug."}, {"n": 33, "why": "A syscall allowlist with the dangerous classes (~) removed - this is what limits the blast radius of a service bug."}, {"n": 34, "why": "It cannot alter the very files it is supposed to be watching."}, {"n": 35, "why": "Restrictive default permissions for anything the unit creates."}, {"n": 37, "why": "The log directory exists before the script writes to it."}, {"n": 42, "why": "Results are appended to a log rather than hidden in the journal alone."}, {"n": 46, "why": "Where the unit is wired into boot; keep it deliberate."}], "annPrefix": "#", "isDoc": false}, "etc/systemd/system/aide-check.timer": {"path": "etc/systemd/system/aide-check.timer", "content": "# /etc/systemd/system/aide-check.timer\n# Daily at 04:15 with a random delay so a fleet does not stampede, and so a busy hour does not\n# delay the check. Persistent= tells systemd to run a missed check after downtime.\n\n[Unit]\nDescription=Daily AIDE integrity check\nDocumentation=file:///etc/systemd/system/aide-check.service\n\n[Timer]\nOnCalendar=*-*-* 04:15:00\nRandomizedDelaySec=30m\nPersistent=true\nUnit=aide-check.service\n\n[Install]\nWantedBy=timers.target\n", "lines": 17, "purpose": "", "notes": [{"n": 9, "why": "Scheduled, not opportunistic - so the evidence arrives every day whether or not anyone logs in."}, {"n": 10, "why": "Spreads execution so many machines do not pile onto a mirror or a shared disk at the same second."}, {"n": 11, "why": "A check missed because the machine was off runs after the next boot instead of vanishing."}, {"n": 15, "why": "Where the unit is wired into boot; keep it deliberate."}], "annPrefix": "#", "isDoc": false}, "etc/systemd/system/apache2.service.d/99-paranoid.conf": {"path": "etc/systemd/system/apache2.service.d/99-paranoid.conf", "content": "# /etc/systemd/system/apache2.service.d/99-paranoid.conf\n# Sandbox the web server's unit. Config files control what Apache *does*; this controls what it\n# *can* do even if a request handling bug gives an attacker code execution in the process.\n#\n# After installing:\n#   sudo systemctl daemon-reload && sudo systemctl restart apache2\n#   sudo systemd-analyze security apache2 | tail -20      # target: exposure < 2.0\n#   journalctl -u apache2 -n 30 | grep -iE 'denied|failed'\n#\n# Read docs/06 §6 before adding or removing anything here: three of these directives break\n# specific Apache modules, and the comments say which.\n\n[Service]\n# --- filesystem ------------------------------------------------------------\nProtectSystem=strict            # / and /usr read-only for this unit\nProtectHome=yes\nPrivateTmp=yes                  # private /tmp and /var/tmp: no shared staging area between services\nPrivateDevices=yes              # no /dev access beyond the bare minimum (no disks, no cameras)\nReadWritePaths=/var/log/apache2 /var/lib/apache2 /run/apache2 /var/cache/apache2\nInaccessiblePaths=/root /home /etc/letsencrypt/live   # keys live here; the unit does not need the\n                                                       # live symlink tree, only the resolved path\n                                                       # read by the master process at startup.\n# --- kernel / namespaces ---------------------------------------------------\nProtectKernelTunables=yes\nProtectKernelModules=yes\nProtectKernelLogs=yes\nProtectControlGroups=yes\nProtectClock=yes\nProtectProc=invisible           # requires systemd >= 257 (Debian 13); drop if on older systemd\nProcSubset=pid\nRestrictNamespaces=yes          # Apache has no business creating namespaces\nRestrictRealtime=yes\nRestrictSUIDSGID=yes\nLockPersonality=yes\n# --- syscalls / capabilities ----------------------------------------------\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-emulation @swap @keyring\nCapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_KILL\nAmbientCapabilities=\nNoNewPrivileges=yes\nRestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX\nUMask=0027\n\n# DELIBERATELY ABSENT - each of these looks tempting and will bite you:\n# * MemoryDenyWriteExecute=yes  -> breaks mod_security3 (libmodsecurity/RE2) and any JIT. Add it\n#                                 only if you have tested your exact module set under load.\n# * PrivateUsers=yes            -> Apache must bind :443 and setuid to www-data; with PrivateUsers\n#                                 the capability model breaks and it will not start. The supported\n#                                 alternative is listening on 8443 inside a user namespace and\n#                                 redirecting 443 -> 8443 in nftables (docs/06 §6).\n# * ProtectSystem=full          -> weaker than 'strict'; there is no reason to pick it.\n# * RestrictAddressFamilies with AF_NETLINK removed -> if you add mod_ldap or depend on glibc's\n#                                 netlink-based interface enumeration, those calls will fail.\n", "lines": 55, "purpose": "The web server's kernel-level prison: filesystem, capability, syscall and namespace confinement that survives an application bug.", "notes": [{"n": 14, "why": "The whole of / and /usr are read-only for this unit - a web bug cannot rewrite the OS."}, {"n": 15, "why": "No access to home directories at all."}, {"n": 16, "why": "A private /tmp and /var/tmp, so the web server cannot see or plant files used by other services."}, {"n": 17, "why": "No device nodes beyond the minimum - no disks, no cameras, no raw hardware."}, {"n": 18, "why": "The only writable locations are its own log, cache and runtime directories."}, {"n": 19, "why": "Even the certificate directory is out of reach beyond what the master process needs at startup."}, {"n": 23, "why": "Removes every kernel-level knob from the process's reach: sysctls, modules, ring buffer, cgroups and the clock."}, {"n": 24, "why": "Removes every kernel-level knob from the process's reach: sysctls, modules, ring buffer, cgroups and the clock."}, {"n": 25, "why": "Removes every kernel-level knob from the process's reach: sysctls, modules, ring buffer, cgroups and the clock."}, {"n": 26, "why": "Removes every kernel-level knob from the process's reach: sysctls, modules, ring buffer, cgroups and the clock."}, {"n": 27, "why": "Removes every kernel-level knob from the process's reach: sysctls, modules, ring buffer, cgroups and the clock."}, {"n": 28, "why": "Other processes are invisible, so a compromise cannot enumerate the host by reading /proc."}, {"n": 29, "why": "Other processes are invisible, so a compromise cannot enumerate the host by reading /proc."}, {"n": 30, "why": "No new namespaces, no realtime scheduling, no setuid/setgid creation and no personality change (which would disable ASLR)."}, {"n": 31, "why": "No new namespaces, no realtime scheduling, no setuid/setgid creation and no personality change (which would disable ASLR)."}, {"n": 32, "why": "No new namespaces, no realtime scheduling, no setuid/setgid creation and no personality change (which would disable ASLR)."}, {"n": 33, "why": "No new namespaces, no realtime scheduling, no setuid/setgid creation and no personality change (which would disable ASLR)."}, {"n": 35, "why": "Removes namespace creation, realtime priority, setuid/guid files, personality changes and non-native syscalls."}, {"n": 36, "why": "A syscall allowlist for services, then explicit removal of privileged, mount, debug, raw-I/O and keyring classes."}, {"n": 37, "why": "A syscall allowlist with the dangerous classes (~) removed - this is what limits the blast radius of a service bug."}, {"n": 38, "why": "Only the capabilities Apache actually needs: bind the port, drop to www-data, manage its own files."}, {"n": 40, "why": "Setuid binaries inside the unit cannot gain privileges."}, {"n": 41, "why": "Only IPv4, IPv6 and UNIX sockets - no netlink, no packet sockets, no raw sockets."}, {"n": 42, "why": "Anything the service creates is not world-readable."}], "annPrefix": "#", "isDoc": false}, "etc/systemd/system/apache2@.service": {"path": "etc/systemd/system/apache2@.service", "content": "# /etc/systemd/system/apache2@.service\n# One Apache instance per security domain (docs/06 §7). OPTIONAL - only use this if you actually\n# host multiple sites that must not read each other's files. A single-purpose server does NOT need\n# this, and every extra instance is another process, user, port and config to keep correct.\n#\n# Usage (instance name \"site1\"):\n#   sudo adduser --system --group --no-create-home --shell /usr/sbin/nologin site1\n#   sudo install -d -o site1 -g site1 -m 0750 /srv/site1 /var/log/apache2-site1 /run/apache2-site1\n#   sudo cp files/etc/apache2/instances/site1.envvars /etc/apache2/instances/site1.envvars\n#   sudo cp files/etc/apache2/instances/site1.conf    /etc/apache2/instances/site1.conf\n#   sudo systemctl enable --now apache2@site1\n#   sudo systemd-analyze security apache2@site1 | tail -3\n\n[Unit]\nDescription=Apache HTTP Server (instance %i)\nDocumentation=https://httpd.apache.org/docs/2.4/\nAfter=network.target remote-fs.target nss-lookup.target\nConditionPathExists=/etc/apache2/instances/%i.conf\nConditionPathExists=/etc/apache2/instances/%i.envvars\n\n[Service]\nType=notify\nEnvironmentFile=/etc/apache2/instances/%i.envvars\nExecStartPre=/usr/sbin/apache2ctl -f /etc/apache2/instances/%i.conf -t\nExecStart=/usr/sbin/apache2 -f /etc/apache2/instances/%i.conf -DFOREGROUND\nExecReload=/usr/sbin/apache2ctl -f /etc/apache2/instances/%i.conf -k graceful\nExecStop=/bin/kill -WINCH ${MAINPID}\nKillSignal=SIGCONT\nPrivateTmp=true\nRestart=on-failure\nRestartSec=5s\n\n# Same sandbox as the main unit, with per-instance paths. Keep this list identical in spirit to\n# files/etc/systemd/system/apache2.service.d/99-paranoid.conf so the two instances are equally\n# hardened - a weaker second instance is how \"isolation\" quietly becomes a downgrade.\nProtectSystem=strict\nProtectHome=yes\nPrivateDevices=yes\nProtectKernelTunables=yes\nProtectKernelModules=yes\nProtectKernelLogs=yes\nProtectControlGroups=yes\nProtectClock=yes\nProtectProc=invisible\nProcSubset=pid\nRestrictNamespaces=yes\nRestrictRealtime=yes\nRestrictSUIDSGID=yes\nLockPersonality=yes\nNoNewPrivileges=yes\nRestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-emulation @swap @keyring\nCapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_KILL\nReadWritePaths=/var/log/apache2-site1 /run/apache2-site1 /var/cache/apache2-site1 /srv/%i\nUMask=0027\n\n[Install]\nWantedBy=multi-user.target\n", "lines": 61, "purpose": "Runs a second security domain as its own user with the same sandbox as the first - isolation or nothing.", "notes": [{"n": 16, "why": "Ordering only - it does not grant any privilege."}, {"n": 17, "why": "Fails safe: the action only happens when its precondition is genuinely true."}, {"n": 18, "why": "Fails safe: the action only happens when its precondition is genuinely true."}, {"n": 22, "why": "Configuration is read from a root-owned file, not inherited from the environment."}, {"n": 28, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 35, "why": "The filesystem is read-only for this unit except for the paths it declares."}, {"n": 36, "why": "Home directories are out of reach."}, {"n": 37, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 38, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 39, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 40, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 41, "why": content": "# /etc/systemd/system/debsums-check.service\n# Answers a different question than AIDE: \"did any file shipped by a Debian package change?\"\n# Cheap enough to run daily. See docs/04 §8.\n\n[Unit]\nDescription=debsums package file integrity check\nAfter=local-fs.target\nConflicts=debsums-check.timer\n\n[Service]\nType=oneshot\nNice=19\nIOSchedulingClass=idle\nProtectSystem=strict\nProtectHome=read-only\nPrivateTmp=yes\nPrivateDevices=yes\nProtectKernelTunables=yes\nProtectKernelModules=yes\nProtectKernelLogs=yes\nProtectControlGroups=yes\nProtectClock=yes\nRestrictNamespaces=yes\nRestrictRealtime=yes\nRestrictSUIDSGID=yes\nLockPersonality=yes\nNoNewPrivileges=yes\nCapabilityBoundingSet=CAP_DAC_READ_SEARCH\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-emulation @swap @keyring\nReadWritePaths=/var/log/paranoid\nUMask=0027\n\nExecStartPre=/bin/mkdir -p /var/log/paranoid\n# -s = report only files whose checksum does NOT match (silent when clean).\n# The package does not ship md5sums for every package; missing ones are reported separately and are\n# NOT a finding (see the filter).\nExecStart=/bin/sh -c '/usr/bin/debsums -s 2>&1 | grep -v -E \"no md5sums|not installed\" || true'\nStandardOutput=append:/var/log/paranoid/debsums.log\nStandardError=append:/var/log/paranoid/debsums.log\n\n[Install]\nWantedBy=multi-user.target\n", "lines": 45, "purpose": "Cross-checks every packaged file against dpkg's stored checksums - a second, independent integrity opinion.", "notes": [{"n": 6, "why": "Ordering only - it does not grant any privilege."}, {"n": 7, "why": "Prevents two instances of the same heavy check running at once."}, {"n": 10, "why": "Runs to completion and exits: nothing lingers listening for input."}, {"n": 13, "why": "The filesystem is read-only for this unit except for the paths it declares."}, {"n": 14, "why": "Home directories are out of reach."}, {"n": 15, "why": " anoid/modules-lock   (then reboot)\n# It cannot be undone at runtime - that is the entire point.\n\n[Unit]\nDescription=Freeze the kernel module table (Tier 3 opt-in)\nDocumentation=file:///etc/paranoid/README.md\nConditionPathExists=/etc/paranoid/modules-lock\nAfter=local-fs.target network-online.target systemd-udev-settle.service\nBefore=multi-user.target\n\n[Service]\nType=oneshot\nRemainAfterExit=yes\n# Fail loudly if the write is refused; silence here would be a false sense of security.\nExecStart=/bin/sh -c 'echo 1 > /proc/sys/kernel/modules_disabled && echo \"modules_disabled=1\"'\nExecStartPost=/bin/sh -c 'grep -q \"^1$\" /proc/sys/kernel/modules_disabled || { echo \"FAILED to lock modules\"; exit 1; }'\nProtectSystem=strict\nProtectHome=yes\nPrivateTmp=yes\nNoNewPrivileges=yes\n\n[Install]\nWantedBy=multi-user.target\n", "lines": 38, "purpose": "Tier-3 option: freezes the module table after boot, so 'load a rootkit module' stops being a step an attacker can take.", "notes": [{"n": 20, "why": "Fails safe: the lock only engages when you have explicitly armed it, so a fresh install is not bricked."}, {"n": 21, "why": "Ordering only - it does not grant any privilege."}, {"n": 22, "why": "Ordering only - it does not grant any privilege."}, {"n": 25, "why": "Runs to completion and exits: nothing lingers listening for input."}, {"n": 26, "why": "Keeps the state visible to systemd so 'is it locked?' is answerable."}, {"n": 28, "why": "After this, no module can be loaded at all - an attacker with root cannot insert a rootkit, and neither can you."}, {"n": 29, "why": "After this, no module can be loaded at all - an attacker with root cannot insert a rootkit, and neither can you."}, {"n": 30, "why": "The filesystem is read-only for this unit except for the paths it declares."}, {"n": 31, "why": "Home directories are out of reach."}, {"n": 32, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 33, "why": "The unit can never gain privileges tPre=/bin/mkdir -p /var/cache/restic /var/log/paranoid\n# What to back up: configuration IS the machine, plus the data and the TLS keys.\n# What NOT to back up: /var/log (ship it instead), /var/cache, /tmp, the LUKS header\n# (keep that offline - it is a decryption key, not a document).\nExecStart=/usr/bin/restic backup \\\n    /etc \\\n    /srv \\\n    /var/www \\\n    /var/lib \\\n    --exclude=/var/lib/aide --exclude=/var/lib/systemd/coredump \\\n    --exclude=/var/cache --exclude=/var/tmp --exclude=/var/log \\\n    --exclude-caches --one-file-system \\\n    --tag automated\nExecStartPost=/usr/bin/restic forget --keep-daily 7 --keep-weekly 5 --keep-monthly 12 --prune\nExecStartPost=/usr/bin/restic snapshots --latest 3\n# A restore drill is required quarterly (docs/10 §5); this service only makes the backup.\nStandardOutput=append:/var/log/paranoid/backup.log\nStandardError=append:/var/log/paranoid/backup.log\n\n[Install]\nWantedBy=multi-user.target\n", "lines": 71, "purpose": "Encrypted, append-only backups of the configuration, the data and the TLS keys - with a documented restore drill.", "notes": [{"n": 17, "why": "Ordering only - it does not grant any privilege."}, {"n": 18, "why": "Ordering only - it does not grant any privilege."}, {"n": 19, "why": "Prevents two instances of the same heavy check running at once."}, {"n": 22, "why": "Runs to completion and exits: nothing lingers listening for input."}, {"n": 25, "why": "Configuration is read from a root-owned file, not inherited from the environment."}, {"n": 26, "why": "The filesystem is read-only for this unit except for the paths it declares."}, {"n": 27, "why": "Backs up the data it needs without write access to user homes."}, {"n": 28, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 29, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 30, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n": 31, "why": f with %s makes the unit refuse to\n#     start entirely (verify with: systemd-analyze verify this-file)\n#   * a script can be syntax-checked and test-run; a nested sh/-c/awk in a unit cannot\n#\n# Verify:  systemd-analyze verify /etc/systemd/system/paranoid-boot-record.service\n# Test:    sudo PARANOID_LOGDIR=/tmp/br /usr/local/sbin/paranoid-boot-record && cat /tmp/br/boots\n\n[Unit]\nDescription=Record boot fingerprint (tamper detection)\nDocumentation=file:///etc/paranoid/README.md\nAfter=local-fs.target\nBefore=multi-user.target\n\n[Service]\nType=oneshot\nRemainAfterExit=yes\nPrivateTmp=yes\nProtectSystem=strict\nProtectHome=yes\nProtectKernelTunables=yes\nProtectKernelModules=yes\nProtectKernelLogs=yes\nProtectControlGroups=yes\nProtectClock=yes\nRestrictNamespaces=yes\nLockPersonality=yes\nNoNewPrivileges=yes\n# AF_UNIX only: this service does not talk to the network at all.\nRestrictAddressFamilies=AF_UNIX\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=@chown @setuid\nReadWritePaths=/var/log/paranoid\nUMask=0027\n\nExecStartPre=/bin/mkdir -p /var/log/paranoid\nExecStart=/usr/local/sbin/paranoid-boot-record\n\n[Install]\nWantedBy=multi-user.target\n", "lines": 46, "purpose": "Records one tamper-evident line per boot, so a boot nobody performed is visible afterwards.", "notes": [{"n": 15, "why": "Ordering only - it does not grant any privilege."}, {"n": 16, "why": "Ordering only - it does not grant any privilege."}, {"n": 19, "why": "Runs to completion and exits: nothing lingers listening for input."}, {"n": 20, "why": "Keeps the state visible to systemd so 'is it locked?' is answerable."}, {"n": 21, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 22, "why": "The filesystem is read-only for this unit except for the paths it declares."}, {"n": 23, "why": "Home directories are out of reach."}, {"n": 24, "why": "Kernel-level knobs, cgroups and the clock are not reachable from this unit."}, {"n"   systemd-analyze verify /etc/systemd/system/paranoid-cert-check.service\n# Test:    sudo PARANOID_CERTDIR=/tmp/certs PARANOID_LOGDIR=/tmp/cc /usr/local/sbin/paranoid-cert-check\n\n[Unit]\nDescription=Check TLS certificate expiry and private key permissions\nDocumentation=file:///etc/paranoid/README.md\nAfter=local-fs.target\nConflicts=paranoid-cert-check.timer\n\n[Service]\nType=oneshot\nProtectSystem=strict\nProtectHome=yes\nPrivateTmp=yes\nPrivateDevices=yes\nProtectKernelTunables=yes\nProtectKernelModules=yes\nProtectKernelLogs=yes\nProtectControlGroups=yes\nProtectClock=yes\nRestrictNamespaces=yes\nRestrictRealtime=yes\nRestrictSUIDSGID=yes\nLockPersonality=yes\nNoNewPrivileges=yes\n# AF_UNIX only: the certificate files are read locally; no OCSP or network lookup is performed.\nRestrictAddressFamilies=AF_UNIX\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-emulation @swap @keyring\nReadWritePaths=/var/log/paranoid\nReadOnlyPaths=/etc/letsencrypt /etc/ssl\nUMask=0027\n\nExecStartPre=/bin/mkdir -p /var/log/paranoid\nExecStart=/usr/local/sbin/paranoid-cert-check\n\n[Install]\nWantedBy=multi-user.target\n", "lines": 46, "purpose": "Catches the classic self-inflicted outage: a hardened server that goes dark because nobody watched certificate renewal.", "notes": [{"n": 12, "why": "Ordering only - it does not grant any privilege."}, {"n": 13, "why": "Prevents two instances of the same heavy check running at once."}, {"n": 16, "why": "Runs to completion and exits: nothing lingers listening for input."}, {"n": 17, "why": "The filesystem is read-only for this unit except for the paths it declares."}, {"n": 18, "why": "Home directories are out of reach."}, {"n": 19, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 20, "why": "Shared scratch space and raw devices are hidden from the unit."}, {"n": 21, "why": "Kernel-level knobs, cgroups and the clock are
