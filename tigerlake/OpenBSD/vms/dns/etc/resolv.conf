#	/etc/resolv.conf — dns guest (overrides vms/common/etc/resolv.conf)
#
#	This guest resolves through its own unwind(8) on localhost, not through
#	unbound(8) on its LAN address.  Two reasons, both about failure modes:
#
#	  * if unbound is down or being reconfigured, this guest can still resolve
#	    well enough to be fixed over SSH, and
#	  * it keeps a recursion path that does not depend on the zone the guest
#	    is responsible for serving — a broken lab.example.org cannot make
#	    "pkg_add" fail for the person trying to fix it.
nameserver 127.0.0.1
lookup file bind
