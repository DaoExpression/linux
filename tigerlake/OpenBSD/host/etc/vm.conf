#	/etc/vm.conf — gateway
#
#	Validate:  vmctl reload            (vmd -n is not available; this parses it)
#	Status:    vmctl status
#	Start one: vmctl start srv-dns
#	Console:   vmctl console srv-dns   (exit with "~.")
#
#	This file IS the vmd(8) configuration: on a current OpenBSD, /etc/vm.conf
#
#	is where the daemon and its VMs are described.  The name /etc/vmd.conf
#	dates from before OpenBSD 6.2, when the daemon's own settings were split
#	from the VM definitions; it no longer exists, and creating one would
#	achieve nothing except confusion.  The only other knob is vmd_flags in
#	rc.conf.local, which controls how the daemon is started (see there).
#
#	Three virtual switches back the guests, each of which is a veb(4)
#	interface pre-configured in /etc/hostname.vebN:
#
#	  dmz      veb0  10.10.40.1/24   internet-facing guests
#	  srv      veb1  10.10.50.1/24   internal guests
#	  install  veb2  10.10.99.1/24   provisioning only (see scripts/)
#
#	The switch name is what a VM's "interface" block refers to; the guest sees
#	it as vio0 regardless.
#
#	pf(4) filters traffic across these bridges (host.conf has rules on veb0
#	and veb1), so a compromised guest cannot reach its neighbours just because
#	they share a switch.

# ------------------------------------------------------------------ global
# VMs are started in small batches so that eight guests booting at once do not
# stampede the disk.  The defaults (one per online CPU, 30s apart) are slower
# than necessary on a lab box with NVMe storage.
staggered start parallel 4 delay 10

# Give vmd(8) its own control socket group instead of root:wheel, so operators
# can use vmctl(8) without a root shell.  Uncomment together with:
#	gpasswd vmd        # or: groupadd vmd ; usermod -G vmd <operator>
#socket owner :vmd

# Export per-VM counters to snmpd(8).  Like relayd's agentx line, this needs
# snmpd's /var/agentx/master to exist first — vmd starts before snmpd, so it is
# off by default.
#agentx

# ------------------------------------------------------------------ switches
switch "dmz" {
	interface veb0
	description "dmz 10.10.40.0/24"
	group vm-zone
	# Drop frames whose source MAC does not belong to an interface on this
	# switch: a guest cannot impersonate its neighbour.
	locked lladdr
	up
}

switch "srv" {
	interface veb1
	description "srv 10.10.50.0/24"
	group vm-zone
	locked lladdr
	up
}

# Provisioning network.  Guests are attached here only while they install
# (scripts/provision-vm.sh passes "-n install"); nothing in vm.conf attaches
# to it permanently.  See the provisioning section of pf.conf.
switch "install" {
	interface veb2
	description "install 10.10.99.0/24 (provisioning only)"
	# Not locked: during install the MAC seen on the wire is the guest's, and
	# we want no surprises while the installer is running.
	up
}

# ------------------------------------------------------------------ guests
# Every guest lives in exactly one zone switch.  Memory/CPU figures come from
# the addressing plan; disk paths are on the dedicated /var/vmm filesystem
# (see /etc/fstab), so a runaway qcow2 cannot fill /var.

# --- bastion: the only guest with a publicly usable SSH path --------------
vm "bastion" {
	memory 1G
	cpus 2
	disk "/var/vmm/bastion.qcow2"
	interface { switch "srv" }
	enable
}

# --- dns: authoritative + recursive resolver for the lab ------------------
vm "dns" {
	memory 512M
	cpus 1
	disk "/var/vmm/dns.qcow2"
	interface { switch "srv" }
	enable
}

# --- db: PostgreSQL for the web VM ---------------------------------------
vm "db" {
	memory 2G
	cpus 2
	disk "/var/vmm/db.qcow2"
	interface { switch "srv" }
	enable
}

# --- storage: NFS, Samba, backups ----------------------------------------
vm "storage" {
	memory 1G
	cpus 2
	disk "/var/vmm/storage.qcow2"
	interface { switch "srv" }
	enable
}

# --- mon: SNMP polling, central logs, reports ----------------------------
vm "mon" {
	memory 1G
	cpus 2
	disk "/var/vmm/mon.qcow2"
	interface { switch "srv" }
	enable
}

# --- web: relayd's backend, inside the DMZ --------------------------------
vm "web" {
	memory 1G
	cpus 2
	disk "/var/vmm/web.qcow2"
	interface { switch "dmz" }
	enable
}

# --- mail: public MX, IMAPS, submission -----------------------------------
vm "mail" {
	memory 2G
	cpus 2
	disk "/var/vmm/mail.qcow2"
	interface { switch "dmz" }
	enable
}

# ------------------------------------------------------------------ template
# A stopped VM can be used as a template for throwaway instances.  Build one
# once (install it like any guest, then halt it), and create copies with:
#	vmctl create -b /var/vmm/srv-template.qcow2 -s 20G /var/vmm/test.qcow2
#	vmctl start -t srv-template -d /var/vmm/test.qcow2 test
# "allow instance" is what makes the non-root case possible; root can always
# create instances regardless of it.
vm "srv-template" {
	memory 512M
	cpus 1
	disk "/var/vmm/srv-template.qcow2"
	interface { switch "srv" }
	disable
	allow instance {
		disk
		interface
		memory
		owner
	}
}

# ------------------------------------------------------------------ notes
# * vmm(4) requires CPU virtualisation support (VT-x/AMD-V) enabled in the
#   firmware.  If "vmctl start" fails immediately, check:
#	dmesg | grep -i -e vmx -e svm
# * Guest memory is charged to the vmd user's datasize limit — see
#   /etc/login.conf.d/vmd-limits and run "usermod -L vmd vmd" once.
# * vmctl(8) cannot change a running VM's configuration: stop it, reload
#   ("vmctl reload"), then start it again.
# * Guests are attached to a switch by name; changing a veb's address does not
#   require touching vm.conf, only the matching hostname.vebN file.
