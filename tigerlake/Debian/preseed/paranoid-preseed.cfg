#=============================================================================
# preseed/paranoid-preseed.cfg
# Unattended Debian 13 "trixie" install for the paranoid Apache server described in docs/02.
#
# !!! READ THIS BEFORE USING IT !!!
#   * A preseed file is CODE THAT PARTITIONS A DISK. Read every line of the partitioning section
#     and confirm it matches your hardware (the disk name below is /dev/nvme0n1, as on the target
#     machine - verify with `lsblk` in the installer before you commit).
#   * TEST IT IN THE ROOTLESS VM FIRST (docs/08 §4). That is a ten-minute test; a preseed bug on
#     bare metal is a lost afternoon.
#   * This file deliberately does NOT contain a LUKS passphrase. The installer will PROMPT for it.
#     Do not add one: preseed files end up on USB sticks, in git, and in shell history.
#   * The user password below is a placeholder. Hash your own:
#       openssl passwd -6 -salt "$(openssl rand -hex 8)" 'your passphrase'
#     and replace * . Leaving it will produce an install you must fix immediately.
#   * GRUB is installed (Path B fallback, docs/03 §2). For Secure Boot with your OWN keys (Path A),
#     plan on replacing the bootloader afterwards with systemd-boot + a signed UKI.
#
# Use it:  add to the installer's boot prompt:
#   auto=true priority=critical url=file:///cdrom/paranoid-preseed.cfg
#=============================================================================

### Locale and keyboard ######################################################
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/locale-selected-only boolean true
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/toggle select No toggling

### Network ##################################################################
# Offline-first: bring up a link only if you have a local mirror. If you install offline, you will
# add the mirror afterwards - that is deliberate, because a network install pulls a lot you do not
# need and you are not yet firewalled.
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_timeout string 30
d-i netcfg/get_hostname string srv-01
d-i netcfg/get_domain string localdomain
d-i netcfg/hostname string srv-01
# If you have no usable network during install, set d-i netcfg/enable boolean false and expect to
# configure /etc/apt/sources.list by hand afterwards.

### Firmware (this machine needs non-free firmware: iwlwifi/i915) #############
d-i hw-detect/load_firmware boolean true

### Clock ####################################################################
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string time.cloudflare.com

### Mirror and repositories ##################################################
d-i mirror/country string manual
d-i mirror/protocol string https
d-i mirror/https/hostname string deb.debian.org
d-i mirror/https/directory string /debian
d-i mirror/https/proxy string
d-i mirror/suite string trixie
d-i mirror/udeb/suite string trixie
# main + non-free-firmware only (docs/02 §2). NO contrib, NO backports, NO third-party repos.
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
d-i apt-setup/non-free boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/security_path string /debian
# Never install Recommends: the "only necessary software" policy, enforced at install time.
d-i pkgsel/install-recommends boolean false
d-i pkgsel/upgrade select none

### Accounts #################################################################
# Root login disabled; the admin user gets sudo. This matches docs/04 §1 (we lock root again after
# install anyway - belt and braces, and it means no window exists where root is usable over the wire).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Administrator
d-i passwd/user-uid string 1000
d-i passwd/user-default-groups string sudo
# !!! PLACEHOLDER - replace with your own crypt(3) hash (see the header) !!!
d-i passwd/user-password-crypted password *
d-i passwd/user-password password insecure-change-me
d-i passwd/user-password-again password insecure-change-me

### Partitioning - LUKS2 + LVM (see docs/02 §3) ##############################
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string crypto
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string vg0
# A separate /boot is required for the read-only-boot tier and for UKI handling; /boot/efi is 1 GiB
# because UKIs plus backups fill a 512 MiB ESP faster than people expect.
# The passphrase is NOT set here on purpose: the installer prompts for it.
d-i partman-crypto/confirm_nooverwrite boolean true
d-i partman-crypto/weak_passphrase boolean false
d-i partman-auto/expert_recipe string                           \
      paranoid ::                                                \
              1024 1024 1024 fat32                               \
                      $primary{ } $lvmignore{ } method{ efi }     \
                      format{ } mountpoint{ /boot/efi } .         \
              1024 1024 1024 ext4                                \
                      $primary{ } $lvmignore{ } $bootable{ }      \
                      method{ format } format{ } use_filesystem{ } \
                      filesystem{ ext4 } mountpoint{ /boot } .    \
              16000 24000 -1 ext4                                \
                      $lvmok{ } lv_name{ root } method{ format }  \
                      format{ } use_filesystem{ } filesystem{ ext4 } \
                      mountpoint{ / } .                           \
              12000 16000 40000 ext4                             \
                      $lvmok{ } lv_name{ var } method{ format }   \
                      format{ } use_filesystem{ } filesystem{ ext4 } \
                      mountpoint{ /var } .                        \
              4000 6000 20000 ext4                               \
                      $lvmok{ } lv_name{ varlog } method{ format } \
                      format{ } use_filesystem{ } filesystem{ ext4 } \
                      mountpoint{ /var/log } .                    \
              2000 4000 8000 ext4                                \
                      $lvmok{ } lv_name{ vartmp } method{ format } \
                      format{ } use_filesystem{ } filesystem{ ext4 } \
                      mountpoint{ /var/tmp } .                    \
              2000 4000 8000 ext4                                \
                      $lvmok{ } lv_name{ srv } method{ format }   \
                      format{ } use_filesystem{ } filesystem{ ext4 } \
                      mountpoint{ /srv } .                        \
              1000 2000 4000 ext4                                \
                      $lvmok{ } lv_name{ home } method{ format }  \
                      format{ } use_filesystem{ } filesystem{ ext4 } \
                      mountpoint{ /home } .                       \
              2000 4000 8000 linux-swap                          \
                      $lvmok{ } lv_name{ swap } method{ swap } format{ } .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Package selection ########################################################
# NO desktop, NO standard utilities at Tier 3. The host package set is installed afterwards by
# scripts/install-hardening.sh (docs/02 §5), which is auditable and tier-aware.
tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server ca-certificates
d-i pkgsel/run_tasksel boolean false
popularity-contest popularity-contest/participate boolean false
d-i pkgsel/install-language-support boolean false

### Bootloader ###############################################################
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/nvme0n1
# For Secure Boot with your own keys (Path A), install GRUB now and replace it afterwards with
# systemd-boot + a signed UKI per docs/03 §2. Do NOT skip the bootloader entirely: you want a
# bootable machine while you set up the signed chain.

### Finish and reboot ########################################################
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

#-----------------------------------------------------------------------------
# AFTER THE INSTALL (do not expect a preseed to do these - they need a human):
#   1. boot, confirm: cryptsetup luksDump /dev/nvme0n1p3 ; lsblk ; findmnt
#   2. move this repository onto the machine (USB, read-only mount is fine)
#   3. sudo bash scripts/install-hardening.sh --dry-run --tier 2
#   4. sudo bash scripts/install-hardening.sh --tier 2
#   5. docs/03 (Secure Boot own keys) -> docs/05 (firewall) -> docs/06 (Apache)
#   6. keep a tested copy of files/etcd-style config offline: docs/10 §5-6
#-----------------------------------------------------------------------------
