#	install.conf for the bastion guest
#
#	Fetched by the installer from httpd(8) on 10.10.99.1 during
#	provisioning; see scripts/provision-vm.sh.  deploy.sh copies this file to
#	/var/www/htdocs/install/install.conf.bastion on the gateway.
#
#	These answers describe a *bootstrap*: a DHCP address on the install
#	network and a default disk layout.  The guest's real configuration
#	(10.10.50.10/24 on the srv switch, sshd hardening, pf) is deployed
#	afterwards from vms/bastion/etc/ and overwrites /etc/hostname.vio0.
#
#	Every REPLACE-ME below must be filled in before the first install.
#	Generate the password hashes with:
#	    encrypt                     # prompts twice, prints the hash
#	and paste the whole "$2b$..." string.

System hostname = bastion
Password for root = REPLACE-ME-ROOT-HASH

# --- network, install time only ----------------------------------------------
Network interfaces = vio0
IPv4 address for vio0 = dhcp
IPv6 address for vio0 = none
DNS domain name = lab.example.org
DNS nameservers = 10.10.99.1

# --- console -----------------------------------------------------------------
# vmd(8) presents the guest's console over a pty; the installer must send the
# console there or `vmctl console` shows nothing.
Change the default console to com0 = yes
Which speed should com0 use = 115200

# --- administration ----------------------------------------------------------
Setup a user = admin
Full name for user admin = Lab Administrator
Password for user admin = REPLACE-ME-ADMIN-HASH
Public SSH key for user admin = REPLACE-ME-SSH-PUBLIC-KEY
Allow root ssh login = prohibit-password

Time zone = UTC

# --- sets --------------------------------------------------------------------
# Served by the gateway itself on the install network.  Every URL in this file
# is an IP literal, so nothing here depends on name resolution working.
Location of sets = http
HTTP Server = 10.10.99.1
Server directory = install
Set name(s) = done
