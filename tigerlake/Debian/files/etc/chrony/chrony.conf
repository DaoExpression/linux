# /etc/chrony/chrony.conf
# Correct time is a security control here: TLS validity, audit timestamps, and certificate
# revocation all depend on it. NTS (RFC 8915) authenticates the time source, which matters because
# an unauthenticated NTP server can shift your clock and make expired certs look valid.
#
# Check:  chronyc tracking ; chronyc sources -v ; chronyc ntpdata | grep -i auth

# NTS-authenticated public sources (Debian trixie chrony supports 'nts').
# Add/remove servers as you like, but keep at least two independent operators.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server time.nrc.ca iburst nts

# Fall back to normal authenticated-by-server-key NTP only if NTS is unavailable for you.
#pool 2.debian.pool.ntp.org iburst

# Our clock must be right before TLS/DNSSEC depend on it, but we never step a running server
# backwards in a way that confuses logs: allow a step only early, then slew.
makestep 1.0 3
driftfile /var/lib/chrony/chrony.drift
rtcsync
logdir /var/log/chrony
log tracking measurements statistics

# Do NOT serve time to others: no 'allow' directive, and no broadcast/multicast server.
# The nftables egress allowlist (docs/05 §4) also restricts who we may talk to.
noclientlog
maxupdateskew 100.0
minsources 2
# Refuse to sync if the offset is absurd (a big jump usually means an attacker or a broken VM).
maxdistance 16.0

# Leapsect-related safety: on a server, prefer to be told about leaps via NTP.
leapsectz right/UTC

# Bind only where it is needed.
bindaddress 127.0.0.1
bindaddress ::1

# Run as an unprivileged user (Debian does this by default).
user _chrony
