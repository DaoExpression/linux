# /etc/systemd/system/apache2.service.d/99-paranoid.conf
# Sandbox the web server's unit. Config files control what Apache *does*; this controls what it
# *can* do even if a request handling bug gives an attacker code execution in the process.
#
# After installing:
#   sudo systemctl daemon-reload && sudo systemctl restart apache2
#   sudo systemd-analyze security apache2 | tail -20      # target: exposure < 2.0
#   journalctl -u apache2 -n 30 | grep -iE 'denied|failed'
#
# Read docs/06 §6 before adding or removing anything here: three of these directives break
# specific Apache modules, and the comments say which.

[Service]
# --- filesystem ------------------------------------------------------------
ProtectSystem=strict            # / and /usr read-only for this unit
ProtectHome=yes
PrivateTmp=yes                  # private /tmp and /var/tmp: no shared staging area between services
PrivateDevices=yes              # no /dev access beyond the bare minimum (no disks, no cameras)
ReadWritePaths=/var/log/apache2 /var/lib/apache2 /run/apache2 /var/cache/apache2
InaccessiblePaths=/root /home /etc/letsencrypt/live   # keys live here; the unit does not need the
                                                       # live symlink tree, only the resolved path
                                                       # read by the master process at startup.
# --- kernel / namespaces ---------------------------------------------------
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectProc=invisible           # requires systemd >= 257 (Debian 13); drop if on older systemd
ProcSubset=pid
RestrictNamespaces=yes          # Apache has no business creating namespaces
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
# --- syscalls / capabilities ----------------------------------------------
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-emulation @swap @keyring
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_KILL
AmbientCapabilities=
NoNewPrivileges=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
UMask=0027

# DELIBERATELY ABSENT - each of these looks tempting and will bite you:
# * MemoryDenyWriteExecute=yes  -> breaks mod_security3 (libmodsecurity/RE2) and any JIT. Add it
#                                 only if you have tested your exact module set under load.
# * PrivateUsers=yes            -> Apache must bind :443 and setuid to www-data; with PrivateUsers
#                                 the capability model breaks and it will not start. The supported
#                                 alternative is listening on 8443 inside a user namespace and
#                                 redirecting 443 -> 8443 in nftables (docs/06 §6).
# * ProtectSystem=full          -> weaker than 'strict'; there is no reason to pick it.
# * RestrictAddressFamilies with AF_NETLINK removed -> if you add mod_ldap or depend on glibc's
#                                 netlink-based interface enumeration, those calls will fail.
