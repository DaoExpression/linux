#	/etc/nsd.conf — gateway
#
#	Validate:  nsd-checkconf /etc/nsd.conf
#	Apply:     rcctl reload nsd        (zones are re-read; SOA serial decides)
#	Zone check: nsd-checkzone lab.example.org /var/nsd/zones/lab.example.org.zone
#	Query it:  dig @10.10.50.1 www.lab.example.org
#
#	The gateway is the *primary* for lab.example.org: it is the one place that
#	always exists, so it is the right home for the zone even though the dns VM
#	is what clients actually query.  The dns VM receives the zone by AXFR and
#	serves recursion on top of it (see vms/dns/).
#
#	This instance answers on 10.10.50.1 (SRV) and 10.10.10.1 (MGMT) only, so
#	a compromised DMZ guest cannot use the gateway as a resolver — pf.conf
#	does not allow it either.

server:
	# --- identity ---------------------------------------------------------
	# Do not tell strangers which version is running, or who runs it.
	hide-version: yes
	identity: "nsd.lab.example.org"
	version: "unknown"

	# --- logging ----------------------------------------------------------
	# 0 = errors only, 1 = + warnings, 2 = + queries.  Leave it at 1 in
	# production: per-query logging belongs on the dns VM, which is the
	# instance clients actually use.
	verbosity: 1
	logfile: "/var/log/nsd.log"

	# --- runtime ----------------------------------------------------------
	username: "_nsd"
	zonesdir: "/var/nsd/zones"
	xfrdfile: "/var/nsd/xfrd.state"
	pidfile: "/var/run/nsd.pid"
	# Write zonefiles and xfrd state atomically so a crash cannot leave a
	# half-written zone behind.
	xfrd-reload-timeout: 10
	server-count: 2
	so-reuseport: yes

	# --- listeners --------------------------------------------------------
	# Loopback for local tooling, the SRV and MGMT addresses for the lab.
	# 10.10.40.1 and the client gateways are intentionally absent.
	ip-address: 127.0.0.1
	ip-address: ::1
	ip-address: 10.10.10.1
	ip-address: 10.10.50.1
	do-ip4: yes
	do-ip6: yes
	port: 53

	# --- hardening --------------------------------------------------------
	# Refuse anything that is not an ordinary query: no AXFR from just anyone
	# (the zone: block below lists the permitted secondaries), no NOTIFY
	# handling from strangers.
	zonefiles-check: yes
	# Response rate limiting: a flat 200 responses/second per source, with
	# every 2nd (slip-ratio 2) answered with TC=1 so legitimate clients
	# retry over TCP while a flood is dropped.
	rrl-size: 1000000
	rrl-ratelimit: 200
	rrl-slip: 2
	# Cookies make off-path spoofing harder.
	answer-cookie: yes

remote-control:
	# nsd-control(8) over a unix socket; reload/transfer/notify from the
	# command line without restarting the daemon.
	control-enable: yes
	control-interface: /var/run/nsd.sock
	server-key-file: "/var/nsd/nsd_server.key"
	server-cert-file: "/var/nsd/nsd_server.pem"
	control-key-file: "/var/nsd/nsd_control.key"
	control-cert-file: "/var/nsd/nsd_control.pem"
	# If nsd refuses to start complaining about these files, generate them
	# once with:  /usr/sbin/nsd-control-setup

# ------------------------------------------------ zones
# Primary for the forward zone.  The file lives in zonesdir.
zone:
	name: "lab.example.org"
	zonefile: "lab.example.org.zone"

	# AXFR to the dns VM (which serves clients) and to loopback for tests.
	# NOKEY means "no TSIG", which is acceptable because the transfer is
	# permitted per-source and only to a host on the SRV segment.  On a
	# network you do not fully control, generate a TSIG key with
	# nsd-control(8) and use "provide-xfr: <ip> <keyname> <keysecret>" here.
	provide-xfr: 10.10.50.11 NOKEY
	provide-xfr: ::1 NOKEY
	provide-xfr: 127.0.0.1 NOKEY
	notify: 10.10.50.11 NOKEY

# Reverse zone for the SRV segment (10.10.50.0/24 -> 50.10.10.in-addr.arpa).
# Same delegation model; the clients find it through the forward zone's NS
# records only if you add the in-addr.arpa delegation at your upstream, which
# is pointless for private space — it is here so "dig -x" works inside the lab.
zone:
	name: "50.10.10.in-addr.arpa"
	zonefile: "50.10.10.in-addr.arpa.zone"
	provide-xfr: 10.10.50.11 NOKEY
	provide-xfr: 127.0.0.1 NOKEY
	notify: 10.10.50.11 NOKEY
