# /etc/apache2/conf-available/headers-hardening.conf
# Security response headers. Enabled with:  sudo a2enconf headers-hardening
# See docs/06 §5. Requires mod_headers (enabled in the module list).
#
# Validate:  sudo apache2ctl configtest
# Verify (from off-box):  curl -sI https://<server>/ | grep -iE 'strict-transport|content-security'

<IfModule mod_headers.c>

    # -----------------------------------------------------------------------
    # Transport and framing
    # -----------------------------------------------------------------------
    # HSTS: 2 years, subdomains included. 'preload' is included so you *can* submit to the preload
    # list, but only do that when you are certain every subdomain will always be HTTPS.
    # env=HTTPS makes it apply only over TLS (so a future port-80 redirect is not poisoned).
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" env=HTTPS

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # -----------------------------------------------------------------------
    # Cross-origin isolation (blocks a class of side-channel and CSRF-ish attacks)
    # -----------------------------------------------------------------------
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    # Uncomment when you have verified every embedded resource is same-origin:
    #Header always set Cross-Origin-Embedder-Policy "require-corp"

    # -----------------------------------------------------------------------
    # Feature policy: deny browser features this site has no business using
    # -----------------------------------------------------------------------
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"

    # -----------------------------------------------------------------------
    # Content-Security-Policy
    # -----------------------------------------------------------------------
    # ADJUST THIS TO YOUR APPLICATION. 'default-src self' will break a site that loads scripts,
    # fonts or styles from a CDN. The correct fix is to serve those assets yourself or list the exact
    # origins - NOT to add 'unsafe-inline' / 'unsafe-eval', which throw away most of the benefit.
    # This policy is strict enough that an injected script cannot exfiltrate anything.
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests"

    # -----------------------------------------------------------------------
    # Do not leak server-side technology, ever
    # -----------------------------------------------------------------------
    Header always unset X-Powered-By
    Header always unset X-Generator
    Header always unset X-Drupal-Cache
    Header always unset X-Runtime
    Header always unset Server

    # -----------------------------------------------------------------------
    # Cookies: force the flags that stop the two most common app-level session thefts.
    # -----------------------------------------------------------------------
    # WARNING: if your application already sets HttpOnly/Secure/SameSite itself, this line produces
    # DUPLICATED attributes. Browsers ignore the duplicates, but some clients/apps are fussy.
    # Test with your app; comment the line out if it causes trouble - the app setting them itself is
    # equally good and cleaner.
    Header edit Set-Cookie ^(?i)(.*)$ "$1; HttpOnly; Secure; SameSite=Strict"

</IfModule>

# If mod_headers is missing, the config should fail loudly rather than silently serve without the
# security headers. a2enconf does not check this, so we assert it here.
<IfModule !mod_headers.c>
    # Deliberately invalid directive: refuses to start if headers are not available.
    # Comment this out only if you have replaced mod_headers with equivalent functionality.
    HeaderHardeningRequiresModHeaders
</IfModule>
