#	/etc/smtpd.conf — gateway
#
#	Validate:  smtpd -n
#	Apply:     rcctl reload smtpd
#	Queue:     smtpctl show queue ; smtpctl show stats
#
#	The gateway is NOT a mail server.  Its smtpd(8) exists so that cron(8),
#	newsyslog(8) and the lab scripts can send mail: it accepts connections
#	from the local host only and relays everything to the mail VM, which owns
#	the public MX records, the DKIM key and the mailboxes.
#
#	That means: no listen on any network interface, no local delivery (no
#	/var/mail, no mbox that nobody reads), no inbound SMTP at all.

# Aliases are resolved here as well as on the mail VM so that a cron message
# addressed to "root" is rewritten to a real mailbox before it leaves.
table aliases file:/etc/mail/aliases

# The only listener.  lo0 keeps it unreachable from every network, including
# the lab: a compromised VM cannot use the gateway as an open relay.
listen on lo0

# Everything is handed to the mail VM over plain SMTP on the SRV/DMZ path.
# Add "tls" and a certificate name here if the mail VM presents a publicly
# trusted certificate; inside the lab, the transport is already on a trusted
# segment and STARTTLS is opportunistic anyway.
action "relay-to-mail" relay host smtp://10.10.40.21

# Local system mail (cron, scripts, logwatch) goes out through the mail VM.
match from local for any action "relay-to-mail"
match from local action "relay-to-mail"

# ------------------------------------------------------------------ notes
# * If the mail VM is down, messages queue on the gateway and are retried for
#   the default 4 days — that is the desired behaviour for a monitoring box.
# * To let other VMs relay through the gateway instead of talking to the mail
#   VM directly, add:
#	listen on 10.10.50.1 port submission tls-require
#	match from src 10.10.50.0/24 for any action "relay-to-mail"
#   and the matching pf rule.  Keeping that off means one compromised guest
#   cannot send mail as the lab.
