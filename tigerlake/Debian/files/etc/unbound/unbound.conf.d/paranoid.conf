# /etc/unbound/unbound.conf.d/paranoid.conf
# A LOCAL validating resolver on 127.0.0.1. It is not a public resolver: nothing on the internet can
# query it, and it accepts queries only from the loopback.
#
# Why bother (docs/04 §11): DNSSEC validation happens here, queries are hidden from the local
# network with DNS-over-TLS, DNS-rebinding towards your LAN is blocked, and the nftables egress
# allowlist can be a single line ("DNS to these upstreams") instead of "port 53 to anywhere".
#
# Check:  sudo unbound-checkconf  &&  sudo systemctl restart unbound  &&  dig +dnssec debian.org @127.0.0.1

server:
    interface: 127.0.0.1
    interface: ::1
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    # Everything else is refused by default (no access-control line = refuse).

    do-ip4: yes
    do-ip6: no            # set to yes only if this host has working IPv6 upstream connectivity
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no

    # --- do not answer questions about ourselves or about anyone else ---
    hide-identity: yes
    hide-version: yes
    identity: "server"
    version: "server"
    do-not-query-localhost: yes
    qname-minimisation: yes
    qname-minimisation-strict: yes

    # --- DNSSEC: fail closed, always ---
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-log-level: 1
    val-clean-additional: yes
    val-permissive-mode: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    aggressive-nsec: yes
    root-hints: "/var/lib/unbound/root.hints"   # optional; remove this line if the file is absent

    # --- anti-rebinding: never hand out private answers to the public ---
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # --- DoS resistance: we are the only client, so be strict ---
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m
    cache-min-ttl: 60
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    minimal-responses: yes
    rrset-roundrobin: yes
    unwanted-reply-threshold: 10000000
    edns-buffer-size: 1232          # avoid fragmentation-based attacks
    max-udp-size: 1232

    # --- never, ever expose this to the network ---
    remote-control:
        control-enable: no

    username: "unbound"
    directory: "/etc/unbound"
    logfile: ""                      # log to syslog/journald
    use-syslog: yes
    verbosity: 1
    log-queries: no                  # no: query logs are a privacy leak inside your own log store

forward-zone:
    name: "."
    forward-tls-upstream: yes        # DNS-over-TLS to the upstreams below
    # Verify against the system CA bundle.
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 1.1.1.1@853#one.one.one.one
    forward-first: no                # if DoT upstreams are down, fail rather than leak in clear
