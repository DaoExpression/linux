#	/etc/dhcpleased.conf — gateway
#
#	dhcpleased(8) is driven by /etc/hostname.igc0 ("inet autoconf"); this file
#	only carries per-interface preferences.  Most installations need no file
#	at all, which is why everything here is a comment.
#
#	Check the result with:
#	    ifconfig igc0 | grep -i inet
#	    dhcpleasectl -n       # requests a new lease
#	    cat /var/db/dhcpleased/*.lease   # what the ISP actually sent

# --- ignore a DHCP server that must not be used ------------------------------
# Handy on a lab trunk where a rogue device (or a second, misconfigured
# router) is also answering: dhcpleased stops using that interface entirely.
#
#interface igc0 {
#	ignore
#}
#
# NOTE: if dhcpleased ignores the only interface that would give the box a
# default route, the gateway boots without one.  Prefer fixing the rogue DHCP
# server, and use the "match in ... port bootps" log rules in pf.conf to find
# it.

# --- multi-homed WANs --------------------------------------------------------
# With two uplinks, pin each interface explicitly so that leases cannot be
# attributed to the wrong one:
#
#interface igc0 {
#	ignore
#}
#interface igc2 {
#	ignore
#}

# The static WAN configuration used when the ISP gives you a fixed address is
# in /etc/hostname.igc0 instead, e.g.:
#	inet 203.0.113.10 255.255.255.248 203.0.113.15
#	!route add default 203.0.113.9
