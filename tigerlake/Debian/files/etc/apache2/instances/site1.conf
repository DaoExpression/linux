# /etc/apache2/instances/site1.conf
# Configuration for the apache2@site1 instance (docs/06 §7, docs/08).
#
# This is a COMPLETE, standalone server configuration: it does not include /etc/apache2/sites-enabled
# or conf-enabled, because a second instance must not inherit vhosts that belong to the first one.
# It DOES include the same hardening fragments, deliberately: an instance that is less hardened than
# the main one is how isolation quietly becomes a downgrade.
#
# Validate:  sudo apache2ctl -f /etc/apache2/instances/site1.conf -t
# Start:     sudo systemctl enable --now apache2@site1
# Inspect:   sudo systemd-analyze security apache2@site1 | tail -3
#            sudo ss -tulpn | grep 8443

ServerRoot "/etc/apache2"
Mutex file:${APACHE_LOCK_DIR} default
PidFile ${APACHE_PID_FILE}
DefaultRuntimeDir ${APACHE_RUN_DIR}

# User/Group come from /etc/apache2/instances/site1.envvars (a dedicated unprivileged user).
User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}

# --- same exposure discipline as the main instance (docs/06 §3) ------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off
HostnameLookups Off
UseCanonicalName Off
FileETag None

Timeout 30
KeepAlive On
MaxKeepAliveRequests 64
KeepAliveTimeout 5
LimitRequestFields 40
LimitRequestFieldSize 4096
LimitRequestLine 4096
LimitRequestBody 1048576
LimitXMLRequestBody 0
RequestReadTimeout header=10-20,MinRate=500 body=10-20,MinRate=500

# --- modules: load only what this instance needs ---------------------------
# mod_proxy is NOT loaded. If you need a front-end proxy, that is a deliberate architectural
# decision with its own review (docs/06 §7 option 3), not a line you add while debugging.
LoadModule mpm_event_module          /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authn_core_module         /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authz_core_module         /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module         /usr/lib/apache2/modules/mod_authz_host.so
LoadModule auth_basic_module         /usr/lib/apache2/modules/mod_auth_basic.so
LoadModule unixd_module              /usr/lib/apache2/modules/mod_unixd.so
LoadModule mime_module               /usr/lib/apache2/modules/mod_mime.so
LoadModule log_config_module         /usr/lib/apache2/modules/mod_log_config.so
LoadModule setenvif_module           /usr/lib/apache2/modules/mod_setenvif.so
LoadModule dir_module                /usr/lib/apache2/modules/mod_dir.so
LoadModule alias_module              /usr/lib/apache2/modules/mod_alias.so
LoadModule headers_module            /usr/lib/apache2/modules/mod_headers.so
LoadModule filter_module             /usr/lib/apache2/modules/mod_filter.so
LoadModule deflate_module            /usr/lib/apache2/modules/mod_deflate.so
LoadModule reqtimeout_module         /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule ssl_module                /usr/lib/apache2/modules/mod_ssl.so
LoadModule socache_shmcb_module      /usr/lib/apache2/modules/mod_socache_shmcb.so
LoadModule security2_module          /usr/lib/apache2/modules/mod_security2.so
#LoadModule http2_module             /usr/lib/apache2/modules/mod_http2.so

# --- shared hardening fragments (same policy as the main instance) ---------
Include /etc/apache2/conf-available/security-hardening.conf
Include /etc/apache2/conf-available/headers-hardening.conf
Include /etc/apache2/conf-available/tls-hardening.conf
Include /etc/apache2/conf-available/mpm-tuning.conf

# --- module configuration that the fragments above expect ------------------
Include /etc/apache2/mods-available/security2.conf
<IfModule ssl_module>
    SSLRandomSeed startup builtin
    SSLRandomSeed connect builtin
</IfModule>
TypesConfig /etc/mime.types
AddDefaultCharset UTF-8
DirectoryIndex index.html

# --- listen: a HIGH port, on purpose --------------------------------------
# The instance does not need a privileged port; publishing it publicly is an nftables decision
# (files/etc/nftables.d/README.md), which keeps the "who can reach this" question in one place.
# 443 stays with the main instance; this one is reachable only if you deliberately map it.
Listen 127.0.0.1:8443

ErrorLog  ${APACHE_LOG_DIR}/site1_error.log
LogLevel  warn
LogFormat "%v %h %l %u %t \"%r\" %>s %b %D \"%{User-Agent}i\"" paranoid
CustomLog ${APACHE_LOG_DIR}/site1_access.log paranoid

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<VirtualHost 127.0.0.1:8443>
    ServerName site1.internal
    SSLEngine on
    SSLCertificateFile    /etc/ssl/private/site1.crt
    SSLCertificateKeyFile /etc/ssl/private/site1.key

    DocumentRoot /srv/site1/public
    <Directory /srv/site1/public>
        Options -Indexes -ExecCGI -Includes -MultiViews -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /srv/site1/data>
        Require all denied
    </Directory>
    <LocationMatch "^/(cgi-bin|server-status|server-info|\..*)">
        Require all denied
    </LocationMatch>
    ErrorDocument 404 /error/404.html
</VirtualHost>
