#	/etc/ssh/sshd_config.d/10-maintenance.conf
#
#	Example drop-in.  Files here are pulled in by the Include line at the
#	end of /etc/ssh/sshd_config.  sshd(8) uses the *first* matching value
#	it reads, so a drop-in can not loosen what sshd_config already set —
#	only tighten, or set options that were left unset.
#
#	This example lets the "netops" group reach the box from USERS while
#	maintenance windows are running, and tightens the grace period further.
#
#	Delete this file (or leave it commented) if you do not need it.

#Match Group netops Address 10.10.20.0/24
#	PasswordAuthentication no
#	PermitRootLogin no
#	ForceCommand /usr/local/sbin/maintenance-shell

LoginGraceTime 20
