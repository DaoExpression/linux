c/cmdline                         # lockdown=confidentiality present\ncat /sys/kernel/security/lockdown\nfindmnt /boot /boot/efi -o TARGET,OPTIONS # /boot ro (tier3) or rw; /boot/efi umask=0077\nsudo sbctl verify | grep -ci 'not signed' # 0<\/code><\/pre><\/div>\n<p>Then run <code>bash scripts/verify-hardening.sh<\/code> — it checks all of the above automatically and exits non-zero if any of it has drifted.<\/p>", "files": ["etc/kernel/cmdline", "etc/kernel/install.conf", "etc/kernel/postinst.d/zz-sign-uki", "etc/default/grub", "etc/crypttab.example", "keys/README.md"], "toc": [{"lvl": 1, "id": "03-boot-integrity-secure-boot-your-keys-uki-luks", "text": "03 — Boot integrity: Secure Boot (your keys), UKI, LUKS"}, {"lvl": 2, "id": "1-choose-your-luks-profile", "text": "1. Choose your LUKS profile"}, {"lvl": 2, "id": "2-secure-boot-with-your-own-keys", "text": "2. Secure Boot with your own keys"}, {"lvl": 3, "id": "path-a-own-keys-systemd-boot-signed-unified-kernel-image-recommended", "text": "Path A — own keys, systemd-boot, signed Unified Kernel Image (recommended)"}, {"lvl": 3, "id": "path-b-debian-shim-mok-fallback", "text": "Path B — Debian shim + MOK (fallback)"}, {"lvl": 2, "id": "3-kernel-lockdown-and-module-policy", "text": "3. Kernel lockdown and module policy"}, {"lvl": 2, "id": "4-p1-p2-conversion-detached-luks-header-verified-and-reversible", "text": "4. P1 → P2 conversion (detached LUKS header), verified and reversible"}, {"lvl": 2, "id": "5-tpm2-what-we-do-and-do-not-use-it-for", "text": "5. TPM2 — what we do and do not use it for"}, {"lvl": 2, "id": "6-ima-measurement-optional-tier-2", "text": "6. IMA / measurement (optional, Tier 2+)"}, {"lvl": 2, "id": "7-verification-checklist-for-this-document", "text": "7. Verification checklist for this document"}], "fences": 10, "tables": 1}, {"slug": "04-base-hardening", "title": "04 · Base hardening", "html": "<h1 id=\"04-base-system-hardening\">04 — Base system hardening<a class=\"anchor\" href=\"#04-base-system-hardening\" aria-label=\"link\">#<\/a><\/h1>\n<p>Everything here ships as an artefact under <code>files/<\/code>; <code>scripts/install-hardening.sh<\/code> installs it. This document explains <strong>what<\/strong> each file does, <strong>why<\/strong>, and how to verify it.<\/p>\n<hr>\n<h2 id=\"1-users-root-and-sudo\">1. Users, root, and sudo<a class=\"anchor\" href=\"#1-users-root-and-sudo\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Action<\/th>\n<th style=\"text-align:left\">Command<\/th>\n<th style=\"text-align:left\">Rationale<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">Lock root login<\/td>\n<td style=\"text-align:left\"><code>sudo passwd -l root<\/code><\/td>\n<td style=\"text-align:left\">No direct root login. <code>sudo<\/code> attributes and logs every action.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Force sudo re-auth<\/td>\n<td style=\"text-align:left\"><code>Defaults timestamp_timeout=0<\/code> in <a href=\"#/file/etc/sudoers.d/00-paranoid\"><code>files/etc/sudoers.d/00-paranoid<\/code><\/a><\/td>\n<td style=\"text-align:left\">An unlocked terminal cannot be used to <code>sudo<\/code> 15 minutes later.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Require a TTY and a PTY<\/td>\n<td style=\"text-align:left\"><code>Defaults requiretty<\/code> (where usable) + <code>Defaults use_pty<\/code><\/td>\n<td style=\"text-align:left\">Kills stdin/stdout hijacking tricks; <code>use_pty<\/code> is the modern, portable part.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Log sudo to its own file<\/td>\n<td style=\"text-align:left\"><code>Defaults logfile=/var/log/sudo.log<\/code> (mode 0600 root:root)<\/td>\n<td style=\"text-align:left\">Survives log tampering attempts better when combined with remote shipping.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Reset the environment<\/td>\n<td style=\"text-align:left\"><code>Defaults env_reset, secure_path=...<\/code><\/td>\n<td style=\"text-align:left\">No poisoned <code>PATH<\/code>/<code>LD_*<\/code> from an administrative session.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Three password tries, tell nobody why<\/td>\n<td style=\"text-align:left\"><code>Defaults passwd_tries=3, !lecture<\/code><\/td>\n<td style=\"text-align:left\">No hints in the failure output.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Add admin to <code>sudo<\/code>, nothing else<\/td>\n<td style=\"text-align:left\"><code>sudo adduser admin sudo<\/code> then remove <code>admin<\/code> from <code>adm<\/code> if you do not want it reading logs<\/td>\n<td style=\"text-align:left\">Least privilege, one account.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Disable unused system accounts<\/td>\n<td style=\"text-align:left\"><code>sudo usermod -L daemon bin sys games<\/code> etc.<\/td>\n<td style=\"text-align:left\">Any account with a shell is a pivot; <code>nologin<\/code> them.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Password policy<\/td>\n<td style=\"text-align:left\"><a href=\"#/file/etc/security/pwquality.conf.d/99-paranoid.conf\"><code>files/etc/security/pwquality.conf.d/99-paranoid.conf<\/code><\/a> + the PAM wiring in <a href=\"#/file/etc/pam.d/README.md\"><code>files/etc/pam.d/README.md<\/code><\/a><\/td>\n<td style=\"text-align:left\">Enforced length (≥ 16) and quality on the <em>admin<\/em> password, applied by PAM, not by convention.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Lockout after failures<\/td>\n<td style=\"text-align:left\"><a href=\"#/file/etc/security/faillock.conf\"><code>files/etc/security/faillock.conf<\/code><\/a> (<code>deny=5<\/code>, <code>unlock_time=900<\/code>, <code>root_unlock_time=60<\/code>) and the <code>pam_faillock<\/code> line in PAM<\/td>\n<td style=\"text-align:left\">Brute force against the console/sudo dies quickly. <strong>Keep a tested root-console recovery path in mind<\/strong> — this is why <code>root_unlock_time<\/code> is short.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">No core dumps for logins<\/td>\n<td style=\"text-align:left\"><a href=\"#/file/etc/security/limits.d/99-paranoid.conf\"><code>files/etc/security/limits.d/99-paranoid.conf<\/code><\/a>: <code>hard core 0<\/code>, <code>nofile<\/code>, <code>nproc<\/code>, <code>maxlogins 2<\/code><\/td>\n<td style=\"text-align:left\">A core dump of a privileged process is a credential leak.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Shell hygiene<\/td>\n<td style=\"text-align:left\"><a href=\"#/file/etc/profile.d/99-hardening.sh\"><code>files/etc/profile.d/99-hardening.sh<\/code><\/a>: <code>umask 027<\/code>, <code>TMOUT=600<\/code>, <code>HISTCONTROL=ignoreboth:erasedups<\/code>, <code>HISTIGNORE<\/code> for commands containing <code>pass<\/code>/<code>key<\/code>/<code>token<\/code><\/td>\n<td style=\"text-align:left\">New files are not world-readable, idle sessions die, and secrets do not end up in history.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp -a files/etc/sudoers.d/00-paranoid /etc/sudoers.d/00-paranoid\nsudo chmod 0440 /etc/sudoers.d/00-paranoid &amp;&amp; sudo visudo -c\nsudo cp files/etc/security/pwquality.conf.d/99-paranoid.conf /etc/security/pwquality.conf.d/\nsudo cp files/etc/security/faillock.conf /etc/security/faillock.conf\nsudo cp files/etc/security/limits.d/99-paranoid.conf /etc/security/limits.d/\nsudo cp files/etc/profile.d/99-hardening.sh /etc/profile.d/ &amp;&amp; sudo chmod 0644 /etc/profile.d/99-hardening.sh\nsudo passwd -l root<\/code><\/pre><\/div>\n<p><code>pam_faillock<\/code> needs the PAM stack to include it in <code>auth<\/code> and <code>account<\/code> (the how-to matters): <a href=\"#/file/etc/pam.d/README.md\"><code>files/etc/pam.d/README.md<\/code><\/a> in this repo shows the exact lines to add to <code>common-auth<\/code>/<code>common-account<\/code> for Debian's <code>pam-auth-update<\/code>-managed files, and you re-run <code>sudo pam-auth-update --enable faillock<\/code>.<\/p>\n<h2 id=\"2-ssh-the-admin-plane-s-cryptosystem\">2. SSH (the admin plane's cryptosystem)<a class=\"anchor\" href=\"#2-ssh-the-admin-plane-s-cryptosystem\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/ssh/sshd_config.d/00-paranoid.conf\"><code>files/etc/ssh/sshd_config.d/00-paranoid.conf<\/code><\/a> is a drop-in (Debian's <code>Include /etc/ssh/sshd_config.d/*.conf<\/code> is already at the top of <code>sshd_config<\/code>). Highlights and why:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>PermitRootLogin no                  # no root over the wire\nPasswordAuthentication no           # keys only; passwords cannot be brute-forced if they are never accepted\nKbdInteractiveAuthentication no\nAuthenticationMethods publickey\nPubkeyAuthentication yes\nAuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2\nPermitEmptyPasswords no\nMaxAuthTries 3\nMaxSessions 4\nLoginGraceTime 20                   # shrinks the unauthenticated window; a DoS trade-off, accepted\nAllowAgentForwarding no\nAllowTcpForwarding no               # admin tunnelling must use the WireGuard plane instead\nX11Forwarding no\nPermitTunnel no\nGatewayPorts no\nPermitUserEnvironment no\nUsePAM yes\nStrictModes yes\nLogLevel VERBOSE                    # logs key fingerprints -&gt; tells you *which* key was used\nPidFile /run/sshd.pid<\/code><\/pre><\/div>\n<p>Modern cryptography, explicitly pinned (no <code>default<\/code> surprises):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>HostKey /etc/ssh/ssh_host_ed25519_key        # delete the RSA host keys after verifying clients can connect\nHostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com\nPubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com\nKexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org\nCiphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com\nMACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com<\/code><\/pre><\/div>\n<p><code>sntrup761x25519-sha512@openssh.com<\/code> is the post-quantum hybrid KEX (OpenSSH ≥ 9.0; trixie has 10.x). <code>AllowUsers admin<\/code> and <code>DenyUsers *<\/code> in the config keep unknown accounts out even if one appears.<\/p>\n<p><strong>Hardware keys:<\/strong> if you own a FIDO2 token, put <code>sk-ssh-ed25519@openssh.com<\/code> keys in <code>~/.ssh/authorized_keys<\/code> <strong>and<\/strong> set <code>required<\/code> … actually the portable way is a line in <code>authorized_keys<\/code>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>sk-ssh-ed25519@openssh.com AAAAH... admin@fido<\/code><\/pre><\/div>\n<p>with touch required by default. That is the single best SSH upgrade available: it makes stolen laptop keys useless.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo sshd -t                                  # syntax check (must print nothing)\nsudo systemctl reload ssh\nsudo sshd -T | grep -E 'permitrootlogin|passwordauthentication|kexalgorithms|ciphers|allowusers'\nsudo journalctl -u ssh -n 20                  # confirm the reload, then test in a SECOND session before closing the first<\/code><\/pre><\/div>\n<p><strong>[TIER 2]<\/strong> Bind SSH to the WireGuard interface only (see <code>docs/05<\/code> §5): move the <code>ListenAddress<\/code> to the tunnel address and let nftables drop 22 on the WAN. Then the SSH service is not internet-reachable at all.<\/p>\n<h2 id=\"3-kernel-parameters-files-etc-sysctl-d-99-paranoid-conf\">3. Kernel parameters — <a href=\"#/file/etc/sysctl.d/99-paranoid.conf\"><code>files/etc/sysctl.d/99-paranoid.conf<\/code><\/a><a class=\"anchor\" href=\"#3-kernel-parameters-files-etc-sysctl-d-99-paranoid-conf\" aria-label=\"link\">#<\/a><\/h2>\n<p>Grouped, with the reasoning that actually matters:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-ini\"><code># — information leaks —\nkernel.dmesg_restrict = 1        # unprivileged users cannot read the ring buffer (addresses, device info)\nkernel.kptr_restrict = 2         # %pK prints nothing to unprivileged users\nkernel.perf_event_paranoid = 3   # perf is a known info-leak/side-channel tool; only root may use it\nkernel.unprivileged_bpf_disabled = 2   # BPF is a powerful primitive; nobody unprivileged needs it\nnet.core.bpf_jit_harden = 2      # hardens the BPF JIT against spray attacks\nvm.unprivileged_userfaultfd = 0  # userfaultfd was a common exploit primitive\nkernel.yama.ptrace_scope = 2     # only root may ptrace non-children\nkernel.io_uring_disabled = 2     # io_uring has a heavy CVE history and nothing here needs it\ndev.tty.ldisc_autoload = 0       # no on-demand TTY line-discipline loading\n\n# — memory/exec integrity —\nkernel.randomize_va_space = 2\nkernel.kexec_load_disabled = 1   # kexec is a boot-integrity bypass; we never use it\nkernel.sysrq = 0                 # no magic SysRq on a server\nfs.protected_hardlinks = 1\nfs.protected_symlinks = 1\nfs.protected_fifos = 2\nfs.protected_regular = 2\n\n# — network —\nnet.ipv4.tcp_syncookies = 1\nnet.ipv4.conf.all.rp_filter = 1 ; net.ipv4.conf.default.rp_filter = 1\nnet.ipv4.conf.all.accept_redirects = 0 ; net.ipv4.conf.default.accept_redirects = 0\nnet.ipv4.conf.all.secure_redirects = 0\nnet.ipv4.conf.all.send_redirects = 0 ; net.ipv4.conf.default.send_redirects = 0\nnet.ipv4.conf.all.accept_source_route = 0\nnet.ipv4.conf.all.log_martians = 1\nnet.ipv4.icmp_echo_ignore_broadcasts = 1\nnet.ipv4.icmp_ignore_bogus_error_responses = 1\nnet.ipv4.conf.all.arp_ignore = 1 ; net.ipv4.conf.all.arp_announce = 2\nnet.ipv6.conf.all.accept_redirects = 0 ; net.ipv6.conf.all.accept_ra = 0   # we use static/routed IPv6 only\nnet.ipv6.conf.all.accept_source_route = 0\nnet.ipv6.conf.all.use_tempaddr = 2       # privacy addresses for outbound\nnet.ipv4.ip_forward = 0                  # [docs/08] set to 1 ONLY if you build internal VM bridges\nnet.ipv4.conf.all.forwarding = 0<\/code><\/pre><\/div>\n<p>Deliberate omissions, so you know they were considered and why they are <strong>not<\/strong> in the artefact:<\/p>\n<ul>\n<li><code>user.max_user_namespaces=0<\/code> / <code>kernel.unprivileged_userns_clone=0<\/code> — would break rootless containers and <code>usbguard<\/code>'s namespace use. Instead we rely on the LSM restrictions of the specific services. The comment in the file says exactly this, so no one \"helpfully\" adds it later.<\/li>\n<\/li>\n<li><code>net.ipv4.tcp_timestamps=0<\/code> — breaks PAWS and worsens retransmits for negligible benefit.<\/li>\n<\/li>\n<li><code>fs.suid_dumpable=0<\/code> — already covered by <code>hard core 0<\/code> in limits; both is fine, add if you like.<\/li>\n<\/li>\n<li><code>net.ipv6.conf.all.disable_ipv6=1<\/code> — only if you truly have no IPv6 clients. Then also delete the <code>ip6<\/code> table from <code>nftables.conf<\/code> (the file tells you how).<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp files/etc/sysctl.d/99-paranoid.conf /etc/sysctl.d/\nsudo sysctl --system | tail -5\nsudo sysctl -a 2&gt;/dev/null | grep -E 'kernel.kptr_restrict|kernel.perf_event_paranoid|unprivileged_bpf'<\/code><\/pre><\/div>\n<h2 id=\"4-kernel-modules-what-loads-and-what-refuses-to\">4. Kernel modules — what loads and what refuses to<a class=\"anchor\" href=\"#4-kernel-modules-what-loads-and-what-refuses-to\" aria-label=\"link\">#<\/a><\/h2>\n<ul>\n<li><a href=\"#/file/etc/modprobe.d/90-blacklist-paranoid.conf\"><code>files/etc/modprobe.d/90-blacklist-paranoid.conf<\/code><\/a> — the blacklist built from <code>docs/00<\/code> §2, with a comment per module naming the device it kills.<\/li>\n<\/li>\n<li><a href=\"#/file/etc/modules-load.d/00-paranoid.conf\"><code>files/etc/modules-load.d/00-paranoid.conf<\/code><\/a> — deliberately <strong>empty<\/strong> (comment only). Nothing here loads on demand at boot; if you need to add a module, you write it down and you can audit it.<\/li>\n<\/li>\n<li><a href=\"#/file/etc/modprobe.d/95-options-paranoid.conf\"><code>files/etc/modprobe.d/95-options-paranoid.conf<\/code><\/a> — <code>options iwlwifi disable_11ax=0<\/code> only if Wi-Fi is retained; plus hardening options for <code>usb-storage<\/code> (<code>quirks=<\/code>) if you keep it. Every option has a comment; there are no unexplained lines.<\/li>\n<\/li>\n<\/ul>\n<p>The <strong>strong<\/strong> version of \"no more modules\" is <code>kernel.modules_disabled=1<\/code>, applied as late in boot as possible:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># files/etc/systemd/system/kernel-modules-lock.service  (shipped, DISABLED by default)\n[Unit]\nDescription=Freeze the module table (Tier 3)\nConditionPathExists=/etc/paranoid/modules-lock\nAfter=local-fs.target network-online.target\n[Service]\nType=oneshot\nExecStart=/bin/sh -c 'echo 1 &gt; /proc/sys/kernel/modules_disabled'\n[Install]\nWantedBy=multi-user.target<\/code><\/pre><\/div>\n<p>Enable it only after everything you will <em>ever<\/em> need is loaded: it breaks <code>fwupd<\/code>, libvirt's kernel modules, USB keyboards attached later, and cannot be undone without a reboot. That is exactly why it is opt-in via <code>/etc/paranoid/modules-lock<\/code>. Verify it is never enabled with a warning inside <code>verify-hardening.sh<\/code> if you have it on but also have fwupd installed.<\/p>\n<h2 id=\"5-mounts-files-etc-fstab\">5. Mounts — <a href=\"#/file/etc/fstab\"><code>files/etc/fstab<\/code><\/a><a class=\"anchor\" href=\"#5-mounts-files-etc-fstab\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-fstab\"><code># &lt;file system&gt;            &lt;mount point&gt; &lt;type&gt; &lt;options&gt;                                        &lt;dump&gt; &lt;pass&gt;\nUUID=&lt;esp-uuid&gt;            /boot/efi     vfat   umask=0077,shortname=winnt,noexec,nosuid,nodev      0      2\nUUID=&lt;boot-uuid&gt;           /boot         ext4   defaults,nosuid,nodev                            0      2\n/dev/vg0/root              /             ext4   defaults,nodev,errors=remount-ro,noatime          0      1\n/dev/vg0/var               /var          ext4   defaults,nosuid,nodev,noatime                    0      2\n/dev/vg0/varlog            /var/log      ext4   defaults,nosuid,nodev,noexec,noatime             0      2\n/dev/vg0/vartmp            /var/tmp      ext4   defaults,nosuid,nodev,noexec,noatime             0      2\n/dev/vg0/home              /home         ext4   defaults,nosuid,nodev,noexec,noatime             0      2\n/dev/vg0/srv               /srv          ext4   defaults,nosuid,nodev,noatime                    0      2\n/dev/vg0/swap              none          swap   sw                                               0      0\ntmpfs                      /tmp          tmpfs  rw,nosuid,nodev,noexec,relatime,size=2G,mode=1777  0      0\ntmpfs                      /dev/shm      tmpfs  rw,nosuid,nodev,noexec,size=512M,mode=1777        0      0<\/code><\/pre><\/div>\n<ul>\n<li><code>noexec<\/code> on <code>/var/log<\/code> and <code>/var/tmp<\/code> is the important one: attackers love those directories because they are writable and historically executable.<\/li>\n<\/li>\n<li><code>/tmp<\/code> on tmpfs with <code>noexec<\/code> is fast, size-bounded, and wiped at reboot. For a web server, that also means a compromised service cannot leave a payload behind after a reboot.<\/li>\n<\/li>\n<li><code>/srv<\/code> is deliberately <strong>not<\/strong> <code>noexec<\/code> — if your vhost serves CGI in an isolated instance (<code>docs/06<\/code> §7), you may need execution there. If you do not, add <code>noexec<\/code>.<\/li>\n<\/li>\n<li><strong>[TIER 3]<\/strong> <code>/boot<\/code> read-only: change <code>defaults<\/code> to <code>ro<\/code> and remount rw only for kernel operations: <code>sudo mount -o remount,rw /boot &amp;&amp; sudo apt full-upgrade &amp;&amp; sudo mount -o remount,ro /boot<\/code>. The shipped <a href=\"#/file/etc/systemd/system/remount-boot-ro.service\"><code>files/etc/systemd/system/remount-boot-ro.service<\/code><\/a> does this automatically at boot.<\/li>\n<\/li>\n<li><strong>[TIER 3]<\/strong> <code>/usr<\/code> read-only via the <code>systemd<\/code> <code>usr<\/code> overlay is another option but it breaks apt's upgrade path in ways most people do not want. Not shipped; mentioned so you know it exists.<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo findmnt --verify                 # fstab syntax/sanity\nsudo findmnt -o TARGET,OPTIONS | grep -E 'tmp|var|boot'\nsudo mount -o remount /tmp 2&gt;/dev/null || true   # after editing fstab, reboot is cleanest<\/code><\/pre><\/div>\n<h2 id=\"6-lsm-stack-apparmor-landlock-yama-from-the-cmdline\">6. LSM stack: AppArmor (+ landlock/yama from the cmdline)<a class=\"anchor\" href=\"#6-lsm-stack-apparmor-landlock-yama-from-the-cmdline\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/apparmor.d/local/usr.sbin.apache2\"><code>files/etc/apparmor.d/local/usr.sbin.apache2<\/code><\/a> is a <code>local/<\/code> include — it <strong>adds<\/strong> to Debian's own Apache profile without fighting it during package upgrades. It denies write access to everything except <code>/var/www/&lt;site&gt;<\/code> paths, and denies capability use outright. See <code>docs/06<\/code> §6 for the full Apache-side story.<\/p>\n<p><a href=\"#/file/etc/apparmor.d/tunables/paranoid-home.d/99-paranoid\"><code>files/etc/apparmor.d/tunables/paranoid-home.d/99-paranoid<\/code><\/a> pins <code>@{HOME}<\/code> handling so profiles do not silently inherit a wrong home.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp -a files/etc/apparmor.d/. /etc/apparmor.d/\nsudo apparmor_parser -r /etc/apparmor.d/usr.sbin.apache2   # reload after edits\nsudo aa-status --verbose | head -40\nsudo aa-enforce /etc/apparmor.d/usr.sbin.apache2\ncat /sys/kernel/security/apparmor/profiles | grep -c enforce    # count of enforcing profiles<\/code><\/pre><\/div>\n<p>Landlock and yama are activated by the <code>lsm=<\/code>/<code>yama.ptrace_scope=2<\/code> settings already applied in §3 and <code>docs/03<\/code>. Confirm the stack order:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>cat /sys/kernel/security/lsm<\/code><\/pre><\/div>\n<h2 id=\"7-auditd-files-etc-audit-rules-d-99-paranoid-rules\">7. auditd — <a href=\"#/file/etc/audit/rules.d/99-paranoid.rules\"><code>files/etc/audit/rules.d/99-paranoid.rules<\/code><\/a><a class=\"anchor\" href=\"#7-auditd-files-etc-audit-rules-d-99-paranoid-rules\" aria-label=\"link\">#<\/a><\/h2>\n<p>Design goals: (a) catch changes to the trust roots, (b) catch the syscalls that turn a bug into a compromise, (c) never drown the log. The rule set does exactly three things:<\/p>\n<ol>\n<li><strong>Identity/auth<\/strong>: <code>-w /etc/passwd -p wa<\/code>, <code>/etc/shadow<\/code>, <code>/etc/gshadow<\/code>, <code>/etc/group<\/code>, <code>/etc/sudoers<\/code>, <code>/etc/sudoers.d<\/code>, <code>/etc/pam.d<\/code>, <code>/etc/ssh/sshd_config<\/code>, <code>/etc/security<\/code>.<\/li>\n<\/li>\n<li><strong>Execution/changes to binaries and modules<\/strong>: `-a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k modules`, <code>-a always,exit -F arch=b64 -S execve -F euid=0 -F auid!=unset -k root-exec<\/code> (only <em>root<\/em> execs = low volume, high signal), <code>-a always,exit -F arch=b64 -S ptrace,bpf -k primitives<\/code>, <code>-a always,exit -F arch=b64 -S setuid,setgid,setreuid,setregid -F auid&gt;=1000 -F auid!=unset -k priv-esc<\/code>, <code>-w /usr/bin -p wa -k binaries<\/code> and <code>-w /usr/sbin -p wa -k binaries<\/code>.<\/li>\n<\/li>\n<li><strong>The web/service plane<\/strong>: <code>-w /etc/apache2 -p wa -k apache-config<\/code>, <code>-w /etc/ssl/private -p rwa -k tls-keys<\/code>, <code>-w /var/www -p wa -k webroot<\/code>, <code>-a always,exit -F arch=b64 -S connect -F a0=2 -k net-out<\/code> — <strong>[TIER 3]<\/strong> only, it is noisy.<\/li>\n<\/li>\n<\/ol>\n<p>Plus: <code>-e 2<\/code> (immutable rules), <code>--backlog_wait_time<\/code>, and <code>max_log_file_action=keep_logs<\/code> with rotation handled by <code>auditd.conf<\/code> (both shipped). Immutability means <strong>you cannot change the rules without a reboot<\/strong> — deliberate, and it is why the rule file is a drop-in that you edit offline.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp files/etc/audit/rules.d/99-paranoid.rules /etc/audit/rules.d/\nsudo cp files/etc/audit/auditd.conf /etc/audit/auditd.conf\nsudo augenrules --load\nsudo auditctl -l | head -20\nsudo auditctl -s | grep -E 'enabled|failure'      # enabled=2 = immutable, failure=1<\/code><\/pre><\/div>\n<p>Ship events off-host (<code>audispd-plugins<\/code> is in the install list):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># files/etc/audit/plugins.d/au-remote.conf + audisp-remote.conf are shipped with sane TLS defaults\nsudo sed -i 's/^active = no/active = yes/' /etc/audit/plugins.d/au-remote.conf\n# remote_server/port/transport in /etc/audit/audisp-remote.conf, then:\nsudo systemctl restart auditd\nsudo ausearch -k apache-config -ts recent | head<\/code><\/pre><\/div>\n<h2 id=\"8-file-integrity-aide-debsums\">8. File integrity: AIDE + debsums<a class=\"anchor\" href=\"#8-file-integrity-aide-debsums\" aria-label=\"link\">#<\/a><\/h2>\n<ul>\n<li><a href=\"#/file/etc/aide/aide.conf.d/99_paranoid.conf\"><code>files/etc/aide/aide.conf.d/99_paranoid.conf<\/code><\/a> adds a strict ruleset for <code>/etc<\/code>, <code>/bin<\/code>, <code>/sbin<\/code>, <code>/usr/{bin,sbin,lib}<\/code>, <code>/var/www<\/code> (contents: <code>p+i+n+u+g+s+m+c+sha512<\/code>), while excluding volatile paths (<code>/var/log<\/code>, <code>/var/cache<\/code>, <code>/run<\/code>, <code>/proc<\/code>).<\/li>\n<\/li>\n<li>The <strong>baseline must be taken last<\/strong>, after all your config is final. Otherwise every check is noise.<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp files/etc/aide/aide.conf.d/99_paranoid.conf /etc/aide/aide.conf.d/\nsudo aideinit &amp;&amp; sudo mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db\nsudo cp files/etc/systemd/system/aide-check.{service,timer} /etc/systemd/system/\nsudo systemctl enable --now aide-check.timer\nsudo cp files/etc/systemd/system/debsums-check.{service,timer} /etc/systemd/system/\nsudo systemctl enable --now debsums-check.timer\nsudo systemctl list-timers aide-check.timer debsums-check.timer<\/code><\/pre><\/div>\n<p>Both timers write results to <code>/var/log/paranoid/<\/code> (mode 0750, root:adm) and, at Tier 2, are expected to also email or push the diff off-host. The <code>debsums -s<\/code> check answers a different question than AIDE (\"did any <em>packaged<\/em> file change?\") and is cheap enough to run daily.<\/p>\n<h2 id=\"9-apt-and-updates-the-part-everyone-gets-wrong\">9. apt and updates — the part everyone gets wrong<a class=\"anchor\" href=\"#9-apt-and-updates-the-part-everyone-gets-wrong\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/apt/apt.conf.d/99-paranoid\"><code>files/etc/apt/apt.conf.d/99-paranoid<\/code><\/a>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>APT::Get::AllowUnauthenticated \"false\";\nAPT::Get::Install-Recommends \"false\";        # the \"install only necessary software\" policy, enforced\nAPT::Get::Install-Suggests \"false\";\nAcquire::AllowInsecureRepositories \"false\";\nAcquire::Check-Valid-Until \"true\";\nAcquire::Max-ValidTime \"604800\";             # refuse stale metadata (7 days)\nAcquire::https::Verify-Peer \"true\";\nAcquire::https::Verify-Host \"true\";\nAcquire::Retries \"3\";\nBinary::apt::APT::Keep-Downloaded-Packages \"false\";\nAP::Sanitize-Environment \"true\";\nDPkg::Pre-Install-Pkgs { \"/usr/sbin/dpkg-preconfigure --apt || true\"; };\nDPkg::Post-Invoke { \"/usr/local/sbin/sign-uki-hook || true\"; };<\/code><\/pre><\/div>\n<p>Notes on what is <strong>not<\/strong> here and why:<\/p>\n<ul>\n<li>No repo pinning to a private mirror: you would need one, and pinning a mirror you do not control is theatre. Instead <strong>restrict sources to <code>main<\/code> + <code>non-free-firmware<\/code><\/strong> and prefer <code>deb<\/code> over <code>http<\/code> where the mirror supports TLS (<code>https://deb.debian.org<\/code>). <code>docs/09<\/code> covers the mirror question.<\/li>\n<\/li>\n<li><code>unattended-upgrades<\/code> is configured for <code>-security<\/code> <strong>only<\/strong> (<a href=\"#/file/etc/apt/apt.conf.d/50unattended-upgrades\"><code>files/etc/apt/apt.conf.d/50unattended-upgrades<\/code><\/a>), with <code>Automatic-Reboot \"false\"<\/code> and <code>Automatic-Reboot-Time<\/code> unset — a kernel/reboot decision on a server is yours, not apt's. <code>needrestart<\/code> is set to <code>list<\/code> (not auto-restart) at Tier 2 so you see what will bounce; <code>docs/10<\/code> §3 is the weekly reboot/restart procedure.<\/li>\n<\/li>\n<li><code>apt-listchanges<\/code> is enabled so you read what the update claims to do before it lands.<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp files/etc/apt/apt.conf.d/99-paranoid /etc/apt/apt.conf.d/\nsudo cp files/etc/apt/apt.conf.d/50unattended-upgrades /etc/apt/apt.conf.d/\nsudo cp files/etc/apt/apt.conf.d/20auto-upgrades /etc/apt/apt.conf.d/\nsudo apt-get update 2&gt;&amp;1 | tail -3\nsudo unattended-upgrade --dry-run -d 2&gt;&amp;1 | tail -20\napt-config dump | grep -E 'Install-Recommends|AllowUnauthenticated|Check-Valid-Until'<\/code><\/pre><\/div>\n<h2 id=\"10-systemd-journald-coredumps\">10. systemd, journald, coredumps<a class=\"anchor\" href=\"#10-systemd-journald-coredumps\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/systemd/coredump.conf.d/99-paranoid.conf\"><code>files/etc/systemd/coredump.conf.d/99-paranoid.conf<\/code><\/a> → <code>Storage=none<\/code>, <code>ProcessSizeMax=0<\/code>: no core dumps are written at all. <a href=\"#/file/etc/systemd/journald.conf.d/99-paranoid.conf\"><code>files/etc/systemd/journald.conf.d/99-paranoid.conf<\/code><\/a> → <code>Storage=persistent<\/code>, <code>Compress=yes<\/code>, <code>SystemMaxUse=512M<\/code>, <code>SystemMaxFileSize=64M<\/code>, <code>RateLimit*<\/code> tightened, <code>ForwardToSyslog=no<\/code> (we do not run rsyslog), <code>Audit=yes<\/code>, and <code>Seal=yes<\/code> <strong>[Tier 2, degrades safely without a TPM]<\/strong> so tampering with the journal is detectable.<\/p>\n<p><a href=\"#/file/etc/systemd/system.conf.d/99-paranoid.conf\"><code>files/etc/systemd/system.conf.d/99-paranoid.conf<\/code><\/a> sets tighter defaults (<code>DefaultTimeoutStopSec=20s<\/code>, <code>DumpCore=no<\/code>, <code>CtrlAltDelBurstAction=none<\/code> — no accidental reboots from an attached keyboard).<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo mkdir -p /etc/systemd/{coredump.conf.d,journald.conf.d,system.conf.d}\nsudo cp files/etc/systemd/coredump.conf.d/99-paranoid.conf /etc/systemd/coredump.conf.d/\nsudo cp files/etc/systemd/journald.conf.d/99-paranoid.conf /etc/systemd/journald.conf.d/\nsudo cp files/etc/systemd/system.conf.d/99-paranoid.conf /etc/systemd/system.conf.d/\nsudo systemctl daemon-reexec &amp;&amp; sudo systemctl restart systemd-journald\njournalctl --disk-usage\ncat /proc/sys/kernel/core_pattern          # should be '|/bin/false' per the artefact, or empty+Storage=none\nsudo systemd-analyze security --offline=true apache2 | tail -5   # reports the unit's exposure score<\/code><\/pre><\/div>\n<h2 id=\"11-time-and-dns\">11. Time and DNS<a class=\"anchor\" href=\"#11-time-and-dns\" aria-label=\"link\">#<\/a><\/h2>\n<p><strong>Time<\/strong> (<a href=\"#/file/etc/chrony/chrony.conf\"><code>files/etc/chrony/chrony.conf<\/code><\/a>): NTS (RFC 8915) via <code>nts<\/code> sources (<code>server &lt;host&gt; iburst nts<\/code>), <code>makestep 1.0 3<\/code>, <code>rtcsync<\/code>, <code>minsources 2<\/code>, and <strong>no<\/strong> <code>allow<\/code> directive (this machine is not a time server for others). Correct time matters because TLS, audit timestamps, and certificate validity all depend on it.<\/p>\n<p><strong>DNS<\/strong> (<a href=\"#/file/etc/unbound/unbound.conf.d/paranoid.conf\"><code>files/etc/unbound/unbound.conf.d/paranoid.conf<\/code><\/a>): a local <strong>validating<\/strong> resolver on <code>127.0.0.1<\/code> with:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>server:\n  interface: 127.0.0.1\n  port: 53\n  access-control: 127.0.0.0/8 allow\n  do-ip6: no                     # unless you have IPv6 upstream connectivity\n  hide-identity: yes\n  hide-version: yes\n  harden-glue: yes\n  harden-dnssec-stripped: yes\n  harden-below-nxdomain: yes\n  harden-referral-path: yes\n  qname-minimisation: yes\n  aggressive-nsec: yes\n  prefetch: yes\n  rrset-roundrobin: yes\n  minimal-responses: yes\n  val-log-level: 2\n  auto-trust-anchor-file: \"/var/lib/unbound/root.key\"\n  tls-cert-bundle: \"/etc/ssl/certs/ca-certificates.crt\"\n  do-not-query-localhost: yes\n  private-address: 10.0.0.0/8 ... (RFC1918 + link-local)   # blocks DNS-rebind into your LAN\nforward-zone:\n  name: \".\"\n  forward-tls-upstream: yes      # DNS-over-TLS upstream, then DNSSEC-validated locally\n  forward-addr: 1.1.1.1@853#cloudflare-dns.com\n  forward-addr: 9.9.9.9@853#dns.quad9.net<\/code><\/pre><\/div>\n<p>Why a resolver at all instead of plain <code>/etc/resolv.conf<\/code>: (a) DNSSEC validation happens on <em>your<\/em> box, (b) DNS-over-TLS hides queries from the local network, (c) <code>private-address<\/code> blocks rebinding attacks aimed at your LAN, (d) all DNS becomes local-only traffic so the nftables egress allowlist can be one line instead of \"whatever port 53 to anywhere\".<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends unbound chrony\nsudo cp files/etc/unbound/unbound.conf.d/paranoid.conf /etc/unbound/unbound.conf.d/\nsudo unbound-checkconf\nsudo systemctl restart unbound &amp;&amp; sudo systemctl restart chrony\n# make the system use it (and make sure nothing else is managing resolv.conf)\necho 'nameserver 127.0.0.1' | sudo tee /etc/resolv.conf\nsudo chattr +i /etc/resolv.conf 2&gt;/dev/null || true\nsudo systemctl disable --now systemd-resolved 2&gt;/dev/null || true\ndig +dnssec debian.org @127.0.0.1 | grep -E 'flags|ad;'\nchronyc tracking &amp;&amp; chronyc sources -v | head<\/code><\/pre><\/div>\n<h2 id=\"12-verification-for-this-document\">12. Verification for this document<a class=\"anchor\" href=\"#12-verification-for-this-document\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo pwck -r ; sudo grpck -r              # no orphaned accounts/groups\nsudo passwd -S root                       # -&gt; L (locked)\nsudo -l -U admin                          # exactly the intended privilege set\nsudo sysctl -a 2&gt;/dev/null | grep -cE '= *[01]' &gt;/dev/null   # (spot-check the artefact instead)\nsudo apparmor_status --enabled &amp;&amp; sudo aa-status | head -5\nsudo auditctl -s\nsudo aide --check --config /etc/aide/aide.conf | tail -5\nsudo systemctl is-enabled unattended-upgrades auditd apparmor unbound chrony\nbash scripts/verify-hardening.sh --tier 2<\/code><\/pre><\/div>", "files": ["etc/sysctl.d/99-paranoid.conf", "etc/security/faillock.conf", "etc/security/limits.d/99-paranoid.conf", "etc/security/pwquality.conf.d/99-paranoid.conf", "etc/sudoers.d/00-paranoid", "etc/profile.d/99-hardening.sh", "etc/ssh/sshd_config.d/00-paranoid.conf", "etc/fstab", "etc/apt/apt.conf.d/20auto-upgrades", "etc/apt/apt.conf.d/50unattended-upgrades", "etc/apt/apt.conf.d/99-paranoid", "etc/aide/aide.conf.d/99_paranoid.conf", "etc/apparmor.d/local/usr.sbin.apache2", "etc/apparmor.d/tunables/paranoid-home.d/99-paranoid", "etc/audit/audisp-remote.conf", "etc/audit/auditd.conf", "etc/audit/plugins.d/au-remote.conf", "etc/audit/rules.d/99-paranoid.rules", "etc/pam.d/README.md", "etc/systemd/journald.conf.d/99-paranoid.conf", "etc/systemd/coredump.conf.d/99-paranoid.conf", "etc/systemd/system.conf.d/99-paranoid.conf", "etc/kernel/cmdline"], "toc": [{"lvl": 1, "id": "04-base-system-hardening", "text": "04 — Base system hardening"}, {"lvl": 2, "id": "1-users-root-and-sudo", "text": "1. Users, root, and sudo"}, {"lvl": 2, "id": "2-ssh-the-admin-plane-s-cryptosystem", "text": "2. SSH (the admin plane's cryptosystem)"}, {"lvl": 2, "id": "3-kernel-parameters-files-etc-sysctl-d-99-paranoid-conf", "text": "3. Kernel parameters — files/etc/sysctl.d/99-paranoid.conf"}, {"lvl": 2, "id": "4-kernel-modules-what-loads-and-what-refuses-to", "text": "4. Kernel modules — what loads and what refuses to"}, {"lvl": 2, "id": "5-mounts-files-etc-fstab", "text": "5. Mounts — files/etc/fstab"}, {"lvl": 2, "id": "6-lsm-stack-apparmor-landlock-yama-from-the-cmdline", "text": "6. LSM stack: AppArmor (+ landlock/yama from the cmdline)"}, {"lvl": 2, "id": "7-auditd-files-etc-audit-rules-d-99-paranoid-rules", "text": "7. auditd — files/etc/audit/rules.d/99-paranoid.rules"}, {"lvl": 2, "id": "8-file-integrity-aide-debsums", "text": "8. File integrity: AIDE + debsums"}, {"lvl": 2, "id": "9-apt-and-updates-the-part-everyone-gets-wrong", "text": "9. apt and updates — the part everyone gets wrong"}, {"lvl": 2, "id": "10-systemd-journald-coredumps", "text": "10. systemd, journald, coredumps"}, {"lvl": 2, "id": "11-time-and-dns", "text": "11. Time and DNS"}, {"lvl": 2, "id": "12-verification-for-this-document", "text": "12. Verification for this document"}], "fences": 21, "tables": 1}, {"slug": "05-network-and-firewall", "title": "05 · Network &amp; firewall", "html": "<h1 id=\"05-network-and-firewall\">05 — Network and firewall<a class=\"anchor\" href=\"#05-network-and-firewall\" aria-label=\"link\">#<\/a><\/h1>\n<p><strong>Read this entire document before applying anything.<\/strong> This is the step that can lock you out of the machine. Do it with a physical console available, and always load rules with <code>nft -c -f<\/code> first.<\/p>\n<hr>\n<h2 id=\"1-design\">1. Design<a class=\"anchor\" href=\"#1-design\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>              ┌──────────────────────── this machine ───────────────────────┐\n internet ────┤ inet filter: policy DROP                                  │\n              │   · 443/tcp  → Apache (rate/per-IP limited, conntrack)    │\n              │   · 80/tcp   → only if you use HTTP-01 ACME; else closed  │\n              │   · 22/tcp   → wg0 ONLY (Tier 2). Never on the WAN.       │\n              │   · ICMP     → echo-request rate-limited, PMTU allowed    │\n              │   · DNS/NTP  → loopback only (unbound/chrony on 127.0.0.1)│\n              │ output:      allowlist (Tier 2) — see §4                  │\n              └───────────────────────────────────────────────────────────┘\n admin ─────── wg0 (WireGuard, UDP 51820) ──► sshd bound to the tunnel address<\/code><\/pre><\/div>\n<p>Principles:<\/p>\n<ol>\n<li><strong>Default DROP, both directions.<\/strong> Ingress is obvious; egress is what stops a compromised Apache from being useful (T10 in <code>docs/01<\/code>).<\/li>\n<\/li>\n<li><strong>No rule for a service that is not running.<\/strong> Rules are a consequence of the design, not a wishlist. If you later install something (<code>docs/09<\/code>), you edit the ruleset deliberately.<\/li>\n<\/li>\n<li><strong>Rate-limit rather than block<\/strong> on 443: you want the internet to reach you, but not with a million new connections per second per address.<\/li>\n<\/li>\n<li><strong>Log what you drop, at a rate you can actually read.<\/strong><\/li>\n<\/li>\n<li><strong>Never let a container daemon rewrite your ruleset.<\/strong> Rootful Docker inserts DOCKER chains in iptables and silently bypasses nftables <code>filter<\/code>. We do not run it (<code>docs/09<\/code>).<\/li>\n<\/li>\n<\/ol>\n<h2 id=\"2-the-ruleset-files-etc-nftables-conf\">2. The ruleset — <a href=\"#/file/etc/nftables.conf\"><code>files/etc/nftables.conf<\/code><\/a><a class=\"anchor\" href=\"#2-the-ruleset-files-etc-nftables-conf\" aria-label=\"link\">#<\/a><\/h2>\n<p>Structure (read the file itself for the full text):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-nft\"><code>#!/usr/sbin/nft -f\nflush ruleset\n\ntable inet filter {\n    # --- dynamic sets: brute-force and abuse counters (self-expiring) ---\n    set ssh4   { type ipv4_addr; flags dynamic, timeout; timeout 1h; }\n    set http4  { type ipv4_addr; flags dynamic, timeout; timeout 10m; }\n    set ssh6   { type ipv6_addr; flags dynamic, timeout; timeout 1h; }\n\n    chain input {\n        type filter hook input priority filter; policy drop;\n\n        iif \"lo\" accept\n        ct state established,related accept\n        ct state invalid drop\n\n        # malformed-flag filter (silently drops scans and naive spoofing)\n        tcp flags &amp; (fin|syn|rst|psh|ack|urg) == 0 drop\n        tcp flags fin,syn == fin,syn drop\n        tcp flags syn,rst == syn,rst drop\n        tcp flags fin,rst == fin,rst drop\n        tcp flags fin,psh,urg == fin,psh,urg drop\n        tcp flags syn,fin == syn,fin drop\n        tcp flags syn,psh == syn,psh drop\n\n        # — SSH: only via the admin interface, and slow it down —\n        iifname \"wg0\" tcp dport 22 ct state new accept\n        tcp dport 22 ct state new \\\n            meter sshmeter4 { ip saddr limit rate over 4/minute burst 3 packets } drop\n        tcp dport 22 ct state new ip saddr @ssh4 limit rate over 6/minute drop\n\n        # — HTTPS: allowed from anywhere, but bounded per source —\n        tcp dport 443 ct state new \\\n            meter httpmeter4 { ip saddr limit rate over 60/minute burst 30 packets } drop\n        tcp dport 443 accept\n\n        # — HTTP: only for ACME validation; delete this if you use DNS-01 (recommended) —\n        tcp dport 80 ct state new ip saddr limit rate over 10/minute drop\n        tcp dport 80 accept\n\n        # — ICMP/ICMPv6: just enough for path MTU discovery and neighbor discovery —\n        icmp type { echo-request } limit rate 4/second accept\n        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept\n        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded,\n                      parameter-problem, nd-router-advert, nd-neighbor-solicit,\n                      nd-neighbor-advert, nd-redirect } accept\n        ipv6 icmp type echo-request limit rate 4/second accept\n\n        counter log prefix \"nft-drop-in: \" level info limit rate 5/minute drop\n    }\n    ...\n}<\/code><\/pre><\/div>\n<p>Points worth your attention:<\/p>\n<ul>\n<li>The <code>meter<\/code> + <code>limit rate over<\/code> combination is a <strong>per-source<\/strong> limiter implemented in the kernel: no userspace daemon needed for the common flood case.<\/li>\n<\/li>\n<li><code>iifname \"wg0\" tcp dport 22 ... accept<\/code> is what makes SSH invisible on the internet. If you choose Tier 1 (SSH on 22 exposed), replace it with the plain rate-limited accept for <code>tcp dport 22<\/code> and keep <code>sshguard<\/code> running (§6).<\/li>\n<\/li>\n<li>Port 80 exists <strong>only<\/strong> for ACME. If you use DNS-01 validation (<code>docs/06<\/code> §4 recommends it), delete the two port-80 lines and close it. Fewer open ports is always better.<\/li>\n<\/li>\n<li>The final <code>counter log ... drop<\/code> gives you a rate-limited record of what hits the wall. Read it with <code>journalctl -k | grep nft-drop-in<\/code>.<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo nft -c -f files/etc/nftables.conf      # CHECK ONLY — must print nothing\nsudo cp files/etc/nftables.conf /etc/nftables.conf\nsudo nft list ruleset &gt; /var/backups/nft.$(date +%F-%H%M).ruleset   # rollback point\nsudo systemctl enable --now nftables\nsudo nft list ruleset | head -40<\/code><\/pre><\/div>\n<p><strong>Rollback in one command<\/strong> (keep this memorised for the \"I locked myself out\" moment):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo nft flush ruleset                      # console access only; opens everything\nsudo nft -f /var/backups/nft.&lt;stamp&gt;.ruleset<\/code><\/pre><\/div>\n<h2 id=\"3-forward-chain-and-virtualization\">3. Forward chain and virtualization<a class=\"anchor\" href=\"#3-forward-chain-and-virtualization\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/nftables.conf\"><code>files/etc/nftables.conf<\/code><\/a> ships a <code>forward<\/code> chain with <strong>policy drop<\/strong> and a commented block for internal VM/container networks. When you build isolation in <code>docs/08<\/code>, uncomment <em>that block only<\/em>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-nft\"><code>iifname \"virbr0\" oifname \"virbr0\" accept          # guests ↔ guests, same bridge, if you want it\niifname \"virbr0\" oifname \"enp0s31f6\" ct state new tcp dport { 80, 443 } accept   # explicit egress\ndrop                                              # everything else from guests<\/code><\/pre><\/div>\n<p>Note the asymmetry: guests get <strong>no<\/strong> DNS, <strong>no<\/strong> SSH, <strong>no<\/strong> arbitrary egress by default. If a guest needs to resolve DNS, you explicitly forward to <code>127.0.0.1:53<\/code> (or your bridge address) — that is the point of egress filtering.<\/p>\n<h2 id=\"4-egress-filtering-tier-2-the-highest-value-unusual-control\">4. Egress filtering (Tier 2) — the highest-value unusual control<a class=\"anchor\" href=\"#4-egress-filtering-tier-2-the-highest-value-unusual-control\" aria-label=\"link\">#<\/a><\/h2>\n<p>Most hardening guides stop at ingress. On a public web server, a compromised service with unrestricted egress is a ready-made C2 client and a staging point. The shipped <code>output<\/code> chain:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-nft\"><code>chain output {\n    type filter hook output priority filter; policy drop;\n\n    oif \"lo\" accept\n    ct state established,related accept\n    ct state invalid drop\n\n    # the local validating resolver and NTP may reach the internet\n    meta l4proto { tcp, udp } th dport 53   ip daddr @dns_upstreams accept\n    meta l4proto { tcp, udp } th dport 853  ip daddr @dns_upstreams accept\n    meta l4proto udp th dport 123 ip daddr @ntp_upstreams accept\n    meta l4proto udp th dport 4460 ip daddr @ntp_upstreams accept     # NTS-KE\n\n    # apt may fetch over TLS, and only as the _apt user (see the artefact for exact syntax)\n    meta skuid _apt tcp dport 443 accept\n    meta skuid root tcp dport 443 accept       # fwupd/ACME while you are administering\n\n    # WireGuard handshake\n    udp dport 51820 ct state new accept\n\n    # NTP/resolver on loopback handled above; ICMP echoes for diagnosis\n    icmp type echo-request accept\n\n    counter log prefix \"nft-drop-out: \" level info limit rate 10/minute drop\n}<\/code><\/pre><\/div>\n<p>Honest caveats:<\/p>\n<ul>\n<li><code>meta skuid<\/code> works for direct sockets; a process that delegates downloads to a helper under a different uid will be blocked. Symptom: apt hangs on \"Connecting\". Fix: add the specific uid/host, do not open <code>tcp dport 443<\/code> for everyone.<\/li>\n<\/li>\n<li>Replace <code>@dns_upstreams<\/code>/<code>@ntp_upstreams<\/code> with the real addresses from your <code>unbound.conf<\/code> and <code>chrony.conf<\/code>. Keeping them as sets means one place to edit.<\/li>\n<\/li>\n<li>If your ACME client uses HTTP-01, it needs outbound 80. DNS-01 (recommended in <code>docs/06<\/code>) needs outbound 53/853 to the <em>API<\/em> endpoint over 443 — covered by the <code>root<\/code>/dedicated-uid rule.<\/li>\n<\/li>\n<li><strong>This will break things.<\/strong> Expect to iterate for the first week; that iteration is the control working. Log <code>nft-drop-out<\/code> to see exactly what tried to leave.<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"5-admin-plane-with-wireguard-tier-2\">5. Admin plane with WireGuard (Tier 2)<a class=\"anchor\" href=\"#5-admin-plane-with-wireguard-tier-2\" aria-label=\"link\">#<\/a><\/h2>\n<p>The point is not \"encryption\" (SSH is already encrypted) — it is <strong>not having SSH on the internet at all<\/strong>, and having a stable address to bind to.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends wireguard-tools\nsudo install -m 0700 -d /etc/wireguard\nsudo cp files/etc/wireguard/wg0.conf.example /etc/wireguard/wg0.conf\n# generate keys on BOTH ends; the server's private key never leaves the machine\numask 077; wg genkey | tee server.key | wg pubkey &gt; server.pub\nsudo sed -i \"s|^PrivateKey = .*|PrivateKey = $(cat server.key)|\" /etc/wireguard/wg0.conf\nsudo chmod 0600 /etc/wireguard/wg0.conf &amp;&amp; sudo systemctl enable --now wg-quick@wg0\nsudo wg show\nip -brief addr show wg0<\/code><\/pre><\/div>\n<p>Then bind sshd to the tunnel address and drop 22 from the WAN:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>echo 'ListenAddress 10.66.0.1' | sudo tee /etc/ssh/sshd_config.d/05-listen-wg.conf\nsudo sshd -t &amp;&amp; sudo systemctl reload ssh<\/code><\/pre><\/div>\n<p><strong>You must test from a client before you disconnect the current session:<\/strong> confirm SSH over the tunnel works, then remove the WAN 22 rule. If the tunnel ever fails, physical console access is the only way in — that is the accepted cost of Tier 2. Keep the WireGuard client config on a USB key in a safe, with its private key, and record the server's public key + endpoint on paper.<\/p>\n<p><a href=\"#/file/etc/wireguard/wg0.conf.example\"><code>files/etc/wireguard/wg0.conf.example<\/code><\/a> includes <code>PostUp<\/code>/<code>PostDown<\/code> nftables snippets so the tunnel's interface rules exist only while the tunnel is up.<\/p>\n<h2 id=\"6-brute-force-handling-choose-one-not-both\">6. Brute-force handling (choose one, not both)<a class=\"anchor\" href=\"#6-brute-force-handling-choose-one-not-both\" aria-label=\"link\">#<\/a><\/h2>\n<p><strong>Option A — <code>sshguard<\/code> (default in this repo).<\/strong> ~100 KB of C, no config language, watches the journal and adds offenders to an nftables set.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends sshguard\nls /usr/lib/sshguard/                       # confirm which backends your version ships\n# sshguard.conf: set BACKEND to the nftables backend present on YOUR system\nsudo sed -i 's|^#*BACKEND=.*|BACKEND=/usr/lib/sshguard/sshguard-nftables|' /etc/sshguard/sshguard.conf\nsudo systemctl enable --now sshguard\njournalctl -u sshguard -n 5<\/code><\/pre><\/div>\n<p><strong>Option B — <code>fail2ban<\/code>.<\/strong> More flexible (jails for Apache as well), but Python + a real config surface. If you pick it, use the nftables action, not iptables:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code># /etc/fail2ban/jail.d/paranoid.local\n[DEFAULT]\nbanaction = nftables-multiport\nbanaction_allports = nftables-allports\nbantime = 1h\nfindtime = 10m\nmaxretry = 4\nbackend = systemd\n[sshd]\nenabled = true<\/code><\/pre><\/div>\n<p>Either way, HTTP abuse is already bounded in-kernel by the <code>httpmeter4<\/code> rule, and application-level abuse is bounded by mod_security3 + CRS (<code>docs/06<\/code> §5). Do not stack three tools doing the same job; pick the kernel meter + one daemon.<\/p>\n<h2 id=\"7-interface-and-service-surface-discipline\">7. Interface and service surface discipline<a class=\"anchor\" href=\"#7-interface-and-service-surface-discipline\" aria-label=\"link\">#<\/a><\/h2>\n<ul>\n<li><strong>The only listening sockets you should see:<\/strong><\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo ss -tulpn | grep -v '127.0.0.1\\|::1'<\/code><\/pre><\/div>\n<p>Expect exactly: <code>sshd<\/code> on the WireGuard address (Tier 2) or <code>:22<\/code> (Tier 1), <code>:443<\/code> on Apache, <code>nftables<\/code>-visible <code>:80<\/code> only if HTTP-01, and <code>:51820/udp<\/code> for WireGuard. Anything else — a third-party agent, <code>rpcbind<\/code>, <code>avahi<\/code>, <code>cups<\/code>, <code>systemd-resolved<\/code> on <code>:53<\/code> competing with unbound — is a finding. <code>verify-hardening.sh<\/code> enumerates this and flags unexpected listeners.<\/p>\n<ul>\n<li><strong>IPv6<\/strong>: <code>docs/04<\/code> §3 disables redirects and RA acceptance. If you have no IPv6 connectivity, set <code>net.ipv6.conf.all.disable_ipv6=1<\/code> and delete the <code>ip6<\/code>/<code>inet<\/code> IPv6 lines — do not run a half-broken IPv6 stack. The <code>inet<\/code> table already covers both families; the file marks the IPv6-only lines.<\/li>\n<\/li>\n<li><strong>Wi-Fi<\/strong>: if you must use it, the interface should be <code>deny<\/code> in <code>usbguard<\/code>'s world? no — it is PCI, not USB. Lock it with <code>rfkill<\/code> and <strong>do not<\/strong> run <code>wpa_supplicant<\/code> as a roaming client unless it is required: <code>systemctl disable --now wpa_supplicant<\/code>. A wired server with a Wi-Fi radio that is up and associating to whatever SSID is nearby is a finding on its own.<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo rfkill list\nsudo nmcli device status 2&gt;/dev/null || true        # if NetworkManager is installed (it should not be)\nsudo systemctl disable --now wpa_supplicant NetworkManager 2&gt;/dev/null || true<\/code><\/pre><\/div>\n<h2 id=\"8-verification\">8. Verification<a class=\"anchor\" href=\"#8-verification\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo nft -c -f /etc/nftables.conf                        # syntax\nsudo nft list chain inet filter input | tail -20\nsudo nft list chain inet filter output | tail -20\nsudo nft list sets\nsudo ss -tulpn | grep -v '127.0.0.1\\|::1'\nsudo nft list ruleset | grep -c 'meter'                  # &gt; 0 means rate limiting is active\njournalctl -k --since '-1h' | grep -c nft-drop           # drops are being logged\nbash scripts/verify-hardening.sh --tier 2 --section network<\/code><\/pre><\/div>\n<p>External check (from another machine, ideally an offsite host):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># from a client outside your network\nnmap -Pn -p 1-1024 --reason &lt;server-ip&gt;     # expect only the ports you intended\ncurl -sSI https://&lt;server&gt; | head -3<\/code><\/pre><\/div>\n<p>Then move to <code>docs/06<\/code> (Apache) and <code>docs/07<\/code> (physical/firmware).<\/p>", "files": ["etc/nftables.conf", "etc/nftables.d/README.md", "etc/unbound/unbound.conf.d/paranoid.conf", "etc/chrony/chrony.conf", "etc/wireguard/wg0.conf.example"], "toc": [{"lvl": 1, "id": "05-network-and-firewall", "text": "05 — Network and firewall"}, {"lvl": 2, "id": "1-design", "text": "1. Design"}, {"lvl": 2, "id": "2-the-ruleset-files-etc-nftables-conf", "text": "2. The ruleset — files/etc/nftables.conf"}, {"lvl": 2, "id": "3-forward-chain-and-virtualization", "text": "3. Forward chain and virtualization"}, {"lvl": 2, "id": "4-egress-filtering-tier-2-the-highest-value-unusual-control", "text": "4. Egress filtering (Tier 2) — the highest-value unusual control"}, {"lvl": 2, "id": "5-admin-plane-with-wireguard-tier-2", "text": "5. Admin plane with WireGuard (Tier 2)"}, {"lvl": 2, "id": "6-brute-force-handling-choose-one-not-both", "text": "6. Brute-force handling (choose one, not both)"}, {"lvl": 2, "id": "7-interface-and-service-surface-discipline", "text": "7. Interface and service surface discipline"}, {"lvl": 2, "id": "8-verification", "text": "8. Verification"}], "fences": 14, "tables": 0}, {"slug": "06-apache-hardening", "title": "06 · Apache hardening", "html": "<h1 id=\"06-apache-hardening-the-service-you-are-actually-exposing\">06 — Apache hardening (the service you are actually exposing)<a class=\"anchor\" href=\"#06-apache-hardening-the-service-you-are-actually-exposing\" aria-label=\"link\">#<\/a><\/h1>\n<p>Assumes <code>docs/02<\/code>–<code>docs/05<\/code> are done. Everything referenced here ships under <code>files/etc/apache2/<\/code> and is installed by <code>scripts/harden-apache.sh<\/code>, which validates and rolls back on failure.<\/p>\n<hr>\n<h2 id=\"1-principles\">1. Principles<a class=\"anchor\" href=\"#1-principles\" aria-label=\"link\">#<\/a><\/h2>\n<ol>\n<li><strong>A web server is a parser.<\/strong> Every module is another parser reachable by strangers. Remove all of them you do not use; that is the difference between \"hardened\" and \"config with nice headers\".<\/li>\n<\/li>\n<li><strong>No dynamic language on the host.<\/strong> No <code>mod_php<\/code>, no Perl/Python/Node handlers, no <code>mod_cgi<\/code>. If the application needs PHP, it runs in its own isolated instance or container (<code>docs/08<\/code>), never in this process.<\/li>\n<\/li>\n<li><strong>One security domain per process.<\/strong> If you host unrelated sites, use separate instances/users (§7) rather than a single <code>www-data<\/code> with overlapping access.<\/li>\n<\/li>\n<li><strong>Fail closed and speak little.<\/strong> No version banners, no directory listings, no stack traces, no <code>Server<\/code> details, generic error pages.<\/li>\n<\/li>\n<li><strong>The unit is sandboxed, not just the config.<\/strong> <code>systemd-analyze security<\/code> should report a low exposure score — see §6.<\/li>\n<\/li>\n<\/ol>\n<h2 id=\"2-module-pruning-do-this-first\">2. Module pruning — do this first<a class=\"anchor\" href=\"#2-module-pruning-do-this-first\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>bash scripts/harden-apache.sh --prune-modules --dry-run     # prints what will be disabled\nsudo bash scripts/harden-apache.sh --prune-modules<\/code><\/pre><\/div>\n<p>The script disables (with <code>a2dismod<\/code>), and the justification for each:<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Module<\/th>\n<th style=\"text-align:left\">Why it goes<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\"><code>autoindex<\/code><\/td>\n<td style=\"text-align:left\">Directory listings are an information-disclosure primitive and a common misconfiguration fallback.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>negotiation<\/code><\/td>\n<td style=\"text-align:left\">Content negotiation is rarely wanted and adds request-parsing surface.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>status<\/code><\/td>\n<td style=\"text-align:left\"><code>/server-status<\/code> leaks vhosts, clients, URLs. <strong>If<\/strong> you want it, restrict to <code>Require ip 127.0.0.1<\/code> (§5).<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>info<\/code><\/td>\n<td style=\"text-align:left\"><code>/server-info<\/code> dumps the entire config. No.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>userdir<\/code><\/td>\n<td style=\"text-align:left\"><code>~user<\/code> paths and home-directory assumptions.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>cgi<\/code>,<code>cgid<\/code><\/td>\n<td style=\"text-align:left\">Arbitrary process execution from the web root. The single biggest \"instant RCE\" footgun.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>imagemap<\/code><\/td>\n<td style=\"text-align:left\">Ancient, unnecessary parser.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>include<\/code><\/td>\n<td style=\"text-align:left\">SSI: server-side execution in HTML files.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>speling<\/code><\/td>\n<td style=\"text-align:left\">Auto-corrects URLs by scanning directories; leaks names and forces filesystem walks.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>dav<\/code>,<code>dav_fs<\/code>,<code>dav_lock<\/code><\/td>\n<td style=\"text-align:left\">WebDAV write methods. Only if you truly need them, and then in an isolated instance.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>proxy*<\/code>,<code>proxy_http<\/code>,<code>proxy_balancer<\/code>,<code>proxy_connect<\/code>,<code>proxy_ftp<\/code><\/td>\n<td style=\"text-align:left\">A misconfigured open proxy is a felony-grade foot-gun. Remove unless this IS a reverse proxy by design.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>actions<\/code>,<code>auth_digest<\/code><\/td>\n<td style=\"text-align:left\">Digest auth is obsolete (MD5). Basic auth over TLS on an isolated admin vhost (mTLS + password) is the floor, nothing weaker. <code>env<\/code> is <strong>kept<\/strong>: it is tiny and many configs legitimately need <code>SetEnv<\/code>.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>php*<\/code>,<code>perl<\/code>,<code>python<\/code>,<code>wsgi<\/code>,<code>cgi<\/code>-family<\/td>\n<td style=\"text-align:left\">Host-side dynamic languages: forbidden by principle 2.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>rewrite<\/code><\/td>\n<td style=\"text-align:left\"><strong>Keep<\/strong> (needed for HTTP→HTTPS and for a strict 404 policy) — but every <code>RewriteRule<\/code> is a regex; keep it to a couple of lines you understand.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>ssl<\/code>,<code>headers<\/code>,<code>socache_shmcb<\/code>,<code>http2<\/code>,<code>mpm_event<\/code>,<code>log_config<\/code>,<code>mime<\/code>,<code>dir<\/code>,<code>alias<\/code>,<code>authz_core<\/code>,<code>authz_host<\/code>,<code>authn_core<\/code>,<code>auth_basic<\/code>,<code>setenvif<\/code>,<code>unixd<\/code>,<code>filter<\/code>,<code>deflate<\/code>,<code>reqtimeout<\/code>,<code>authz_core<\/code><\/td>\n<td style=\"text-align:left\"><strong>Keep.<\/strong> These are the load-bearing ones for a TLS server.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># after pruning, confirm what is actually loaded\nsudo apache2ctl -M | sort\nsudo apache2ctl -t -D DUMP_RUN_CFG | head<\/code><\/pre><\/div>\n<h2 id=\"3-global-config-files-etc-apache2-apache2-conf\">3. Global config — <a href=\"#/file/etc/apache2/apache2.conf\"><code>files/etc/apache2/apache2.conf<\/code><\/a><a class=\"anchor\" href=\"#3-global-config-files-etc-apache2-apache2-conf\" aria-label=\"link\">#<\/a><\/h2>\n<p>Compared with Debian's stock file, the differences that matter:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code>ServerTokens Prod                    # 'Server: Apache' and nothing else\nServerSignature Off                  # no version in error pages\nTraceEnable Off                      # TRACE/TRACK off (cross-site tracing)\nHostnameLookups Off                  # no reverse DNS: no latency, no DNS traffic from Apache, no leaks\nTimeout 30\nKeepAlive On\nMaxKeepAliveRequests 64\nKeepAliveTimeout 5\nLimitRequestFields 40\nLimitRequestFieldSize 4096\nLimitRequestLine 4096\nLimitRequestBody 1048576             # 1 MiB ceiling; override per site if you accept uploads\nLimitXMLRequestBody 0                # no XML bodies at all (kills XXE/Billion-Laughs at the door)\nUseCanonicalName Off                 # do not trust Host: for self-referential URLs\nFileETag None                        # ETags leak inode numbers on some FS; disable them<\/code><\/pre><\/div>\n<p><code>sec-hardening<\/code> directives (shipped in <code>conf-available/security-hardening.conf<\/code>):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code>&lt;Directory /&gt;\n    AllowOverride None\n    Options None\n    Require all denied\n&lt;/Directory&gt;\n\n&lt;Directory /var/www/&gt;\n    AllowOverride None               # .htaccess is an attacker-writable config file; forbid it\n    Options -Indexes -ExecCGI -Includes -MultiViews\n    Require all granted\n&lt;/Directory&gt;\n\n# Do not leak the filesystem layout\n&lt;LocationMatch \"^\\/(\\.|%2e)\"&gt;\n    Require all denied\n&lt;/LocationMatch&gt;\nRedirectMatch 404 /\\..*$           # deny dotfiles and dot-dirs everywhere<\/code><\/pre><\/div>\n<p><code>mime.conf<\/code> hardening: keep the default <code>AddType<\/code>/<code>AddHandler<\/code> but <strong>remove<\/strong> anything that maps a path to a handler. The shipped file also contains the classic trap fix:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code># A file called evil.php.jpg must never be treated as anything but an image\n&lt;FilesMatch \"\\.(php|phtml|phar|pl|py|cgi|sh|asp|jsp)$\"&gt;\n    Require all denied\n&lt;/FilesMatch&gt;<\/code><\/pre><\/div>\n<p>That single rule means even if an attacker lands a file in the web root, it does not <em>execute<\/em> — the host has no handler for it anyway (principle 2), but defense in depth costs nothing here.<\/p>\n<p><code>ports.conf<\/code>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code>Listen 443\n# Uncomment ONLY for HTTP-01 ACME validation; DNS-01 is recommended (§4)\n#Listen 80<\/code><\/pre><\/div>\n<h2 id=\"4-tls-tls-1-3-only-post-quantum-key-exchange-acme-via-dns-01\">4. TLS — TLS 1.3 only, post-quantum key exchange, ACME via DNS-01<a class=\"anchor\" href=\"#4-tls-tls-1-3-only-post-quantum-key-exchange-acme-via-dns-01\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/apache2/conf-available/tls-hardening.conf\"><code>files/etc/apache2/conf-available/tls-hardening.conf<\/code><\/a>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code># — protocol floor and ceiling: 1.3 only —\nSSLProtocol -all +TLSv1.3\n# TLS 1.3 ciphersuites (only the two AEAD suites worth having)\nSSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256\n# Post-quantum hybrid key exchange first (OpenSSL 3.5 / trixie), then classical curve\nSSLOpenSSLConfCmd Groups X25519MLKEM768:X25519:P-384:P-256\nSSLOpenSSLConfCmd Curves X25519MLKEM768:X25519:P-384\nSSLOpenSSLConfCmd MinProtocol TLSv1.3\nSSLHonorCipherOrder off              # no-op for 1.3, kept explicit for auditors\nSSLCompression off\nSSLSessionTickets off                # forward secrecy without ticket-key rotation games\nSSLOptions +StrictRequire\nSSLInsecureRenegotiation off\nSSLVerifyClient none                 # override with 'require' on admin-only vhosts (§5)<\/code><\/pre><\/div>\n<p>Why TLS 1.3 only: it removes the entire class of 1.2-era footguns (CBC/RC4/3DES, renegotiation, weak DH groups, downgrade attacks, RSA key exchange → no forward secrecy). The cost is real: old clients (Android &lt; 5.0-era, Windows &lt; 10, some embedded/Java 8 builds) cannot connect. For a public site, verify your client population or add TLS 1.2 <strong>with<\/strong> <code>SSLCipherSuite ECDHE-...GCM<\/code> explicitly listed. Do not add 1.1/1.0 — ever.<\/p>\n<p><strong>OCSP stapling — a 2026 trap:<\/strong> Let's Encrypt <strong>discontinued its OCSP service in 2025<\/strong> in favour of CRLs. So <code>SSLUseStapling on<\/code> with an LE certificate now does nothing useful (no responder to staple). Ship it as:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code># Only meaningful if your CA still runs an OCSP responder.\n# Let's Encrypt removed OCSP in 2025 -&gt; stapling is a no-op for LE certs. Leave this block\n# commented unless you use a CA that still staples.\n#SSLUseStapling on\n#SSLStaplingCache shmcb:/run/apache2/stapling(128000)<\/code><\/pre><\/div>\n<p>Certificate acquisition: <strong>use DNS-01 ACME validation<\/strong>, not HTTP-01. Reasons: it needs <strong>no inbound port 80<\/strong>, it covers wildcards, it keeps working when your HTTP stack is down (renewal is independent of the thing being renewed), and it removes an entire vhost/serving path from the attack surface.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends certbot\n# DNS-01 needs a plugin for YOUR DNS provider, or use the manual/webhook hooks.\nsudo certbot certonly --dns-&lt;provider&gt; -d example.com -d www.example.com \\\n     --key-type ecdsa --rsa-key-size 384 \\\n     --deploy-hook 'systemctl reload apache2'<\/code><\/pre><\/div>\n<p>Operational notes that trip people up:<\/p>\n<ul>\n<li><strong>ECDSA (<code>--key-type ecdsa<\/code>, P-256 default) is better here<\/strong>: smaller, faster, and Apache/OpenSSL handle it natively. Keep an RSA certificate as a fallback only if you must support ancient clients.<\/li>\n<\/li>\n<li>Renewal: <code>certbot.timer<\/code> (shipped by the package) runs twice daily. Verify with <code>systemctl list-timers certbot.timer<\/code> and <code>sudo certbot renew --dry-run<\/code>.<\/li>\n<\/li>\n<li>The <strong><code>--deploy-hook<\/code> must not restart, only reload<\/strong> — a failed restart at 03:00 while nobody is watching is how you get an outage. <code>reload<\/code> keeps the old process if the new config is invalid.<\/li>\n<\/li>\n<li>Private keys live in <code>/etc/letsencrypt/live/&lt;domain&gt;/privkey.pem<\/code> (mode 0600 root). Apache's master process runs as root and reads them; the <code>www-data<\/code> children cannot. Confirm with <code>sudo -u www-data cat /etc/letsencrypt/live/*/privkey.pem<\/code> → must be <strong>Permission denied<\/strong>.<\/li>\n<\/li>\n<li><strong>If your private key is high-value<\/strong> (impersonation of many domains), consider moving the key material to a hardware token (YubiKey PIV / a TPM-backed OpenSSL provider) later. Apache supports <code>SSLCryptoDevice<\/code> with an engine/PKCS#11 provider; this is advanced and easy to get wrong, so it is a documented future improvement rather than part of this build.<\/li>\n<\/li>\n<\/ul>\n<p>Verify the TLS result from off-box — do not trust the config file:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apache2ctl configtest\nsslscan &lt;server&gt;:443 | head -20            # expect TLS 1.3 suites only\nopenssl s_client -connect &lt;server&gt;:443 -tls1_3 -groups X25519MLKEM768 &lt;/dev/null 2&gt;&amp;1 | grep -E 'group|Protocol'\nopenssl s_client -connect &lt;server&gt;:443 -tls1_2 &lt;/dev/null 2&gt;&amp;1 | grep -iE 'handshake failure|alert'\ncurl -sSI https://&lt;server&gt; | grep -iE 'strict-transport|server:'<\/code><\/pre><\/div>\n<h2 id=\"5-headers-methods-admin-vhosts\">5. Headers, methods, admin vhosts<a class=\"anchor\" href=\"#5-headers-methods-admin-vhosts\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/apache2/conf-available/headers-hardening.conf\"><code>files/etc/apache2/conf-available/headers-hardening.conf<\/code><\/a>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code>&lt;IfModule mod_headers.c&gt;\n    Header always set Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" env=HTTPS\n    Header always set X-Content-Type-Options \"nosniff\"\n    Header always set X-Frame-Options \"DENY\"\n    Header always set Referrer-Policy \"strict-origin-when-cross-origin\"\n    Header always set Cross-Origin-Opener-Policy \"same-origin\"\n    Header always set Cross-Origin-Resource-Policy \"same-origin\"\n    Header always set Permissions-Policy \"accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()\"\n    Header always set Content-Security-Policy \"default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; upgrade-insecure-requests\"\n    # never let a proxy or browser cache a response containing secrets\n    Header always unset X-Powered-By\n    Header always unset Server\n    Header edit Set-Cookie ^(.*)$ \"$1; HttpOnly; Secure; SameSite=Strict\"\n&lt;/IfModule&gt;\n\n# Only the methods you serve. Everything else gets 405.\n&lt;Location /&gt;\n    &lt;LimitExcept GET HEAD POST&gt;\n        Require all denied\n    &lt;/LimitExcept&gt;\n&lt;/Location&gt;<\/code><\/pre><\/div>\n<p>Adjust the CSP to the application — a <code>default-src 'self'<\/code> policy will break a site that loads CDN scripts. <strong>Do not<\/strong> add <code>unsafe-inline<\/code> to make it work; serve the assets yourself. This is the one header that meaningfully reduces the impact of an XSS in your app.<\/p>\n<p>Admin-only vhost pattern (bind it to the WireGuard address so it is not internet-reachable):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code>&lt;VirtualHost 10.66.0.1:443&gt;\n    ServerName admin.internal\n    SSLEngine on\n    SSLCertificateFile      /etc/ssl/private/admin.crt\n    SSLCertificateKeyFile   /etc/ssl/private/admin.key\n    SSLVerifyClient require                 # mutual TLS: client cert must be signed by your CA\n    SSLVerifyDepth 1\n    SSLCACertificateFile /etc/ssl/private/admin-ca.crt\n    &lt;Location /&gt;\n        Require ssl-verify-client\n        AuthType Basic\n        AuthName \"restricted\"\n        AuthUserFile /etc/apache2/.htpasswd-admin   # 0600 root:root\n        Require valid-user\n    &lt;/Location&gt;\n    ErrorLog  /var/log/apache2/admin_error.log\n    CustomLog /var/log/apache2/admin_access.log paranoid\n&lt;/VirtualHost&gt;<\/code><\/pre><\/div>\n<p>Two independent factors (client certificate <strong>and<\/strong> a password) in front of anything administrative. <code>server-status<\/code>, if you keep <code>mod_status<\/code>, only here:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code>&lt;Location /server-status&gt;\n    SetHandler server-status\n    Require ip 127.0.0.1 10.66.0.1\n&lt;/Location&gt;<\/code><\/pre><\/div>\n<h2 id=\"6-sandboxing-the-apache-unit\">6. Sandboxing the Apache unit<a class=\"anchor\" href=\"#6-sandboxing-the-apache-unit\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/systemd/system/apache2.service.d/99-paranoid.conf\"><code>files/etc/systemd/system/apache2.service.d/99-paranoid.conf<\/code><\/a>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-ini\"><code>[Service]\n# — filesystem —\nProtectSystem=strict\nProtectHome=yes\nPrivateTmp=yes\nPrivateDevices=yes\nReadWritePaths=/var/log/apache2 /var/lib/apache2 /run/apache2 /var/cache/apache2\nInaccessiblePaths=/root /home\n# — kernel/namespace —\nProtectKernelTunables=yes\nProtectKernelModules=yes\nProtectKernelLogs=yes\nProtectControlGroups=yes\nProtectClock=yes\nProtectProc=invisible\nProcSubset=pid\nRestrictNamespaces=yes\nRestrictRealtime=yes\nRestrictSUIDSGID=yes\nLockPersonality=yes\n# — syscalls/capabilities —\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-emulation @swap @keyring\nCapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_KILL\nNoNewPrivileges=yes\nRestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX\nUMask=0027<\/code><\/pre><\/div>\n<p>Warnings to respect, because two of these break things silently if you add the wrong module:<\/p>\n<ul>\n<li><code>MemoryDenyWriteExecute<\/code> is <strong>not<\/strong> in the list on purpose. <code>mod_security3<\/code> (libmodsecurity/RE2), and any dynamic language, may need W^X-incompatible mappings. Add it only after testing with your exact module set; if you do, run <code>ModSecurity<\/code> rules through a request and watch for crashes.<\/li>\n<\/li>\n<li><code>RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX<\/code>: if you later add <code>mod_ldap<\/code>/DNS lookups handled through <code>AF_NETLINK<\/code>, they will fail. Watch <code>journalctl -u apache2<\/code> for <code>socket()<\/code> denials.<\/li>\n<\/li>\n<li>Do <strong>not<\/strong> add <code>PrivateUsers=yes<\/code>: Apache binds low ports and must setuid to <code>www-data<\/code>; it will fail to start. If you want that isolation, listen on 8080/8443 inside the namespace and redirect the ports with nftables — a deliberate, documented choice, not a copy-paste.<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp files/etc/systemd/system/apache2.service.d/99-paranoid.conf /etc/systemd/system/apache2.service.d/\nsudo systemctl daemon-reload &amp;&amp; sudo systemctl restart apache2\nsudo systemd-analyze security apache2 | tail -20       # target: exposure &lt; 2.0\ncurl -skI https://localhost/ | head -3                 # still serving?\njournalctl -u apache2 -n 30 --no-pager | grep -iE 'denied|failed'<\/code><\/pre><\/div>\n<h2 id=\"7-isolation-between-sites-when-you-have-more-than-one\">7. Isolation between sites (when you have more than one)<a class=\"anchor\" href=\"#7-isolation-between-sites-when-you-have-more-than-one\" aria-label=\"link\">#<\/a><\/h2>\n<p><code>www-data<\/code> shared by five sites means a bug in one reads all five. Options, cheapest first:<\/p>\n<ol>\n<li><strong>Separate instance per security domain<\/strong> — a template unit and per-instance config: <a href=\"#/file/etc/systemd/system/apache2@.service\"><code>files/etc/systemd/system/apache2@.service<\/code><\/a>, <a href=\"#/file/etc/apache2/instances/site1.envvars\"><code>files/etc/apache2/instances/site1.envvars<\/code><\/a>, <a href=\"#/file/etc/apache2/instances/site1.conf\"><code>files/etc/apache2/instances/site1.conf<\/code><\/a>. Each instance gets its <strong>own user<\/strong> (<code>adduser --system --no-create-home --shell /usr/sbin/nologin site1<\/code>), its own ports (<code>8443<\/code>, <code>8444<\/code>, …) and its own <code>ReadWritePaths<\/code> in a <code>%i<\/code>-aware drop-in.<\/li>\n<\/li>\n<li><strong>nftables redirect<\/strong> maps public 443 to the per-site port. Because TLS SNI is inside the encrypted stream, a redirect cannot route by hostname — so this works cleanly only when each site has its own IP address (or one site per port/domain combination). Otherwise you need a reverse-proxy front end.<\/li>\n<\/li>\n<li><strong>Front-end Apache terminating TLS + <code>mod_proxy<\/code> to Unix-socket backends.<\/strong> Fine, but now you have re-enabled <code>mod_proxy<\/code>, which §2 removed for good reason: a proxy bug is a serious bug. If you go this route, the backends must be unreachable except via the socket, and the proxy vhost needs <code>ProxyPass<\/code> to a fixed socket path with no user-controlled component (no <code>ProxyPass<\/code> with unvalidated <code>$1<\/code> from a Regex — that is SSRF).<\/li>\n<\/li>\n<li><strong>Full container/VM per site<\/strong> — <code>docs/08<\/code>. Most isolation, most overhead. Correct answer when the tenants do not trust each other.<\/li>\n<\/li>\n<\/ol>\n<p>For a single-purpose server (the stated goal), <strong>one instance, one site, <code>www-data<\/code><\/strong> is the right answer. Do not build §7 machinery \"just in case\".<\/p>\n<h2 id=\"8-mod-security3-owasp-crs\">8. mod_security3 + OWASP CRS<a class=\"anchor\" href=\"#8-mod-security3-owasp-crs\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code># files/etc/apache2/mods-available/security2.conf  (installed as security2.conf)\n&lt;IfModule security2_module&gt;\n    SecRuleEngine On                       # DetectionOnly is for tuning only — the artefact uses On\n    SecRequestBodyAccess On\n    SecResponseBodyAccess Off              # response inspection is expensive and rarely pay
