#	/etc/httpd.conf — gateway
#
#	Validate:  httpd -n
#	Apply:     rcctl reload httpd
#
#	httpd(8) on the gateway does two small jobs and nothing else:
#	  1. answer ACME challenges on loopback, so acme-client(1) can renew the
#	     certificate that relayd(8) uses, without either one owning port 80
#	  2. serve a status page to the monitoring VM
#
#	Everything public goes through relayd(8).  Nothing here is reachable from
#	the internet directly: pf.conf only publishes 80/443 to relayd.

# Every path below is relative to this chroot, so "root /htdocs/status" means
# /var/www/htdocs/status on disk.
chroot "/var/www"

# ------------------------------------------------------------------ ACME
# relayd forwards /.well-known/acme-challenge/* here.  acme-client(1) writes
# the challenge files into /var/www/acme (which the shipped configuration
# symlinks to the chrooted path), and "request strip 2" removes the
# "/.well-known/acme-challenge" prefix before mapping to the filesystem.
server "acme" {
	listen on 127.0.0.1 port 8080
	root "/acme"

	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}

	# Anything other than a challenge is a mistake: answer 404 rather than
	# exposing the directory.
	location "*" {
		block return 404
	}

	log style combined
}

# ------------------------------------------------------------------ status
# Reached from the SRV network by the monitoring VM.  Create the password file
# before enabling authentication:
#	htpasswd -c /etc/htpasswd monitor     (or: printf 'monitor:%s\n' \
#	    "$(encrypt <<< 'PASSWORD')" > /etc/htpasswd)
# and then uncomment the authenticate line.  httpd(8) refuses to start if the
# file it is told to use does not exist, which is why it is off by default.
server "status" {
	listen on 10.10.50.1 port 8081
	root "/htdocs/status"

	#authenticate "/" with "/etc/htpasswd"

	# One static page, no directory index, no CGI.
	directory index "index.html"
	location "/.well-known/*" { block }
	location "*" {
		block return 404
	}

	log style combined
}

# ------------------------------------------------------------------ provisioning
# Serves the install sets and install.conf to guests on the install network
# (10.10.99.0/24).  scripts/fetch-sets.sh copies the OpenBSD releases there.
#
# dhcpd(8) hands installing guests next-server 10.10.99.1 with the boot file
# "auto_install", so the installer fetches /install.conf from this server with
# no prompts.  Directory listing is off on purpose: a guest should only ever
# retrieve files it was told about.
server "install" {
	listen on 10.10.99.1 port 80
	root "/htdocs/install"

	# Per-VM answers, one file per guest; the installer picks the one that
	# matches the hostname it was booted with.
	location "/install.conf" {
		root "/htdocs/install"
	}

	# Keep the mirror browsable only from the machine running the script.
	location "/" {
		root "/htdocs/install"
	}

	log style combined
	log access
}

# ------------------------------------------------------------------ notes
# * httpd(8) drops privileges to the www user and chroots per server, so files
#   under /var/www must be readable by www:_www; run "chown -R www:_www
#   /var/www/htdocs/status" after copying content in.
# * /var/www/htdocs/install holds symlinks to the release directories under
#   /var/www/pub — see scripts/fetch-sets.sh.
# * Optional: a small redirect-only server on 10.10.50.1:8090 for the internal
#   name if you do not want relayd to serve the LAN.
