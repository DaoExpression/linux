# /etc/usbguard/usbguard-daemon.conf
# Deny-by-default USB policy. See docs/07 §4.
#
# Practical warning: generate rules from YOUR machine with ONLY trusted devices attached
# (usbguard generate-policy), and keep a second keyboard/console within reach for the first boot
# after enabling this. A bad ruleset that blocks your only input device is a bad day.

# Default policy for devices that do not match any rule: BLOCK.
RuleFile=/etc/usbguard/rules.conf
ImplicitPolicyTarget=block

# What to do with devices already present when the daemon starts (the internal keyboard, the
# host controllers). 'apply-policy' means rules.conf governs them too.
PresentDevicePolicy=apply-policy
PresentControllerPolicy=keep
InsertedDevicePolicy=apply-policy

# Never auto-authorize anything.
AuthorizedDefault=none

# Do not try to restore controller state on shutdown; leave the kernel to it.
RestoreControllerDeviceState=false

# Match rules to logical ports rather than physical ones? Keep false unless you have a fixed
# chassis layout you are modelling; true surprises people when devices move.
DeviceRulesWithPort=false

# --- who may talk to the daemon ---
IPCAllowedUsers=root
IPCAllowedGroups=root
IPCProcessSocketsPath=/run/usbguard/
IPCAccessControlFiles=yes

# Every allow/deny decision goes to the audit trail (auditd), which is shipped off-box.
AuditBackend=LinuxAudit
AuditFilePath=/var/log/usbguard/usbguard-audit.log

# Defence in depth: never let the daemon be talked into revealing device topology.
HidePII=true
