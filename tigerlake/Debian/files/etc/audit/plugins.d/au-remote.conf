# /etc/audit/plugins.d/au-remote.conf
# Ships log events to /etc/audit/audisp-remote.conf's remote_server. ACTIVE BY DEFAULT ONLY IF YOU
# SET THE DESTINATION - docs/04 §7 shows the two commands. Local logging continues regardless.

active = no
direction = out
path = /sbin/audisp-remote
type = always
format = string
args =
