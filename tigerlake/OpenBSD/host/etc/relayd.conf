#	/etc/relayd.conf — gateway
#
#	Validate:  relayd -n
#	Apply:     rcctl reload relayd
#	Inspect:   relayctl show summary ; relayctl show hosts
#
#	relayd(8) is the public face of the lab.  It terminates TLS on the
#	gateway's own address and proxies to the DMZ web VM, so the private key
#	for the public certificate never has to live in a DMZ guest.
#
#	Division of labour with pf.conf:
#	  * pf.conf publishes port 80 and 443 to ($ext_if), the gateway itself
#	  * relayd listens there and makes its own outbound connection to the
#	    backend (a layer-7 "relay", not a layer-3 "redirect"), so no extra
#	    pf anchor or rdr rule is needed
#	  * mail is *not* proxied here: pf redirects 25/465/587/993/995 straight
#	    to the mail VM so SMTP STARTTLS stays end-to-end

ext_ip	= "203.0.113.10"		# must match the WAN address relayd binds

# --- backends -----------------------------------------------------------------
# Relayd health-checks a table; the backend port can be in the table entry so
# that different vhosts can share a host.
table <web>	{ 10.10.40.20 port 8080 }
# A second web VM, for load balancing or a blue/green cutover:
#table <web>	{ 10.10.40.20 port 8080, 10.10.40.101 port 8080 }

# The gateway's own httpd(8), which answers ACME challenges on loopback.
table <acme>	{ 127.0.0.1 port 8080 }

# --- global settings ----------------------------------------------------------
# Checks every 5s with a 500ms timeout: the backends are in the DMZ, one hop
# away, so a tighter timeout than the 200ms default is safe (and the default
# 200ms is too tight for a cross-subnet check).
interval 5
timeout 500
prefork 4
log state changes
log connection errors

# Export relayd's statistics to snmpd(8) so the monitoring VM can graph them.
# snmpd must be running first: the agentx socket /var/agentx/master is created
# by snmpd(8) at start-up, and relayd exits if it cannot connect.  rc(8) starts
# relayd before snmpd, so enable this deliberately and confirm the order, or
# add "rcctl set relayd flags" plus a dependency via /etc/rc.local.
#agentx

# --- protocols ----------------------------------------------------------------
# HTTP: only the ACME challenge is answered; everything else is redirected so
# no plaintext request ever reaches the backend.
http protocol "redirect-to-tls" {
	pass request quick path "/.well-known/acme-challenge/*" forward to <acme>

	# 308 keeps the method and body, which matters for API clients that get
	# redirected by mistake.
	match request path "/*" redirect "https://$HOST$REQUEST_URI" code 308
	block
}

# HTTPS: TLS 1.2+, modern ciphers, HSTS, and no proxy metadata leaked to the
# backend.
http protocol "lab-https" {
	tls keypair "lab.example.org"
	# Add SANs as extra keypairs; all of them must exist in /etc/ssl/private/
	# and /etc/ssl/ as <name>.key and <name>.crt (acme-client puts them there).
	#tls keypair "www.lab.example.org"

	tls ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
	tls ecdhe secp384r1
	tls protocols "tlsv1.3,tlsv1.2"

	# Renewals keep working while TLS is terminated here.
	pass request quick path "/.well-known/acme-challenge/*" forward to <acme>

	# Transport hygiene towards the backend.
	match request header "Host" value "*" set header "X-Forwarded-Proto" value "https"
	match response header "Strict-Transport-Security" value "*" set header \
		"Strict-Transport-Security" value "max-age=31536000; includeSubDomains"

	# Do not tell the internet what the backend runs.
	match response header "Server" value "*" set header "Server" value "lab"
	block response header "X-Powered-By"
}

# --- relays -------------------------------------------------------------------
relay "https" {
	listen on $ext_ip port 443 tls
	protocol "lab-https"
	forward to <web> check http "/" host "lab.example.org" code 200
}

relay "http" {
	listen on $ext_ip port 80
	protocol "redirect-to-tls"
	# This forward is only reached if the ACME pass above did not match, which
	# cannot happen because the redirect blocks everything else; it exists so
	# relayd has a valid target and can health-check the backend over http.
	forward to <web> check http "/" host "lab.example.org" code 200
}

# ------------------------------------------------------------------ notes
# * The mail guest holds its OWN certificate (SMTP STARTTLS must be
#   end-to-end), so its HTTP-01 challenge has to reach 10.10.40.21 rather than
#   this host's httpd.  Add a table for it and a per-host rule above the
#   redirect in the "redirect-to-tls" protocol, then check the result with
#   "relayd -n" before reloading — a protocol rule that does not parse takes
#   the whole HTTPS front end down, not just the challenge route.
#
# * Certificates are managed by acme-client(1) (/etc/acme-client.conf) and land
#   in /etc/ssl/lab.example.org.crt + /etc/ssl/private/lab.example.org.key,
#   which is exactly what "tls keypair lab.example.org" expects.
# * relayctl(8) is the operational tool: "relayctl show hosts" to see the
#   health-check state, "relayctl show summary" for the counters.
# * If you add a "redirect" (layer 3) block later, pf.conf needs the
#   anchor "relayd/*" line enabled; see the note there.
