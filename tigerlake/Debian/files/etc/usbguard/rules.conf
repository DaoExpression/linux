# /etc/usbguard/rules.conf
#
# ⚠ THIS FILE MUST BE GENERATED ON YOUR OWN MACHINE. The lines below are a documented shape, not a
#   working policy: the hashes and serials are machine-specific, and copying someone else's rules
#   either blocks your keyboard or, worse, allows theirs.
#
# Generate it (docs/07 §4):
#   sudo usbguard generate-policy > /tmp/rules.new      # with ONLY trusted devices attached
#   sudo diff -u /etc/usbguard/rules.conf /tmp/rules.new
#   sudo cp /tmp/rules.new /etc/usbguard/rules.conf && sudo chmod 0600 /etc/usbguard/rules.conf
#   sudo systemctl restart usbguard
#
# What good rules look like: one line per device you can name, with a hash (strong) or at least the
# serial (weaker), and a final unconditional block. Nothing more.
#
# --- host controllers (always needed; they are the roots of the USB tree) ------------------
allow id 1d6b:0002 serial "" name "xHCI Host Controller" hash "REPLACE" parent-hash "REPLACE"
allow id 1d6b:0003 serial "" name "xHCI Host Controller" hash "REPLACE" parent-hash "REPLACE"
#
# --- your internal keyboard / touchpad / fingerprint reader (HID over USB or I2C) -----------
# allow id 046d:c31c serial "" name "USB Keyboard" hash "REPLACE" parent-hash "REPLACE"
#
# --- the offline LUKS header token for Profile P2 (docs/03 §4) ------------------------------
# It is only needed at boot, BEFORE USBGuard starts, so you can deliberately leave it blocked here.
# If you want to use it while the system runs (e.g. to back up a new header), authorize it
# temporarily:  sudo usbguard allow-device <id>   then   sudo usbguard block-device <id>
#
# --- default deny: everything not listed above is blocked ------------------------------------
block
