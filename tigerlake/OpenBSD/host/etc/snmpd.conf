#	/etc/snmpd.conf — gateway
#
#	Validate:  snmpd -n
#	Apply:     rcctl reload snmpd
#	Test from the mon VM:  snmp walk -v2c -c <community> 10.10.50.1 system
#	                       (net-snmp from packages)
#
#	snmpd(8) runs read-only, bound to the SRV and MGMT addresses, and every
#	community is restricted to a source.  pf.conf enforces the same thing in
#	the packet filter, so this file is the second lock on the same door.

# --- listeners ----------------------------------------------------------------
# Loopback for snmpd's own agentx subagents (relayd(8), vmd(8) export metrics
# through /var/agentx/master, which lives on the loopback side).
listen on 127.0.0.1
listen on ::1
listen on 10.10.50.1
listen on 10.10.10.1
# 10.10.20.1 / 10.10.30.1 are deliberately absent: client networks do not get
# to enumerate the gateway.

# --- access control -----------------------------------------------------------
# v2c communities.  "source" is mandatory here: a community without a source
# restriction is a password on the public internet as soon as someone allows
# the port through pf.
read-only community "REPLACE-ME-COMMUNITY" source 10.10.50.14
read-only community "REPLACE-ME-COMMUNITY" source 10.10.10.0/24

# v3 is what you should use as soon as the monitoring VM supports it: the
# credentials below authenticate and encrypt, and can be revoked per user.
# Generate a key with:  snmpd -T?  or simply a long random string per user.
#user "monitor" auth hmac-sha2-256 authkey "REPLACE-ME" priv aes enc "REPLACE-ME"
#seclevel auth

# --- identity -----------------------------------------------------------------
# These three strings end up in every SNMP response; keep them accurate, they
# are the first thing an operator reads when a graph goes flat.
system name "gw.lab.example.org"
system contact "admin@lab.example.org"
system location "lab rack A1, gateway"
system services 72		# application(72) — routing/forwarding is layer 3

# --- traps --------------------------------------------------------------------
# Send notifications to the monitoring VM instead of waiting to be polled.
# Useful for interface state changes and IPsec SA failures.
trap receiver "mon.lab.example.org"
trap community "REPLACE-ME-COMMUNITY"

# --- agentx subagents ---------------------------------------------------------
# relayd(8) and vmd(8) can export their own counters with an "agentx" line in
# their configuration files; snmpd creates /var/agentx/master at start-up for
# them.  Nothing needs to be enabled here for that to work — only those two
# config files need their agentx line uncommented (they are commented out
# there because of start-up ordering).
