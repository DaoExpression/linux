#	/etc/smtpd.conf — mail guest
#
#	Validate:  smtpd -n
#	Apply:     rcctl reload smtpd
#	Queue:     smtpctl show queue ; smtpctl show stats ; smtpctl show envelopes
#	Password:  smtpctl encrypt        (prompts; prints a credentials-table hash)
#
#	Role: this guest is the lab's MX.  It accepts mail for lab.example.org,
#	hands it to dovecot over LMTP, and relays outbound mail after signing it.
#	It knows nothing about the rest of the lab, and the rest of the lab knows
#	nothing about SMTP — the gateway relays its own system mail through here.

# ------------------------------------------------------------------ tables
table aliases	file:/etc/mail/aliases
# Virtual addresses: maps an address in the hosted domains to a local account,
# so a user can be someone@lab.example.org without that being a unix login.
table virtuals	file:/etc/mail/virtuals
# Submission credentials for SMTPAUTH.  Format is "user:hash"; generate the
# hash with "smtpctl encrypt" and never store a plaintext password here.
table users	file:/etc/mail/credentials

# ------------------------------------------------------------------ certificates
# acme-client(1) writes the full chain and the key that these two lines point
# at (see acme-client.conf in this tree).  STARTTLS on port 25 and TLS on
# 465/587/993 all use this one keypair.
pki mail.lab.example.org cert "/etc/ssl/mail.lab.example.org.crt"
pki mail.lab.example.org key "/etc/ssl/private/mail.lab.example.org.key"

# ------------------------------------------------------------------ filters
# DKIM signing.  OpenBSD 7.5+ can sign natively; this uses the long-standing
# package, which keeps the private key out of the MTA process:
#
#	pkg_add opensmtpd-filter-dkimsign
#	openssl genrsa -out /etc/mail/dkim/lab2048.key 2048
#	openssl rsa -in /etc/mail/dkim/lab2048.key -pubout \
#	    -out /etc/mail/dkim/lab2048.pub
#	chown root:_smtpd /etc/mail/dkim/lab2048.key && chmod 640 /etc/mail/dkim/lab2048.key
#
# ...and then paste the base64 from lab2048.pub into the "lab2048._domainkey"
# TXT record in the zone on the gateway (host/var/nsd/zones/).
filter "dkimsign" proc-exec "filter-dkimsign -d lab.example.org -s lab2048 -k /etc/mail/dkim/lab2048.key" user _smtpd

# Refuse connections with no reverse DNS at all.  Legitimate mail servers have
# PTR records; the vast majority of what connects from a bare address is
# spam.  This is a filter rather than a pf rule so that the rejection is
# visible in the SMTP transcript.
filter "needs-rdns" phase connect match !rdns disconnect "550 Access denied: no reverse DNS"

# ------------------------------------------------------------------ listeners
# Port 25 is the world.  STARTTLS is opportunistic: mail must still be
# accepted from a server that cannot negotiate TLS, but the certificate is
# offered and authenticated clients are told so.
listen on 10.10.40.21 port 25 tls pki mail.lab.example.org \
	filter "needs-rdns" hostname mail.lab.example.org

# Submission, implicit TLS (RFC 8314 style).  Authentication is mandatory.
listen on 10.10.40.21 port 465 smtps pki mail.lab.example.org \
	auth <users> hostname mail.lab.example.org

# Submission with STARTTLS, for clients that cannot do implicit TLS.
listen on 10.10.40.21 port 587 tls-require pki mail.lab.example.org \
	auth <users> hostname mail.lab.example.org

# There is deliberately no second port-25 listener for the gateway's relayed
# system mail: one listener, one certificate, and the match rule below
# identifies the gateway by source address instead.  Two listeners on the same
# address:port is a silent conflict — the second one is simply never used.

# ------------------------------------------------------------------ actions
# Inbound: hand the message to dovecot's LMTP socket.  dovecot decides which
# mailbox it lands in, via the virtual and alias tables.
action "inbound" lmtp "/var/run/dovecot/lmtp" virtual <virtuals> alias <aliases>

# Outbound: normal MX delivery, advertising the real hostname, with a queue
# that is compressed to save space and encrypted because a lab VM's disk may
# be temporary.
action "outbound" relay helo mail.lab.example.org

# ------------------------------------------------------------------ matching
# The gateway relays its own system mail here (see host/etc/smtpd.conf) from
# its SRV address.  Those messages go out like any other outbound mail but are
# NOT DKIM-signed on behalf of the domain: they are diagnostics from a machine
# that is not the MX, and signing them would misstate their provenance.
match from src 10.10.50.1 for any action "outbound"

# Authenticated users may send anywhere.
match auth from any for any action "outbound" filter "dkimsign"

# Mail for our own domain is delivered locally, from anywhere.
match from any for domain lab.example.org action "inbound"

# Local mail generated on this guest (cron, doveadm) is delivered locally too.
match from local for any action "inbound"

# ------------------------------------------------------------------ queue
# Queue files ARE worth compressing in a lab: a stalled relay can otherwise
# fill a 20G guest.
queue compression
queue ttl 4d
# Queue encryption is available but is NOT enabled here: it must be given a
# key, and the only alternatives are a literal key in this file (which is then
# a secret in the repository) or a passphrase read from the terminal at
# start-up (which means a daemon that cannot boot unattended).  If you want it,
# put the key in a root-readable file and arrange for the key to be supplied:
#queue encryption key "REPLACE-ME-WITH-A-LONG-RANDOM-SECRET"

# ------------------------------------------------------------------ notes
# * The order of match rules matters: first match wins, so the tag GW rule is
#   above the generic "auth" rule on purpose.
# * Outbound mail must still pass SPF: the domain's TXT record is on the
#   gateway's zone, and it lists this host as an MX ("v=spf1 mx -all").
# * If you later add webmail, put it here behind relayd rather than exposing
#   another DMZ guest: one host with the mail data, one attacker surface.
