# /etc/audit/audisp-remote.conf
# Off-box audit shipping. Rationale (docs/01 T4, docs/10): an attacker with root on this machine
# can edit or delete local logs. A copy that left the machine before they arrived cannot be edited.
#
# Set remote_server to YOUR collector, then flip au-remote.conf to active = yes and restart auditd.
# The collector should be a different machine (a small VM elsewhere) that only accepts audit traffic.

remote_server = 10.66.0.2
port = 60
local_port = 60
transport = tcp
mode = immediate
queue_file = /var/spool/audit/remote.log
## Keep local records if the network is down rather than dropping them:
queue_depth = 2048
format = managed
network_retry_time = 1
max_tries_per_record = 3
max_time_per_record = 5
heartbeat_timeout = 0
## Do not let a network outage block auditing:
disk_low_action = ignore
disk_full_action = stop
disk_error_action = warn_once_per_hour
remote_ending_action = reconnect
generic_error_action = syslog
generic_warning_action = syslog
queue_error_action = stop
verify = yes
## TLS: enable it. The collector must present a certificate you trust.
enable_krb5 = no
krb5_principal = auditd
krb5_key_file = /etc/audit/audisp-remote.key
## For TLS, use a local wrapper/gssproxy or run the collector inside the WireGuard plane
## (docs/05 §5) - that is the simple, auditable option we recommend here.
