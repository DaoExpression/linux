#	/etc/iked.conf — gateway
#
#	Validate:  iked -n            (config check)
#	Apply:     rcctl reload iked
#	Inspect:   ikectl show sa ; ikectl show policies ; ipsecctl -sa
#
#	Two policies: road warriors (this file, PSK placeholder) and a
#	certificate-based site tunnel (commented until you have a CA).  Traffic
#	selector addresses are in the VPN zone (10.10.60.0/24, see the addressing
#	plan); pf.conf treats that whole network as an admin network arriving on
#	enc0.
#
#	Certificates, if you use them, live in:
#	    /etc/iked/ca/<ca>.crt          trusted CA
#	    /etc/iked/certs/<name>.crt     our certificate
#	    /etc/iked/private/local.key    our private key
#	Both ends need the CA certificate; nothing else is shared.

# --- uplink address ----------------------------------------------------------
# "local" below must be the address peers reach.  On a DHCP uplink, naming the
# interface is more robust than a literal address — iked re-resolves it when
# the file is reloaded, so add an rcctl reload to your WAN-up hook rather than
# chasing a changed address by hand.  A literal address also works:
#	ext_ip = "203.0.113.10"
ext_ip = "igc0"

# --- global behaviour --------------------------------------------------------
# Liveness check every 30s: a client that vanishes is cleaned up instead of
# holding a stale SA (and a stale pf state) for hours.
set dpd_check_interval 30
# IKEv2 message fragmentation, for peers behind a path that drops large UDP
# datagrams (common on hotel and mobile networks).
set fragmentation
# One IKE SA per peer identity: a reconnecting laptop replaces its old SA
# instead of accumulating one per reconnect.
set enforcesingleikesa
# MOBIKE lets a roaming client change address without renegotiating; it is on
# by default, so it is only mentioned here for discoverability.
set mobike

# --- road warriors -----------------------------------------------------------
# Clients get an address from 10.10.60.0/24 and are handed the lab resolver.
# Replace the PSK with something long and random, e.g.:
#	openssl rand -base64 48
# A shared PSK is fine for a handful of lab devices; for anything bigger, use
# per-user EAP credentials (see the "user" lines further down).  If you would
# rather not keep the secret in this file at all, iked.conf(5) documents the
# pskd keyword, which takes the key from a file instead.
ikev2 "roadwarrior" passive esp \
	from 10.10.60.0/24 to 0.0.0.0/0 \
	local $ext_ip peer any \
	srcid gw.lab.example.org \
	config address 10.10.60.0/24 \
	config netmask 255.255.255.0 \
	config name-server 10.10.50.11 \
	tag "roadwarrior" \
	psk "REPLACE-ME-WITH-A-LONG-RANDOM-PSK"

# "config address 10.10.60.0/24" with "to 0.0.0.0/0" is a full tunnel: the
# client's default route points at us and everything (including internet
# browsing) is NATed by the match rule in pf.conf.  For split tunnelling,
# narrow the selector instead:
#	from 10.10.60.0/24 to 10.10.0.0/16

# --- per-user credentials (EAP) ---------------------------------------------
# Worth the extra setup once more than a couple of people connect: revoking
# one user no longer means re-keying everybody.  iked.conf(5) documents the
# matching policy keywords for the EAP methods you allow.
#user "alice" "REPLACE-ME"
#user "bob"   "REPLACE-ME"

# --- site tunnel (certificate based) ----------------------------------------
# Passive: this end waits for the branch to dial in, which is what you want
# when only one side has a static address.  Uncomment once both CAs are in
# /etc/iked/ca/ and the certificates are installed.
#
#ikev2 "branch-site" passive esp \
#	from 10.10.0.0/16 to 10.20.0.0/16 \
#	local $ext_ip peer 203.0.113.20 \
#	srcid gw.lab.example.org \
#	dstid gw.branch.example.net \
#	tag "$ext_if"

# --- transport-mode policy for monitoring -----------------------------------
# Encrypt SNMP from the monitoring VM to a remote site over the same IKE SA
# instead of standing up a second tunnel.  Transport mode, so the original
# addresses are preserved.
#ikev2 "mon-snmp" passive transport esp \
#	from 10.10.50.14 to 10.20.0.14 \
#	local $ext_ip peer 203.0.113.20 \
#	proto udp \
#	tag "$ext_if"

# --- notes -------------------------------------------------------------------
# * ikev2 always requires ESP or AH; AH is not offered here because NAT-T and
#   AH do not mix, and most lab clients are behind NAT.
# * ipcomp is available but disabled in sysctl.conf
#   (net.inet.ipcomp.enable=0) — turn both on together if you want it.
# * The "tag" assignment lets pf.conf match on "tagged roadwarrior" if you
#   prefer that to matching the VPN subnet; this ruleset keys off enc0 and the
#   10.10.60.0/24 pool, which is simpler to reason about with a single tunnel.
