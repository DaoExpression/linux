# /etc/ssh/sshd_config.d/00-paranoid.conf
# Debian's /etc/ssh/sshd_config already starts with: Include /etc/ssh/sshd_config.d/*.conf
# Files are read in lexicographic order and the FIRST value wins for most keywords, so this
# 00- file takes precedence over anything Debian ships later.
# Validate:  sudo sshd -t  &&  sudo sshd -T | grep -E 'permitrootlogin|ciphers|kexalgorithms'

# ---------------------------------------------------------------------------
# Who may log in
# ---------------------------------------------------------------------------
# Replace 'admin' with your username. This is a second lock on the door: an account that
# appears (by mistake or by an attacker adding it) still cannot reach sshd.
AllowUsers admin
DenyUsers root

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthenticationMethods publickey
AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2
StrictModes yes
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60
LoginGraceTime 20

# ---------------------------------------------------------------------------
# What a session may do
# ---------------------------------------------------------------------------
PermitUserEnvironment no
PermitTunnel no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
GatewayPorts no
PermitListen none
PermitOpen none
DisableForwarding yes
RekeyLimit 512M 1h
Compression no

# ---------------------------------------------------------------------------
# Cryptography - pin everything; never rely on distro "defaults" here
# ---------------------------------------------------------------------------
# Delete /etc/ssh/ssh_host_rsa_key* and ssh_host_ecdsa_key* once you have confirmed clients work.
HostKey /etc/ssh/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com
PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com
# sntrup761x25519 is the post-quantum hybrid; keep it first.
KexAlgorithms sntrup761x25519-sha512@openssh.com,mlkem768x25519-sha256,curve25519-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# ---------------------------------------------------------------------------
# Logging and PAM
# ---------------------------------------------------------------------------
LogLevel VERBOSE          # logs the fingerprint of the key/host used on each auth attempt
SyslogFacility AUTH
UsePAM yes
PidFile /run/sshd.pid
PrintLastLog yes
PrintMotd no
Banner none               # do not advertise anything, including an "authorized use" banner
UseDNS no                 # no reverse DNS: no latency, no DNS traffic out of a pre-auth session

# ---------------------------------------------------------------------------
# Tier 2: reachable ONLY over the WireGuard admin plane (see docs/05 §5).
# Uncomment after you have verified SSH over the tunnel from a client, and drop 22 from nftables.
# ---------------------------------------------------------------------------
#ListenAddress 10.66.0.1
