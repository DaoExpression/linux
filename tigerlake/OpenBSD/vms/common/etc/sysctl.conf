#	/etc/sysctl.conf — lab guest baseline
#
#	Deployed to every guest by scripts/deploy.sh (vms/common/etc first, then the
#	per-guest tree on top).  A guest is a server, not a router: nothing here
#	forwards packets, and the settings exist so that a guest behaves
#	predictably under load and does not leak information about itself.
#
#	Per-guest files may add to this; keep anything that is not universal in
#	vms/<name>/etc/sysctl.conf instead.

# --- no forwarding: guests are endpoints --------------------------------------
net.inet.ip.forwarding=0
net.inet6.ip6.forwarding=0
net.inet.ip.redirect=0
net.inet6.ip6.redirect=0

# --- stack tuning -------------------------------------------------------------
# Same receive/send buffers as the gateway: the SRV and DMZ segments are
# 10G-capable at the veb(4) level even though the guests are virtio.
net.inet.tcp.recvspace=65536
net.inet.tcp.sendspace=65536
net.inet.udp.recvspace=65536
net.inet.icmp.icmplim=200

# --- state/table limits -------------------------------------------------------
# A guest holds far fewer states than the gateway, but it does run pf for its
# own protection (see pf.conf), so the request buffer still matters.
net.pf.request_maxcount=65535
kern.maxfiles=16384
kern.maxfilesperproc=8192

# --- do not answer broadcasts, do not accept redirects ------------------------
net.inet6.icmp6.rediraccept=0
net.inet6.icmp6.nd6_maxnudhint=1

# --- crash behaviour ----------------------------------------------------------
# Guest consoles are captured in a file by vmd(8); a ddb prompt frozen on the
# console is a support call, so drop into the reboot path instead.
ddb.panic=0
