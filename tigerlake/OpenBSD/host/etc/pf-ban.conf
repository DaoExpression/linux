#	/etc/pf-ban.conf — tunables for /usr/local/sbin/pf-ban.sh
#
#	Sourced by the script (POSIX sh syntax, no command substitution tricks).
#	Delete the file and the defaults inside the script apply.

# Which pf(4) table to maintain.  Must match the table declared in pf.conf.
PF_BAN_TABLE="bruteforce"

# Where ban expiry times live.  This file is the source of truth: the pf table
# is rebuilt from it, so losing it means losing every ban's expiry, not just
# the bans.
PF_BAN_DB="/var/db/pfban.tsv"

# Byte offset into the authlog that "watch" has already processed.  Deleting
# it makes the next run re-scan the whole file (and re-ban everything over the
# threshold, which is harmless).
PF_BAN_OFFSET="/var/db/pfban.offset"

# The log to watch.  On OpenBSD this is where sshd(8) records failed logins.
PF_BAN_AUTHLOG="/var/log/authlog"

# Default ban length in seconds (1 hour).
PF_BAN_TTL=3600

# Failures required before an address is banned, and the window they must fall
# inside.  Five attempts in ten minutes is generous for interactive use and
# far below what a scanner does.
PF_BAN_THRESHOLD=5
PF_BAN_WINDOW=600

# Ceiling for repeat offenders: an address that keeps coming back is banned
# for twice the previous duration each time, up to this (24 hours).
PF_BAN_MAX=86400

# Where the lock directory lives (the script creates $PF_BAN_LOCKDIR/pf-ban.sh.lock).
PF_BAN_LOCKDIR="/var/run"
