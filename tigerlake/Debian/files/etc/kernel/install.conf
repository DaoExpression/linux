# /etc/kernel/install.conf
# Consumed by kernel-install(8). Makes every kernel install emit a Unified Kernel Image that
# contains kernel + initramfs + cmdline(/etc/kernel/cmdline) + os-release, which is what we sign.
#
# Debian 13 note: generating UKIs on Debian requires an initrd generator that supports it.
# 'dracut' is the tested path here (apt-get install --no-install-recommends dracut systemd-ukify).
# If you prefer to keep initramfs-tools, remove these lines and instead sign the kernel+initrd
# directly with sbctl's sign glob (see docs/03 §2 Path A fallback note).
layout=uki
initrd_generator=dracut
uki_generator=ukify

# Where kernel-install writes entries and the ESP mount point.
# (systemd-boot reads the ESP; bootctl install assumes /boot/efi unless you changed it.)
# BOOT_ROOT=/boot/efi
