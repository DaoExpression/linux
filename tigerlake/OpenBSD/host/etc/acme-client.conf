#	/etc/acme-client.conf — gateway
#
#	Validate:  acme-client -n
#	Dry run:   acme-client -n -v -F lab.example.org     (-F forces renewal)
#	Issue:     acme-client -v lab.example.org
#	Renew:     /usr/local/sbin/acme-renew   (from /etc/crontab, daily)
#
#	The certificates this produces are consumed by relayd(8) — its
#	"tls keypair lab.example.org" reads exactly the two paths in the domain
#	block below, which is why the full chain is written to the .crt file.

# --- authorities --------------------------------------------------------------
# Staging exists so you can prove the whole chain — DNS, port 80 through
# relayd to httpd's ACME handler, key handling — without burning Let's Encrypt
# rate limits.  Switch "sign with" to letsencrypt-staging, test, then switch
# back.  The two use separate account keys.
authority letsencrypt {
	api url "https://acme-v02.api.letsencrypt.org/directory"
	account key "/etc/acme/letsencrypt-privkey.pem"
}

authority letsencrypt-staging {
	api url "https://acme-staging-v02.api.letsencrypt.org/directory"
	account key "/etc/acme/letsencrypt-staging-privkey.pem"
}

# A second CA to fall back on if the first is having a bad day.  Fill in the
# account key path and contact email before using it.
#authority buypass {
#	api url "https://api.buypass.com/acme/directory"
#	account key "/etc/acme/buypass-privkey.pem"
#}

# --- domains ------------------------------------------------------------------
domain lab.example.org {
	# Everything the relay serves must be in here; relayd matches on SNI,
	# and a name that is missing becomes a certificate error for the client.
	alternative names { www.lab.example.org }

	domain key "/etc/ssl/private/lab.example.org.key"
	# Full chain, not the bare leaf: relayd(8) hands the file to clients as-is.
	domain full chain certificate "/etc/ssl/lab.example.org.crt"

	sign with letsencrypt

	# The challenge is answered by httpd(8) on loopback, which relayd(8)
	# forwards to; see httpd.conf and relayd.conf.  This path is inside
	# httpd's chroot, so it is /var/www/acme on disk.
	challenge response "/var/www/acme"
}

# The mail VM holds its own certificates (SMTP STARTTLS must be end-to-end),
# so it runs acme-client too — see vms/mail/etc/acme-client.conf.

# ------------------------------------------------------------------ notes
# * The account key is the only thing that proves you own the account; back it
#   up with the rest of /etc/acme, and treat it like an SSH host key.
# * /etc/acme must be readable only by root, and /var/www/acme must be
#   readable by the www user inside httpd's chroot — acme-client takes care of
#   the permissions it needs, but check after a manual run:
#	ls -la /var/www/acme /etc/acme /etc/ssl/private/lab.example.org.key
# * Renewal is cheap and safe: acme-client only talks to the CA when the
#   certificate is close to expiry, so the daily cron entry is a no-op most
#   days and acme-renew only reloads relayd when a file actually changed.
