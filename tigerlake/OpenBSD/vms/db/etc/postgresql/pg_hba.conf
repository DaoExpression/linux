# /var/postgresql/data/pg_hba.conf — db guest
# ---------------------------------------------------------------------------
# This file DOES replace the package's copy: it is the authorisation layer, it
# is short, and it should be reviewable at a glance.  Reload with:
#     rcctl reload postgresql
# and check what the server actually parsed:
#     psql -c 'select * from pg_hba_file_rules'
#
# Order matters: the first matching line wins, so the specific rules come first.
#
# TYPE      DATABASE   USER        ADDRESS          METHOD
# ---------------------------------------------------------------------------

# --- local socket ------------------------------------------------------------
# initdb names the superuser role after the OS account that ran it, which for
# the OpenBSD package is _postgresql.  "peer" means "the OS user must match the
# role name", so this line keeps the superuser off the network entirely:
# logging in as _postgresql locally is the only way to be superuser.
# (If you ran initdb as a different account, change the name here to match —
#  "psql -c '\du'" as that account shows what was created.)
local     all        _postgresql                  peer
local     all        all                          reject

# --- replication -------------------------------------------------------------
# Reserved for the day the database is moved to a replica pair.  Uncomment
# together with the matching settings on the standby.
#host      replication  replicator  10.10.50.13/32  scram-sha-256

# --- the application ---------------------------------------------------------
# The web guest connects as the application role, over TCP, with a password.
# "scram-sha-256" rather than "md5": md5 hashes are cheap to crack offline.
host      appdb      webapp      10.10.40.20/32   scram-sha-256

# --- monitoring --------------------------------------------------------------
# postgres_exporter runs on the db guest itself and connects over loopback, so
# no network rule is needed for it.  If you ever move it to the mon guest,
# uncomment this instead of opening 5432 to the world:
#host      appdb      exporter    10.10.50.14/32   scram-sha-256

# --- administration ----------------------------------------------------------
# An admin on the bastion or in MGMT may connect as a limited role.  Give that
# role the privileges it needs in the database, not superuser.
host      all        dbadmin     10.10.50.10/32   scram-sha-256
host      all        dbadmin     10.10.10.0/24    scram-sha-256

# --- everything else ---------------------------------------------------------
# An explicit reject at the end turns "I forgot a rule" into a clear error in
# the log instead of a silent no-match.  It also makes the deny visible in
# pg_hba_file_rules.
host      all        all         0.0.0.0/0        reject
host      all        all         ::/0             reject

# ---------------------------------------------------------------------------
# Setting the passwords for the roles referenced above (run as postgres):
#     CREATE ROLE webapp LOGIN PASSWORD 'REPLACE-ME';
#     CREATE ROLE dbadmin LOGIN PASSWORD 'REPLACE-ME';
#     CREATE DATABASE appdb OWNER webapp;
# The passwords belong in the application's configuration on the web guest —
# not in this file, and not in this repository.
