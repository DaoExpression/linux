#	/etc/pf.conf — bastion
#
#	Same shape as the shared baseline (vms/common/etc/pf.conf) with one
#	addition: the bastion is what admins use to reach the other guests, so its
#	outbound rules are explicit about where traffic may go.  If this host is
#	compromised, the outbound rules are what limit the blast radius.

set skip on lo
set block-policy drop
set state-policy floating
set reassembly yes
set fingerprints "/etc/pf.os"
set loginterface vio0

if		= "vio0"
me		= "10.10.50.10"

mgmt_net	= "10.10.10.0/24"
srv_net		= "10.10.50.0/24"
dmz_net		= "10.10.40.0/24"
vpn_net		= "10.10.60.0/24"
gw		= "10.10.50.1"
monitor		= "10.10.50.14"

icmp_types	= "{ echoreq echorep unreach timexceed paramprob }"

match in all scrub (no-df random-id max-mss 1440)

antispoof quick for $if
block all

# --- inbound ------------------------------------------------------------------
pass in quick inet proto icmp from { $mgmt_net $srv_net $vpn_net } icmp-type $icmp_types keep state
pass in quick proto udp from any port bootpc to any port bootps
pass quick inet6 proto icmp6 all

# SSH: the admin networks, and nobody else.  The gateway's pf.conf does not
# publish this port on the WAN; if you ever add that rdr rule, the AllowUsers
# list above still has to match for a login to succeed.
pass in quick proto tcp from $mgmt_net to $me port ssh keep state
pass in quick proto tcp from $vpn_net to $me port ssh keep state

# Monitoring, time and DNS as on every guest.
pass in quick proto udp from $monitor to $me port snmp keep state
pass in quick proto udp from $gw to $me port ntp keep state
pass in quick proto { tcp udp } from $gw to $me port domain keep state

# No service listens here that the rules above do not mention: the bastion is
# an SSH concentrator, not an application server.

# --- outbound -----------------------------------------------------------------
# Only the lab, only where it makes sense.  Not "to any": an admin's jump host
# does not need to reach the internet, and removing that path removes a whole
# class of exfiltration from a stolen session.
pass out quick on $if proto tcp from $me to $srv_net port ssh keep state
pass out quick on $if proto tcp from $me to $dmz_net port ssh keep state
pass out quick on $if proto { tcp udp } from $me to { $gw $monitor } port { domain ntp snmp } keep state
pass out quick on $if inet proto icmp from $me to any icmp-type $icmp_types keep state
pass out quick on $if proto udp from any port bootpc to any port bootps
# Uncomment if package updates on the bastion must come straight from the
# internet instead of through a local mirror:
#pass out on $if from $me to any keep state

# ------------------------------------------------------------------ notes
# * /etc/ssh/ssh_config on admin workstations should get a matching "Match"
#   block so that "ssh db" from here uses ProxyJump through the bastion rather
#   than a direct connection — otherwise this guest is decoration.
