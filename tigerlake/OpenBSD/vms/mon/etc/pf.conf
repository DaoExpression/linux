#	/etc/pf.conf — mon guest
#
#	The unusual thing about this guest is its outbound policy: a monitoring
#	host must reach everything, and that is a genuinely dangerous property if
#	it is ever compromised.  The rules below therefore enumerate the *frontier*
#	— the lab's real hosts — rather than writing "to any", so a rogue process
#	here cannot wander into the client networks on an odd port.

set skip on lo
set block-policy drop
set state-policy floating
set reassembly yes
set fingerprints "/etc/pf.os"
set loginterface vio0

if		= "vio0"
me		= "10.10.50.14"

mgmt_net	= "10.10.10.0/24"
srv_net		= "10.10.50.0/24"
dmz_net		= "10.10.40.0/24"
vpn_net		= "10.10.60.0/24"
gw_mgmt		= "10.10.10.1"
gw_srv		= "10.10.50.1"

guests		= "{ 10.10.50.10 10.10.50.11 10.10.50.12 10.10.50.13 10.10.40.20 10.10.40.21 }"
icmp_types	= "{ echoreq echorep unreach timexceed paramprob }"

match in all scrub (no-df random-id max-mss 1440)

antispoof quick for $if
block all

# --- inbound ------------------------------------------------------------------
# Only the admin networks may reach this guest: the monitoring system is a
# high-value target (it holds credentials to everything and a copy of every
# log), so it is treated like the bastion.
pass in quick proto tcp from $mgmt_net to $me port ssh keep state
pass in quick proto tcp from $vpn_net to $me port ssh keep state
pass in quick inet proto icmp from { $mgmt_net $srv_net $vpn_net } icmp-type $icmp_types keep state
pass in quick proto udp from any port bootpc to any port bootps
pass quick inet6 proto icmp6 all

# Logs: guests ship syslog here as well as to the gateway, so a failure of
# either sink still leaves a copy.  UDP 514 from the SRV and DMZ guests.
pass in quick proto udp from { $srv_net $dmz_net } to $me port syslog keep state

# SSH out is not allowed in (above), so the collector's own dashboards must be
# reached the same way — nothing else listens here.

# --- outbound: the frontier ---------------------------------------------------
# SNMP to every host in the lab, including the gateway's own SNMP on both of
# its management addresses.
pass out quick on $if proto udp from $me to { $guests $gw_srv $gw_mgmt } port snmp keep state
# Exporter ports: node_exporter (9100), blackbox-style prober (9115),
# postgres_exporter (9187), and the gateway's own status page (8081).
pass out quick on $if proto tcp from $me to { $guests $gw_srv } port "{ 9100 9115 9187 8081 }" keep state
# SSH for the checks that have to read a file (they run with a restricted key
# that is valid only from this address — see the guest sshd_configs, which
# allow admin@10.10.50.0/24).
pass out quick on $if proto tcp from $me to $guests port ssh keep state
# ICMP for reachability and latency.
pass out quick on $if inet proto icmp from $me to { $srv_net $dmz_net $mgmt_net } icmp-type $icmp_types keep state
# DNS, NTP and package updates.
pass out quick on $if proto { tcp udp } from $me to 10.10.50.11 port domain keep state
pass out quick on $if proto udp from $me to $gw_srv port ntp keep state
pass out on $if from $me to any keep state

# ------------------------------------------------------------------ notes
# * The last rule is a catch-all so that package updates and anything the
#   collectd plugins need keep working.  It is the rule to remove first if you
#   want the monitoring host to be strictly confined; the explicit rules above
#   already cover everything the lab actually polls.
