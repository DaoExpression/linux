#	$OpenBSD: syslog.conf,v 1.39 $
#
#	/etc/syslog.conf — gateway
#
#	syslogd(8) is started with -u (see rc.conf.local) so it accepts UDP from
#	the guests.  This file keeps the local streams in the usual places and
#	adds one file per remote host under /var/log/remote/.
#
#	Format:  selector<TAB>action
#	Reload:  rcctl reload syslogd     (the file is re-read on SIGHUP)
#	Verify:  newsyslog rotates /var/log/remote/*.log (see newsyslog.conf)

# --- local streams ------------------------------------------------------------
*.notice;auth.info;authpriv.info;daemon.info	/var/log/messages
*.err						root
*.emerg						*
*.alert						root
auth.info;authpriv.info				/var/log/authlog
auth.info						root

# security-level messages are the ones worth waking someone for
auth.notice;authpriv.notice;*.err		security
cron.info					/var/cron/log
daemon.info					/var/log/daemon
kern.info					/var/log/messages
mail.info					/var/log/maillog
local0.info					/var/log/lab-report.log
local1.info					/var/log/pf-ban.log

# --- service-specific programs ------------------------------------------------
# Filter the process name with "!prog"; an empty "!" returns to everything.
!ppp
*.*						/var/log/ppp.log
!ntp
*.info						/var/log/ntpd.log
!nsd
*.info						/var/log/nsd.log
!unwind
*.info						/var/log/unwind.log
!iked
*.info						/var/log/iked.log
!relayd
*.info						/var/log/relayd.log
!httpd
*.info						/var/log/httpd.log
!dhcpd
*.info						/var/log/dhcpd.log
!

# --- remote hosts -------------------------------------------------------------
# Host-specific sections: "+hostname" selects the source, "-*" ends the
# section.  Everything a guest sends arrives here, which means a compromised
# VM cannot erase its own logs — it never had them to begin with; the local
# syslog on each guest is intentionally minimal.
#
# Note that the guest's syslog.conf must point at the gateway's SRV address
# (10.10.50.1), which lives in a different subnet from the DMZ guests — pf
# allows it because $mon_vm... no: pf allows *all* SRV-to-gateway traffic and
# the guests are allowed to send to the gateway's own syslog port through the
# rules in their own pf.conf plus the "pass in on $dmz_if/srv_if ... to
# $gw_*" rules.  If a guest's logs stop arriving, check pf first.

+web.lab.example.org
*.*						/var/log/remote/web.log
-*

+mail.lab.example.org
*.*						/var/log/remote/mail.log
-*

+bastion.lab.example.org
*.*						/var/log/remote/bastion.log
-*

+dns.lab.example.org
*.*						/var/log/remote/dns.log
-*

+db.lab.example.org
*.*						/var/log/remote/db.log
-*

+storage.lab.example.org
*.*						/var/log/remote/storage.log
-*

+mon.lab.example.org
*.*						/var/log/remote/mon.log
-*

# Catch-all for anything else that starts logging to us (a new VM, a switch,
# the AP).  Keeping this last means a device cannot slip past unlogged.
+*
*.*						/var/log/remote/unknown.log
-*
