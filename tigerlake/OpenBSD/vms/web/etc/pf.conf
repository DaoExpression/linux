#	/etc/pf.conf — web guest
#
#	The DMZ guest.  Assume anything running here can be reached by an
#	attacker who finds a bug in the site, and write the rules to contain that:
#	inbound only from the gateway (relayd) and the admin networks, outbound
#	only to the database, DNS and the gateway.

set skip on lo
set block-policy drop
set state-policy floating
set reassembly yes
set fingerprints "/etc/pf.os"
set loginterface vio0

if		= "vio0"
me		= "10.10.40.20"

mgmt_net	= "10.10.10.0/24"
srv_net		= "10.10.50.0/24"
dmz_net		= "10.10.40.0/24"
vpn_net		= "10.10.60.0/24"
gw_dmz		= "10.10.40.1"
dns		= "10.10.50.11"
db		= "10.10.50.12"
monitor		= "10.10.50.14"
bastion		= "10.10.50.10"

icmp_types	= "{ echoreq echorep unreach timexceed paramprob }"

match in all scrub (no-df random-id max-mss 1440)

antispoof quick for $if
block all

# --- inbound ------------------------------------------------------------------
# HTTP from the gateway only: relayd(8) is what the internet talks to, and if
# you ever add a second relay node, this is the rule to widen.
pass in quick proto tcp from $gw_dmz to $me port 8080 keep state

# Management, exactly as on the other guests.
pass in quick proto tcp from $mgmt_net to $me port ssh keep state
pass in quick proto tcp from $bastion to $me port ssh keep state
pass in quick proto tcp from $vpn_net to $me port ssh keep state
pass in quick inet proto icmp from { $mgmt_net $srv_net $dmz_net } icmp-type $icmp_types keep state
pass in quick proto udp from any port bootpc to any port bootps
pass quick inet6 proto icmp6 all

# Monitoring and time.
pass in quick proto udp from $monitor to $me port snmp keep state
pass in quick proto tcp from $monitor to $me port 9100 keep state
pass in quick proto udp from $monitor to $me port syslog keep state
pass in quick proto udp from $gw_dmz to $me port ntp keep state

# --- outbound -----------------------------------------------------------------
# The application's dependency list, written down.  Everything else is refused,
# which is what makes an exploit here boring: no SMTP out (so no spam relay from
# a compromised web app), no SMB, no LDAP.
pass out quick on $if proto { tcp udp } from $me to $dns port domain keep state
pass out quick on $if proto tcp from $me to $db port 5432 keep state
pass out quick on $if proto { tcp udp } from $me to $gw_dmz port { ntp domain } keep state
pass out quick on $if inet proto icmp from $me to { $dmz_net $srv_net } icmp-type $icmp_types keep state
# Package updates.  In a lab, keeping this allows pkg_add; in production, mirror
# the packages onto the storage guest and point this at 10.10.50.13 instead.
pass out on $if from $me to any keep state

# ------------------------------------------------------------------ notes
# * If the site ever needs to send mail (contact forms), add an explicit rule
#   for the mail guest rather than opening port 25 generally:
#   pass out quick on $if proto tcp from $me to 10.10.40.21 port submission keep state
