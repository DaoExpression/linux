# /etc/modsecurity/crs/paranoid-crs.conf
# OWASP Core Rule Set posture for this host. See docs/06 §8.
#
# Installed alongside the packaged CRS: the Debian package provides the rules under
# /usr/share/modsecurity-crs; this file sets the *posture* and any narrow exclusions.
#
# Tuning procedure (do not skip to phase 2):
#   1. PL1 + SecRuleEngine DetectionOnly for 24-48h with real traffic
#   2. read /var/log/apache2/modsec_audit.log, classify each hit
#   3. add NARROW exclusions below (by rule id AND path), never disable a whole category
#   4. raise to PL2, switch SecRuleEngine to On, re-watch for a week

# ---------------------------------------------------------------------------
# Paranoia level and thresholds
# ---------------------------------------------------------------------------
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=2"
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.detection_paranoia_level=2"

# Anomaly scoring thresholds. Lower than the CRS defaults because this host serves a narrow,
# well-understood application: it does not need to be forgiving, it needs to fail closed.
SecAction "id:900110,phase:1,nolog,pass,t:none,\
  setvar:tx.inbound_anomaly_score_threshold=15,\
  setvar:tx.outbound_anomaly_score_threshold=8"

# Enforce strict body processing for urlencoded bodies.
SecAction "id:900130,phase:1,nolog,pass,t:none,setvar:tx.enforce_bodyproc_urlencoded=1"

# Do not accept so-called "invalid" UTF-8 silently.
SecAction "id:900140,phase:1,nolog,pass,t:none,setvar:tx.crs_validate_utf8_encoding=1"

# Restrict the methods the CRS expects - matches the <LimitExcept> rule in security-hardening.conf.
SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

# Content types the application may send. Narrow this to exactly what you use; every extra type is
# another parser reachable by attackers.
SecAction "id:900220,phase:1,nolog,pass,t:none,\
  setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded|multipart/form-data|application/json|text/plain|'"

# File extensions we never accept.
SecAction "id:900240,phase:1,nolog,pass,t:none,\
  setvar:'tx.restricted_extensions=.php .php3 .php4 .php5 .phtml .pl .py .rb .cgi .asp .aspx .jsp .sh .exe .dll .so .bin'"

SecAction "id:900990,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=400"

# ---------------------------------------------------------------------------
# Narrow exclusions (add yours here, with a comment saying WHY and WHEN)
# ---------------------------------------------------------------------------
# Format for a justified exclusion - one rule, one path, one reason:
#   SecRule REQUEST_URI "@beginsWith /api/v1/webhook" \
#     "id:1001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:payload"
#
# Rules of thumb:
#  * Never use 'ctl:ruleEngine=Off' for a path unless you have read every rule it disables.
#  * Never exclude by IP: the attacker will use that IP.
#  * Re-review exclusions at the quarterly audit (docs/10 §5) - exclusions accumulate and rot.
#
# Example (kept commented; enable only if your app genuinely posts JSON with a signature field):
# SecRule REQUEST_URI "@beginsWith /api/v1/hook" "id:1002,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942430"
