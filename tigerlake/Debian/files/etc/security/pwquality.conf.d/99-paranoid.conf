# /etc/security/pwquality.conf.d/99-paranoid.conf
# Password quality for the one interactive account. Passphrases, not passwords: length first.
minlen = 16
minclass = 3
maxrepeat = 2
maxclassrepeat = 4
maxsequence = 4
gecoscheck = 1
dictcheck = 1
usercheck = 1
enforcing = 1
retry = 3
badwords = admin root localhost debian apache server srv-01
