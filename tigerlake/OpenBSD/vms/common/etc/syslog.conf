#	/etc/syslog.conf — lab guest baseline
#
#	Every guest sends its logs to the gateway, which keeps them per-host under
#	/var/log/remote/ (see the gateway's syslog.conf).  That means a compromise
#	or a disk failure inside a guest cannot erase the evidence, and it is why
#	the local files here are small.
#
#	The gateway listens because syslogd runs with -u there, and files what it
#	receives under /var/log/remote/<guest>.log.  Apply changes with:
#	    rcctl restart syslogd
#
#	This one file is deployed unchanged to all seven guests.

# --- local copies: errors only ------------------------------------------------
# A guest that keeps a full local log buries the useful line; keep warnings and
# above, plus everything the auth path produces.
*.err;auth.notice					/var/log/messages
auth.info;authpriv.info					/var/log/authlog
cron.info						/var/log/cron

# --- ship everything to the gateway -------------------------------------------
# One destination, UDP 514, at the gateway's SRV address.  "@" is the send
# operator; there is no "keep local copy" form, so both lines above and this
# one are needed.
*.*							@10.10.50.1

# --- service programs worth separating locally ---------------------------------
!relayd
*.*							@10.10.50.1
!dovecot
*.*							@10.10.50.1
!postgresql
*.*							@10.10.50.1
!
