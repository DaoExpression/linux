# /etc/systemd/journald.conf.d/99-paranoid.conf
# Persistent, size-bounded, rate-limited and (where a TPM is present) sealed journal.
# See docs/04 §10. Reload with: systemctl restart systemd-journald

[Journal]
Storage=persistent
Compress=yes
Seal=yes                     # FSS sealing: detects tampering with the journal. Degrades safely
                             # (no sealing) if there is no usable TPM - it does not block boot.
SplitMode=uid
SystemMaxUse=512M
SystemMaxFileSize=64M
SystemMaxFiles=20
RuntimeMaxUse=64M
MaxRetentionSec=3month
MaxFileSec=1month
MaxLevelStore=info
MaxLevelSyslog=info
MaxLevelKMsg=notice
MaxLevelConsole=notice
MaxLevelWall=emerg
ForwardToSyslog=no           # no rsyslog on this host; ship off-box with journal-upload instead
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=yes
Audit=yes
ReadKMsg=yes
LineMax=48K
RateLimitIntervalSec=30s
RateLimitBurst=2000
# Do not accept client-sent data: nothing should be sending journal entries to us over the network.
# (Port 19532 is not open in nftables either - belt and braces.)
