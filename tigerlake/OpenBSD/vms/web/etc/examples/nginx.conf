#	/etc/examples/nginx.conf — web guest (OPTIONAL)
#
#	This file is an ALTERNATIVE to the base system's httpd(8), kept under
#	/etc/examples/ so that nothing loads it by accident.  The lab's default is
#	base httpd (see /etc/httpd.conf): it is in the base system, it is what
#	OpenBSD's documentation and acme/relayd examples assume, and it has a
#	config validator that runs without the daemon.
#
#	Reach for nginx instead when you need something base httpd does not do —
#	WebSocket upgrades, response rewriting, upstream keepalive tuning, or
#	arbitrary proxy_cache semantics.
#
#	To switch, on this guest:
#	    pkg_add nginx
#	    rcctl disable httpd
#	    cp /etc/examples/nginx.conf /etc/nginx/nginx.conf
#	    rcctl enable nginx && rcctl start nginx
#
#	Nothing on the gateway changes: relayd(8) still terminates TLS and still
#	forwards to 10.10.40.20:8080.  That is the point of keeping the backend
#	behind a relay — swapping it is a decision made on one guest.

worker_processes  2;		# the guest has 2 vCPUs (see vm.conf)
worker_rlimit_nofile 4096;

events {
	worker_connections 1024;
	# The backend is one hop away over virtio; keepalive pays for itself.
	multi_accept on;
}

http {
	include		mime.types;
	default_type	application/octet-stream;

	# --- logging ------------------------------------------------------------
	# One file per vhost, shipped to the gateway's central syslog by syslogd(8).
	log_format lab '$remote_addr - $remote_user [$time_local] "$request" '
	               '$status $body_bytes_sent "$http_referer" '
	               '"$http_user_agent" rt=$request_time';
	access_log /var/log/nginx/access.log lab;
	error_log  /var/log/nginx/error.log warn;

	# --- transport hygiene ---------------------------------------------------
	sendfile	on;
	tcp_nopush	on;
	tcp_nodelay	on;
	keepalive_timeout 30;
	server_tokens	off;		# relayd already rewrites the Server header
	client_max_body_size 16m;	# uploads larger than this belong in an app

	# --- the vhost relayd forwards to ----------------------------------------
	server {
		listen 10.10.40.20:8080;
		server_name lab.example.org;

		# Only relayd should be talking to us; anything else is a mistake and
		# is worth failing loudly rather than serving.
		if ($http_x_forwarded_proto != "https") {
			return 421;
		}

		root /var/www/htdocs/lab;
		index index.html;

		# Long-lived assets, hashed filenames: cache hard.
		location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
			expires 30d;
			add_header Cache-Control "public, immutable";
		}

		# The challenge directory is normally served by httpd(8) on the
		# gateway, but keep the path working if a certificate is ever issued
		# from this guest.
		location ^~ /.well-known/acme-challenge/ {
			root /var/www/acme;
			default_type "text/plain";
		}

		# --- the application -------------------------------------------------
		# Unix socket is preferable to a loopback port: no listen backlog to
		# exhaust, and file permissions do the access control.
		location /api/ {
			proxy_pass http://unix:/var/www/run/app.sock:/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			# Upgrade support, for WebSockets from the same app.
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_read_timeout 60s;
		}

		# Never serve dotfiles, and never serve the application's socket.
		location ~ /\. { deny all; }
		location ^~ /run/ { deny all; }
	}
}

# ------------------------------------------------------------------ notes
# * No tls block anywhere in this file on purpose.  The certificate and the
#   private key live on the gateway (relayd terminates TLS); if nginx held
#   them, the DMZ guest would become the place a key leak is discovered.
# * $http_x_forwarded_proto is set by relayd's protocol block on the gateway.
#   If it is missing, this vhost answers 421 rather than serving a request that
#   arrived over plain HTTP — a cheap way to make a misconfigured relay
#   obvious.
