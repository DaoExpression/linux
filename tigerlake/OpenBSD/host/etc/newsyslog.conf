#	$OpenBSD: newsyslog.conf,v 1.34 $
#
#	/etc/newsyslog.conf — gateway
#
#	This is a *replacement* for the shipped file: diff it against
#	/etc/newsyslog.conf on the running host before installing so you do not
#	lose entries added by a future release.
#
#	Fields:
#	  logfilename  [owner:group]  mode  count  size  when  flags  [/pid_file] [sig]

# logfilename          [owner:group]    mode count size when  flags [/pid_file] [sig_num]
/var/log/authlog			640  7     1000 *     Z
/var/log/daemon				640  7     1000 *     Z
/var/log/messages			644  7     1000 *     Z
/var/log/secure				600  7     500  *     Z
/var/log/wtmp				644  7     *    @T     B
/var/log/xferlog			640  7     250  *     Z
/var/log/maillog			640  7     1000 *     Z
/var/log/lpd-errs			640  7     100  *     Z
/var/log/relayd				640  7     500  *     Z
/var/log/httpd				640  7     500  *     Z
/var/log/nsd				640  7     500  *     Z
/var/log/unwind				640  7     500  *     Z
/var/log/iked				640  7     250  *     Z
/var/log/dhcpd				640  7     250  *     Z

# pf(4) logs.  pflogd(8) rotates /var/log/pflog itself on SIGUSR1, but old
# copies still need trimming.  Keep two weeks of packets, no compression so
# tcpdump -r works without a decompressor.
/var/log/pflog			600  14    *    24    ZB "/var/run/pflogd.pid" 30
/var/log/pflog.0		600  8     *    24    ZB

# Central log receiver: one file per device under /var/log/remote, written by
# syslogd(8) (see syslog.conf).  /usr/local is where the lab scripts live.
/var/log/remote/*.log		644  7     2000 *     Z

# Lab report output, regenerated weekly by cron.
/var/log/lab-report.log		644  4     1000 *     Z
