# /etc/apache2/sites-available/000-default.conf
# The DEFAULT vhost. What it does here is important: it serves NOTHING.
#
# Rationale (docs/06 §3): any request that does not match a real VirtualHost - by Host: header, by
# IP, or by TLS SNI fallback - lands here. If this vhost had content, that content would be reachable
# by every wrong-hostname scan on the internet, under a certificate name that does not match, which
# is both an information leak and a phishing surface.
#
# A minimal, generic 404 with no server identification is the correct behaviour.

<VirtualHost *:443>
    ServerName default.invalid
    # No certificate is configured here on purpose: with SSLOptions +StrictRequire (tls-hardening.conf)
    # Apache will refuse to serve rather than fail open. Browsers reaching the default vhost get a
    # TLS failure - which is exactly right, because they are not asking for a site we host.

    DocumentRoot /var/www/default
    <Directory /var/www/default>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    # Generic, static error page: no version, no paths, no stack traces.
    ErrorDocument 400 /error/400.html
    ErrorDocument 403 /error/403.html
    ErrorDocument 404 /error/404.html
    ErrorDocument 500 /error/500.html

    ErrorLog ${APACHE_LOG_DIR}/default_error.log
    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/default_access.log paranoid
</VirtualHost>

# NOTE: no port-80 vhost. If you use HTTP-01 ACME instead of DNS-01, you need one - but it must do
# exactly two things: answer /.well-known/acme-challenge/ and redirect everything else to HTTPS.
# docs/06 §4 explains why DNS-01 (and therefore no port 80 at all) is the better choice here.
