#	install.conf for the web guest — see scripts/provision-vm.sh
#
#	Bootstrap answers only.  Real configuration (10.10.40.20 on the dmz switch,
#	httpd behind relayd, the reverse-proxy vhosts) comes from vms/web/etc/
#	after the install.
#	Fill in every REPLACE-ME first (password hashes: run "encrypt").

System hostname = web
Password for root = REPLACE-ME-ROOT-HASH

# --- network, install time only ----------------------------------------------
Network interfaces = vio0
IPv4 address for vio0 = dhcp
IPv6 address for vio0 = none
DNS domain name = lab.example.org
DNS nameservers = 10.10.99.1

# --- console -----------------------------------------------------------------
Change the default console to com0 = yes
Which speed should com0 use = 115200

# --- administration ----------------------------------------------------------
Setup a user = admin
Full name for user admin = Lab Administrator
Password for user admin = REPLACE-ME-ADMIN-HASH
Public SSH key for user admin = REPLACE-ME-SSH-PUBLIC-KEY
Allow root ssh login = prohibit-password

Time zone = UTC

# --- sets --------------------------------------------------------------------
# A static-content vhost needs no compiler: base + man is enough.  Add
# comp${RELNUM}.tgz here if you intend to build anything on the web VM.
Location of sets = http
HTTP Server = 10.10.99.1
Server directory = install
Set name(s) = done
