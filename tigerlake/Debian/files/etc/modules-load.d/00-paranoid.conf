# /etc/modules-load.d/00-paranoid.conf
#
# Intentionally EMPTY (comments only).
#
# Nothing is force-loaded at boot. Modules that are needed are loaded on demand by udev; modules
# that are not needed are blacklisted in 90-blacklist-paranoid.conf. If you ever need to add a
# module here, you are making a permanent, auditable statement about the machine - do it
# deliberately and note why in /etc/paranoid/package-justifications.
#
# Verify nothing was slipped in:  ls /etc/modules-load.d/ && cat /etc/modules
