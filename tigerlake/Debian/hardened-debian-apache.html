s off here\n    SecRequestBodyLimit 131072             # 128 KiB, matches LimitRequestBody intent\n    SecRequestBodyNoFilesLimit 131072\n    SecRequestBodyInMemoryLimit 131072\n    SecRequestBodyLimitAction Reject\n    SecPcreMatchLimit 100000\n    SecPcreMatchLimitRecursion 100000\n    SecDebugLogLevel 0                     # never log request bodies at debug on a public box\n    SecAuditEngine RelevantOnly\n    SecAuditLogRelevantStatus \"^(?:5|4(?!04))\"\n    SecAuditLogParts ABIFHZ\n    SecAuditLogType Serial\n    SecAuditLog /var/log/apache2/modsec_audit.log\n    SecDataDir /var/cache/apache2/mod_security2\n    SecTmpDir /var/cache/apache2/mod_security2\n    SecUploadKeepFiles Off\n    SecUploadDir /var/cache/apache2/mod_security2\n    SecDefaultAction \"phase:1,log,auditlog,deny,status:403\"\n    SecDefaultAction \"phase:2,log,auditlog,deny,status:403\"\n    IncludeOptional /etc/modsecurity/modsecurity.conf\n    IncludeOptional /usr/share/modsecurity-crs/*.load\n    IncludeOptional /etc/modsecurity/crs/paranoid-crs.conf\n&lt;/IfModule&gt;<\/code><\/pre><\/div>\n<p><a href=\"#/file/etc/modsecurity/crs/paranoid-crs.conf\"><code>files/etc/modsecurity/crs/paranoid-crs.conf<\/code><\/a> sets the CRS posture:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code>SecAction \"id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=2\"\nSecAction \"id:900001,phase:1,nolog,pass,t:none,setvar:tx.detection_paranoia_level=2\"\nSecAction \"id:900110,phase:1,nolog,pass,t:none,\\\n  setvar:tx.inbound_anomaly_score_threshold=15,\\\n  setvar:tx.outbound_anomaly_score_threshold=8\"\nSecAction \"id:900130,phase:1,nolog,pass,t:none,setvar:tx.enforce_bodyproc_urlencoded=1\"\nSecAction \"id:900990,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=400\"<\/code><\/pre><\/div>\n<p>Tuning procedure (this is the part that takes an afternoon, not five minutes):<\/p>\n<ol>\n<li>Start at PL1 with <code>SecRuleEngine DetectionOnly<\/code> for 24–48 h and real traffic.<\/li>\n<\/li>\n<li>Read <code>/var/log/apache2/modsec_audit.log<\/code>, classify every hit as <em>true positive<\/em> or <em>app bug<\/em>.<\/li>\n<\/li>\n<li>Add <strong>narrow<\/strong> exclusions per rule id and per URI path in <code>paranoid-crs.conf<\/code> — never disable a whole rule category, and never <code>ctl:ruleRemoveTargetById<\/code> across the whole vhost.<\/li>\n<\/li>\n<li>Raise to PL2, switch to <code>On<\/code>, then re-watch. Repeatedly hitting the anomaly threshold on normal traffic means you tuned wrong, not that the traffic is malicious.<\/li>\n<\/li>\n<li><code>SecAuditLog<\/code> <strong>must<\/strong> be rotated and must not be world-readable: <a href=\"#/file/etc/logrotate.d/modsec\"><code>files/etc/logrotate.d/modsec<\/code><\/a> ships a rotation block with <code>create 0640 root adm<\/code>.<\/li>\n<\/li>\n<\/ol>\n<p>Honest limitation: CRS is a signature set. It stops commodity scanners and lazy exploitation; it will not stop a determined attacker with a novel bug in your application. Its real value here is that it raises the cost of automation and gives you an audit trail of attempts.<\/p>\n<h2 id=\"9-logging-and-log-integrity\">9. Logging and log integrity<a class=\"anchor\" href=\"#9-logging-and-log-integrity\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-apache\"><code>LogFormat \"%v %{X-Forwarded-For}i %h %l %u %t \\\"%r\\\" %&gt;s %b %D %{SSL_PROTOCOL}x %{SSL_CIPHER}x \\\"%{User-Agent}i\\\" %{Referer}i\" paranoid\nLogLevel warn\n# piped to journald at Tier 2 so events land in a remote-shippable, sealed store\nCustomLog \"|/usr/bin/logger -t apache_access -p local6.info\" paranoid\nErrorLog  \"|/usr/bin/logger -t apache_error  -p local6.err\"<\/code><\/pre><\/div>\n<ul>\n<li>Everything lands in the journal, which is already configured (<code>docs/04<\/code> §10) to be persistent, size-limited and <strong>sealed<\/strong>; <code>systemd-journal-upload<\/code> can ship it off-host over TLS. That is a far better story than Apache writing files nobody reads.<\/li>\n<\/li>\n<li>If you prefer files, keep <a href=\"#/file/etc/logrotate.d/apache2\"><code>files/etc/logrotate.d/apache2<\/code><\/a> (shipped) and remember <code>/var/log<\/code> is mounted <code>noexec<\/code> — a webshell cannot be dropped there.<\/li>\n<\/li>\n<li>Never log request bodies, <code>Authorization<\/code> headers, or cookies. <code>mod_security<\/code>'s audit log parts must stay <code>ABIFHZ<\/code> (no <code>C<\/code>/<code>E<\/code> = no request body content) exactly as shipped.<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"10-verification\">10. Verification<a class=\"anchor\" href=\"#10-verification\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apache2ctl configtest                        # Syntax OK (a warning about a missing FQDN is fine)\nsudo apache2ctl -M | sort                         # only the modules you decided to keep\nsudo apache2ctl -S                                # vhost map: nothing you did not intend\nsudo systemd-analyze security apache2 | tail -3\nsudo ss -tulpn | grep apache                      # :443 (and :80 only if HTTP-01)\ncurl -sI https://&lt;server&gt;/ | grep -iE 'server|strict-transport|x-content-type|content-security'\ncurl -sI https://&lt;server&gt;/../etc/passwd | head -1 # expect 400/404, never 200\ncurl -s https://&lt;server&gt;/%2e%2e/ | head -1        # expect 404\nbash scripts/verify-hardening.sh --section apache\nsudo certbot renew --dry-run<\/code><\/pre><\/div>\n<p>Then re-run the AIDE baseline (<code>docs/04<\/code> §8) — the web server config is now final and should be part of the integrity baseline.<\/p>", "files": ["etc/apache2/apache2.conf", "etc/apache2/ports.conf", "etc/apache2/conf-available/headers-hardening.conf", "etc/apache2/conf-available/mpm-tuning.conf", "etc/apache2/conf-available/security-hardening.conf", "etc/apache2/conf-available/tls-hardening.conf", "etc/apache2/mods-available/security2.conf", "etc/apache2/sites-available/000-default.conf", "etc/apache2/sites-available/example-hardened.conf", "etc/modsecurity/crs/paranoid-crs.conf", "etc/modsecurity/modsecurity.conf", "etc/logrotate.d/apache2", "etc/logrotate.d/modsec", "etc/systemd/system/apache2.service.d/99-paranoid.conf"], "toc": [{"lvl": 1, "id": "06-apache-hardening-the-service-you-are-actually-exposing", "text": "06 — Apache hardening (the service you are actually exposing)"}, {"lvl": 2, "id": "1-principles", "text": "1. Principles"}, {"lvl": 2, "id": "2-module-pruning-do-this-first", "text": "2. Module pruning — do this first"}, {"lvl": 2, "id": "3-global-config-files-etc-apache2-apache2-conf", "text": "3. Global config — files/etc/apache2/apache2.conf"}, {"lvl": 2, "id": "4-tls-tls-1-3-only-post-quantum-key-exchange-acme-via-dns-01", "text": "4. TLS — TLS 1.3 only, post-quantum key exchange, ACME via DNS-01"}, {"lvl": 2, "id": "5-headers-methods-admin-vhosts", "text": "5. Headers, methods, admin vhosts"}, {"lvl": 2, "id": "6-sandboxing-the-apache-unit", "text": "6. Sandboxing the Apache unit"}, {"lvl": 2, "id": "7-isolation-between-sites-when-you-have-more-than-one", "text": "7. Isolation between sites (when you have more than one)"}, {"lvl": 2, "id": "8-mod-security3-owasp-crs", "text": "8. mod_security3 + OWASP CRS"}, {"lvl": 2, "id": "9-logging-and-log-integrity", "text": "9. Logging and log integrity"}, {"lvl": 2, "id": "10-verification", "text": "10. Verification"}], "fences": 19, "tables": 1}, {"slug": "07-physical-and-firmware", "title": "07 · Physical / firmware", "html": "<h1 id=\"07-physical-access-firmware-and-peripherals\">07 — Physical access, firmware, and peripherals<a class=\"anchor\" href=\"#07-physical-access-firmware-and-peripherals\" aria-label=\"link\">#<\/a><\/h1>\n<p>Everything in <code>docs/03<\/code>–<code>docs/06<\/code> assumes an attacker who is <em>inside<\/em> the OS boundary. This document is about the boundary itself: firmware, the Management Engine, DMA-capable ports, and USB.<\/p>\n<hr>\n<h2 id=\"1-bios-uefi-checklist-dell-tiger-lake\">1. BIOS/UEFI checklist (Dell, Tiger Lake)<a class=\"anchor\" href=\"#1-bios-uefi-checklist-dell-tiger-lake\" aria-label=\"link\">#<\/a><\/h2>\n<p>Do these on the physical console, and re-check them after every firmware update — Dell firmware updates have been known to reset security settings.<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Setting<\/th>\n<th style=\"text-align:left\">Value<\/th>\n<th style=\"text-align:left\">Why<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">Admin/Setup password<\/td>\n<td style=\"text-align:left\">strong, unique, <strong>not<\/strong> stored on the machine<\/td>\n<td style=\"text-align:left\">Anyone with 5 minutes could otherwise flip Secure Boot off.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">BIOS update from<\/td>\n<td style=\"text-align:left\">Dell's site over a trusted network, or <code>fwupdmgr<\/code> (signed LVFS metadata)<\/td>\n<td style=\"text-align:left\">Never from a random mirror; UEFI firmware is the root of trust.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Secure Boot<\/td>\n<td style=\"text-align:left\"><strong>enabled<\/strong>, own keys enrolled (<code>docs/03<\/code> §2)<\/td>\n<td style=\"text-align:left\">Boot integrity.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Boot order<\/td>\n<td style=\"text-align:left\">internal NVMe only; USB/optical/PXE <strong>disabled after install<\/strong><\/td>\n<td style=\"text-align:left\">Removes live-USB attacks. Keep a BIOS password so this cannot be changed.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Firmware TPM (PTT)<\/td>\n<td style=\"text-align:left\">enabled if you want journal sealing/IMA; irrelevant to LUKS here<\/td>\n<td style=\"text-align:left\"><code>docs/03<\/code> §5.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Kernel DMA Protection<\/td>\n<td style=\"text-align:left\"><strong>enabled<\/strong><\/td>\n<td style=\"text-align:left\">Pre-boot + early-boot DMA blocked for TB3/4.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Thunderbolt security<\/td>\n<td style=\"text-align:left\"><strong>User Authorization<\/strong>, \"no security\" never<\/td>\n<td style=\"text-align:left\"><code>docs/00<\/code> §3.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Thunderbolt boot / pre-boot DMA<\/td>\n<td style=\"text-align:left\">disabled<\/td>\n<td style=\"text-align:left\">Stops a malicious dock from loading a ROM before your IOMMU policy applies.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Discrete graphics<\/td>\n<td style=\"text-align:left\"><strong>disabled<\/strong> if the menu offers it<\/td>\n<td style=\"text-align:left\">Removes the NVIDIA MX450 (<code>01:00.0<\/code>) entirely.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Camera / Microphone<\/td>\n<td style=\"text-align:left\"><strong>disabled<\/strong><\/td>\n<td style=\"text-align:left\">Hardware kill beats a driver blacklist.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Bluetooth / WWAN<\/td>\n<td style=\"text-align:left\"><strong>disabled<\/strong><\/td>\n<td style=\"text-align:left\">Unused radios are attack surface.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Wake-on-LAN / Wake on USB / Wake on AC<\/td>\n<td style=\"text-align:left\">disabled<\/td>\n<td style=\"text-align:left\">No remote/adjacent wake events; also blocks some cold-boot tricks.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Legacy ROM / CSM<\/td>\n<td style=\"text-align:left\">disabled<\/td>\n<td style=\"text-align:left\">No legacy BIOS code paths.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">CPU settings<\/td>\n<td style=\"text-align:left\">VT-d on, VT-x on, Trusted Execution on, hyperthreading: your call (Tier 3 disables it)<\/td>\n<td style=\"text-align:left\"><code>docs/00<\/code>/<code>docs/03<\/code>.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Chassis/Kensington<\/td>\n<td style=\"text-align:left\">lock the machine; in an office, a cable lock is not theatre<\/td>\n<td style=\"text-align:left\">Obvious, and it is the cheapest control on the list.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Verify what the OS can see (it cannot see everything the BIOS did):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo dmidecode -t bios -t system | grep -E 'Vendor|Version|Release Date|Product|Serial'\nsudo mokutil --sb-state                     # SecureBoot enabled (or bootctl status)\nsudo fwupdmgr get-devices 2&gt;/dev/null | head -40\ncat /sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c 2&gt;/dev/null | xxd | tail -1<\/code><\/pre><\/div>\n<h2 id=\"2-intel-management-engine-residual-risk-stated-honestly\">2. Intel Management Engine — residual risk, stated honestly<a class=\"anchor\" href=\"#2-intel-management-engine-residual-risk-stated-honestly\" aria-label=\"link\">#<\/a><\/h2>\n<p>Tiger Lake fuses Boot Guard and signs the ME region, so <code>me_cleaner<\/code> is <strong>not<\/strong> a safe operation on this machine: at best it does nothing, at worst it bricks the platform or invalidates the boot policy that your Secure Boot keys depend on. We do not pretend the ME can be removed. We do:<\/p>\n<ol>\n<li><strong>Blacklist the OS-side interface<\/strong> (<code>mei_me<\/code>, <code>mei<\/code>) — see <a href=\"#/file/etc/modprobe.d/90-blacklist-paranoid.conf\"><code>files/etc/modprobe.d/90-blacklist-paranoid.conf<\/code><\/a>. This removes a privileged, DMA-capable device from the kernel's reachable device list and is verifiable (<code>lsmod | grep -c mei_me<\/code> → 0, <code>ls /dev/mei*<\/code> → nothing).<\/li>\n<\/li>\n<li><strong>Disable what the firmware lets you<\/strong> — AMT/vPro/\"Capability Licensing\" in the BIOS menu if it exists (<code>sudo dmidecode -t 2<\/code> to learn your exact model). On consumer SKUs this is usually absent, which is fine: no AMT means no remote ME network stack to attack.<\/li>\n<\/li>\n<li><strong>Keep the ME firmware current<\/strong> via BIOS updates: ME firmware ships inside the Dell UEFI image, and ME CVEs are patched there. This is why <code>docs/10<\/code> puts firmware on a monthly cadence.<\/li>\n<\/li>\n<li><strong>Accept and record the residual risk<\/strong> (that CE is unavailable against a state-level ME compromise). If your threat model includes that adversary, the correct answer is not a software setting; it is different hardware (a machine with a neutralised ME or a CPU without one).<\/li>\n<\/li>\n<\/ol>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>lsmod | grep -E '^mei' || echo \"OK: no MEI modules loaded\"\nls /dev/mei* 2&gt;/dev/null || echo \"OK: no MEI device nodes\"\nsudo dmesg | grep -iE 'mei|ME is' | head<\/code><\/pre><\/div>\n<h2 id=\"3-thunderbolt-and-dma\">3. Thunderbolt and DMA<a class=\"anchor\" href=\"#3-thunderbolt-and-dma\" aria-label=\"link\">#<\/a><\/h2>\n<p>Firmware settings in §1 do most of the work. The OS-side complement:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># If Thunderbolt is genuinely unused (racked/wired machine): blacklist it. Already in the artefact.\nlsmod | grep -c thunderbolt          # 0 == not loaded\n\n# If you need TB ports, keep the driver and manage authorization explicitly:\nsudo apt-get install --no-install-recommends bolt\nboltctl list                          # authorized devices only\nboltctl monitor                       # watch an authorization in real time while you plug something in<\/code><\/pre><\/div>\n<p>Rules of engagement for a dock: you, personally, plug it in; you check <code>boltctl list<\/code> after; anything you did not authorize gets unplugged and the machine is treated as suspect (<code>docs/11<\/code>) if it appeared already authorized. Also note the IOMMU cannot protect you from a device that is <em>allowed<\/em> to be there — \"authorized dock\" is a trust decision, not a security boundary.<\/p>\n<p>DMA protection posture to confirm:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo dmesg | grep -iE 'DMAR|IOMMU' | head -20     # expect DMAR-IR and per-device domains\nls /sys/kernel/iommu_groups/ | wc -l              # groups exist (see docs/00: 17 listed)\ncat /proc/cmdline | tr ' ' '\\n' | grep -E 'iommu|intremap'<\/code><\/pre><\/div>\n<h2 id=\"4-usb-usbguard-with-a-deny-by-default-policy\">4. USB — USBGuard with a deny-by-default policy<a class=\"anchor\" href=\"#4-usb-usbguard-with-a-deny-by-default-policy\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/usbguard/usbguard-daemon.conf\"><code>files/etc/usbguard/usbguard-daemon.conf<\/code><\/a> + <a href=\"#/file/etc/usbguard/rules.conf\"><code>files/etc/usbguard/rules.conf<\/code><\/a>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-conf\"><code># usbguard-daemon.conf (essentials)\nImplicitPolicyTarget=block           # unknown devices are BLOCKED, not allowed\nPresentDevicePolicy=apply-policy\nPresentControllerPolicy=keep\nInsertedDevicePolicy=apply-policy\nAuthorizedDefault=none\nRestoreControllerDeviceState=false\nDeviceRulesWithPort=false\nIPCAllowedUsers=root\nIPCAllowedGroups=root\nIPCAccessControlFiles=yes\nAuditBackend=LinuxAudit          # every decision lands in auditd<\/code><\/pre><\/div>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-conf\"><code># rules.conf — the important property is that this file is TINY and each line is explainable\nallow id 1d6b:0002 serial \"0000:00:14.0\" name \"xHCI Host Controller\" hash \"...\" parent-hash \"...\"\nallow id 1d6b:0003 serial \"0000:00:14.0\" name \"xHCI Host Controller\" hash \"...\" parent-hash \"...\"\n# internal keyboard/touchpad (HID over I2C/USB) — generate these from your own machine, do not copy\nallow id 046d:c31c serial \"\" name \"USB Keyboard\" hash \"...\" parent-hash \"...\"\nblock<\/code><\/pre><\/div>\n<p>Generate the ruleset <strong>from your own hardware<\/strong>, in <code>--dry-run<\/code> mode first:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends usbguard\nsudo usbguard generate-policy &gt; /tmp/usbguard.rules          # with ONLY trusted devices attached\nsudo usbguard generate-policy --no-hash &gt; /tmp/usbguard.nohash.rules   # hashes are the strong form\nsudo diff -u /tmp/usbguard.rules files/etc/usbguard/rules.conf    # review before installing!\nsudo cp /tmp/usbguard.rules /etc/usbguard/rules.conf\nsudo chmod 0600 /etc/usbguard/rules.conf\nsudo usbguard-daemon -d -P -c /etc/usbguard/usbguard-daemon.conf   # foreground test, if unsure\nsudo systemctl enable --now usbguard\nsudo usbguard list-devices<\/code><\/pre><\/div>\n<p>Practical warnings:<\/p>\n<ul>\n<li><strong>Hashes matter.<\/strong> <code>--no-hash<\/code> rules allow any device that claims the same VID/PID/serial — trivially spoofable. Prefer with-hash. But a firmware update to the keyboard changes its hash; re-generate after any peripheral firmware change.<\/li>\n<\/li>\n<li><strong>Test with a second console<\/strong> (physical, and if possible a spare keyboard). A bad ruleset that blocks your only keyboard is a very annoying brick, and the fix requires reaching the machine.<\/li>\n<\/li>\n<li>Use <code>usbguard<\/code>'s <code>--permanent<\/code> for policy and <code>usbguard allow-device &lt;id&gt;<\/code> for one-off authorization <strong>while someone is watching<\/strong>. Never leave an unlimited allow rule in place \"for now\".<\/li>\n<\/li>\n<li>Complement with the kernel knob if you want belt and braces — but read the warning: <code>usbcore.authorized_default=0<\/code> in the kernel cmdline blocks new USB devices at the kernel level, including a keyboard plugged in after boot. Acceptable only on a racked machine with serial console.<\/li>\n<\/li>\n<li>Tier 3: also blacklist <code>usb_storage<\/code>/<code>uas<\/code> (in the artefact, commented) so a rogue USB stick is not even a block device.<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"5-radios\">5. Radios<a class=\"anchor\" href=\"#5-radios\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo rfkill list                       # confirm wifi/bt state\nsudo rfkill block wifi bluetooth       # block at the kernel level\nsudo systemctl mask --now wpa_supplicant NetworkManager 2&gt;/dev/null || true\n# persist: files/etc/modprobe.d/90-blacklist-paranoid.conf blacklists btusb/btintel/bluetooth\n# and (if wired-only) iwlwifi entirely.<\/code><\/pre><\/div>\n<p>If the machine is wired-only, blacklisting <code>iwlwifi<\/code> removes the AX201 from the picture completely, and you can also drop <code>firmware-iwlwifi<\/code> from the install list (<code>docs/02<\/code> §5). Do this only if you have a working alternative path to the machine.<\/p>\n<h2 id=\"6-cameras-microphones-sensors\">6. Cameras, microphones, sensors<a class=\"anchor\" href=\"#6-cameras-microphones-sensors\" aria-label=\"link\">#<\/a><\/h2>\n<ul>\n<li>BIOS kill switches (best) <strong>plus<\/strong> driver blacklist (<code>uvcvideo<\/code>, <code>intel_ish_ipc<\/code>, audio modules) — both are in the artefact, and both are verified by <code>verify-hardening.sh<\/code>.<\/li>\n<\/li>\n<li>There is no legitimate reason for a headless HTTPS server to have a microphone. If your BIOS does not offer a mic kill switch, this is where the blacklist is genuinely load-bearing.<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>ls /dev/video* 2&gt;/dev/null || echo \"OK: no video devices\"\nlsof /dev/snd/* 2&gt;/dev/null | head || true\nlsmod | grep -cE 'snd_sof|snd_hda_intel|uvcvideo'   # 0<\/code><\/pre><\/div>\n<h2 id=\"7-tamper-detection-and-physical-response\">7. Tamper detection and physical response<a class=\"anchor\" href=\"#7-tamper-detection-and-physical-response\" aria-label=\"link\">#<\/a><\/h2>\n<p>You cannot detect everything physical. What you <em>can<\/em> do:<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Indicator<\/th>\n<th style=\"text-align:left\">Where to look<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">Uptime reset (pulled power, case opened, cold boot)<\/td>\n<td style=\"text-align:left\"><code>uptime -s<\/code>, <code>journalctl --list-boots<\/code>, and a boot-counter file you append to at every boot<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Secure Boot turned off<\/td>\n<td style=\"text-align:left\"><code>bootctl status<\/code>, checked daily by <code>verify-hardening.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">New USB/TB device appeared<\/td>\n<td style=\"text-align:left\"><code>usbguard list-devices<\/code>, <code>boltctl list<\/code>, both in the audit trail<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Firmware version changed unexpectedly<\/td>\n<td style=\"text-align:left\"><code>dmidecode -t bios<\/code> captured to <code>/var/log/paranoid/firmware-state<\/code> and diffed monthly<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Header USB missing/replaced<\/td>\n<td style=\"text-align:left\">boot fails; that is the signal<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">LUKS passphrase change<\/td>\n<td style=\"text-align:left\"><code>cryptsetup luksDump<\/code> shows keyslot changes; AIDE+auditd watch the header region; <code>paranoid-boot-record<\/code> logs the keyslot count on every boot (<a href=\"#/file/usr/local/sbin/paranoid-boot-record\"><code>/usr/local/sbin/paranoid-boot-record<\/code><\/a> is the implementation, and it prints its own record when run by hand)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><a href=\"#/file/etc/systemd/system/paranoid-boot-record.service\"><code>files/etc/systemd/system/paranoid-boot-record.service<\/code><\/a> calls <a href=\"#/file/usr/local/sbin/paranoid-boot-record\"><code>/usr/local/sbin/paranoid-boot-record<\/code><\/a> on every start, appending one line to <code>/var/log/paranoid/boots<\/code>:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>2026-10-14T17:44:02Z boot=8d915368-… kernel=6.12.9-amd64 sb=enabled lockdown=confidentiality luks=/dev/nvme0n1p3 keyslots=1<\/code><\/pre><\/div>\n<p>so a boot you did not perform is visible in the log and in the sealed journal. The logic lives in a script rather than in <code>ExecStart<\/code> for a concrete reason: a <code>%<\/code> inside a unit file is a systemd specifier, and an inline <code>printf \"%s\"<\/code> makes the unit refuse to start entirely — <code>systemd-analyze verify<\/code> catches that, and <code>make lint<\/code>/<code>bash -n<\/code> catch script-level mistakes. Test it without waiting for a reboot:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo PARANOID_LOGDIR=/tmp/br /usr/local/sbin/paranoid-boot-record &amp;&amp; cat /tmp/br/boots\nsystemd-analyze verify /etc/systemd/system/paranoid-boot-record.service<\/code><\/pre><\/div>\n<p><strong>Watchdog:<\/strong> if you have a hardware/out-of-band path (a smart plug you can power-cycle remotely, or a second machine that can reach the PDU), tie the \"machine is down\" alarm to it. A server that reboots into a broken state with nobody watching is indistinguishable from a compromised one. Set <code>RuntimeWatchdogSec=20<\/code> in <a href=\"#/file/etc/systemd/system.conf.d/99-paranoid.conf\"><code>files/etc/systemd/system.conf.d/99-paranoid.conf<\/code><\/a> only if your hardware supports it reliably — a spurious watchdog reset on an unsupported platform is a self-inflicted outage.<\/p>\n<h2 id=\"8-verification\">8. Verification<a class=\"anchor\" href=\"#8-verification\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>bash scripts/verify-hardening.sh --section physical\nlsmod | grep -cE 'mei|thunderbolt|uvcvideo|snd_sof|bluetooth|nouveau'   # expect 0\nsudo usbguard list-devices | head\nsudo rfkill list | head\nsudo dmidecode -t bios | grep -E 'Version|Release Date'\nsudo fwupdmgr get-updates 2&gt;/dev/null | head -20 || echo \"run fwupdmgr manually during the monthly cycle\"\nsudo journalctl -t usbguard --since '-7d' | tail<\/code><\/pre><\/div>", "files": ["etc/usbguard/rules.conf", "etc/usbguard/usbguard-daemon.conf"], "toc": [{"lvl": 1, "id": "07-physical-access-firmware-and-peripherals", "text": "07 — Physical access, firmware, and peripherals"}, {"lvl": 2, "id": "1-bios-uefi-checklist-dell-tiger-lake", "text": "1. BIOS/UEFI checklist (Dell, Tiger Lake)"}, {"lvl": 2, "id": "2-intel-management-engine-residual-risk-stated-honestly", "text": "2. Intel Management Engine — residual risk, stated honestly"}, {"lvl": 2, "id": "3-thunderbolt-and-dma", "text": "3. Thunderbolt and DMA"}, {"lvl": 2, "id": "4-usb-usbguard-with-a-deny-by-default-policy", "text": "4. USB — USBGuard with a deny-by-default policy"}, {"lvl": 2, "id": "5-radios", "text": "5. Radios"}, {"lvl": 2, "id": "6-cameras-microphones-sensors", "text": "6. Cameras, microphones, sensors"}, {"lvl": 2, "id": "7-tamper-detection-and-physical-response", "text": "7. Tamper detection and physical response"}, {"lvl": 2, "id": "8-verification", "text": "8. Verification"}], "fences": 12, "tables": 2}, {"slug": "08-isolation-and-virtualization", "title": "08 · Isolation / VM", "html": "<h1 id=\"08-isolation-and-virtualization-instead-of-host-installs\">08 — Isolation and virtualization instead of host installs<a class=\"anchor\" href=\"#08-isolation-and-virtualization-instead-of-host-installs\" aria-label=\"link\">#<\/a><\/h1>\n<p>The rule that overrides convenience in this build:<\/p>\n<blockquote><p><strong>Anything that is not essential to serving HTTPS does not belong in the host's package set.<\/strong> If you need it anyway, run it isolated: a service-sandboxed container (<code>systemd-nspawn<\/code>), a rootless container (podman), or a rootless VM (QEMU/libvirt <em>session<\/em>). The host stays minimal; the risk stays in a box you can throw away.<\/p><\/blockquote>\n<p>Why this is not paranoia theatre: <code>docs/04<\/code>+<code>docs/06<\/code> make host privilege escalation from the web service expensive — but every extra host package is a new set of parsers, a new setuid binary candidate, a new systemd unit, and a new CVE stream you must track. A container's CVE does not automatically become <em>your<\/em> root.<\/p>\n<hr>\n<h2 id=\"1-choosing-the-isolation-level\">1. Choosing the isolation level<a class=\"anchor\" href=\"#1-choosing-the-isolation-level\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Need<\/th>\n<th style=\"text-align:left\">Best tool<\/th>\n<th style=\"text-align:left\">Why not something else<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">Run a small unprivileged network service (a stats page, a PHP app, a DB)<\/td>\n<td style=\"text-align:left\"><strong><code>systemd-nspawn<\/code><\/strong><\/td>\n<td style=\"text-align:left\">It is <code>systemd<\/code> + namespaces + <code>seccomp<\/code> + LSM, ships with <code>systemd-container<\/code>, and reuses the hardening directives you already know. No daemon, no rootful mgmt stack.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Run a CLI tool / build environment / odd runtime<\/td>\n<td style=\"text-align:left\"><strong>rootless <code>podman<\/code><\/strong><\/td>\n<td style=\"text-align:left\">No root daemon at all (unlike rootful Docker), OCI images are reproducible and disposable, and the host's firewall is not silently rewritten.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Run a service that needs a <em>different kernel<\/em> or full kernel-level isolation<\/td>\n<td style=\"text-align:left\"><strong>rootless QEMU/libvirt session<\/strong><\/td>\n<td style=\"text-align:left\">Strongest separation; slower and heavier. Use when the guest itself is untrusted.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">One-shot tool you will use once (firmware updater, PDF tool)<\/td>\n<td style=\"text-align:left\"><strong>container, then delete<\/strong><\/td>\n<td style=\"text-align:left\">Keeps the host list static.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Costs, stated plainly: containers share the kernel, so a kernel-level bug escapes them all — the host kernel hardening in <code>docs/03<\/code>/<code>docs/04<\/code> is what you are trusting. VMs are heavier (RAM, CPU overcommit, storage), need their own update cadence, and a rootless VM image is not automatically minimal.<\/p>\n<h2 id=\"2-prefer-systemd-nspawn-for-the-one-small-service-case\">2. Prefer <code>systemd-nspawn<\/code> for the \"one small service\" case<a class=\"anchor\" href=\"#2-prefer-systemd-nspawn-for-the-one-small-service-case\" aria-label=\"link\">#<\/a><\/h2>\n<p>Minimal, daemon-free, and every isolation knob is a systemd directive you can read:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends systemd-container debootstrap\nsudo mkdir -p /var/lib/machines\nsudo debootstrap --variant=minbase --include=ca-certificates,openssl trixie \\\n     /var/lib/machines/app01 https://deb.debian.org/debian\nsudo systemd-nspawn -D /var/lib/machines/app01 --setenv=TERM=xterm passwd root<\/code><\/pre><\/div>\n<p><a href=\"#/file/etc/systemd/nspawn/app01.nspawn\"><code>files/etc/systemd/nspawn/app01.nspawn<\/code><\/a> (installed to <code>/etc/systemd/nspawn/<\/code>) is the isolation policy:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-ini\"><code>[Exec]\nBoot=yes\nCapability=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_KILL\nPrivateUsers=pick                     # maps the container's root to an unprivileged host uid\nNotifyReady=yes\nSystemCallFilter=@system-service\nSystemCallFilter=~@privileged @resources @obsolete @mount @debug @cpu-raw-io\nRestrictNamespaces=~user\n\n[Files]\nPrivate=yes\nReadOnly=yes                         # container rootfs is read-only...\nVolatile=state                       # ...with /var as a per-instance writable tmpfs on disk\nBindReadOnly=/etc/ssl/certs:/etc/ssl/certs\n\n[Network]\nPrivate=yes                          # its own netns, and NO address unless you add one\n# Zone=internal                      # optional: put it in a firewalld zone (we do not run firewalld)\n# Port=tcp:8443:443                  # only if you deliberately publish a port\n\n[Security]\nNoNewPrivileges=yes<\/code><\/pre><\/div>\n<p>Key properties to keep:<\/p>\n<ul>\n<li><code>Private=yes<\/code> in <code>[Files]<\/code> + <code>ReadOnly=yes<\/code>: the container cannot see <code>/etc<\/code>, <code>/root<\/code>, or the webroot. Bind-mount <strong>only<\/strong> the specific directory it needs, read-only if possible.<\/li>\n<\/li>\n<li><code>Private=yes<\/code> in <code>[Network]<\/code> + no <code>Port=<\/code> line = no network at all. Add the <em>narrowest<\/em> possible publication when you need one; never <code>Port=<\/code> a management port to the WAN.<\/li>\n<\/li>\n<li><code>PrivateUsers=pick<\/code> maps container root to an unprivileged host uid. **If the service must bind a low port**, that is a design smell — listen high inside, and redirect/publish from the host.<\/li>\n<\/li>\n<li>The container has its <strong>own update story<\/strong>: `sudo systemd-nspawn -D /var/lib/machines/app01 -- \\ bash -c 'apt-get update &amp;&amp; apt-get -y upgrade'<code>. It is in <\/code>docs/10`'s weekly routine. A container nobody updates is just a nicer-looking vulnerable service.<\/li>\n<\/li>\n<\/ul>\n<p>Start and inspect:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo systemctl enable --now systemd-nspawn@app01\nsudo machinectl list\nsudo systemctl status systemd-nspawn@app01\nsudo nsenter -t $(machinectl show app01 -p Leader --value) -n ss -tulpn   # what it listens on<\/code><\/pre><\/div>\n<h2 id=\"3-rootless-podman-if-you-want-oci-images\">3. Rootless <code>podman<\/code>, if you want OCI images<a class=\"anchor\" href=\"#3-rootless-podman-if-you-want-oci-images\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends podman slirp4netns fuse-overlayfs\nsudo loginctl enable-linger app              # a dedicated unprivileged user\nsudo -u app podman run --rm -it docker.io/library/debian:trixie bash<\/code><\/pre><\/div>\n<p>Hardened run defaults, kept in <a href=\"#/file/etc/containers/containers.conf\"><code>files/etc/containers/containers.conf<\/code><\/a> (installed from the repo):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-ini\"><code>[containers]\ndefault_capabilities = [\"CAP_NET_BIND_SERVICE\"]   # drop everything else\nno_hosts = true                                    # /etc/hosts is not mounted\nipcns = \"private\"\npidns = \"private\"\nutsns = \"private\"\nuserns = \"auto\"\ncgroupns = \"private\"\ndefault_sysctls = [\n  \"net.ipv4.ping_group_range=0 0\",\n  \"net.ipv4.ip_unprivileged_port_start=0\",\n]\nenv_host = false\ninit = true\nseccomp_profile = \"default\"<\/code><\/pre><\/div>\n<p>And the image discipline that makes this worth it:<\/p>\n<ul>\n<li><strong>Pin by digest, not tag<\/strong>: <code>podman run docker.io/library/nginx@sha256:...<\/code>. Tags move; digests do not.<\/li>\n<\/li>\n<li><strong>Rootless only.<\/strong> Never start <code>podman.service<\/code> (the rootful socket) and never hand it to a web app (<code>/run/podman/podman.sock<\/code> is root-equivalent). Put this in your head as an absolute.<\/li>\n<\/li>\n<li><strong>No <code>--privileged<\/code>, no <code>-v /:/host<\/code>, no <code>/dev<\/code> passthrough.<\/strong> Each of those turns a container into a host root shell. If your image <em>requires<\/em> them, the image is the problem.<\/li>\n<\/li>\n<li><strong>Own the storage<\/strong>: put container volumes on the encrypted <code>/srv<\/code> or <code>/var<\/code> LVs, with the same <code>nosuid,nodev<\/code> mount options.<\/li>\n<\/li>\n<li><strong>Egress<\/strong>: rootless podman with <code>slirp4netns<\/code>/<code>pasta<\/code> is subject to your host egress rules. That is the desired behaviour — a container cannot bypass <code>docs/05<\/code> §4.<\/li>\n<\/li>\n<\/ul>\n<blockquote><p><strong>Interaction with <code>docs/04<\/code> §3:<\/strong> <code>user.max_user_namespaces=0<\/code> and <code>kernel.unprivileged_userns_clone=0<\/code> are deliberately <em>not<\/em> set, because rootless containers need them. If you choose to set them (Tier 3 \"no unprivileged namespaces\"), you must give up rootless podman/nspawn. Decide once, and let <code>verify-hardening.sh<\/code> enforce the pair consistently instead of letting the two settings contradict each other.<\/p><\/blockquote>\n<h2 id=\"4-rootless-vms-qemu-session-when-you-need-a-real-kernel-boundary\">4. Rootless VMs (<code>qemu:///session<\/code>), when you need a real kernel boundary<a class=\"anchor\" href=\"#4-rootless-vms-qemu-session-when-you-need-a-real-kernel-boundary\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends qemu-system-x86 qemu-utils libvirt-daemon-system \\\n     virtinst libosinfo-bin\n# Use the SESSION (rootless) instance, not the system one:\nvirsh --connect qemu:///session list --all<\/code><\/pre><\/div>\n<p>Policy for this host:<\/p>\n<ul>\n<li><strong><code>qemu:///session<\/code> only.<\/strong> The system instance puts a root daemon (<code>libvirtd<\/code>/<code>virtqemud<\/code>) in your trust boundary and makes <code>/var/run/libvirt/libvirt-sock<\/code> root-equivalent. Not on a paranoid host.<\/li>\n<\/li>\n<li><strong>Disk encryption per guest<\/strong>: give each VM its own LV (<code>/dev/vg0/vm-&lt;name&gt;<\/code>) and put LUKS inside it, or rely on the host's LUKS for the datastore. Either is defensible; document which you chose.<\/li>\n<\/li>\n<li><strong>No USB/TB passthrough<\/strong> unless the use case demands it, and then only a specific device by <code>vendor:product<\/code> and only while needed (<code>docs/07<\/code> §3).<\/li>\n<\/li>\n<li><strong>Networking<\/strong>: <code>-netdev user<\/code> (slirp) by default = NAT with no inbound and no bridge. A bridge (<code>virbr0<\/code>) requires <code>net.ipv4.ip_forward=1<\/code> and the explicit forward rules in <code>docs/05<\/code> §3 — re-enable them <em>only<\/em> for the guest subnets you name.<\/li>\n<\/li>\n<li><strong>Resources<\/strong>: cap guests (<code>MemoryMax=<\/code>, <code>CPUQuota=<\/code>) in their systemd units so a runaway guest cannot DoS the web server. The host's job is serving HTTPS; everything else is a guest.<\/li>\n<\/li>\n<li><strong>The guest's own hardening<\/strong> is a separate install (<code>docs/02<\/code>+<code>docs/04<\/code> apply inside it). Use it to <em>test<\/em> this repo's preseed before ever running it on bare metal — that is the ideal use of a VM here and the reason <code>preseed/paranoid-preseed.cfg<\/code> is safe to iterate on:<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># inside the rootless VM, exercise the preseed end-to-end\nqemu-img create -f qcow2 /var/lib/libvirt/images/test.qcow2 20G\nvirt-install --connect qemu:///session --name test --memory 4096 --vcpus 2 \\\n  --disk path=/var/lib/libvirt/images/test.qcow2,format=qcow2 \\\n  --cdrom ~/debian-13-netinst.iso --network user --graphics none --console pty \\\n  --extra-args \"auto=true priority=critical url=file:///cdrom/paranoid-preseed.cfg\"<\/code><\/pre><\/div>\n<h2 id=\"5-what-must-never-run-on-this-host-regardless-of-isolation\">5. What must never run on this host (regardless of isolation)<a class=\"anchor\" href=\"#5-what-must-never-run-on-this-host-regardless-of-isolation\" aria-label=\"link\">#<\/a><\/h2>\n<ul>\n<li>A <strong>rootful container daemon<\/strong> (Docker/podman socket) — root-equivalent and it rewrites nftables.<\/li>\n<\/li>\n<li>A <strong>CI runner<\/strong> (GitLab/GitHub runner, Jenkins) — arbitrary code execution by design.<\/li>\n<\/li>\n<li>Anything that listens on a <strong>management port exposed to the internet<\/strong> (webmin, cPanel, Jupyter, panels). If you need a UI, it goes behind the WireGuard plane and mTLS (<code>docs/06<\/code> §5).<\/li>\n<\/li>\n<li><strong>Build toolchains<\/strong> (<code>build-essential<\/code>, <code>pip<\/code>, <code>npm<\/code>, <code>cargo<\/code>) — do the build in a throwaway container and ship the artifact. A compiler on a web host converts memory bugs into <code>system()<\/code> calls.<\/li>\n<\/li>\n<li>A <strong>desktop stack<\/strong> (X11/Wayland, NetworkManager, bluez, PulseAudio) — each one grew up assuming single-user local use.<\/li>\n<\/li>\n<li><strong>Monitoring agents from vendors<\/strong> unless <em>you<\/em> audited the binary; prefer pulling metrics (node_exporter is small but still a host binary — run it in a container with a read-only mount of <code>/proc<\/code> and no network beyond the scrape target, or skip it and read <code>journalctl<\/code>+<code>sysstat<\/code>).<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"6-verification\">6. Verification<a class=\"anchor\" href=\"#6-verification\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>machinectl list                                  # containers you expect, and only those\nsystemctl is-enabled systemd-nspawn@app01        # enabled if you use it\nsudo -u app podman ps --format '{{.Names}} {{.Image}}'\nsudo ss -tulpn | grep -E 'podman|docker|libvirt'  # expect: nothing listening on a public address\nsudo ss -x | grep -c libvirt-sock                 # rootful libvirt would show here\nsysctl net.ipv4.ip_forward                        # 0 unless you built a bridge on purpose\nsudo nft list chain inet filter forward | tail -5 # policy drop + only your explicit guest rules\nbash scripts/verify-hardening.sh --section isolation<\/code><\/pre><\/div>\n<p>If <code>ip_forward=1<\/code> or a <code>virbr0<\/code> exists and you did <strong>not<\/strong> intend a bridge, that is a finding: some libvirt/virt-manager default installation flipped it. Turn it off and re-check <code>docs/05<\/code> §3.<\/p>", "files": ["etc/systemd/nspawn/app01.nspawn", "etc/containers/containers.conf", "etc/apache2/instances/site1.conf", "etc/apache2/instances/site1.envvars", "etc/systemd/system/apache2@.service"], "toc": [{"lvl": 1, "id": "08-isolation-and-virtualization-instead-of-host-installs", "text": "08 — Isolation and virtualization instead of host installs"}, {"lvl": 2, "id": "1-choosing-the-isolation-level", "text": "1. Choosing the isolation level"}, {"lvl": 2, "id": "2-prefer-systemd-nspawn-for-the-one-small-service-case", "text": "2. Prefer systemd-nspawn for the \"one small service\" case"}, {"lvl": 2, "id": "3-rootless-podman-if-you-want-oci-images", "text": "3. Rootless podman, if you want OCI images"}, {"lvl": 2, "id": "4-rootless-vms-qemu-session-when-you-need-a-real-kernel-boundary", "text": "4. Rootless VMs (qemu:///session), when you need a real kernel boundary"}, {"lvl": 2, "id": "5-what-must-never-run-on-this-host-regardless-of-isolation", "text": "5. What must never run on this host (regardless of isolation)"}, {"lvl": 2, "id": "6-verification", "text": "6. Verification"}], "fences": 8, "tables": 1}, {"slug": "09-software-policy", "title": "09 · Software policy", "html": "<h1 id=\"09-only-necessary-software-the-decision-procedure\">09 — \"Only necessary software\": the decision procedure<a class=\"anchor\" href=\"#09-only-necessary-software-the-decision-procedure\" aria-label=\"link\">#<\/a><\/h1>\n<p>This is the policy that keeps the machine from drifting into a general-purpose server over 18 months. Every package on the host must pass this test, and the test has receipts (commands you can run).<\/p>\n<hr>\n<h2 id=\"1-the-five-questions-in-order\">1. The five questions, in order<a class=\"anchor\" href=\"#1-the-five-questions-in-order\" aria-label=\"link\">#<\/a><\/h2>\n<p>Ask them in this order and stop at the first \"yes\".<\/p>\n<ol>\n<li><strong>Can the host do it without new software?<\/strong> <code>systemd<\/code> already provides: timers (cron), socket activation, <code>systemd-networkd<\/code> (DHCP/static), <code>systemd-resolved<\/code> or <code>unbound<\/code> (DNS), <code>journald<\/code> (logging/rotation), <code>nftables<\/code> (firewalling), <code>systemd-cryptsetup<\/code> (encryption), <code>systemd-nspawn<\/code> (containers), <code>systemd-oomd<\/code> (memory pressure). A startling number of \"must-install\" packages are redundant daemons.<\/li>\n<\/li>\n<li><strong>Is it already installed as a dependency of something essential?<\/strong> Check before adding: <code>dpkg -l | grep -E '^ii' | wc -l<\/code> and <code>apt-cache rdepends &lt;pkg&gt;<\/code>. Do not install a second tool for a job an existing dependency already does.<\/li>\n<\/li>\n<li><strong>Can it run isolated instead of on the host?<\/strong> → <code>docs/08<\/code>. Container or rootless VM. Default answer for databases, application runtimes, build tools, and anything that ships its own updater.<\/li>\n<\/li>\n<li><strong>Is it needed only once?<\/strong> → install, use, purge <strong>in the same session<\/strong>: <code>sudo apt-get install --no-install-recommends fwupd &amp;&amp; sudo fwupdmgr ... &amp;&amp; sudo apt-get purge --auto-remove fwupd<\/code> This is the documented pattern for firmware updates in this repo.<\/li>\n<\/li>\n<li><strong>Otherwise<\/strong>: install it with <code>--no-install-recommends<\/code>, in the fewest packages possible, record <em>why<\/em> in <code>/etc/paranoid/package-justifications<\/code>, and re-review at the quarterly audit (<code>docs/10<\/code>).<\/li>\n<\/li>\n<\/ol>\n<p>The justification file is not bureaucracy — it is what lets you (or future-you) tell the difference between \"load-bearing\" and \"someone installed it at 2 a.m. and forgot\".<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo install -d -m 0700 /etc/paranoid\nsudo tee -a /etc/paranoid/package-justifications &gt;/dev/null &lt;&lt;'EOF'\n# package                     date        justification\n# fwupd                       2026-10-14  monthly Dell BIOS/EC firmware updates (installed on demand, purged after)\n# unbound                     2026-10-14  local DNSSEC-validating resolver for the host (docs/04 §11)\n# sshguard                    2026-10-14  SSH brute-force response, nftables backend (docs/05 §6)\nEOF<\/code><\/pre><\/div>\n<h2 id=\"2-apt-hygiene-that-enforces-the-policy-mechanically\">2. Apt hygiene that enforces the policy mechanically<a class=\"anchor\" href=\"#2-apt-hygiene-that-enforces-the-policy-mechanically\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/apt/apt.conf.d/99-paranoid\"><code>files/etc/apt/apt.conf.d/99-paranoid<\/code><\/a> (installed in <code>docs/04<\/code> §9) already sets:<\/p>\n<ul>\n<li><code>APT::Get::Install-Recommends \"false\"<\/code> — the single most effective anti-bloat switch on Debian. <strong>Know the cost<\/strong>: some packages genuinely rely on a Recommends for functionality (e.g. a driver's firmware, a <code>-doc<\/code> you wanted). When something misbehaves right after install, <code>apt-get install --no-install-recommends -o APT::Get::Install-Recommends=true &lt;missing-recommend&gt;<\/code> is the targeted fix — not flipping the global switch back.<\/li>\n<\/li>\n<li><code>APT::Get::Install-Suggests \"false\"<\/code>, <code>AllowUnauthenticated false<\/code>, <code>Check-Valid-Until true<\/code>.<\/li>\n<\/li>\n<li>Sources restricted to <code>main<\/code> + <code>non-free-firmware<\/code> (no <code>contrib<\/code>, no backports, no third-party repos).<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># what is installed, and what is only there as a dependency\napt-mark showmanual | wc -l ; apt-mark showmanual | sort\n# orphans you can remove\nsudo deborphan 2&gt;/dev/null || sudo apt-get autoremove --purge -s\n# does anything actually use this?\napt-cache rdepends --installed &lt;package&gt; | tail -n +3\n# why is this file here?\ndpkg -S /usr/bin/&lt;thing&gt;<\/code><\/pre><\/div>\n<p><strong>Rules for sources:<\/strong> never add a third-party apt repo to this host. If a vendor only ships a <code>.deb<\/code> repo, that vendor goes in a container or a VM, or you build the package yourself on a different machine and install it after verifying its signature/hash. A PPA-style repo on a public server is a permanent, silent root path.<\/p>\n<h2 id=\"3-verdicts-for-the-things-people-usually-want\">3. Verdicts for the things people usually want<a class=\"anchor\" href=\"#3-verdicts-for-the-things-people-usually-want\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Want<\/th>\n<th style=\"text-align:left\">Verdict<\/th>\n<th style=\"text-align:left\">Notes<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">PHP / Python / Node app<\/td>\n<td style=\"text-align:left\"><strong>container or VM<\/strong> (<code>docs/08<\/code>)<\/td>\n<td style=\"text-align:left\">Never <code>mod_php<\/code>/<code>libapache2-mod-php<\/code>, never a host <code>python3 -m http.server<\/code> in production.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">MariaDB / PostgreSQL<\/td>\n<td style=\"text-align:left\"><strong>container or VM<\/strong> with its own LUKS volume<\/td>\n<td style=\"text-align:left\">The DB is the data. Give it its own isolation and its own backup/verify loop. Do not <code>bind-address 0.0.0.0<\/code>.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Docker / rootful podman<\/td>\n<td style=\"text-align:left\"><strong>no<\/strong><\/td>\n<td style=\"text-align:left\">Rewrites nftables, gives a root-equivalent socket, drags in a daemon. Rootless podman covers most needs (<code>docs/08<\/code> §3).<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Git (server)<\/td>\n<td style=\"text-align:left\"><strong>SSH + bare repos + <code>git-shell<\/code><\/strong>, not a web UI<\/td>\n<td style=\"text-align:left\">If you need a forge, put it in a VM; Gitea/GitLab are full applications with their own CVE stream.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>certbot<\/code><\/td>\n<td style=\"text-align:left\"><strong>yes, on host<\/strong><\/td>\n<td style=\"text-align:left\">It holds your TLS keys and needs to be the thing that reloads Apache. Minimal, purpose-built.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>nginx<\/code> alongside Apache<\/td>\n<td style=\"text-align:left\"><strong>no<\/strong><\/td>\n<td style=\"text-align:left\">Two web servers = two parsers, two rule sets, two update streams. Pick one.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>fail2ban<\/code><\/td>\n<td style=\"text-align:left\">optional<\/td>\n<td style=\"text-align:left\">Python + daemon. <code>sshguard<\/code> + kernel <code>meter<\/code> rules cap the same buckets (<code>docs/05<\/code> §6).<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>fwupd<\/code><\/td>\n<td style=\"text-align:left\"><strong>on demand<\/strong><\/td>\n<td style=\"text-align:left\">Purge after the firmware cycle; it pulls <code>polkit<\/code> and a daemon.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>lynis<\/code>, <code>nmap<\/code>, <code>sslyze<\/code>, <code>testssl<\/code><\/td>\n<td style=\"text-align:left\"><strong>on demand, or on your workstation<\/strong><\/td>\n<td style=\"text-align:left\">Auditing tools on the audited host can be used against you. Run scanners from a client machine.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>git<\/code>, <code>curl<\/code>, <code>wget<\/code>, <code>vim<\/code><\/td>\n<td style=\"text-align:left\"><strong>on demand<\/strong><\/td>\n<td style=\"text-align:left\">Convenient, but <code>curl<\/code>+<code>git<\/code> on a host receiving untrusted input is a nice exfil/download pair from a compromised service. Install when updating, purge when done, at Tier 3.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>rsyslog<\/code><\/td>\n<td style=\"text-align:left\"><strong>no<\/strong><\/td>\n<td style=\"text-align:left\"><code>journald<\/code> covers it; we ship logs via <code>systemd-journal-upload<\/code> instead.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>cron<\/code> / <code>anacron<\/code><\/td>\n<td style=\"text-align:left\"><strong>no<\/strong><\/td>\n<td style=\"text-align:left\"><code>systemd<\/code> timers do the same job with better logging and sandboxing (<code>docs/04<\/code> §8 uses timers).<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>unattended-upgrades<\/code><\/td>\n<td style=\"text-align:left\"><strong>yes<\/strong><\/td>\n<td style=\"text-align:left\">Security-only, no automatic reboot (<code>docs/04<\/code> §9).<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Desktop environment<\/td>\n<td style=\"text-align:left\"><strong>never<\/strong><\/td>\n<td style=\"text-align:left\">See <code>docs/08<\/code> §5.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>sudo<\/code> alternatives (doas)<\/td>\n<td style=\"text-align:left\">unnecessary<\/td>\n<td style=\"text-align:left\"><code>sudo<\/code> with the drop-in in <code>docs/04<\/code> §1 is audited, logged, and understood.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Monitoring agent (vendor)<\/td>\n<td style=\"text-align:left\"><strong>container<\/strong>, ideally<\/td>\n<td style=\"text-align:left\">Or pull-based metrics; a push agent with root is a persistent backdoor by design.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Backups (<code>restic<\/code>, <code>borg<\/code>)<\/td>\n<td style=\"text-align:left\"><strong>yes, on host<\/strong><\/td>\n<td style=\"text-align:left\">It must read the data; put the repository key offline and use append-only on the remote. See <code>docs/10<\/code> §5.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"4-adding-software-safely-the-workflow\">4. Adding software safely — the workflow<a class=\"anchor\" href=\"#4-adding-software-safely-the-workflow\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># 1. What IS this package? Size, deps, files, and provenance.\napt-cache show &lt;pkg&gt; | grep -E '^(Package|Version|Depends|Recommends|Section|Priority)'\napt-get install --no-install-recommends -s &lt;pkg&gt; | grep -E '^Inst' | wc -l    # dependency count, dry run\napt-get install --no-install-recommends -s &lt;pkg&gt; | grep '^Inst'               # and WHO\ngrep -r '&lt;pkg&gt;' /etc/paranoid/package-justifications 2&gt;/dev/null\n\n# 2. Would it open a port, install a unit, add a setuid binary, or add a cron entry?\napt-get install --no-install-recommends -s &lt;pkg&gt; &gt;/dev/null\ndpkg-deb -c /var/cache/apt/archives/&lt;pkg&gt;*.deb 2&gt;/dev/null | grep -E 'bin/|\\.service|init|sudoers|cron'\ndpkg-query -W -f='${Package}\\n' &lt;pkg&gt; &amp;&amp; find /usr/bin /usr/sbin -perm -4000 -newer /var/lib/dpkg/status\n\n# 3. Install it, then answer \"what changed?\" before you walk away\nsudo apt-get install --no-install-recommends &lt;pkg&gt;\nsudo systemctl list-units --state=running --no-pager | tail -10      # new daemon? should be one you wanted\nsudo ss -tulpn | grep -v '127.0.0.1\\|::1'                            # new listener? DROP it or firewall it\nsudo aa-status | tail -5\nsudo nft list ruleset | grep -c &lt;newport&gt;\n\n# 4. Record and baseline\necho \"# $(date -u +%F) &lt;pkg&gt; — &lt;one-line reason&gt;\" | sudo tee -a /etc/paranoid/package-justifications\nsudo aide --update --config /etc/aide/aide.conf &amp;&amp; sudo mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db<\/code><\/pre><\/div>\n<p>If step 3 shows a new listener you did not intend, either firewall it off (add a <code>drop<\/code> counter rule so you see attempts) or remove the package. Do not \"leave it for now\" — that is how a hardened host becomes an average one.<\/p>\n<h2 id=\"5-removing-software-safely\">5. Removing software safely<a class=\"anchor\" href=\"#5-removing-software-safely\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get purge --auto-remove &lt;pkg&gt;          # purge, not remove: config files outlive 'remove'\nsudo systemctl --now disable &lt;pkg&gt; 2&gt;/dev/null || true\nsudo find /etc -name '*&lt;pkg&gt;*' -print           # purge leftovers\nsudo find /var -name '*&lt;pkg&gt;*' -print\nsudo deborphan\n# then rebuild the AIDE baseline, because \"removed\" is also a change worth detecting\nsudo aide --update --config /etc/aide/aide.conf<\/code><\/pre><\/div>\n<p>Two gotchas that bite people:<\/p>\n<ul>\n<li><strong>Purging a library<\/strong> can silently remove the reason a service worked. Check <code>apt-get purge -s<\/code> first and read the list of packages it wants to remove <em>with<\/em> it.<\/li>\n<\/li>\n<li><strong><code>--auto-remove<\/code><\/strong> can remove dependencies you <em>did<\/em> want, if they were pulled in only by the package you are deleting. Read the dry run.<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"6-keeping-the-policy-honest\">6. Keeping the policy honest<a class=\"anchor\" href=\"#6-keeping-the-policy-honest\" aria-label=\"link\">#<\/a><\/h2>\n<p>The policy decays unless something checks it. Add these to the monthly routine (<code>docs/10<\/code> §4):<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>apt-mark showmanual | sort &gt; /var/log/paranoid/pkgs-manual-$(date +%F).txt\ndiff &lt;(cat /var/log/paranoid/pkgs-manual-*.txt | tail -1) &lt;(apt-mark showmanual|sort) || true\nsudo ss -tulpn | grep -v '127.0.0.1\\|::1'            # compare against the list in docs/05 §7\nls -la /etc/systemd/system/*.d/ /etc/systemd/system/  # new drop-ins you did not write = a finding<\/code><\/pre><\/div>\n<p><code>verify-hardening.sh --section packages<\/code> automates the comparison of the manual package list against the approved list in this document, and flags both <strong>additions<\/strong> (drift) and <strong>missing essentials<\/strong> (someone removed something load-bearing).<\/p>", "files": ["etc/paranoid/README.md"], "toc": [{"lvl": 1, "id": "09-only-necessary-software-the-decision-procedure", "text": "09 — \"Only necessary software\": the decision procedure"}, {"lvl": 2, "id": "1-the-five-questions-in-order", "text": "1. The five questions, in order"}, {"lvl": 2, "id": "2-apt-hygiene-that-enforces-the-policy-mechanically", "text": "2. Apt hygiene that enforces the policy mechanically"}, {"lvl": 2, "id": "3-verdicts-for-the-things-people-usually-want", "text": "3. Verdicts for the things people usually want"}, {"lvl": 2, "id": "4-adding-software-safely-the-workflow", "text": "4. Adding software safely — the workflow"}, {"lvl": 2, "id": "5-removing-software-safely", "text": "5. Removing software safely"}, {"lvl": 2, "id": "6-keeping-the-policy-honest", "text": "6. Keeping the policy honest"}], "fences": 5, "tables": 1}, {"slug": "10-audit-and-maintenance", "title": "10 · Audit &amp; maintenance", "html": "<h1 id=\"10-operating-the-machine-audit-and-maintenance-runbook\">10 — Operating the machine: audit and maintenance runbook<a class=\"anchor\" href=\"#10-operating-the-machine-audit-and-maintenance-runbook\" aria-label=\"link\">#<\/a><\/h1>\n<p>A hardened machine that nobody updates is a ticking clock. This is the cadence — pick the schedule and put it in a calendar, because none of it happens by itself.<\/p>\n<hr>\n<h2 id=\"1-the-cadence-at-a-glance\">1. The cadence at a glance<a class=\"anchor\" href=\"#1-the-cadence-at-a-glance\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">When<\/th>\n<th style=\"text-align:left\">Task<\/th>\n<th style=\"text-align:left\">Artefact / command<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\"><strong>Daily (automated)<\/strong><\/td>\n<td style=\"text-align:left\">AIDE check, <code>debsums<\/code> check, journal seal check, boot-record append, cert expiry check<\/td>\n<td style=\"text-align:left\"><code>aide-check.timer<\/code>, <code>debsums-check.timer<\/code>, <code>paranoid-boot-record.service<\/code>, <code>paranoid-cert-check.timer<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>Daily (5 min, human)<\/strong><\/td>\n<td style=\"text-align:left\">Read the security log. Yes, actually read it.<\/td>\n<td style=\"text-align:left\"><code>journalctl -p warning --since today<\/code>, <code>ausearch -ts today \\| tail<\/code>, <code>modsec_audit.log<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>Weekly<\/strong><\/td>\n<td style=\"text-align:left\">Security updates, service restarts, log growth, firewall drop review<\/td>\n<td style=\"text-align:left\">§3<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>Monthly<\/strong><\/td>\n<td style=\"text-align:left\">Firmware check, full package review, backup restore test, AIDE baseline review<\/td>\n<td style=\"text-align:left\">§4<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>Quarterly<\/strong><\/td>\n<td style=\"text-align:left\">Key rotation review, config review against this repo, restore drill, external scan<\/td>\n<td style=\"text-align:left\">§5<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>After every change<\/strong><\/td>\n<td style=\"text-align:left\">Re-run verification, re-baseline AIDE<\/td>\n<td style=\"text-align:left\"><code>verify-hardening.sh<\/code> + <code>aide --update<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"2-safety-rules-for-doing-any-of-this-remotely\">2. Safety rules for doing any of this remotely<a class=\"anchor\" href=\"#2-safety-rules-for-doing-any-of-this-remotely\" aria-label=\"link\">#<\/a><\/h2>\n<ol>\n<li><strong>Two shells minimum<\/strong>: one in which you run changes, one sitting idle. If the first dies, the second is your escape.<\/li>\n<\/li>\n<li><strong>nftables<\/strong>: <code>nft -c -f<\/code> before <code>nft -f<\/code>, and keep <code>/var/backups/nft.&lt;stamp&gt;.ruleset<\/code> regenerated after every working change (<code>docs/05<\/code> §2).<\/li>\n<\/li>\n<li><strong>sshd<\/strong>: never reload/restart over the session you are using without a second shell verified as working. Test with <code>sudo sshd -t<\/code> first, and prefer <code>reload<\/code>.<\/li>\n<\/li>\n<li><strong>Apache<\/strong>: <code>apache2ctl configtest<\/code> before <code>systemctl reload apache2<\/code>. The shipped <code>harden-apache.sh<\/code> does this and rolls back on failure — let it.<\/li>\n<\/li>\n<li><strong>Kernel/LUKS/systemd changes<\/strong>: <code>systemd-analyze verify<\/code>, and reboot at a time you can reach the console or has an OOB path (<code>docs/07<\/code> §7).<\/li>\n<\/li>\n<li>The idle shell is not enough for a <em>lockout<\/em>: if nftables drops your IP, no shell helps. Know your recovery path (physical console, IPMI-less laptop = a person physically present, or a rescue ISO with the LUKS header USB).<\/li>\n<\/li>\n<\/ol>\n<h2 id=\"3-weekly-routine-about-20-minutes\">3. Weekly routine (about 20 minutes)<a class=\"anchor\" href=\"#3-weekly-routine-about-20-minutes\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># — 1. what does the update actually contain? —\nsudo apt-get update\napt list --upgradable\nsudo apt-listchanges --apt 2&gt;/dev/null | head -50     # read the changelogs, not just the count\nsudo apt-get --simulate upgrade | grep -E '^(Inst|Conf)' | wc -l\n\n# — 2. security first, then the rest —\nsudo unattended-upgrade -d                            # security-only, per docs/04 §9\nsudo apt-get upgrade                                  # non-security, decided by you\nsudo apt-get full-upgrade -s                          # remove/install changes: READ THIS before running it\n\n# — 3. what needs restarting because of library updates? —\nsudo needrestart -b\nsudo systemctl list-units --state=failed\n# restart in order of least risk; Apache last, and only after configtest\nsudo systemctl restart &lt;service&gt;; sudo systemctl reload apache2\n\n# — 4. did anything change in a way we care about? —\nsudo aide --check --config /etc/aide/aide.conf | tail -20\nsudo debsums -s 2&gt;&amp;1 | head\njournalctl -p err --since '-7d' | grep -v -E 'audit|usbguard' | head -30\njournalctl -k --since '-7d' | grep -i nft-drop | sort | uniq -c | sort -rn | head\nsudo ausearch -k modules -ts week | tail\nsudo ss -tulpn | grep -v '127.0.0.1\\|::1'\ndf -h / /var /var/log; journalctl --disk-usage<\/code><\/pre><\/div>\n<p>Decide explicitly, every week, about <strong>reboots<\/strong>: a kernel or microcode update is not applied until you reboot. <code>needrestart -b<\/code> tells you what is pending. Plan the reboot, verify afterwards with <code>uptime -s<\/code> and <code>verify-hardening.sh<\/code>.<\/p>\n<h2 id=\"4-monthly-routine-about-an-hour\">4. Monthly routine (about an hour)<a class=\"anchor\" href=\"#4-monthly-routine-about-an-hour\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># — 1. firmware (install-on-demand pattern, docs/09 §1 q4) —\nsudo apt-get install --no-install-recommends fwupd\nsudo fwupdmgr refresh --force &amp;&amp; sudo fwupdmgr get-updates\nsudo fwupdmgr update                    # includes Dell BIOS/EC and, if offered, the UEFI dbx revocation list\nsudo systemctl reboot                   # firmware updates need a clean reboot; verify from the BIOS screen\nsudo apt-get purge --auto-remove fwupd  # per policy: no daemon left behind\n\n# — 2. package-list review (drift detection) —\napt-mark showmanual | sort &gt; /var/log/paranoid/pkgs-manual-$(date +%F).txt\ndiff /var/log/paranoid/pkgs-manual-$(ls -1 /var/log/paranoid/pkgs-manual-*.txt | tail -2 | head -1) \\\n     /var/log/paranoid/pkgs-manual-$(date +%F).txt\ngrep -c '^[^#]' /var/log/paranoid/pkgs-manual-$(date +%F).txt\n\n# — 3. listeners and units you did not create —\nsudo ss -tulpn | grep -v '127.0.0.1\\|::1'\nls -la /etc/systemd/system/ /etc/systemd/system/*.d/ | grep -v '^total'\nsystemd-delta --type=extended | head -40\n\n# — 4. audit rules and apparmor still loaded/unchanged —\nsudo auditctl -s | grep -E 'enabled|lost|backlog'\nsudo aa-status | head -5\nsudo apparmor_parser --skip-cache --skip-kernel-load -Q /etc/apparmor.d/usr.sbin.apache2 2&gt;&amp;1 | head\n\n# — 5. TLS and certificates —\nsudo certbot certificates\nsudo certbot renew --dry-run\nopenssl s_client -connect 127.0.0.1:443 -servername &lt;domain&gt; &lt;/dev/null 2&gt;/dev/null \\\n  | openssl x509 -noout -subject -dates -issuer\n\n# — 6. backups: an untested backup is not a backup (see §5) —\nsudo restic snapshots --latest 3\n\n# — 7. verify the build is still the build —\nsudo bash scripts/verify-hardening.sh --tier 2<\/code><\/pre><\/div>\n<p>Anything <code>verify-hardening.sh<\/code> reports as FAIL is either (a) drift you must explain and revert, or (b) a deliberate change that must be reflected in this repo and re-baselined. There is no third category; \"it's fine, I'll get to it\" is how the machine stops matching the guide.<\/p>\n<h2 id=\"5-backups-design-keys-and-the-drill\">5. Backups (design, keys, and the drill)<a class=\"anchor\" href=\"#5-backups-design-keys-and-the-drill\" aria-label=\"link\">#<\/a><\/h2>\n<p><strong>What to back up:<\/strong> <code>/etc<\/code> (all of it — it <em>is<\/em> the configuration), <code>/etc/letsencrypt<\/code>, <code>/var/www<\/code>, <code>/var/lib/&lt;app&gt;<\/code>, <code>/etc/paranoid<\/code>, and the <strong>LUKS header backup<\/strong> (stored offline, never in the backup repository <em>if<\/em> the repository is remote). What not to back up: <code>/var/log<\/code> (ship it instead), <code>/var/cache<\/code>, <code>/tmp<\/code>, anything reproducible via apt.<\/p>\n<p><strong>How:<\/strong> <code>restic<\/code> or <code>borg<\/code> to a <strong>remote, append-only<\/strong> repository (SFTP target or object storage with object-lock). Append-only matters: ransomware and a compromised root can delete normal remote backups.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends restic\nsudo restic -r sftp:backup@host:/srv/restic-repo init         # run once, key goes offline immediately\nsudo tee /etc/paranoid/backup.env &gt;/dev/null &lt;&lt;'EOF'\n# 0600 root:root. The repository password lives HERE and in your offline vault — nowhere else.\n# RESTIC_PASSWORD_FILE=/root/.restic-pass\nEOF\nsudo chmod 0600 /etc/paranoid/backup.env\nsudo cp files/etc/systemd/system/paranoid-backup.{service,timer} /etc/systemd/system/\nsudo systemctl enable --now paranoid-backup.timer<\/code><\/pre><\/div>\n<p><strong>The drill (quarterly, non-negotiable):<\/strong> restore <code>/etc<\/code> and one site into a <em>rootless VM<\/em> on this machine (<code>docs/08<\/code> §4) or on your workstation, boot it, and confirm the site serves. Then delete the VM. A restore you have never performed is a hypothesis.<\/p>\n<h2 id=\"6-recovery-procedures-you-must-have-written-down-on-paper-offline\">6. Recovery procedures you must have written down (on paper, offline)<a class=\"anchor\" href=\"#6-recovery-procedures-you-must-have-written-down-on-paper-offline\" aria-label=\"link\">#<\/a><\/h2>\n<ol>\n<li><strong>Lost LUKS passphrase<\/strong>: header backup + passphrase = only options. P2 (detached header): if the USB is gone, the data is gone — restore from backup and reinstall.<\/li>\n<\/li>\n<li><strong>Machine will not boot after a kernel update<\/strong>: boot the previous kernel from the systemd-boot menu (or a rescue ISO), then <code>apt-get install --reinstall linux-image-&lt;old&gt;<\/code>, and re-sign the UKI.<\/li>\n<\/li>\n<li><strong>Locked out by nftables<\/strong>: physical console → <code>sudo nft flush ruleset<\/code>, then restore from <code>/var/backups/nft.&lt;stamp&gt;.ruleset<\/code>.<\/li>\n<\/li>\n<li><strong>Locked out by sshd config<\/strong>: physical console, or boot the rescue ISO and fix <code>/etc/ssh/sshd_config.d/<\/code>.<\/li>\n<\/li>\n<li><strong>Secure Boot keys lost<\/strong>: firmware → clear Secure Boot keys, re-enrol from the offline backup in <a href=\"#/file/keys/README.md\"><code>files/keys/README.md<\/code><\/a>. Without the backup: reset the firmware to factory and start <code>docs/03<\/code> §2 again.<\/li>\n<\/li>\n<li><strong>Suspected compromise<\/strong>: stop here and go to <code>docs/11<\/code>. Do <strong>not<\/strong> \"clean\" the machine.<\/li>\n<\/li>\n<\/ol>\n<p>Keep 1–6 printed, in the same place as the recovery USB, the LUKS header backup and the LUKS passphrase (or its location). A runbook that only exists on the machine it repairs is not a runbook.<\/p>\n<h2 id=\"7-what-healthy-looks-like-baseline-snapshot\">7. What \"healthy\" looks like (baseline snapshot)<a class=\"anchor\" href=\"#7-what-healthy-looks-like-baseline-snapshot\" aria-label=\"link\">#<\/a><\/h2>\n<p>Save this output after the build is complete; diff against it monthly.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>{\n  echo \"== $(date -u +%FT%TZ) ==\"\n  uptime -s ; cat /proc/cmdline ; uname -r\n  cat /sys/kernel/security/lockdown\n  sudo bootctl status | grep -iE 'secure boot|signer'\n  sudo cryptsetup status cryptroot 2&gt;/dev/null || sudo cryptsetup status $(lsblk -no NAME /dev/nvme0n1p3 | head -1)\n  sudo nft list ruleset | sha512sum\n  sudo ss -tulpn | grep -v '127.0.0.1\\|::1'\n  lsmod | awk '{print $1}' | sort\n  dpkg -l | awk '/^ii/{print $2, $3}' | sort | sha512sum\n  sudo systemd-analyze security apache2 | tail -3\n  findmnt -o TARGET,FSTYPE,OPTIONS\n  ls -l /etc/paranoid/ /var/log/paranoid/ 2&gt;/dev/null\n} | sudo tee /var/log/paranoid/baseline-$(date +%F).txt<\/code><\/pre><\/div>\n<p>That file plus the AIDE database plus the sealed journal are your three independent \"what changed?\" witnesses. If all three agree nothing changed and a service is behaving oddly, look at the service; if they disagree, look at the machine.<\/p>", "files": ["etc/systemd/system/aide-check.timer", "etc/systemd/system/debsums-check.timer", "etc/systemd/system/paranoid-backup.timer", "etc/systemd/system/paranoid-cert-check.timer", "usr/local/sbin/paranoid-boot-record", "usr/local/sbin/paranoid-cert-check", "etc/systemd/system/paranoid-backup.service", "etc/systemd/system/paranoid-boot-record.service", "etc/systemd/system/paranoid-cert-check.service", "etc/systemd/system/aide-check.service", "etc/systemd/system/debsums-check.service", "etc/systemd/system/kernel-modules-lock.service", "etc/systemd/system/remount-boot-ro.service"], "toc": [{"lvl": 1, "id": "10-operating-the-machine-audit-and-maintenance-runbook", "text": "10 — Operating the machine: audit and maintenance runbook"}, {"lvl": 2, "id": "1-the-cadence-at-a-glance", "text": "1. The cadence at a glance"}, {"lvl": 2, "id": "2-safety-rules-for-doing-any-of-this-remotely", "text": "2. Safety rules for doing any of this remotely"}, {"lvl": 2, "id": "3-weekly-routine-about-20-minutes", "text": "3. Weekly routine (about 20 minutes)"}, {"lvl": 2, "id": "4-monthly-routine-about-an-hour", "text": "4. Monthly routine (about an hour)"}, {"lvl": 2, "id": "5-backups-design-keys-and-the-drill", "text": "5. Backups (design, keys, and the drill)"}, {"lvl": 2, "id": "6-recovery-procedures-you-must-have-written-down-on-paper-offline", "text": "6. Recovery procedures you must have written down (on paper, offline)"}, {"lvl": 2, "id": "7-what-healthy-looks-like-baseline-snapshot", "text": "7. What \"healthy\" looks like (baseline snapshot)"}], "fences": 4, "tables": 1}, {"slug": "11-incident-response", "title": "11 · Incident response", "html": "<h1 id=\"11-incident-response-compromise-lockout-or-something-is-wrong\">11 — Incident response (compromise, lockout, or \"something is wrong\")<a class=\"anchor\" href=\"#11-incident-response-compromise-lockout-or-something-is-wrong\" aria-label=\"link\">#<\/a><\/h1>\n<p>Rules first, because they are counter-intuitive and you will be under pressure:<\/p>\n<ol>\n<li><strong>Do not power off.<\/strong> The memory of a running system is the best evidence you will ever have (processes, keys, network state, unlinked files). Powering off destroys it (and enables cold-boot attacks in the opposite direction only if the attacker is the one with physical access).<\/li>\n<\/li>\n<li><strong>Do not \"clean\" the machine.<\/strong> Removing the obvious backdoor leaves the actual access path in place and tells the attacker you noticed. Rebuild is the default response to confirmed compromise.<\/li>\n<\/li>\n<li><strong>Do not trust tools on the machine<\/strong> for the first pass. Use <code>busybox<\/code>-style statics on a USB or read-only media if you suspect <code>ls<\/code>, <code>ps<\/code>, <code>ss<\/code>, <code>auditd<\/code>, or the kernel itself are hooked.<\/li>\n<\/li>\n<li><strong>Preserve in order of volatility<\/strong>: memory → network → processes → disk → logs → firmware.<\/li>\n<\/li>\n<li><strong>Write down timestamps and everything you did.<\/strong> Your own actions become the confusing part of the timeline.<\/li>\n<\/li>\n<\/ol>\n<hr>\n<h2 id=\"1-triage-is-it-actually-a-compromise\">1. Triage — is it actually a compromise?<a class=\"anchor\" href=\"#1-triage-is-it-actually-a-compromise\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Signal<\/th>\n<th style=\"text-align:left\">Likely explanation<\/th>\n<th style=\"text-align:left\">Investigate<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">Unexpected AIDE diff in <code>/usr/bin<\/code><\/td>\n<td style=\"text-align:left\">package upgrade (check <code>dpkg.log<\/code>) <strong>or<\/strong> tampering<\/td>\n<td style=\"text-align:left\"><code>dpkg --verify<\/code>, <code>debsums -s<\/code>, <code>journalctl -u apt<\/code>, compare with the <code>.deb<\/code> in <code>/var/cache<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">New listener on a public address<\/td>\n<td style=\"text-align:left\">something you installed (<code>docs/09<\/code> §4 step 3) or a backdoor<\/td>\n<td style=\"text-align:left\"><code>ss -tulpn<\/code> → owner PID → <code>/proc/&lt;pid&gt;/{cmdline,exe,maps,environ}<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>nft-drop-out<\/code> storm<\/td>\n<td style=\"text-align:left\">misconfigured app trying to reach the internet <strong>or<\/strong> C2 attempts<\/td>\n<td style=\"text-align:left\"><code>journalctl -k \\| grep nft-drop-out \\| tail -100<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">auditd <code>execve<\/code> for root you cannot explain<\/td>\n<td style=\"text-align:left\">legitimate admin action (did <em>you<\/em> do it?) or privesc<\/td>\n<td style=\"text-align:left\"><code>ausearch -k root-exec -ts recent<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Kernel oops / spontaneous reboot<\/td>\n<td style=\"text-align:left\">hardware, bad microcode, driver <strong>or<\/strong> deliberate crash-then-persist<\/td>\n<td style=\"text-align:left\"><code>journalctl -b -1 -p err<\/code>, <code>dmesg<\/code>, <code>mcelog<\/code>/EDAC (<code>igen6_edac<\/code> is present on this box)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">mod_security hits with 200s<\/td>\n<td style=\"text-align:left\">CRS on legitimate traffic <strong>or<\/strong> an actual exploitation attempt<\/td>\n<td style=\"text-align:left\"><code>modsec_audit.log<\/code>, correlate with access log and app logs<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">USBGuard block events you did not create<\/td>\n<td style=\"text-align:left\">someone touched the machine<\/td>\n<td style=\"text-align:left\"><code>journalctl -t usbguard<\/code>, <code>ausearch -k usbguard<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The most common answer to \"am I hacked?\" is: no, it is a package upgrade, a log you did not read, or an app you installed last month. Check those three before escalating.<\/p>\n<h2 id=\"2-if-you-decide-it-is-a-real-incident-containment\">2. If you decide it is a real incident — containment<a class=\"anchor\" href=\"#2-if-you-decide-it-is-a-real-incident-containment\" aria-label=\"link\">#<\/a><\/h2>\n<p>Goal: stop the bleeding without destroying evidence.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># 1. free the evidence first: memory snapshot if you can get one out\nsudo dd if=/proc/kcore of=/dev/null bs=1M   # (no-op placeholder: see note below)\n\n# Realistic options on this hardware, in order of preference:\n#  a) If you can reach the machine physically: use an external Linux with LiME/AVML on a USB,\n#     or at minimum `eevdf`-safe collection: `sudo systemctl stop apache2` (freezes app state,\n#     keeps memory), then image.\n#  b) Network-only: capture traffic and state before cutting the network:\nsudo ss -tulpn &gt; /var/log/paranoid/ir-ss.txt\nsudo ss -tanp &gt;&gt; /var/log/paranoid/ir-ss.txt\nsudo lsof -nP -i &gt;&gt; /var/log/paranoid/ir-lsof.txt 2&gt;/dev/null\nsudo ps auxfww &gt; /var/log/paranoid/ir-ps.txt\nsudo cat /proc/*/cmdline | tr '\\0' ' ' &gt;&gt; /var/log/paranoid/ir-cmdlines.txt 2&gt;/dev/null\nsudo iptables-save &gt; /dev/null 2&gt;&amp;1; sudo nft list ruleset &gt; /var/log/paranoid/ir-nft.txt\nsudo cp /var/log/apache2/*.log /var/log/paranoid/ 2&gt;/dev/null\nsudo ausearch --start recent &gt; /var/log/paranoid/ir-audit.txt\nsudo journalctl --since '-7d' -o
