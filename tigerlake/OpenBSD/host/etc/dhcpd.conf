#	/etc/dhcpd.conf — gateway
#
#	Validate:  dhcpd -n vlan20 vlan30     (dbg, no daemon, config check)
#	Apply:     rcctl reload dhcpd	       (re-reads the file)
#
#	USERS and GUEST are served; SRV, DMZ and MGMT are statically addressed
#	(guests get their address from install.conf, hosts from
#	/etc/hostname.<if>), so there is deliberately no subnet declaration for
#	them — dhcpd(8) will only ever answer on the two interfaces below.

option domain-name "lab.example.org";
# The lab resolver is the dns VM (unbound), not the gateway: the gateway's
# unwind(8) binds to localhost only.  See docs/03-service-map.md.
option domain-name-servers 10.10.50.11;
# NTP is the gateway itself — see /etc/ntpd.conf.  Per-subnet overrides below
# point clients at their own segment's address so the traffic stays local.
option ntp-servers 10.10.20.1;

default-lease-time 3600;		# 1 hour
max-lease-time 7200;

# ISC-derived dhcpd: without this it refuses to serve addresses for which it
# believes another server is authoritative, which is the behaviour we want on
# a shared segment but not here.
authoritative;

# The lab has no DNS updates (nsd uses flat zone files, and the zone file is
# in the repository — see host/var/nsd/zones/).
ddns-update-style none;

# Extra option: point clients at the gateway's own SNMP/trap collector?  No —
# the monitoring VM polls outward.  Nothing to add here.

# ------------------------------------------------------------------ USERS
subnet 10.10.20.0 netmask 255.255.255.0 {
	option routers 10.10.20.1;
	option subnet-mask 255.255.255.0;

	# Dynamic pool.  Keep it out of the static range used by the addressing
	# plan (10.10.20.1-99 are for infrastructure and reservations).
	range 10.10.20.100 10.10.20.199;

	# Clients may also fall back to the gateway for the lab zone if the dns
	# VM is down; the gateway's nsd(8) is authoritative for it.
	option domain-name-servers 10.10.50.11, 10.10.10.1;
	option ntp-servers 10.10.20.1;

	# Wired clients on this segment belong to the lab domain.
	option domain-name "lab.example.org";
}

# ------------------------------------------------------------------ GUEST
subnet 10.10.30.0 netmask 255.255.255.0 {
	option routers 10.10.30.1;
	option subnet-mask 255.255.255.0;
	range 10.10.30.100 10.10.30.250;

	# Guests resolve through the dns VM as well; their pf rules allow only
	# that one destination inside the lab.
	option domain-name-servers 10.10.50.11;
	option ntp-servers 10.10.30.1;
	option domain-name "guest.lab.example.org";

	# Shorter leases: guest devices come and go.
	default-lease-time 1800;
	max-lease-time 3600;
}

# ------------------------------------------------------------------ PROVISIONING
# The install network (vmd switch "install", veb2, 10.10.99.0/24).
#
# A guest booted from bsd.rd gets its lease here.  The two options at the
# bottom are what trigger autoinstall(8): a lease whose boot file is named
# "auto_install" makes the kernel run the installer unattended, and the
# installer then fetches /install.conf from next-server (httpd(8) on the
# gateway, port 80 of 10.10.99.1).
#
# Only machines being provisioned belong here.  pf rules restrict the subnet
# to DHCP, DNS, NTP and HTTP towards the gateway, so an installing guest
# cannot reach the lab — or the internet — through it.
subnet 10.10.99.0 netmask 255.255.255.0 {
	option routers 10.10.99.1;
	option subnet-mask 255.255.255.0;

	# Answered explicitly so the installer's DNS question is satisfied even
	# though every URL in install.conf is an IP literal.
	option domain-name-servers 10.10.99.1;
	option domain-name "install.lab.example.org";

	next-server 10.10.99.1;
	filename "auto_install";

	# One batch of guests at a time; see scripts/provision-vm.sh.
	range 10.10.99.100 10.10.99.150;
	default-lease-time 600;
	max-lease-time 1800;
}
# ------------------------------------------------------------------ reservations
# Fixed addresses for hardware that has to be found by name (switches, the AP,
# printers).  These live outside the dynamic ranges above.
#
#host ap      { hardware ethernet 02:00:5e:00:00:0a; fixed-address 10.10.20.10; }
#host sw-core { hardware ethernet 02:00:5e:00:00:0b; fixed-address 10.10.20.11; }
#host printer { hardware ethernet 02:00:5e:00:00:0c; fixed-address 10.10.20.20; }

# ------------------------------------------------------------------ DHCPv6
# OpenBSD base has no DHCPv6 server.  IPv6 on the client segments is handled
# by SLAAC via radvd(8); if you need DHCPv6 (stateful address assignment or
# handing out v6 resolvers), run dhcp6d/isc-dhcp from packages on the dns VM.
