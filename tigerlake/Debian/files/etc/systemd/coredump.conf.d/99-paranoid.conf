# /etc/systemd/coredump.conf.d/99-paranoid.conf
# A core dump of a privileged process contains keys, passwords and heap data. We do not want any,
# anywhere, ever. Combined with /etc/security/limits.d/99-paranoid.conf and fs.suid_dumpable=0.
# Reload: systemctl daemon-reexec

[Coredump]
Storage=none
ProcessSizeMax=0
ExternalSizeMax=0
JournalSizeMax=1M
MaxUse=0
KeepFree=0
