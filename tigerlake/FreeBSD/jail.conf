# ==========================================================================
# jail.conf — FreeBSD jails using ONLY the base system (jail(8), jail.conf(5))
# ==========================================================================
# Install to:  /etc/jail.conf          (post-install.sh installs it for you)
# Howto:       JAILS.txt in this directory — read it once (§1-§4) and you can
#              build, boot and enter both jails below. No bastille/iocage/ezjail.
#
# This file defines two example jails that match rc.conf's bridge0
# (10.0.100.0/24, host = .1) and pf.conf §8:
#   www — CLASSIC ("fat") jail: its own full copy of the base system
#   db  — THIN jail: only /etc, /var, /tmp, /usr/local are its own; the base
#         OS is mounted read-only (nullfs) from one shared template
#
# NOTHING here runs by itself: jails start only when you run `jail -c` /
# `service jail start`, or after you set jail_enable="YES" in rc.conf
# (§6 below). jail(8) refuses to start a jail whose path is missing.
#
# COMMANDS (details in JAILS.txt §4):
#   doas jail -f /etc/jail.conf -e :        # list the jails this file defines
#   doas jail -f /etc/jail.conf -c www      # start one
#   doas jail -f /etc/jail.conf -r www      # stop one
#   doas jail -f /etc/jail.conf -cv db      # start, verbose (prints every step)
#   doas jexec www /bin/sh                  # run a command inside a running jail
#   doas service jail start|stop|restart|status www    # via rc (needs jail_enable)
#
# SYNTAX TRAPS (jail.conf(5) — learn them once):
#   * every assignment ends with ';' and values are "quoted"
#   * append with "+=" — a second plain "=" REPLACES the earlier value
#   * ${path} and $name are substituted per jail by jail(8); 'single quotes'
#     would switch substitution off
#   * jail names may NOT contain '.'  —  a jail block is: name { params }
# ==========================================================================

# --------------------------------------------------------------------------
# 1. LAYOUT — the only two lines to edit if you want jails elsewhere
# --------------------------------------------------------------------------
# $jroot must not contain spaces (the exec.* commands below rely on it).
$jroot    = "/usr/local/jails";           # parent directory of all jails
$template = "$jroot/template";            # shared base.txz tree for thin jails
                                           # (see JAILS.txt §1 — build it first)

# --------------------------------------------------------------------------
# 2. DEFAULTS — the '*' block applies to EVERY jail defined below;
#    a jail block can override anything from here.
# --------------------------------------------------------------------------
* {
    # Directory of the jail: /usr/local/jails/www, /usr/local/jails/db, ...
    path = "$jroot/$name";

    # ---- boot the jail like a little machine ----
    exec.system_user = "root";             # host-side commands run as root
    exec.jail_user   = "root";             # in-jail commands run as root
    exec.clean;                            # start with a clean environment
    exec.start = "/bin/sh /etc/rc";                # "power on"
    exec.stop  = "/bin/sh /etc/rc.shutdown jail";  # "power off" (graceful)
    # Every line the jail's rc prints lands HERE, on the host — the fastest
    # way to debug a jail that won't come up (JAILS.txt §11):
    exec.consolelog = "/var/log/jail_${name}_console.log";

    # ---- devices ----
    mount.devfs;                           # mount /dev inside the jail
    # ruleset 4 = devfsrules_jail (/etc/defaults/devfs.rules): hides disks,
    # dri, etc. A jail that sees disk devices can write OUTSIDE its root.
    devfs_ruleset = "4";

    # ---- switches that are OFF in the kernel by default (uncomment in a
    #      jail block when you need them) ----
    # allow.raw_sockets = "true";          # ping/traceroute FROM inside
    # allow.set_hostname = "true";         # let the jail change its hostname
    # allow.mount = "true";                # jail mounts itself (needs enforce_statfs < 2)
    # sysvmsg = "new"; sysvsem = "new"; sysvshm = "new";   # private SysV IPC

    enforce_statfs = "2";                  # statfs/fstatfs visibility: 0 = all mounts,
                                           # 1 = only mounts below the jail root,
                                           # 2 = only the mount holding the jail root
                                           # (2 is the FreeBSD default)
    stop.timeout = "30";                   # seconds for services to shut down
}

# --------------------------------------------------------------------------
# 3. CLASSIC ("fat") JAIL — one full copy of the base system per jail
# --------------------------------------------------------------------------
# Build its filesystem ONCE first (JAILS.txt §2):
#     doas mkdir -p /usr/local/jails/www
#     doas tar -xpf base.txz -C /usr/local/jails/www     # or: zfs clone, §8 of JAILS.txt
# Cost: ~0.5-1 GB per jail. Base updates are independent per jail.
www {
    # path comes from the '*' defaults above (= $jroot/$name)
    host.hostname = "www.jail";            # this is uname -n inside the jail
    ip4.addr = "bridge0|10.0.100.10";      # address lives on rc.conf's jail bridge

    # Fail fast if the base system was never extracted (empty jail trap):
    exec.prepare = "test -x ${path}/bin/sh";
    exec.prepare += "mkdir -p ${path}/dev";     # mount.devfs needs this dir
    # Give the jail a resolv.conf ONCE — later you may edit it by hand and it
    # will stay (the copy only happens while the file is missing/empty):
    exec.prepare += "test -s ${path}/etc/resolv.conf || cp /etc/resolv.conf ${path}/etc/resolv.conf";
}

# --------------------------------------------------------------------------
# 4. THIN JAIL — base OS from the template, read-only; the jail OWNS only
#    etc/ var/ tmp/ root/ home/ usr/local/
# --------------------------------------------------------------------------
# No extraction needed at all: `jail -f /etc/jail.conf -c db` builds the
# skeleton below automatically on first start (JAILS.txt §3).
# Cost: a few MB + whatever the jail writes. Base updates happen once, on
# $template — every thin jail sees them after a restart.
db {
    # path comes from the '*' defaults above (= $jroot/$name)
    host.hostname = "db.jail";
    ip4.addr = "bridge0|10.0.100.20";

    # ---- first start builds the skeleton; every start re-checks it ----
    # (fail fast if the template was never built — JAILS.txt §1)
    exec.prepare = "test -d ${template}/bin";
    exec.prepare += "mkdir -p ${path}/bin ${path}/dev ${path}/home ${path}/lib ${path}/libexec ${path}/media ${path}/mnt ${path}/proc ${path}/rescue ${path}/root ${path}/sbin ${path}/tmp";
    exec.prepare += "mkdir -p ${path}/usr ${path}/usr/bin ${path}/usr/games ${path}/usr/home ${path}/usr/include ${path}/usr/lib ${path}/usr/libexec ${path}/usr/local ${path}/usr/sbin ${path}/usr/share";
    exec.prepare += "mkdir -p ${path}/var ${path}/var/audit ${path}/var/crash ${path}/var/cron ${path}/var/cron/tabs ${path}/var/db ${path}/var/empty ${path}/var/log ${path}/var/mail ${path}/var/run ${path}/var/spool ${path}/var/spool/mqueue ${path}/var/spool/clientmqueue ${path}/var/tmp";
    exec.prepare += "chmod 1777 ${path}/tmp ${path}/var/tmp";
    # /etc is deliberately NOT mkdir'd: it is copied whole from the template
    # (so the jail always gets a complete /etc), then given a resolv.conf:
    exec.prepare += "test -d ${path}/etc || cp -R ${template}/etc ${path}/etc";
    exec.prepare += "test -s ${path}/etc/resolv.conf || cp /etc/resolv.conf ${path}/etc/resolv.conf";

    # ---- the thin part: base system mounted read-only from the template.
    #      Runs BEFORE the jail is created; unmounted in reverse on stop.
    #      No commas in these lines (comma = list separator in jail.conf). ----
    mount  = "${template}/bin         ${path}/bin         nullfs ro";
    mount += "${template}/sbin        ${path}/sbin        nullfs ro";
    mount += "${template}/lib         ${path}/lib         nullfs ro";
    mount += "${template}/libexec     ${path}/libexec     nullfs ro";
    mount += "${template}/rescue      ${path}/rescue      nullfs ro";
    mount += "${template}/usr/bin     ${path}/usr/bin     nullfs ro";
    mount += "${template}/usr/sbin    ${path}/usr/sbin    nullfs ro";
    mount += "${template}/usr/lib     ${path}/usr/lib     nullfs ro";
    mount += "${template}/usr/libexec ${path}/usr/libexec nullfs ro";
    mount += "${template}/usr/share   ${path}/usr/share   nullfs ro";
}

# --------------------------------------------------------------------------
# 5. OPTIONAL EXTRAS — copy into a jail block when you need them
# --------------------------------------------------------------------------
# a) Share ONE /usr/local between thin jails (read-only window on the
#    template's /usr/local — install packages there once, all jails see them):
#    mount += "${template}/usr/local ${path}/usr/local nullfs ro";
#    (from the host: doas pkg -r $template install <pkg> — see JAILS.txt §6)
#    (default above keeps /usr/local per jail — that is real isolation)
#
# b) More read-only dirs some software wants:
#    mount += "${template}/usr/include ${path}/usr/include nullfs ro";   # compilers
#    mount += "${template}/usr/src     ${path}/usr/src     nullfs ro";
#
# c) VNET jail (its own network stack + interface) instead of the shared-IP
#    design above. Base system ships the helpers and a worked example in
#    /usr/share/examples/jails/ (README, VIMAGE, jib, jng, jail.xxx.conf):
#      cp /usr/share/examples/jails/jib /usr/sbin/
#      vnet;
#      vnet.interface = "e0b_$name";
#      exec.prestart += "/usr/sbin/jib addm $name em0";   # bridge the epair
#      exec.poststop += "/usr/sbin/jib destroy $name";
#    Remove the ip4.addr line from that jail (the address moves inside),
#    read the README in that directory first (jib manages its own bridge —
#    don't hand it an interface rc.conf already gave to bridge0), and see
#    pf.conf §8 scenario D — it applies unchanged.
#
# d) Keep per-jail definitions in separate files instead of editing this one:
#    mkdir -p /etc/jail.conf.d    then uncomment (a glob may match zero files):
#    .include "/etc/jail.conf.d/*.conf";
#
# e) Nested/dependent jails: see `depend` and hierarchical jails in jail(8).

# --------------------------------------------------------------------------
# 6. TURNING JAILS ON AT BOOT (rc.conf) + DAY-2 CHEAT-SHEET
# --------------------------------------------------------------------------
# Everything above stays off until you opt in (JAILS.txt §4):
#     doas sysrc jail_enable="YES"
#     doas sysrc jail_list="www db"           # only these at boot
#                                             # (empty/'' = ALL jails below)
#     doas sysrc jail_parallel_start="YES"    # optional: start them together
#
# Day-to-day:
#   doas service jail start www        # = jail -f /etc/jail.conf -c www
#   doas service jail stop www
#   doas service jail restart db
#   doas service jail status           # = jls -N
#   doas service jail console www      # root shell inside (host root only)
#   jls                                # running jails: jid, name, path
#   jls -j db                          # one jail's details
#   doas jexec db /bin/sh              # command of your choice inside
#   jexec db ps aux                    # only this jail's processes
#   tail -f /var/log/jail_db_console.log   # the jail's rc output (on the host)
#
# TRAPS:
#   * host services bound to "all addresses" (wildcard) also claim the jails'
#     IPs — jail(8) says to pin them (sshd ListenAddress, etc). This repo's
#     rc.conf already runs sendmail=NONE and sshd off, so you start clean.
#   * do not cd into a jail directory on the host: it blocks the nullfs
#     unmount at `jail -r` (see JAILS.txt §11).
#   * jail ≠ VM: same kernel. Keep the HOST updated (freebsd-update + reboot);
#     LOCKDOWN.txt/SECURITY-LOGS.txt cover the host side.
# ==========================================================================
