#	/etc/sysctl.conf — gateway
#
#	Read by rc(8) at boot.  Verify every key exists for your release with
#	sysctl(8): an unknown key makes rc print "sysctl: unknown oid".
#	Show everything with: sysctl -a | less

# ---------------------------------------------------------------- forwarding
net.inet.ip.forwarding=1		# required: this box routes
net.inet6.ip6.forwarding=1
net.inet.ip.mforwarding=0		# no multicast routing
net.inet6.ip6.mforwarding=0

# Don't emit ICMP redirects: the lab is strictly subnet-partitioned and
# redirects only help hosts on the same L2 segment reach each other.
net.inet.ip.redirect=0
net.inet6.ip6.redirect=0

# ------------------------------------------------------------------ interface queues
net.inet.ip.ifq.maxlen=2048
net.inet.ip6.ifq.maxlen=2048

# ------------------------------------------------------------------ IP stack
net.inet.tcp.recvspace=65536
net.inet.tcp.sendspace=65536
net.inet.udp.recvspace=65536
net.inet.icmp.icmplim=200
net.inet6.icmp6.rediraccept=0
net.inet6.icmp6.nd6_maxnudhint=1

# ------------------------------------------------------------------ IPsec (iked)
net.inet.esp.enable=1
net.inet.ah.enable=1
net.inet.ipcomp.enable=0
net.inet.ipip.allow=1

# ------------------------------------------------------------------ state/table limits
net.pf.request_maxcount=65535		# ioctl(2) buffer for large rulesets
kern.maxfiles=40960
kern.maxfilesperproc=10240

# ------------------------------------------------------------------ console hygiene
# Only leave DDB reachable from the console; a remote panic/hang should not
# hand anyone a debugger.
machdep.kbdreset=0

# Uncomment once the second gateway is installed and CARP is set up:
#net.inet.carp.preempt=1
#net.inet.carp.log=2
