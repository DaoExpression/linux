# /etc/apache2/conf-available/tls-hardening.conf
# Global TLS policy: TLS 1.3 only, strong ciphers, post-quantum hybrid key exchange.
# See docs/06 §4 for the reasoning, the client-compatibility cost, and the OCSP/2026 note.
#
# Requires: mod_ssl, OpenSSL 3.5 (Debian 13 trixie). Check with: openssl version
# Validate:  sudo apache2ctl configtest
# Verify (off-box):  sslscan <server>:443 ; openssl s_client -connect <server>:443 -tls1_2

# ---------------------------------------------------------------------------
# Protocol: 1.3 only. This removes CBC/RC4/3DES, renegotiation, weak DH groups,
# downgrade attacks and RSA key exchange (no forward secrecy) in one line.
# ---------------------------------------------------------------------------
SSLProtocol -all +TLSv1.3

# Client-compatibility escape hatch: if you must serve legacy clients, use the *next* line instead
# and list only AEAD ECDHE suites. Never enable TLS 1.1/1.0.
#SSLProtocol -all +TLSv1.3 +TLSv1.2
#SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

# TLS 1.3 cipher suites (Apache has no directive for these other than SSLOpenSSLConfCmd).
SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# ---------------------------------------------------------------------------
# Key exchange: post-quantum hybrid FIRST, then classical curves.
# X25519MLKEM768 is the ML-KEM-768 + X25519 hybrid from OpenSSL 3.5. "Harvest now, decrypt later"
# is a real threat for long-lived TLS sessions/logs, and this costs nothing measurable.
# ---------------------------------------------------------------------------
SSLOpenSSLConfCmd Groups X25519MLKEM768:X25519:P-384:P-256
SSLOpenSSLConfCmd Curves X25519MLKEM768:X25519:P-384
SSLOpenSSLConfCmd SignatureAlgorithms ecdsa_secp256r1_sha256:ed25519:ecdsa_secp384r1_sha384:rsa_pss_rsae_sha256
SSLOpenSSLConfCmd MinProtocol TLSv1.3
SSLOpenSSLConfCmd Options -SessionTicket,-Compression

# ---------------------------------------------------------------------------
# Session and renegotiation policy
# ---------------------------------------------------------------------------
SSLCompression off
SSLSessionTickets off        # no ticket keys to rotate or leak; FS comes from the KEX
SSLHonorCipherOrder off      # no-op for 1.3; kept explicit so audits do not wonder
SSLOptions +StrictRequire    # a vhost without a certificate refuses to serve instead of failing open
SSLInsecureRenegotiation off
SSLRenegBufferSize 131072
# Client certificates are NOT requested globally; admin vhosts turn them on explicitly (docs/06 §5).
SSLVerifyClient none
SSLVerifyDepth 2

# ---------------------------------------------------------------------------
# OCSP stapling - DISABLED ON PURPOSE (2026)
# ---------------------------------------------------------------------------
# Let's Encrypt discontinued its OCSP responders in 2025; stapling a Let's Encrypt certificate now
# staples nothing. Leave this commented unless your CA still runs OCSP, and if you enable it, watch
# that the stapling cache does not force extra outbound connections your egress allowlist blocks.
#SSLUseStapling on
#SSLStaplingCache shmcb:/run/apache2/stapling(128000)
#SSLStaplingResponderTimeout 5
#SSLStaplingReturnResponderErrors off
#SSLStaplingStandardCacheTimeout 3600

# ---------------------------------------------------------------------------
# HSTS lives in headers-hardening.conf (it is a header, and it belongs with the other headers).
# Certificates, keys and per-vhost TLS material live in the vhost files, not here.
# ---------------------------------------------------------------------------
