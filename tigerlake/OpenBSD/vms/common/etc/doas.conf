#	/etc/doas.conf — lab guest baseline
#
#	Validated on every invocation; check with "doas -C /etc/doas.conf" after
#	editing.  A syntax error denies everything, including the operations the
#	lab scripts need.
#
#	Guests are administered over SSH by a human with a wheel account, so the
#	policy is short on purpose: the whole point of a guest is that you can
#	rebuild it from this repository instead of repairing it by hand.

# wheel gets a password-protected root shell.
permit persist :wheel

# Service management and local firewall reloads, without a password: these are
# the operations the deploy script and the operators perform constantly.
permit nopass keepenv :wheel cmd /usr/sbin/rcctl
permit nopass keepenv :wheel cmd /sbin/pfctl
permit nopass keepenv :wheel cmd /sbin/shutdown args -p now
permit nopass keepenv :wheel cmd /sbin/reboot
permit nopass keepenv :wheel cmd /usr/sbin/pkg_add
permit nopass keepenv :wheel cmd /usr/sbin/pkg_delete
permit nopass keepenv :wheel cmd /usr/sbin/pkg_info

# The deploy wrapper, so configuration cannot be edited in place by accident.
permit nopass keepenv :wheel cmd /usr/local/sbin/deploy-config

# rsync(1), so the gateway can pull this guest's /etc as a backup
# (/usr/local/sbin/lab-backup on the gateway, which runs rsync escalated by
# doas on this side).  This is a broad grant: remove it if you take backups
# some other way, and lab-backup will fail loudly rather than silently doing
# nothing.
permit nopass keepenv :wheel cmd /usr/bin/rsync

# Log/diagnostic helpers.
permit nopass keepenv :wheel cmd /usr/bin/tail args -f /var/log/messages
permit nopass keepenv :wheel cmd /usr/bin/tail args -f /var/log/authlog
