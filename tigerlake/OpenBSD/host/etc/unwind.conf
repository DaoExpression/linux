#	/etc/unwind.conf — gateway
#
#	Validate:  unwind -n          (config check)
#	Apply:     rcctl restart unwind
#	Stats:     unwindctl status
#
#	unwind(8) answers on localhost only, which is exactly what the gateway
#	needs: /etc/resolv.conf points at 127.0.0.1, so every name lookup the
#	gateway itself makes is cached, DNSSEC-validated and privacy-preserving.
#	The lab's *clients* do not use this instance — they use the dns VM's
#	unbound(8), which is reachable from the client networks (see
#	docs/03-service-map.md).
#
#	Validation is on by default and cannot be turned off from this file;
#	"preference" only decides which upstream wins.

# --- Upstream resolvers -------------------------------------------------------
# With the ISP's DHCP answer in place, unwind already has resolvers learned
# through resolvd(8) ("autoconf").  Listing explicit forwarders gives you
# deterministic upstreams, DNS-over-TLS, and a working resolver on a network
# whose DHCP server hands out nothing useful.
#
# DoT when the certificate name is known.  unwind pins the "authentication
# name", so a MITM upstream fails validation instead of silently answering.
forwarder { 9.9.9.9 149.112.112.112 }
forwarder { 1.1.1.1 1.0.0.1 }
#forwarder { 9.9.9.9 port 853 authentication name "dns.quad9.net" DoT }

# Prefer encrypted transport, then fall back to plain forwarders, then to
# resolving recursively ourselves.  Remove "recursor" if the gateway must
# never send queries on its own (for example on a metered uplink) — without
# it, unwind simply fails when every forwarder is unreachable.
preference { DoT oDoT-forwarder forwarder recursor autoconf }

# --- Split horizon ------------------------------------------------------------
# The gateway is the authoritative server for lab.example.org itself (nsd(8)
# on 10.10.10.1 / 10.10.50.1), so it must not be asked to resolve that zone
# through a forwarder.  Force those queries to go through the libc/stub path
# so the local nsd answers.
force autoconf { lab.example.org }

# --- Blocking -----------------------------------------------------------------
# Domains answered with REFUSED.  "log" records each blocked lookup in the
# usual syslog stream so you can see what a device is trying to reach.
#
# Create /etc/unwind.blocklist with one domain per line; a leading dot means
# "this zone and all subdomains".  Typical lab entries:
#	.ads.example
#	.telemetry.vendor.example
#	pool.ntp.org		# when the lab must use its own ntpd(8)
block list "/etc/unwind.blocklist" log

# --- captive portals ----------------------------------------------------------
# If the lab has a guest Wi-Fi that redirects unauthenticated clients, unwind
# can detect the portal and answer the probe requests itself.  It is off by
# default and needs the portal detection to be useful; leave it off here.
