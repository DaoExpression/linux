#	/etc/dovecot/dovecot.conf — mail guest
#
#	Install:   pkg_add dovecot
#	Check:     doveconf -n          (effective config; catches typos)
#	Apply:     rcctl restart dovecot
#	Mailboxes: doveadm mailbox list -u user@lab.example.org
#
#	dovecot owns every mailbox on this host.  smtpd(8) never writes to a
#	mailbox directly: it delivers over LMTP to the socket below, so there is
#	exactly one process whose locking rules matter.
#
#	The port keeps its configuration in /etc/dovecot/.  This file is the whole
#	configuration — the package's conf.d/ split is not used, because a single
#	readable file is worth more in a lab than a directory of defaults.

protocols = imap lmtp
# No POP3: mail is read on more than one device, and IMAP is the only protocol
# that does that correctly.  Add "pop3" here if a device genuinely needs it.

# --- listeners ----------------------------------------------------------------
# Bind the DMZ address.  dovecot's default "*" would also listen on loopback
# (harmless) and on fd00:...::21 (which pf allows, but there is no reason to
# widen the surface).
listen = 10.10.40.21
service imap-login {
	inet_listener imap {
		port = 143
		# Plaintext IMAP is only useful for a client that will STARTTLS
		# immediately; disable it entirely if every client can use 993.
		ssl = no
	}
	inet_listener imaps {
		port = 993
		ssl = yes
	}
}
service lmtp {
	# smtpd(8) delivers here.  A unix socket plus a group the MTA belongs to
	# is the only way to have both daemons agree on access without giving
	# smtpd write access to the mail store.
	unix_listener /var/run/dovecot/lmtp {
		mode = 0660
		user = _smtpd
		group = _smtpd
	}
}

# --- TLS ----------------------------------------------------------------------
# Required for both IMAP and LMTP from outside.  Same keypair as smtpd, issued
# by acme-client on this guest.
ssl = required
ssl_cert = </etc/ssl/mail.lab.example.org.crt
ssl_key = </etc/ssl/private/mail.lab.example.org.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
ssl_cipher_list = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256
# If you want to pin DH parameters, generate them once and uncomment:
#ssl_dh = </etc/ssl/dhparam.pem

# --- mail location ------------------------------------------------------------
# One virtual mail user owns every mailbox.  That means a compromised webmail
# or IMAP bug cannot become a root shell by writing to a home directory, and
# backups are one directory.
mail_home = /var/vmail/%d/%n
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 2000
# Create the account once:
#	groupadd -g 2000 vmail
#	useradd -u 2000 -g vmail -d /var/vmail -s /sbin/nologin vmail
#	install -d -o vmail -g vmail -m 0700 /var/vmail

# --- authentication -----------------------------------------------------------
# A flat password file, one line per mailbox, in dovecot's own scheme format
# ({CRYPT}, {SHA512-CRYPT}, ...).  Generate entries with:
#	doveadm pw -s SHA512-CRYPT -u alice@lab.example.org
# and never store a plaintext password anywhere.
disable_plaintext_auth = yes
auth_mechanisms = plain login
passdb {
	driver = passwd-file
	args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/passwd
}
userdb {
	# Static userdb: every mailbox belongs to the same system account, and
	# the mailbox path comes from mail_home above.
	driver = static
	args = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

# --- LMTP to smtpd ------------------------------------------------------------
# The recipient address is already expanded by smtpd's virtual table, so LMTP
# must not try to resolve it against system users.
protocol lmtp {
	postmaster_address = postmaster@lab.example.org
	lmtp_rcpt_check_quota = no
	mail_plugins =
}
service lmtp {
	process_min_avail = 1
}

# --- namespaces ---------------------------------------------------------------
# A single namespace, maildir on disk, with Sent/Drafts/Junk as real folders so
# that a client which does not know about SPECIAL-USE still behaves.
namespace inbox {
	inbox = yes
	separator = /
	mailbox Drafts {
		special_use = \Drafts
		auto = subscribe
	}
	mailbox Sent {
		special_use = \Sent
		auto = subscribe
	}
	mailbox Junk {
		special_use = \Junk
		auto = subscribe
	}
	mailbox Trash {
		special_use = \Trash
		auto = subscribe
	}
}

# --- quotas -------------------------------------------------------------------
# Quotas belong on the filesystem for a lab this size, but a soft limit in
# dovecot gives a much better error message than ENOSPC:
#plugin {
#	quota = maildir:User quota
#	quota_rule = *:storage=5G
#}
#protocol imap {
#	mail_plugins = $mail_plugins quota
#}

# --- logging ------------------------------------------------------------------
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
# The per-host logs are shipped to the gateway's central syslog by syslogd(8);
# see /etc/syslog.conf on this guest.

# --- notes --------------------------------------------------------------------
# * /etc/dovecot/passwd and /etc/dovecot/master-users must be root-only
#   (0600): dovecot reads them before dropping privileges.
# * Enable the auth_debug* settings temporarily when a login fails — they print
#   exactly which passdb answered, or why none did.
