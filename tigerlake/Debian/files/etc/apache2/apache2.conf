# /etc/apache2/apache2.conf
# Hardened main configuration. Differences from Debian's stock file are deliberate and commented;
# see docs/06-apache-hardening.md §3.
#
# Validate after ANY edit:  sudo apache2ctl configtest   (must print "Syntax OK")
# The install script backs up the original to /var/backups/paranoid/<stamp>/ before replacing this.

# ---------------------------------------------------------------------------
# Server identity and runtime
# ---------------------------------------------------------------------------
ServerRoot "/etc/apache2"

# Mutex and pid paths come from /etc/apache2/envvars (not from this file) so that extra instances
# (docs/06 §7) get their own. Do not hardcode them here.
Mutex file:${APACHE_LOCK_DIR} default
PidFile ${APACHE_PID_FILE}
DefaultRuntimeDir ${APACHE_RUN_DIR}

User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}
# Debian's default is www-data with no shell and no home directory. Keep it that way; never give the
# web user a login shell, and never add it to any group that owns application data.

# ---------------------------------------------------------------------------
# Exposure control: say as little as possible
# ---------------------------------------------------------------------------
ServerTokens Prod            # "Server: Apache" - no version, no modules
ServerSignature Off          # no version string on error pages or directory listings
TraceEnable Off              # TRACE/TRACK off (cross-site tracing)
HostnameLookups Off          # no reverse DNS: no latency, no DNS traffic, no timing leak
UseCanonicalName Off         # never trust the Host: header for self-referential URLs
FileETag None                # ETags can leak inode numbers; we do not use conditional GETs on a
                             # static-by-design server

# ---------------------------------------------------------------------------
# Connection handling - tight, because we serve one purpose
# ---------------------------------------------------------------------------
Timeout 30
KeepAlive On
MaxKeepAliveRequests 64
KeepAliveTimeout 5

# Request-size limits are a first line of defence: an oversized request never reaches a parser.
LimitRequestFields 40
LimitRequestFieldSize 4096
LimitRequestLine 4096
LimitRequestBody 1048576          # 1 MiB ceiling on request bodies
LimitXMLRequestBody 0             # no XML bodies at all: kills XXE/Billion-Laughs before a parser
                                  # sees them

# Slowloris / slow-POST: require progress. This is why we do not need a separate anti-DoS daemon
# for header trickling.
RequestReadTimeout header=10-20,MinRate=500 body=10-20,MinRate=500

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
ErrorLog ${APACHE_LOG_DIR}/error.log
LogLevel warn

# Extended format: vhost, client, time, request, status, bytes, microseconds, TLS protocol+cipher,
# UA and Referer. Enough to investigate, without request bodies (never log those).
LogFormat "%v %h %l %u %t \"%r\" %>s %b %D %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%{User-Agent}i\" %{Referer}i" paranoid
LogFormat "%v %h %l %u %t \"%r\" %>s %b %D" paranoid-minimal
# Tier 2: pipe to journald so events land in a persistent, sealed, remotely shippable store
# (docs/06 §9). Comment these two lines and use the file-based CustomLog below if you prefer files.
CustomLog "|/usr/bin/logger -t apache_access -p local6.info" paranoid
ErrorLog  "|/usr/bin/logger -t apache_error  -p local6.err"
# CustomLog ${APACHE_LOG_DIR}/access.log paranoid

# ---------------------------------------------------------------------------
# Modules and the rest of the configuration
# ---------------------------------------------------------------------------
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf

# Only 443 (and possibly 80). See files/etc/apache2/ports.conf.
Include ports.conf

# ---------------------------------------------------------------------------
# Default deny, then explicit permission
# ---------------------------------------------------------------------------
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/>
    Options -Indexes -ExecCGI -Includes -MultiViews -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# .htaccess is an attacker-writable configuration file in the web root. Forbid it, and forbid
# serving it or any other dotfile.
AccessFileName .htaccess
<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>
RedirectMatch 404 /\.(?!well-known/).*$

# Server version in error documents is already off; keep error pages generic and static.
# (Configure ErrorDocument per site - see sites-available/example-hardened.conf.)

# Include the security/tls/headers fragments (shipped in conf-available, enabled via a2enconf).
IncludeOptional conf-enabled/*.conf

# Sites last: a vhost can then refine, but cannot unset, the global defaults above.
IncludeOptional sites-enabled/*.conf
