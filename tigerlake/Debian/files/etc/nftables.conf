#!/usr/sbin/nft -f
# /etc/nftables.conf - paranoid ingress AND egress policy for a single-purpose HTTPS server.
#
# ALWAYS check before loading:      sudo nft -c -f /etc/nftables.conf
# Apply:                            sudo systemctl enable --now nftables   (or: nft -f)
# Rollback from a console:          sudo nft flush ruleset
#                                   sudo nft -f /var/backups/nft.<stamp>.ruleset
#
# See docs/05-network-and-firewall.md for the reasoning. Every rule below exists for a reason that
# is written next to it; if you cannot explain a rule, delete it, do not keep it "just in case".

flush ruleset

define ADMIN_NET = 10.66.0.0/24      # your WireGuard admin subnet (docs/05 §5)

table inet filter {

    # -----------------------------------------------------------------------
    # Dynamic, self-expiring sets used for per-source rate limiting.
    # -----------------------------------------------------------------------
    set http4  { type ipv4_addr; flags dynamic, timeout; timeout 10m; }
    set http6  { type ipv6_addr; flags dynamic, timeout; timeout 10m; }
    set ssh4   { type ipv4_addr; flags dynamic, timeout; timeout 1h;  }

    # Replace with the real upstreams from /etc/unbound/unbound.conf.d/paranoid.conf and
    # /etc/chrony/chrony.conf. Keeping them as named sets means one place to edit.
    set dns_upstreams { type ipv4_addr; elements = { 1.1.1.1, 9.9.9.9 } }
    set ntp_upstreams { type ipv4_addr; elements = { 162.159.200.1, 216.239.35.0 } }

    # -----------------------------------------------------------------------
    # INGRESS - default DROP
    # -----------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state invalid drop
        ct state established,related accept

        # Malformed TCP flag combinations: scans, spoofing attempts, broken stacks.
        tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0 drop
        tcp flags fin,syn == fin,syn drop
        tcp flags syn,rst == syn,rst drop
        tcp flags fin,rst == fin,rst drop
        tcp flags fin,psh,urg == fin,psh,urg drop
        tcp flags syn,fin == syn,fin drop
        tcp flags syn,psh == syn,psh drop

        # --- SSH: ONLY over the admin tunnel (Tier 2). Never on the public interface. ---
        iifname "wg0" tcp dport 22 ct state new accept
        # Tier 1 alternative (SSH exposed, rate-limited - delete the line above if you use this):
        iifname != "wg0" tcp dport 22 ct state new \
            update @ssh4 { ip saddr limit rate over 6/minute } drop

        # --- HTTPS: reachable from anywhere, bounded per source address ---
        tcp dport 443 ct state new update @http4 { ip saddr limit rate over 60/minute burst 30 packets } drop
        tcp dport 443 ct state new update @http6 { ip6 saddr limit rate over 60/minute burst 30 packets } drop
        tcp dport 443 accept

        # --- HTTP: ONLY for HTTP-01 ACME validation. DELETE these two lines if you use DNS-01
        #     (which docs/06 §4 recommends) - a closed port 80 is strictly better. ---
        tcp dport 80 ct state new update @http4 { ip saddr limit rate over 10/minute } drop
        tcp dport 80 accept

        # --- WireGuard admin plane ---
        udp dport 51820 ct state new accept

        # --- ICMP: path MTU discovery, plus a rate-limited echo so you can diagnose ---
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        icmp type echo-request limit rate 4/second accept
        ipv6-icmp type { destination-unreachable, packet-too-big, time-exceeded,
                         parameter-problem, nd-router-solicit, nd-router-advert,
                         nd-neighbor-solicit, nd-neighbor-advert, nd-redirect } accept
        ipv6-icmp type echo-request limit rate 4/second accept

        # Everything else: one rate-limited log line, one counter, then silence.
        limit rate 5/minute log prefix "nft-drop-in: " level info counter drop
    }

    # -----------------------------------------------------------------------
    # FORWARD - guests/VMs get NOTHING unless you explicitly say so (docs/08 §4).
    # -----------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Uncomment ONLY for the bridge you deliberately built:
        #iifname "virbr0" oifname "virbr0" accept
        #iifname "virbr0" oifname "eno1" ct state new tcp dport { 80, 443 } accept
        #iifname "virbr0" oifname "eno1" ct state established,related accept
        #iifname "eno1" oifname "virbr0" ct state established,related accept

        limit rate 5/minute log prefix "nft-drop-fwd: " level info counter drop
    }

    # -----------------------------------------------------------------------
    # EGRESS - TIER 2 allowlist. This is what makes a compromised Apache useless
    # for command-and-control and for exfiltration.
    # -----------------------------------------------------------------------
    chain output {
        type filter hook output priority filter; policy drop;

        oif "lo" accept
        ct state invalid drop
        ct state established,related accept

        # The local validating resolver and chrony may reach their upstreams, nothing else may.
        ip daddr @dns_upstreams meta l4proto { tcp, udp } th dport { 53, 853 } accept
        ip daddr @ntp_upstreams meta l4proto udp th dport { 123, 4460 } accept

        # Package management and firmware updates (TLS only).
        meta skuid "_apt" tcp dport 443 accept
        meta skuid "root" tcp dport 443 ct state new accept

        # ACME DNS-01 (docs/06 §4): the certbot process only.
        meta skuid "root" tcp dport 53 accept

        # WireGuard handshake / keepalive.
        udp dport 51820 accept

        # Outbound echo replies are covered by 'established'. Allow traceroute answers.
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ipv6-icmp type { destination-unreachable, packet-too-big, time-exceeded,
                         parameter-problem } accept

        # Anything else leaving this machine is either a bug or a backdoor. Both are worth seeing.
        limit rate 10/minute log prefix "nft-drop-out: " level info counter drop
    }
}

# -----------------------------------------------------------------------------
# OPTIONAL: drop-in fragments, e.g. extra allow rules for a container you add later.
# Keep fragments small and reviewed; never let a fragment contain 'policy accept'.
# -----------------------------------------------------------------------------
include "/etc/nftables.d/*.conf"
