#	$OpenBSD: resolv.conf,v 1.15 $
#
#	While unwind(8) is running this file is normally maintained by
#	resolvd(8) and lists the resolvers learned from DHCP/SLAAC.  The base
#	default below points the resolver library at the local unwind(8)
#	instance; unwind then answers from its cache and recurses upstream.
#	If you enable unwind, this is the file you want.
nameserver 127.0.0.1
lookup file bind
