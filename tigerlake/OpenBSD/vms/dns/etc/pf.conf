#	/etc/pf.conf — dns guest
#
#	Baseline rules plus the one service this guest exists to provide.  The
#	source lists here are duplicated from the gateway's pf.conf on purpose:
#	this ruleset is the last line of defence for the resolver, and it should be
#	readable without opening another file.

set skip on lo
set block-policy drop
set state-policy floating
set reassembly yes
set fingerprints "/etc/pf.os"
set loginterface vio0

if		= "vio0"
me		= "10.10.50.11"

mgmt_net	= "10.10.10.0/24"
user_net	= "10.10.20.0/24"
guest_net	= "10.10.30.0/24"
dmz_net		= "10.10.40.0/24"
srv_net		= "10.10.50.0/24"
vpn_net		= "10.10.60.0/24"
gw		= "10.10.50.1"
gw_alt		= "10.10.10.1"
monitor		= "10.10.50.14"
bastion		= "10.10.50.10"

lab_nets	= "{ $mgmt_net $user_net $guest_net $dmz_net $srv_net $vpn_net }"
icmp_types	= "{ echoreq echorep unreach timexceed paramprob }"

match in all scrub (no-df random-id max-mss 1440)

antispoof quick for $if
block all

# --- inbound ------------------------------------------------------------------
pass in quick inet proto icmp from $lab_nets icmp-type $icmp_types keep state
pass in quick proto udp from any port bootpc to any port bootps
pass quick inet6 proto icmp6 all

# sshd, as on every guest.
pass in quick proto tcp from $mgmt_net to $me port ssh keep state
pass in quick proto tcp from $bastion to $me port ssh keep state
pass in quick proto tcp from $vpn_net to $me port ssh keep state

# --- the service ---------------------------------------------------------------
# DNS from the whole lab.  Deliberately TCP *and* UDP, and deliberately not
# rate-limited here: the gateway's nsd(8) does response-rate-limiting on the
# authoritative side, and throttling the recursor would just make clients
# retry.
pass in quick proto { tcp udp } from $lab_nets to $me port domain keep state

# Zone transfers: only the gateway may ask, and only because an operator might
# want a copy of the zone on the gateway's nsd(8).  In the normal direction
# (gateway -> this guest) this rule is unused.
pass in quick proto tcp from { $gw $gw_alt } to $me port domain keep state

# Monitoring and time.
pass in quick proto udp from $monitor to $me port snmp keep state
pass in quick proto udp from $gw to $me port ntp keep state
pass in quick proto udp from $monitor to $me port syslog keep state

# --- outbound -----------------------------------------------------------------
# Recursion needs the internet; everything else this guest originates is
# ordinary (package updates, log shipping, NTP to the gateway above).
pass out on $if from $me to any keep state

# ------------------------------------------------------------------ notes
# * unbound(8) does its own access-control; the rules above are the packet-level
#   version of the same policy.  Keeping both is not redundant: if unbound.conf
#   is ever edited to allow a wider range by mistake, pf still refuses.
# * Do not add a rule letting the DMZ reach this guest on anything but port 53 —
#   the DMZ is the segment that faces the internet.
