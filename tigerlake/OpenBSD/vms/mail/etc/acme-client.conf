#	/etc/acme-client.conf — mail guest
#
#	Validate:  acme-client -n
#	Issue:     acme-client -v mail.lab.example.org
#	Renew:     /usr/local/sbin/acme-renew   (from the crontab in this tree)
#
#	This guest needs its own certificate rather than one proxied from the
#	gateway: SMTP STARTTLS and IMAP are end-to-end protocols.  A relay that
#	terminated its TLS would have to hold the mail session state, and the
#	client would be authenticating to the relay rather than to the mailbox.
#
#	The keypair written below is exactly the one smtpd.conf and dovecot.conf
#	point at:
#	    pki mail.lab.example.org cert "/etc/ssl/mail.lab.example.org.crt"
#	    ssl_cert = </etc/ssl/mail.lab.example.org.crt

authority letsencrypt {
	api url "https://acme-v02.api.letsencrypt.org/directory"
	account key "/etc/acme/letsencrypt-privkey.pem"
}

authority letsencrypt-staging {
	api url "https://acme-staging-v02.api.letsencrypt.org/directory"
	account key "/etc/acme/letsencrypt-staging-privkey.pem"
}

domain mail.lab.example.org {
	# No alternative names: this host answers on one name for SMTP, IMAP and
	# submission, and adding names that nothing validates only widens the
	# certificate's blast radius.
	domain key "/etc/ssl/private/mail.lab.example.org.key"
	domain full chain certificate "/etc/ssl/mail.lab.example.org.crt"

	sign with letsencrypt

	# HTTP-01.  The challenge has to be answered by *this* host, because the
	# certificate's private key is installed here and nowhere else.
	#
	# Two pieces are already in this tree:
	#   * httpd(8) on this guest, restricted to /.well-known/acme-challenge
	#     (see httpd.conf in this tree; enable it with "rcctl enable httpd")
	#   * a pf rule here allowing port 80 from the gateway
	#
	# The remaining step is on the gateway: relayd(8) must forward the
	# challenge for this hostname to 10.10.40.21, alongside the rule it
	# already has for its own httpd on 127.0.0.1:8080.  Add a table for this
	# host and a per-host rule in relayd.conf's HTTP protocol, then CHECK IT
	# before trusting it:
	#
	#	sudo relayd -n
	#	sudo rcctl reload relayd
	#	curl -i http://mail.lab.example.org/.well-known/acme-challenge/probe
	#
	# Doing it any other way (a redirect to HTTPS, or letting relayd answer
	# the challenge itself) will make renewal fail with a 404 on the
	# challenge URL and nothing else in the log.
	#
	# The alternative is TLS-ALPN-01, which relayd on the gateway can present
	# without this host running any HTTP at all — see acme-client.conf(5) for
	# the "challenge tls-alpn" form.
	challenge response "/var/www/acme"
}

# ------------------------------------------------------------------ notes
# * If you would rather not run a web server on the mail guest at all, keep the
#   certificate for SMTP/IMAP and let relayd terminate TLS for anything
#   web-facing — that is the arrangement the web VM uses.
# * The account key in /etc/acme is the only proof of account ownership.  Back
#   it up, and keep /etc/acme mode 700.
# * A failed renewal is silent until the certificate expires, which is why
#   /usr/local/sbin/acme-renew logs the expiry date of every certificate it
#   touches.
