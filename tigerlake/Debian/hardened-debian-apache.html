n\n[Service]\nType=oneshot\nRemainAfterExit=yes\nExecStart=/bin/mount -o remount,ro /boot\nExecStartPost=/bin/sh -c 'findmnt -no OPTIONS /boot | grep -qE \"(^|,)ro(,|$)\" || { echo \"/boot is NOT read-only\"; exit 1; }'\nProtectSystem=strict\nNoNewPrivileges=yes\n\n[Install]\nWantedBy=sysinit.target\n", "lines": 36, "purpose": "Tier-3 option: makes /boot read-only, so a modified kernel cannot be staged on disk for the next boot.", "notes": [{"n": 19, "why": "Ordering only - it does not grant any privilege."}, {"n": 20, "why": "Ordering only - it does not grant any privilege."}, {"n": 21, "why": "Prevents two instances of the same heavy check running at once."}, {"n": 22, "why": "Only acts when /boot really is a separate mount, so it cannot do something surprising on a different layout."}, {"n": 26, "why": "Runs to completion and exits: nothing lingers listening for input."}, {"n": 27, "why": "Keeps the state visible to systemd so 'is it locked?' is answerable."}, {"n": 28, "why": "Makes /boot read-only, so a modified kernel or initramfs cannot be staged for the next boot."}, {"n": 29, "why": "Checks the mount really is read-only rather than reporting success."}, {"n": 30, "why": "The filesystem is read-only for this unit except for the paths it declares."}, {"n": 31, "why": "The unit can never gain privileges through a setuid binary."}, {"n": 34, "why": "Where the unit is wired into boot; keep it deliberate."}], "annPrefix": "#", "isDoc": false}, "etc/unbound/unbound.conf.d/paranoid.conf": {"path": "etc/unbound/unbound.conf.d/paranoid.conf", "content": "# /etc/unbound/unbound.conf.d/paranoid.conf\n# A LOCAL validating resolver on 127.0.0.1. It is not a public resolver: nothing on the internet can\n# query it, and it accepts queries only from the loopback.\n#\n# Why bother (docs/04 §11): DNSSEC validation happens here, queries are hidden from the local\n# network with DNS-over-TLS, DNS-rebinding towards your LAN is blocked, and the nftables egress\n# allowlist can be a single line (\"DNS to these upstreams\") instead of \"port 53 to anywhere\".\n#\n# Check:  sudo unbound-checkconf  &&  sudo systemctl restart unbound  &&  dig +dnssec debian.org @127.0.0.1\n\nserver:\n    interface: 127.0.0.1\n    interface: ::1\n    port: 53\n    access-control: 127.0.0.0/8 allow\n    access-control: ::1/128 allow\n    # Everything else is refused by default (no access-control line = refuse).\n\n    do-ip4: yes\n    do-ip6: no            # set to yes only if this host has working IPv6 upstream connectivity\n    do-udp: yes\n    do-tcp: yes\n    prefer-ip6: no\n\n    # --- do not answer questions about ourselves or about anyone else ---\n    hide-identity: yes\n    hide-version: yes\n    identity: \"server\"\n    version: \"server\"\n    do-not-query-localhost: yes\n    qname-minimisation: yes\n    qname-minimisation-strict: yes\n\n    # --- DNSSEC: fail closed, always ---\n    auto-trust-anchor-file: \"/var/lib/unbound/root.key\"\n    val-log-level: 1\n    val-clean-additional: yes\n    val-permissive-mode: no\n    harden-glue: yes\n    harden-dnssec-stripped: yes\n    harden-below-nxdomain: yes\n    harden-referral-path: yes\n    harden-algo-downgrade: yes\n    aggressive-nsec: yes\n    root-hints: \"/var/lib/unbound/root.hints\"   # optional; remove this line if the file is absent\n\n    # --- anti-rebinding: never hand out private answers to the public ---\n    private-address: 10.0.0.0/8\n    private-address: 172.16.0.0/12\n    private-address: 192.168.0.0/16\n    private-address: 169.254.0.0/16\n    private-address: fd00::/8\n    private-address: fe80::/10\n\n    # --- DoS resistance: we are the only client, so be strict ---\n    num-threads: 2\n    msg-cache-size: 32m\n    rrset-cache-size: 64m\n    cache-min-ttl: 60\n    cache-max-ttl: 86400\n    prefetch: yes\n    prefetch-key: yes\n    minimal-responses: yes\n    rrset-roundrobin: yes\n    unwanted-reply-threshold: 10000000\n    edns-buffer-size: 1232          # avoid fragmentation-based attacks\n    max-udp-size: 1232\n\n    # --- never, ever expose this to the network ---\n    remote-control:\n        control-enable: no\n\n    username: \"unbound\"\n    directory: \"/etc/unbound\"\n    logfile: \"\"                      # log to syslog/journald\n    use-syslog: yes\n    verbosity: 1\n    log-queries: no                  # no: query logs are a privacy leak inside your own log store\n\nforward-zone:\n    name: \".\"\n    forward-tls-upstream: yes        # DNS-over-TLS to the upstreams below\n    # Verify against the system CA bundle.\n    tls-cert-bundle: \"/etc/ssl/certs/ca-certificates.crt\"\n    forward-addr: 1.1.1.1@853#cloudflare-dns.com\n    forward-addr: 9.9.9.9@853#dns.quad9.net\n    forward-addr: 1.1.1.1@853#one.one.one.one\n    forward-first: no                # if DoT upstreams are down, fail rather than leak in clear\n", "lines": 89, "purpose": "A local DNSSEC-validating resolver over DNS-over-TLS: authenticated answers, no cleartext queries, no rebinding into your LAN.", "notes": [{"n": 11, "why": "The resolver answers on loopback only: it is not a public DNS server."}, {"n": 12, "why": "The resolver answers on loopback only: it is not a public DNS server."}, {"n": 14, "why": "Explicit allowlist of clients; everything else is refused by default."}, {"n": 15, "why": "Explicit allowlist of clients; everything else is refused by default."}, {"n": 25, "why": "Refuses to describe itself to anyone who asks."}, {"n": 26, "why": "Refuses to describe itself to anyone who asks."}, {"n": 29, "why": "Stops the resolver being pointed at a service on this host (a rebinding/SSRF trick)."}, {"n": 30, "why": "Sends only the minimum needed per query, so upstreams cannot enumerate your lookups."}, {"n": 31, "why": "Sends only the minimum needed per query, so upstreams cannot enumerate your lookups."}, {"n": 34, "why": "DNSSEC validation from the root of trust: forged answers fail rather than being used."}, {"n": 37, "why": "Fail closed - a validation failure is a refusal, not a warning."}, {"n": 38, "why": "Closes the known DNSSEC downgrade and bogus-referral tricks that turn validation off without you noticing."}, {"n": 39, "why": "Closes the known DNSSEC downgrade and bogus-referral tricks that turn validation off without you noticing."}, {"n": 40, "why": "Closes the known DNSSEC downgrade and bogus-referral tricks that turn validation off without you noticing."}, {"n": 41, "why": "Closes the known DNSSEC downgrade and bogus-referral tricks that turn validation off without you noticing."}, {"n": 42, "why": "Closes the known DNSSEC downgrade and bogus-referral tricks that turn validation off without you noticing."}, {"n": 43, "why": "Safe caching of denial-of-existence, which reduces how much you tell upstreams."}, {"n": 47, "why": "Refuses to return private-range answers to public queries - the DNS-rebinding defence for your own LAN."}, {"n": 48, "why": "Refuses to return private-range answers to public queries - the DNS-rebinding defence for your own LAN."}, {"n": 49, "why": "Refuses to return private-range answers to public queries - the DNS-rebinding defence for your own LAN."}, {"n": 50, "why": "Refuses to return private-range answers to public queries - the DNS-rebinding defence for your own LAN."}, {"n": 51, "why": "Refuses to return private-range answers to public queries - the DNS-rebinding defence for your own LAN."}, {"n": 52, "why": "Refuses to return private-range answers to public queries - the DNS-rebinding defence for your own LAN."}, {"n": 55, "why": "Bounded resources: the resolver cannot be made to exhaust memory."}, {"n": 56, "why": "Bounded resources: the resolver cannot be made to exhaust memory."}, {"n": 57, "why": "Bounded resources: the resolver cannot be made to exhaust memory."}, {"n": 65, "why": "Keeps responses under the fragmentation threshold, avoiding a well-known spoofing enabler."}, {"n": 66, "why": "Keeps responses under the fragmentation threshold, avoiding a well-known spoofing enabler."}, {"n": 69, "why": "The remote control interface is off: no administrative channel into the resolver."}, {"n": 72, "why": "Runs unprivileged after binding port 53."}, {"n": 77, "why": "Query logs are a privacy leak inside your own evidence store."}, {"n": 81, "why": "Encrypts your queries to the upstream: the local network cannot read or tamper with them."}, {"n": 84, "why": "DNS-over-TLS with the upstream's hostname verified against the system CA bundle."}, {"n": 85, "why": "DNS-over-TLS with the upstream's hostname verified against the system CA bundle."}, {"n": 86, "why": "DNS-over-TLS with the upstream's hostname verified against the system CA bundle."}, {"n": 87, "why": "If the authenticated upstreams fail, resolution fails - it does not silently fall back to cleartext."}], "annPrefix": "#", "isDoc": false}, "etc/usbguard/rules.conf": {"path": "etc/usbguard/rules.conf", "content": "# /etc/usbguard/rules.conf\n#\n# ⚠ THIS FILE MUST BE GENERATED ON YOUR OWN MACHINE. The lines below are a documented shape, not a\n#   working policy: the hashes and serials are machine-specific, and copying someone else's rules\n#   either blocks your keyboard or, worse, allows theirs.\n#\n# Generate it (docs/07 §4):\n#   sudo usbguard generate-policy > /tmp/rules.new      # with ONLY trusted devices attached\n#   sudo diff -u /etc/usbguard/rules.conf /tmp/rules.new\n#   sudo cp /tmp/rules.new /etc/usbguard/rules.conf && sudo chmod 0600 /etc/usbguard/rules.conf\n#   sudo systemctl restart usbguard\n#\n# What good rules look like: one line per device you can name, with a hash (strong) or at least the\n# serial (weaker), and a final unconditional block. Nothing more.\n#\n# --- host controllers (always needed; they are the roots of the USB tree) ------------------\nallow id 1d6b:0002 serial \"\" name \"xHCI Host Controller\" hash \"REPLACE\" parent-hash \"REPLACE\"\nallow id 1d6b:0003 serial \"\" name \"xHCI Host Controller\" hash \"REPLACE\" parent-hash \"REPLACE\"\n#\n# --- your internal keyboard / touchpad / fingerprint reader (HID over USB or I2C) -----------\n# allow id 046d:c31c serial \"\" name \"USB Keyboard\" hash \"REPLACE\" parent-hash \"REPLACE\"\n#\n# --- the offline LUKS header token for Profile P2 (docs/03 §4) ------------------------------\n# It is only needed at boot, BEFORE USBGuard starts, so you can deliberately leave it blocked here.\n# If you want to use it while the system runs (e.g. to back up a new header), authorize it\n# temporarily:  sudo usbguard allow-device <id>   then   sudo usbguard block-device <id>\n#\n# --- default deny: everything not listed above is blocked ------------------------------------\nblock\n", "lines": 30, "purpose": "A tiny, machine-specific allowlist of the devices you can actually name.", "notes": [{"n": 16, "why": "The host controllers must be allowed or the entire USB tree is dead, including your keyboard."}, {"n": 17, "why": "The host controllers must be allowed or the entire USB tree is dead, including your keyboard."}, {"n": 28, "why": "Terminal default-deny: anything not named above is blocked, which is the whole policy in one line."}], "annPrefix": "#", "isDoc": false}, "etc/usbguard/usbguard-daemon.conf": {"path": "etc/usbguard/usbguard-daemon.conf", "content": "# /etc/usbguard/usbguard-daemon.conf\n# Deny-by-default USB policy. See docs/07 §4.\n#\n# Practical warning: generate rules from YOUR machine with ONLY trusted devices attached\n# (usbguard generate-policy), and keep a second keyboard/console within reach for the first boot\n# after enabling this. A bad ruleset that blocks your only input device is a bad day.\n\n# Default policy for devices that do not match any rule: BLOCK.\nRuleFile=/etc/usbguard/rules.conf\nImplicitPolicyTarget=block\n\n# What to do with devices already present when the daemon starts (the internal keyboard, the\n# host controllers). 'apply-policy' means rules.conf governs them too.\nPresentDevicePolicy=apply-policy\nPresentControllerPolicy=keep\nInsertedDevicePolicy=apply-policy\n\n# Never auto-authorize anything.\nAuthorizedDefault=none\n\n# Do not try to restore controller state on shutdown; leave the kernel to it.\nRestoreControllerDeviceState=false\n\n# Match rules to logical ports rather than physical ones? Keep false unless you have a fixed\n# chassis layout you are modelling; true surprises people when devices move.\nDeviceRulesWithPort=false\n\n# --- who may talk to the daemon ---\nIPCAllowedUsers=root\nIPCAllowedGroups=root\nIPCProcessSocketsPath=/run/usbguard/\nIPCAccessControlFiles=yes\n\n# Every allow/deny decision goes to the audit trail (auditd), which is shipped off-box.\nAuditBackend=LinuxAudit\nAuditFilePath=/var/log/usbguard/usbguard-audit.log\n\n# Defence in depth: never let the daemon be talked into revealing device topology.\nHidePII=true\n", "lines": 40, "purpose": "Deny-by-default USB, audited: an unknown device is blocked, not mounted, not trusted.", "notes": [{"n": 9, "why": "Unknown devices are blocked, not trusted-by-default: the single most important USB setting."}, {"n": 13, "why": "Even devices already plugged in at start are subject to the policy."}, {"n": 18, "why": "Nothing is ever auto-authorised, including on hotplug."}, {"n": 21, "why": "Does not try to restore state on shutdown, avoiding a confusing window at stop time."}, {"n": 28, "why": "Only root may change the policy at runtime."}, {"n": 34, "why": "Every allow/deny decision lands in the kernel audit trail and gets shipped off-box."}, {"n": 38, "why": "The daemon does not leak device identifiers - device fingerprints are identity too."}], "annPrefix": "#", "isDoc": false}, "etc/wireguard/wg0.conf.example": {"path": "etc/wireguard/wg0.conf.example", "content": "# /etc/wireguard/wg0.conf  (mode 0600, root:root)   -  copy from this example, see docs/05 §5\n#\n# The point of the tunnel is NOT \"extra encryption\" (SSH already has that). It is that sshd can\n# listen on an address that only exists while the tunnel is up, so the internet cannot see port 22\n# at all. Remove the WAN SSH rule in nftables once you have verified this works from a client.\n#\n# Generate keys (NEVER copy a private key from a tutorial):\n#   umask 077; wg genkey | tee server.key | wg pubkey > server.pub\n# Then paste them below, and put the CLIENT's public key in the [Peer] section.\n# Check:  sudo wg show  &&  ip -brief addr show wg0  &&  sudo wg-quick up wg0\n\n[Interface]\nAddress = 10.66.0.1/24\nListenPort = 51820\nPrivateKey = <SERVER_PRIVATE_KEY>\n\n# Keep the interface rules minimal and tied to the tunnel's lifetime so nothing lingers when it is\n# down. These are additive to /etc/nftables.conf; the input chain still defaults to drop.\nPostUp   = nft add rule inet filter input iifname \"wg0\" accept comment \"wg0 in\"\nPostDown = nft flush chain inet filter input ; nft -f /etc/nftables.conf\n# Note the PostDown: rather than trying to delete the exact rule handle (fragile), we rebuild the\n# ruleset from the file. That guarantees no stale accept rules survive a tunnel restart.\n\n# No server-side NAT, no forwarding: this is an admin plane, not a VPN for browsing.\n# If you ever add a second peer (a jump host), give it a /32 and keep them from talking to\n# each other with: PreUp = nft add rule inet filter forward iifname \"wg0\" oifname \"wg0\" drop\n\n[Peer]\n# Your laptop / admin machine. One peer per device, and revoke by deleting the peer.\nPublicKey = <CLIENT_PUBLIC_KEY>\nAllowedIPs = 10.66.0.2/32\nPersistentKeepalive = 25\n\n# --------------------------------------------------------------------------------------------\n# Client config equivalent (keep on the admin machine, mode 0600, back it up offline):\n#\n# [Interface]\n# Address = 10.66.0.2/32\n# PrivateKey = <CLIENT_PRIVATE_KEY>\n# DNS = 10.66.0.1          # optional: use the server's resolver over the tunnel\n#\n# [Peer]\n# PublicKey = <SERVER_PUBLIC_KEY>\n# Endpoint = <server-ip>:51820\n# AllowedIPs = 10.66.0.0/24, <server-ip>/32\n# PersistentKeepalive = 25\n# --------------------------------------------------------------------------------------------\n", "lines": 48, "purpose": "An admin plane that removes SSH from the internet entirely - the service simply is not reachable without the tunnel.", "notes": [{"n": 12, "why": "A private admin subnet that exists only while the tunnel is up."}, {"n": 14, "why": "The server's own key; it never leaves this machine, and it is what makes the plane unguessable."}, {"n": 18, "why": "Adds the tunnel's firewall exception only while the interface exists - no rule left behind."}, {"n": 19, "why": "Rebuilds the ruleset from file on teardown, so a stale accept rule can never survive."}, {"n": 30, "why": "One peer, one exact address: a stolen client key is scoped to a single address."}, {"n": 31, "why": "Keeps the tunnel usable behind NAT without opening a second path in."}], "annPrefix": "#", "isDoc": false}, "keys/README.md": {"path": "keys/README.md", "content": "# files/keys — your Secure Boot keys\n\n`sbctl` stores keys in `/var/lib/sbctl`; this directory is for **documentation and offline storage\ninstruction**, not for storing private keys in the repo.\n\n## Create and enrol (see `docs/03` §2 for context)\n\n```bash\nsudo apt-get install --no-install-recommends sbctl sbsigntool systemd-boot systemd-ukify efitools\n# put the firmware in SETUP MODE first (Dell: Security -> Secure Boot -> Custom Mode)\nsudo sbctl status\nsudo sbctl create-keys\nsudo sbctl enroll-keys --microsoft    # omit --microsoft if you do not need signed option ROMs/dbx\n```\n\n## Back up immediately (before you need it)\n\n```bash\nsudo mkdir -p /root/sbkeys-backup\nsudo cp -a /var/lib/sbctl /root/sbkeys-backup/\nsudo cp -a /usr/share/secureboot /root/sbkeys-backup/ 2>/dev/null || true\nsudo tar -C /root -czf /root/sbkeys-$(date +%F).tar.gz sbkeys-backup\nsudo sha512sum /root/sbkeys-*.tar.gz | tee /root/sbkeys.sha512\n# copy /root/sbkeys-*.tar.gz + sbkeys.sha512 to TWO offline media (USB in a safe, encrypted archive)\n# and record the PASSWORDS/hashes on paper. Then:\nsudo shred -u /root/sbkeys-*.tar.gz /root/sbkeys.sha512\nsudo rm -rf /root/sbkeys-backup\n```\n\n## Files you must never commit\n\n- `PK.key`, `KEK.key`, `db.key` (from `/var/lib/sbctl/keys/`) — private platform keys.\n- `*.auth` files (the signed enrolment updates) — less sensitive, but do not publish your GUIDs.\n\n## Restore after a firmware reset\n\n```bash\nsudo systemctl stop systemd-boot-update 2>/dev/null || true\nsudo mkdir -p /var/lib/sbctl\nsudo tar -C / -xzf sbkeys-<date>.tar.gz var/lib/sbctl      # adjust paths to your archive layout\nsudo sbctl status\nsudo sbctl verify                # then re-sign anything reported as unsigned\n```\n\n## If the backup is lost\n\nYou cannot recover the keys. You can still get back to a working machine: clear Secure Boot keys in the\nfirmware, boot an unsigned install, re-run `docs/03` §2 from scratch to create a new key set, then\nre-install and rebuild. Treat \"keys lost\" the same as \"machine compromised\" for planning purposes — it is\na full rebuild, which is exactly why the offline copy matters.\n", "lines": 51, "purpose": "", "notes": [], "annPrefix": "#", "isDoc": true}, "usr/local/sbin/paranoid-boot-record": {"path": "usr/local/sbin/paranoid-boot-record", "content": "#!/usr/bin/env bash\n# /usr/local/sbin/paranoid-boot-record\n#\n# Appends one line per boot to the boot record, so a boot nobody performed becomes visible in both a\n# plain file and the sealed journal (docs/07 §7).\n#\n# Called by paranoid-boot-record.service. Kept OUT of the unit file on purpose: '%' characters in\n# ExecStart are systemd specifiers (a bare %s makes the unit refuse to start), and nested\n# sh/quotes/awk inside a unit is unmaintainable. A script is testable - see --help.\n#\n# Environment overrides exist for testing:\n#   PARANOID_LOGDIR   (default /var/log/paranoid)\n#   PARANOID_LUKSDEV  (default: first crypto_LUKS device found)\n#\n# Exit codes: 0 ok, 1 could not write the record.\n\nset -uo pipefail\n\nLOGDIR=\"${PARANOID_LOGDIR:-/var/log/paranoid}\"\nRECORD=\"${LOGDIR}/boots\"\n\nif [ \"${1:-}\" = \"--help\" ] || [ \"${1:-}\" = \"-h\" ]; then\n    sed -n '2,16p' \"$0\" | sed 's/^# \\{0,1\\}//'\n    exit 0\nfi\n\nmkdir -p \"$LOGDIR\" 2>/dev/null || true\nif [ ! -d \"$LOGDIR\" ]; then\n    echo \"paranoid-boot-record: log directory ${LOGDIR} does not exist\" >&2\n    exit 1\nfi\n\nboot_id=\"$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo unknown)\"\nkernel=\"$(uname -r 2>/dev/null || echo unknown)\"\nnow=\"$(date -u +%FT%TZ)\"\n\n# Secure Boot state. bootctl may be absent before package install; that is not an error.\nsb=\"unknown\"\nif command -v bootctl >/dev/null 2>&1; then\n    sb=\"$(bootctl status 2>/dev/null | awk -F: '/Secure Boot/{print $2; exit}' | tr -d ' ')\"\n    [ -n \"$sb\" ] || sb=\"unknown\"\nfi\n\n# Count active LUKS2 keyslots on the root container. A changed count means the header was modified.\nluksdev=\"${PARANOID_LUKSDEV:-}\"\nif [ -z \"$luksdev\" ] && command -v blkid >/dev/null 2>&1; then\n    luksdev=\"$(blkid -t TYPE=crypto_LUKS -o device 2>/dev/null | head -1)\"\nfi\nkeyslots=\"n/a\"\nif [ -n \"$luksdev\" ] && command -v cryptsetup >/dev/null 2>&1; then\n    keyslots=\"$(cryptsetup luksDump \"$luksdev\" 2>/dev/null | grep -cE '^[[:space:]]+[0-9]+: luks2')\"\nfi\n\n# Lockdown mode is a one-line summary of the boot-time kernel policy.\nlockdown=\"$(head -1 /sys/kernel/security/lockdown 2>/dev/null | tr -d '[]' | awk '{print $1}')\"\n[ -n \"$lockdown\" ] || lockdown=\"n/a\"\n\nline=\"${now} boot=${boot_id} kernel=${kernel} sb=${sb} lockdown=${lockdown} luks=${luksdev:-none} keyslots=${keyslots}\"\n\nif printf '%s\\n' \"$line\" >> \"$RECORD\" 2>/dev/null; then\n    [ -n \"${PARANOID_LOGDIR:-}\" ] && printf '%s\\n' \"$line\"   # echo when used as a test tool\n    exit 0\nfi\n\n# Fall back to stdout so the journal still captures it (systemd logs it with the unit name).\nprintf ' /* ------------------------------------------------------- config rendering */
function lineKind(path){
  if (path.startsWith('etc/apt/')) return '//';
  if (path.endsWith('ima-policy') || path.endsWith('kernel/cmdline')) return '\u0000';
  return '#';
}
function renderConfig(path){
  const a = DATA.artefacts[path];
  if (!a) return '<div class="error">Unknown artefact: ' + esc(path) + '</div>';
  const pref = lineKind(path);
  const notes = new Map(a.notes.map(n => [n.n, n.why]));
  const lines = a.content.split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i++){
    const raw = lines[i];
    const trimmed = raw.trim();
    let cls = '', body;
    if (trimmed && pref !== '\u0000' && trimmed.startsWith(pref)){
      cls = 'c'; body = esc(raw);
    } else {
      // key/value split for the first token so directives stand out
      const m = raw.match(/^(\s*)([A-Za-z0-9_@.\-\/\[\]]+)([\s=:])/);
      if (m && !raw.startsWith('#') && !raw.startsWith('//')){
        body = esc(m[1]) + '<span class="kk">' + esc(m[2]) + '</span>' + esc(raw.slice(m[1].length + m[2].length));
      } else {
        body = esc(raw);
      }
    }
    let ann = '';
    if (notes.has(i)) ann = '<span class="ann">' + esc(notes.get(i)) + '</span>';
    out.push('<span class="row" id="L' + (i+1) + '"><span class="ln">' + (i+1) + '</span>' +
             '<span class="' + cls + '">' + body + '</span>' + ann + '</span>');
  }
  return '<pre class="cfg">' + out.join('\n') + '</pre>';
}
function fileHeader(path){
  const a = DATA.artefacts[path];
  return '<div class="toolbar">' +
    '<span class="fp">/' + esc(path) + '</span>' +
    '<span class="pill">' + a.lines + ' lines</span>' +
    '<span class="pill">' + (a.isDoc ? 'documentation' : a.notes.length + ' security annotations') + '</span>' +
    '<span class="sp"></span>' +
    '<button class="tb" data-ann>annotations: ' + (state.ann ? 'on' : 'off') + '</button>' +
    '<button class="tb" data-copy="' + esc(path) + '">copy</button>' +
    '<button class="tb" data-dl="' + esc(path) + '">download</button>' +
    '</div>';
}
function fileBlock(path, opts){
  const a = DATA.artefacts[path];
  if (!a) return '';
  const o = opts || {};
  return '<details class="filecard"' + (o.open ? ' open' : '') + ' data-path="' + esc(path) + '">' +
    '<summary><span class="fp">' + esc(path) + '</span>' +
      '<span class="fm">' + a.lines + ' lines · ' +
      (a.isDoc ? 'documentation' : a.notes.length + ' notes') + '</span></summary>' +
    (a.purpose ? '<div class="fpurp">' + esc(a.purpose) + '</div>' : '') +
    '<div class="body" data-render="' + esc(path) + '"></div></details>';
}
function hydrate(root){
  root.querySelectorAll('[data-render]').forEach(el => {
    if (el.dataset.done) return;
    el.innerHTML = '<div class="toolbar">' +
        '<button class="tb" data-ann>annotations: ' + (state.ann ? 'on' : 'off') + '</button>' +
        '<span class="sp"></span>' +
        '<button class="tb" data-copy="' + esc(el.dataset.render) + '">copy</button>' +
        '<button class="tb" data-dl="' + esc(el.dataset.render) + '">download</button>' +
      '</div>' + renderConfig(el.dataset.render);
    el.dataset.done = '1';
  });
}

/* ------------------------------------------------------------- rendering */
function slugFromHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/');
  const kind = parts[0] || 'page';
  let arg = parts.slice(1).join('/');
  let line = 0;
  const qi = arg.indexOf('?');
  if (qi >= 0){
    const m = arg.slice(qi + 1).match(/(?:^|&)l=(\d+)/);
    if (m) line = parseInt(m[1], 10) || 0;
    arg = arg.slice(0, qi);
  }
  return { kind, arg: decodeURIComponent(arg), line };
}
function render(){
  const { kind, arg, line } = slugFromHash();
  const toc = $('#toc');
  toc.innerHTML = '';
  if (kind === 'file') return renderFilePage(arg, line);
  if (kind === 'files') return renderFilesPage();
  if (kind === 'controls') return renderControls();
  if (kind === 'search') return renderSearch(arg);
  return renderDoc(arg || 'README');
}

function renderDoc(slug){
  const page = DATA.pages.find(p => p.slug === slug) || DATA.pages[0];
  const view = $('#view');
  let filesHtml = '';
  if (page.files.length){
    filesHtml = '<h2 id="artefacts">Configuration files for this chapter<a class="anchor" href="#artefacts">#</a></h2>' +
      '<p class="legend">These are the exact files installed by <code>scripts/install-hardening.sh</code>. ' +
      'Annotations (<em>⟵ why this matters</em>) explain the security property each option buys; ' +
      'toggle them off to see the file exactly as it exists on disk.</p>' +
      '<div class="toolbar"><button class="tb" data-ann>annotations: ' + (state.ann ? 'on' : 'off') + '</button>' +
      '<button class="tb" id="expandAll">expand all</button>' +
      '<span class="sp"></span><span class="pill">' + page.files.length + ' files</span></div>' +
      page.files.map(f => fileBlock(f)).join('');
  }
  view.innerHTML = '<div class="crumb">Guide · ' + esc(page.title.replace(/<[^>]+>/g,'')) + '</div>' +
    page.html + filesHtml +
    '<div class="foot">Generated from <code>' + esc(DATA.generated) + '</code>. ' +
    'The page is self-contained and works offline.</div>';
  markActive(page.slug);
  // Eager: fill every file card now rather than on first expand. The content is static and the
  // whole document is ~0.5 MiB, so this costs nothing - and it means the cards are present for
  // Ctrl+P, browser find (Ctrl+F) and copy/paste, which lazy rendering would silently break.
  hydrate(view);
  buildToc(page, view);
  view.scrollTop = 0;
  window.scrollTo(0, 0);
  document.title = page.title.replace(/<[^>]+>/g,'') + ' — Hardened Debian + Apache';
}

function buildToc(page, view){

  const items = page.toc.filter(t => t.lvl === 2 || t.lvl === 3);
  let h = '<div class="grp">On this page</div>';
  items.forEach(t => { h += '<a class="l' + t.lvl + '" href="#' + t.id + '">' + esc(t.text) + '</a>'; });
  if (page.files.length) h += '<div class="grp" style="margin-top:14px">Artefacts</div><a href="#artefacts">' + page.files.length + ' files in this chapter</a>';
  toc.innerHTML = h;
  toc.querySelectorAll('a').forEach(a => a.addEventListener('click', ev => {
    const id = a.getAttribute('href').slice(1);
    const t = view.querySelector('#' + CSS.escape(id));
    if (t){ ev.preventDefault(); t.scrollIntoView({behavior:'smooth', block:'start'}); }
  }));
}

function renderFilePage(path, line){
  const a = DATA.artefacts[path];
  const view = $('#view');
  if (!a){ view.innerHTML = '<div class="error">No such artefact: ' + esc(path) + '</div>'; return; }
  view.innerHTML = '<div class="crumb">Artefacts · <span class="fp">' + esc(path) + '</span></div>' +
    '<h1 style="font-family:var(--mono);font-size:20px">' + esc(path.split('/').pop()) + '</h1>' +
    (a.purpose ? '<p style="max-width:100ch">' + esc(a.purpose) + '</p>' : '') +
    fileHeader(path) + renderConfig(path) +
    chapterLinks(path);
  markActive('');
  document.title = path + ' — Hardened Debian + Apache';
  if (line > 0){
    const row = view.querySelector('#L' + line);
    if (row){ row.classList.add('hl'); row.scrollIntoView({block:'center'}); }
  }
}
function chapterLinks(path){
  const pages = DATA.pages.filter(p => p.files.includes(path)).map(p => p.slug);
  if (!pages.length) return '';
  return '<div class="legend">Referenced by: ' + pages.map(s => {
    const t = DATA.pages.find(p => p.slug === s).title.replace(/<[^>]+>/g,'');
    return '<a href="#/page/' + s + '">' + esc(t) + '</a>';
  }).join(' · ') + '</div>';
}

function renderFilesPage(){
  const view = $('#view');
  let h = '<div class="crumb">Reference A</div><h1>All configuration files</h1>' +
    '<p>Every artefact in <code>files/</code>, grouped by purpose. Each entry opens with the file ' +
    'exactly as it will be installed, plus an inline explanation of why each effective option ' +
    'raises the security bar.</p>';
  DATA.appendix.forEach(g => {
    h += '<h2 id="' + esc(g.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()) + '">' + esc(g.title) +
         ' <span class="pill">' + g.files.length + '</span></h2>';
    h += '<div class="cb-wrap"><pre class="code"><code>' +
         g.files.map(f => '<a href="#/file/' + enc(f) + '">' + esc(f) + '</a>').join('\n') +
         '</code></pre></div>';
  });
  view.innerHTML = h;
  markActive('files');
}
function renderControls(){
  const view = $('#view');
  let h = '<div class="crumb">Reference B</div><h1>Control matrix</h1>' +
    '<p>Threat to control to artefact to the command that proves it. If a row cannot be ' +
    'demonstrated with its command, the control is not in place — that is the whole idea.</p>' +
    '<div class="tw"><table><thead><tr><th>Threat</th><th>Primary controls</th>' +
    '<th>Artefact</th><th>Verify</th></tr></thead><tbody>';
  DATA.controls.forEach(r => {
    h += '<tr><td><strong>' + esc(r[0]) + '</strong></td><td>' + esc(r[1]) + '</td>' +
         '<td>' + esc(r[2]) + '</td><td><code>' + esc(r[3]) + '</code></td></tr>';
  });
  h += '</tbody></table></div>';
  view.innerHTML = h;
  markActive('controls');
}

function search(q){
  q = q.toLowerCase().trim();
  if (q.length < 2) return { pages: [], files: [] };
  const pages = DATA.pages.filter(p =>
    p.title.toLowerCase().includes(q) || p.html.toLowerCase().includes(q));
  const files = [];
  Object.values(DATA.artefacts).forEach(a => {
    if (a.path.toLowerCase().includes(q)){ files.push({path:a.path, hit:'filename', line:0}); return; }
    const lines = a.content.toLowerCase().split('\n');
    for (let i = 0; i < lines.length && files.length < 400; i++){
      if (lines[i].includes(q)){ files.push({path:a.path, hit:lines[i].trim().slice(0,160), line:i+1}); break; }
    }
  });
  return { pages, files };
}
function renderSearch(q){
  const view = $('#view');
  const r = search(q);
  let h = '<div class="crumb">Search</div><h1>Results for “' + esc(q) + '”</h1>';
  if (!r.pages.length && !r.files.length) h += '<div class="note">Nothing matched.</div>';
  if (r.pages.length){
    h += '<h2>' + r.pages.length + ' chapter(s)</h2><div class="hits">';
    r.pages.forEach(p => {
      h += '<div class="hit"><a class="where" href="#/page/' + p.slug + '">' + p.title.replace(/<[^>]+>/g,'') + '</a></div>';
    });
    h += '</div>';
  }
  if (r.files.length){
    h += '<h2>' + r.files.length + ' configuration file(s)</h2><div class="hits">';
    r.files.forEach(f => {
      h += '<div class="hit"><a class="where" href="#/file/' + enc(f.path) + (f.line ? '?l=' + f.line : '') + '">' +
           esc(f.path) + (f.line ? ':' + f.line : '') + '</a>' +
           (f.line ? '<div class="snippet">' + esc(f.hit) + '</div>' : '') + '</div>';
    });
    h += '</div>';
  }
  view.innerHTML = h;
  markActive('');
}

/* ---------------------------------------------------------------- events */
document.addEventListener('click', e => {
  const annBtn = e.target.closest('[data-ann]');
  if (annBtn){
    state.ann = !state.ann;
    localStorage.setItem('ann', state.ann ? '1' : '0');
    document.body.classList.toggle('hideann', !state.ann);
    document.querySelectorAll('[data-ann]').forEach(b => {
      b.textContent = 'annotations: ' + (state.ann ? 'on' : 'off');
      b.classList.toggle('on', state.ann);
    });
    return;
  }
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const text = DATA.artefacts[copy.dataset.copy].content;
    const done = () => { copy.textContent = 'copied'; setTimeout(() => copy.textContent = 'copy', 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
    else { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
           document.execCommand('copy'); t.remove(); done(); }
    return;
  }
  const dl = e.target.closest('[data-dl]');
  if (dl){
    const path = dl.dataset.dl, a = DATA.artefacts[path];
    const url = URL.createObjectURL(new Blob([a.content], {type:'text/plain'}));
    const link = document.createElement('a');
    link.href = url; link.download = path.split('/').pop(); link.click();
    URL.revokeObjectURL(url);
    return;
  }
  if (e.target.id === 'expandAll'){
    const open = !state.expanded;
    state.expanded = open;
    document.querySelectorAll('details.filecard').forEach(d => { d.open = open; });
    e.target.textContent = open ? 'collapse all' : 'expand all';
    if (open) hydrate(document);
    return;
  }
});
document.addEventListener('toggle', e => {
  if (e.target.matches('details.filecard[open]')) hydrate(e.target);
}, true);

$('#q').addEventListener('input', e => {
  // Live filtering of the sidebar only. Searching file CONTENTS happens on Enter, so typing in the
  // box never yanks the reading pane out from under you.
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.nav a').forEach(a => {
    a.classList.toggle('hidden', q.length > 0 && !a.textContent.toLowerCase().includes(q));
  });
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim().length >= 2){
    location.hash = '#/search/' + encodeURIComponent(e.target.value.trim());
  }
  if (e.key === 'Escape'){
    e.target.value = '';
    document.querySelectorAll('.nav a').forEach(a => a.classList.remove('hidden'));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', render);

/* ------------------------------------------------------------------- boot */
$('#nav').innerHTML = navHtml();
render();
if (!location.hash) location.hash = '#/page/README';
</script>
