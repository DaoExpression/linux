# /etc/modprobe.d/90-blacklist-paranoid.conf
# Every entry is a device on THIS machine (see TigerLake_PCI.txt / docs/00-hardware-profile.md)
# that a headless HTTPS server does not need. Blacklisting removes the kernel code path AND the
# device from the driver's reach; it does not power the hardware off (do that in the BIOS too).
#
# Check after reboot:  lsmod | grep -E '<module>'   -> no output

# --- Discrete GPU: 01:00.0 NVIDIA TU117M [GeForce MX450] (driver: nouveau) --------------------
# Extra firmware, extra DMA master, an option ROM, and its own CVE stream. Also disable
# "switchable/Optimus graphics" in the Dell BIOS so the device is not even enumerated.
blacklist nouveau
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidiafb
blacklist drm_ttm_helper
install nouveau /bin/false
install nvidia /bin/false

# --- Audio: 00:1f.3 Smart Sound Technology ------------------------------------------------
# sof-audio-pci-intel-tgl is loaded today. No speakers, no microphone, no ALSA surface.
blacklist snd_sof_pci_intel_tgl
blacklist snd_sof_intel_hda_common
blacklist snd_sof
blacklist snd_hda_intel
blacklist snd_hda_codec
blacklist snd_hda_core
blacklist snd_pcm
blacklist snd_timer
blacklist soundcore

# --- Intel Management Engine interface: 00:16.0 (driver: mei_me) ---------------------------
# This does NOT stop the ME from running on Tiger Lake (Boot Guard fuses its region - see
# docs/00 §4). It removes the OS<->ME HECI path and its privileged device nodes from the kernel.
blacklist mei_me
blacklist mei
blacklist mei_hdcp

# --- Radios: 00:14.3 Wi-Fi 6 AX201 ---------------------------------------------------------
# Uncomment if this machine is WIRED-ONLY (blocked at rfkill as well).
# Keep it commented if Wi-Fi is your only management path, or you will lose the machine.
#blacklist iwlwifi
#blacklist iwlmvm
blacklist bluetooth
blacklist btusb
blacklist btintel
blacklist btbcm
blacklist btmtk

# --- Thunderbolt 4: 00:07.0 root port, 00:0d.2 NHI -----------------------------------------
# Uncomment only if the TB ports are genuinely never used. Firmware settings in docs/07 §1
# (User Authorization + Kernel DMA Protection) are the primary control; this is the second.
#blacklist thunderbolt
#blacklist thunderbolt_net

# --- Sensors: 00:12.0 Integrated Sensor Hub (driver: intel_ish_ipc) ------------------------
blacklist intel_ish_ipc
blacklist intel_ishtp
blacklist intel_ishtp_hid

# --- Vendor accelerators / telemetry -------------------------------------------------------
# 00:08.0 GNA scoring accelerator (no driver loaded today, blacklisted for good measure)
blacklist intel_gna
# 00:0a.0 Telemetry aggregator (intel_vsec). TIER 2: only blacklist if `dmesg | grep -i thermal`
# still shows DPTF/proc_thermal working after reboot - some firmware needs intel_vsec.
blacklist intel_vsec
blacklist pmt_telemetry
blacklist pmt_class

# --- Serial IO / SMBus / touchpad-less laptops ----------------------------------------------
# Uncomment on a racked machine with no touchpad. Check the console works without them first.
#blacklist intel_lpss_pci
#blacklist i2c_i801
#blacklist i2c_smbus

# --- Cameras ----------------------------------------------------------------------------------
blacklist uvcvideo
blacklist videobuf2_common
blacklist videobuf2_v4l2
blacklist videodev
blacklist v4l2_async

# --- Storage-by-USB  **[TIER 3]** -------------------------------------------------------------
# Only if you never plug in USB storage. Otherwise USBGuard (docs/07 §4) is the right control.
#blacklist usb_storage
#blacklist uas

# --- The SPI controller (00:1f.5) must stay UNBOUND ------------------------------------------
# Do not load intel-spi / spi-intel / mtd: those drivers can rewrite your firmware from the OS.
blacklist intel_spi
blacklist intel_spi_platform
blacklist spi_intel
blacklist spi_intel_pci
blacklist mtd
