# /etc/sysctl.d/99-paranoid.conf
# Hardened kernel parameters for a paranoid single-purpose HTTPS server.
# Installed by scripts/install-hardening.sh --tier {1|2|3}
# See docs/04-base-hardening.md §3 for the reasoning behind every block.
# Files in /etc/sysctl.d are applied in lexicographic order; 99-* is last on purpose.

# ============================================================================
# Information leaks
# ============================================================================
kernel.dmesg_restrict = 1          # only root may read the kernel ring buffer
kernel.kptr_restrict = 2           # %pK prints 0 for everyone
kernel.perf_event_paranoid = 3     # perf_events is a side-channel/info-leak tool
kernel.unprivileged_bpf_disabled = 2
net.core.bpf_jit_harden = 2
vm.unprivileged_userfaultfd = 0
kernel.yama.ptrace_scope = 2       # only root may ptrace a non-child
kernel.io_uring_disabled = 2       # io_uring: heavy CVE history, unused here
dev.tty.ldisc_autoload = 0

# ============================================================================
# Execution / memory integrity
# ============================================================================
kernel.randomize_va_space = 2
kernel.kexec_load_disabled = 1     # kexec is a boot-integrity bypass
kernel.sysrq = 0
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# ============================================================================
# Network stack
# ============================================================================
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.tcp_rfc1337 = 1           # drop RST in TIME_WAIT (RFC 1337)
net.ipv4.tcp_max_syn_backlog = 1024

# IPv6: we do not use SLAAC or redirects. Comment this whole block out if you set
# net.ipv6.conf.all.disable_ipv6 = 1 and remove the IPv6 lines from /etc/nftables.conf.
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.all.router_solicitations = 0
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.all.use_tempaddr = 2   # irrelevant without SLAAC; harmless if IPv6 is routed

# Forwarding stays OFF unless docs/08 gives you a deliberate VM/container bridge.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.forwarding = 0
net.ipv6.conf.all.forwarding = 0

# ** TIER 2 ** egress is filtered in nftables, not here. Keep this at 1 so that
# Reverse Path Filtering can actually drop spoofed reply traffic.
net.ipv4.conf.all.route_localnet = 0

# ============================================================================
# Deliberately NOT set (see docs/04 §3 - read before "improving" this file)
# ============================================================================
# kernel.unprivileged_userns_clone = 0   / user.max_user_namespaces = 0
#   -> breaks rootless podman/nspawn and systemd's PrivateUsers, which docs/08 depends on.
#      If you choose Tier 3 "no unprivileged namespaces", you must give up rootless isolation;
#      verify-hardening.sh enforces that the two decisions stay consistent.
# net.ipv4.tcp_timestamps = 0
#   -> breaks PAWS and makes retransmits worse for negligible gain.
# net.ipv6.conf.all.disable_ipv6 = 1
#   -> only if you truly have no IPv6 clients; then also strip the ip6 rules.
# kernel.modules_disabled = 1
#   -> applied late in boot by kernel-modules-lock.service (Tier 3), never from sysctl.
kernel.core_pattern = |/bin/false
