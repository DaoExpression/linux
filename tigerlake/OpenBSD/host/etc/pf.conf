##	/etc/pf.conf — gateway *gw.lab.example.org*
##
##	Validate:  pfctl -nf /etc/pf.conf
##	Load:      pfctl -f  /etc/pf.conf
##	Inspect:   pfctl -sr ; pfctl -sn ; pfctl -st ; pfctl -ss -v
##
##	pf.conf(5) requires the sections below in this order — macros, tables,
##	options, normalization, queueing, translation, filtering.  pfctl refuses
##	to load an out-of-order file, so keep additions in the right section.
##
##	HOW RULES ARE EVALUATED HERE
##	---------------------------
##	pf(4) walks the filter rules in order.  A "quick" rule ends evaluation
##	immediately, so *every policy restriction in this file is quick*, and
##	they are written as "allow the exceptions first, then quick-block the
##	rest of the zone, then fall through to a general pass".  Plain (non
##	quick) rules only remember their action and let evaluation continue; the
##	last one to match wins.  Getting this wrong is the classic way to end up
##	with a ruleset that looks right and passes everything.
##
##	Policy:
##	  * default deny, both directions, every interface
##	  * MGMT + VPN are the trusted admin networks: full lab access
##	  * USERS get the internet plus a listed set of services
##	  * GUEST gets the internet and cannot reach the lab at all
##	  * DMZ may be published and reach DNS + one database port
##	  * SRV may reach itself, the DMZ and the internet, never USERS/GUEST
##	  * all internal traffic is NATed out the WAN

###############################################################################
# MACROS
###############################################################################

# --- interfaces.  Verify names with ifconfig(8) before loading. ---
ext_if		= "igc0"		# WAN
trunk_if	= "igc1"		# 802.1Q trunk (no address of its own)

mgmt_if		= "vlan10"
user_if		= "vlan20"
guest_if	= "vlan30"
dmz_if		= "veb0"		# bridge aggregate; vmd(8) switch "dmz"
srv_if		= "veb1"		# bridge aggregate; vmd(8) switch "srv"
vpn_if		= "enc0"			# IPsec; iked(8) road warriors
install_if	= "veb2"			# vmd(8) switch "install" (provisioning)

# --- networks ---
mgmt_net	= "10.10.10.0/24"
user_net	= "10.10.20.0/24"
guest_net	= "10.10.30.0/24"
dmz_net		= "10.10.40.0/24"
srv_net		= "10.10.50.0/24"
vpn_net		= "10.10.60.0/24"
install_net	= "10.10.99.0/24"	# provisioning only (see vm.conf)

internal_nets	= "{ $mgmt_net $user_net $guest_net $dmz_net $srv_net $vpn_net $install_net }"
served_nets	= "{ $mgmt_net $user_net $dmz_net $srv_net $vpn_net }"
all_lab_ifs	= "{ $mgmt_if $user_if $guest_if $dmz_if $srv_if }"

# --- gateway addresses ---
gw_mgmt		= "10.10.10.1"
gw_user		= "10.10.20.1"
gw_guest	= "10.10.30.1"
gw_dmz		= "10.10.40.1"
gw_srv		= "10.10.50.1"
gw_vpn		= "10.10.60.1"
install_gw	= "10.10.99.1"

# --- lab hosts (keep in sync with /etc/hosts and the dns VM's zone) ---
bastion_vm	= "10.10.50.10"
dns_vm		= "10.10.50.11"
db_vm		= "10.10.50.12"
storage_vm	= "10.10.50.13"
mon_vm		= "10.10.50.14"
web_vm		= "10.10.40.20"
mail_vm		= "10.10.40.21"

# --- service groups ---
user_services	= "{ domain ssh http https smtp submission smtps imaps pop3s }"
admin_services	= "{ ssh https }"

# --- ICMP ---
icmp_types_in	= "{ echoreq echorep unreach timexceed paramprob }"
icmp_types_out	= "{ echoreq unreach timexceed paramprob }"

# --- NFS: 111 = sunrpc/rpcbind, 2049 = nfsd.  OpenBSD's mountd(8) listens on
# --- a port in the reserved range: find it with "rpcinfo -p 10.10.50.13" and
# --- add it to nfs_ports, otherwise every mount that goes through the gateway
# --- fails with "RPC: Program not registered" while local mounts keep working.
nfs_ports	= "{ 111 2049 }"

###############################################################################
# TABLES
###############################################################################

# Brute-force offenders, maintained by /usr/local/sbin/pf-ban.sh (see
# /etc/crontab).  "persist" keeps the contents across a ruleset reload.
table <bruteforce> persist

# RFC 6890 "must never appear on the wire" sources, refreshed from
# /etc/pf.bogons.  Edit that file rather than this list.
table <bogons> persist file "/etc/pf.bogons"

# Martians: destinations that can only mean a misconfigured or hostile host.
# Deliberately *excludes* 10.0.0.0/8 and 192.168.0.0/16 — the lab lives there.
table <martians> { 0.0.0.0/8 127.0.0.0/8 169.254.0.0/16 192.0.0.0/24 \
	192.0.2.0/24 198.18.0.0/15 198.51.100.0/24 224.0.0.0/3 \
	255.255.255.255/32 }

# Who may poll snmpd(8) on the gateway: only the monitoring VM.
table <monitors> { $mon_vm }

###############################################################################
# OPTIONS
###############################################################################

set skip on lo

set block-policy drop			# silence, do not answer with RST/ICMP
set state-policy floating
set reassemble yes
set optimization normal
set fingerprints "/etc/pf.os"

# Keep established flows alive across a link flap; start reclaiming states
# that are not being reused once the table grows past the adaptive window.
set timeout { tcp.established 86400, tcp.closing 60, adaptive.start 6000, adaptive.end 12000 }
set limit { states 100000, src-nodes 30000, frags 20000, tables 1000, table-entries 200000 }

set loginterface $ext_if		# counters in "pfctl -si"

# --- QUEUEING is deliberately disabled ---
#
# The "queue" keyword only loads if ALTQ is compiled into the kernel, and a
# ruleset that fails to parse leaves the gateway with *no* firewall after a
# reboot.  Enable it consciously, after verifying on the running kernel:
#
#	pfctl -nf /etc/pf.conf		# must be silent
#	dmesg | grep -i altq
#
# then, for example, to prioritise interactive traffic on a 100M WAN:
#
#	queue gm   on $ext_if bandwidth 100M
#	queue bulk parent gm bandwidth 85M default
#	queue voip parent gm bandwidth 10M
#	queue dns  parent gm bandwidth 2M
#	queue sync parent gm bandwidth 3M
#	pass out on $ext_if proto udp to any port ntp set queue dns
#	pass out on $ext_if proto tcp to any port { http https } set queue bulk
#	pass out on $ext_if proto tcp to any port { imaps submission } set queue voip

###############################################################################
# TRAFFIC NORMALIZATION
###############################################################################

# pf(4) allows exactly one scrub rule.  max-mss 1440 keeps TCP working over
# ISP links that carry PPPoE or a tunnel; no-df clears the DF bit on fragments
# that a broken path cannot handle; random-id defeats idle-window scans.
match in all scrub (no-df random-id max-mss 1440)

###############################################################################
# TRANSLATION
###############################################################################

# --- NAT out the WAN --------------------------------------------------------
# One rule for every internal network.  It matches only outbound traffic on
# the WAN, so lab-internal traffic is never translated.
match out on $ext_if inet from $internal_nets to any nat-to ($ext_if)

# --- Published services: WAN -> DMZ VMs -------------------------------------
# "to ($ext_if)" tracks whatever address the ISP hands out.
#
# Web is NOT redirected: relayd(8) terminates TLS on the gateway itself and
# proxies to the web VM (see relayd.conf), so those connections are addressed
# to the gateway and only need a pass rule below.
#
# Mail is redirected straight through to the mail VM, which holds its own
# certificates — SMTP STARTTLS must stay end-to-end.
match in on $ext_if proto tcp from any to ($ext_if) port { smtp submission smtps } \
	rdr-to $mail_vm
match in on $ext_if proto tcp from any to ($ext_if) port { imaps pop3s } \
	rdr-to $mail_vm

# SSH is NOT published on the WAN.  If you must, send it to the bastion (which
# has its own stricter sshd_config), never to the gateway itself:
#match in on $ext_if proto tcp from any to ($ext_if) port ssh rdr-to $bastion_vm

# --- ftp-proxy(8) -----------------------------------------------------------
# ftpd(8) on the gateway serves the OpenBSD install sets; the data connections
# are proxied through this anchor.  (divert-to on a pass rule is the modern
# equivalent; rdr-to here keeps it in the translation section.)
match in on $ext_if proto tcp from any to ($ext_if) port ftp rdr-to 127.0.0.1 port 8021
anchor "ftp-proxy/*"

# relayd(8) only needs its own anchor if you use "redirect" (layer 3) blocks.
# This file uses "relay" (layer 7, a userland proxy), so it is not required;
# keep it commented until you add a redirect section to relayd.conf.
#anchor "relayd/*"

###############################################################################
# FILTERING
###############################################################################

# --- anti-spoofing ----------------------------------------------------------
# Blocks sources claiming to be from a directly-connected network when they
# arrive on the wrong interface, plus packets carrying an interface's own
# address as their source from anywhere else.
antispoof quick for { $ext_if $mgmt_if $user_if $guest_if $srv_if $dmz_if }

# Spoofed sources that have no route back (asymmetric routing).
block in quick from urpf-failed

# --- default deny -----------------------------------------------------------
block all

# --- cheap wins, evaluated before anything else -----------------------------
# Bogons and martians arriving from the ISP.
block drop in log quick on $ext_if from <bogons> to any
block drop in log quick on $ext_if from any to <martians>
# Same check inside: an internal host cannot be the loopback network.
block drop in log quick on $all_lab_ifs from <martians> to any
# Known offenders (pf-ban.sh maintains the table).
block drop in log quick from <bruteforce> to any
# Port scans: a bare SYN/FIN/RST combination is never a legitimate packet.
block drop in log quick proto tcp from any to any flags FUP/FUP

# --- infrastructure that must work on every internal interface --------------
# DHCP.  The request arrives from 0.0.0.0:68 to 255.255.255.255:67, which
# matches nothing else in this file; without these rules dhcpd(8) never sees a
# request and every client on the segment times out.  The outbound rule is
# spelled out rather than relying on state for the broadcast reply.
pass in quick on { $user_if $guest_if } proto udp from any port bootpc to any port bootps
pass out quick on { $user_if $guest_if } proto udp from any port bootps to any port bootpc
pass out quick on $ext_if proto udp from any port bootpc to any port bootps
pass in quick on $ext_if proto udp from any port bootps to any port bootpc
# IPv6 neighbour/router discovery, SLAAC and RA on the internal segments.
pass quick on $all_lab_ifs inet6 proto icmp6 all
# WAN IPv6: the minimum for autoconf to work at all, plus path-MTU signalling.
pass in quick on $ext_if inet6 proto icmp6 \
	icmp6-type { routersol routeradv neighbrsol neighbradv toobig echoreq echorep }
# sshd(8) on the gateway is not reachable from the install network either; an
# installing guest is untrusted until its own configuration is deployed.

# --- WAN: published services ------------------------------------------------
# A redirect does not authorise a packet — these rules do, and these are the
# ones to audit.
#
# Web: relayd(8) is a userland proxy listening on the gateway's own address.
pass in quick on $ext_if proto tcp from any to ($ext_if) port { http https } keep state
# Mail: the rdr rule above rewrote the destination, so the rule sees $mail_vm.
pass in on $ext_if proto tcp from any to $mail_vm \
	port { smtp submission smtps imaps pop3s } keep state
# Reachability and PMTU for off-site clients.
pass in on $ext_if inet proto icmp icmp-type $icmp_types_in keep state
# IKEv2: 500/udp for negotiation, 4500/udp for NAT-T, plus raw ESP/AH.
pass in on $ext_if proto udp from any to ($ext_if) port { 500 4500 } keep state
pass in on $ext_if proto { esp ah } from any to ($ext_if) keep state

# --- outbound: everything the gateway itself originates --------------------
# Forwarded traffic is already covered by the state created by the "pass in"
# rules below; these rules cover traffic born on the gateway (DNS, NTP,
# AXFR, package updates, backups) and are the reason the box can still work
# when a state table entry has expired.
pass out on $ext_if inet keep state
pass out on $ext_if inet6 keep state
pass out on $all_lab_ifs keep state

# --- MGMT: the trusted control plane ---------------------------------------
# Admin hosts may reach the gateway's own services...
pass in quick on $mgmt_if proto tcp from $mgmt_net to $gw_mgmt port { ssh domain http https } keep state
pass in quick on $mgmt_if proto udp from $mgmt_net to $gw_mgmt port { domain ntp } keep state
# ...manage every VM over ssh/https...
pass in quick on $mgmt_if proto tcp from $mgmt_net to $served_nets port $admin_services keep state
# ...mount the shared storage and query the lab resolver directly...
pass in quick on $mgmt_if proto { tcp udp } from $mgmt_net to $storage_vm port $nfs_ports keep state
pass in quick on $mgmt_if proto { tcp udp } from $mgmt_net to $dns_vm port domain keep state
# ...and ping.  Beyond that, MGMT is treated as the lab: full access, because
# that is what an admin network is for.  Tighten by deleting this line.
pass in quick on $mgmt_if from $mgmt_net to $internal_nets keep state
pass in on $mgmt_if from $mgmt_net to any keep state

# --- VPN: same trust level as MGMT, reached over enc0 ----------------------
# iked(8) authenticates the peer before anything is decapsulated, so the pool
# is one trusted-but-remote admin network.
pass in quick on $vpn_if from $vpn_net to $internal_nets keep state
pass in on $vpn_if from $vpn_net to any keep state

# --- USERS: internet plus a listed set of lab services ---------------------
# Exceptions first (quick), then the quick block that closes the rest of the
# lab, and finally the general pass that makes the internet work.
pass in quick on $user_if proto tcp from $user_net to $srv_net port $user_services keep state
pass in quick on $user_if proto { tcp udp } from $user_net to $dns_vm port domain keep state
pass in quick on $user_if proto { tcp udp } from $user_net to $storage_vm port $nfs_ports keep state
pass in quick on $user_if proto tcp from $user_net to $dmz_net port { http https } keep state
pass in quick on $user_if proto { tcp udp } from $user_net to $gw_user port { domain ntp } keep state
pass in quick on $user_if proto icmp from $user_net to any icmp-type $icmp_types_in keep state
block drop in log quick on $user_if from $user_net to $internal_nets
pass in on $user_if from $user_net to any keep state

# --- GUEST: internet only ---------------------------------------------------
# Guests reach the resolver for lookups and nothing else in the lab.  The
# quick block that follows is what implements client isolation; the general
# pass then gives them the internet (NATed by the rule above).
pass in quick on $guest_if proto { tcp udp } from $guest_net to $dns_vm port domain keep state
pass in quick on $guest_if proto udp from $guest_net to any port ntp keep state
pass in quick on $guest_if proto icmp from $guest_net to any icmp-type $icmp_types_in keep state
block drop in log quick on $guest_if from $guest_net to $internal_nets
pass in on $guest_if from $guest_net to any keep state
# To restrict guests to web browsing only, replace the line above with the
# strict-egress variant in /etc/examples/pf.conf.example-strict-egress.

# --- DMZ: published VMs -----------------------------------------------------
# Managed from SRV and MGMT, allowed to resolve through the lab DNS, allowed
# one database port (web -> db) and nothing else internal.
pass in quick on $dmz_if proto tcp from $srv_net to $dmz_net port $admin_services keep state
pass in quick on $dmz_if proto tcp from $mgmt_net to $dmz_net port $admin_services keep state
pass in quick on $dmz_if proto { tcp udp } from $dmz_net to $dns_vm port domain keep state
pass in quick on $dmz_if proto { tcp udp } from $dmz_net to $gw_dmz port { domain ntp } keep state
pass in quick on $dmz_if proto tcp from $web_vm to $db_vm port 5432 keep state
# The mail VM keeps its mailboxes locally; if you move them onto NFS, add:
#pass in quick on $dmz_if proto { tcp udp } from $mail_vm to $storage_vm port $nfs_ports keep state
pass in quick on $dmz_if proto icmp from $dmz_net to any icmp-type $icmp_types_in keep state
block drop in log quick on $dmz_if from $dmz_net to { $mgmt_net $user_net $guest_net $srv_net }
pass in on $dmz_if from $dmz_net to any keep state

# --- SRV: internal servers --------------------------------------------------
# Servers talk to each other freely.  This rule is not cosmetic: pf(4) filters
# traffic switched across bridge(4)/veb(4) members, so VM-to-VM flows on veb1
# really are evaluated against this file.
pass in quick on $srv_if from $srv_net to $srv_net keep state
pass in quick on $srv_if proto tcp from $srv_net to $dmz_net \
	port { ssh http https smtp submission } keep state
# Monitoring: the mon VM polls agentless SNMP on the gateway and the guests,
# plus the gateway's status page (8081) and the well-known exporter ports
# (9100 node_exporter, 9101 another, 9113 nginx/relayd exporter).
pass in quick on $srv_if proto udp from <monitors> to { $mgmt_net $dmz_net $gw_srv } port snmp keep state
pass in quick on $srv_if proto tcp from $mon_vm to { $mgmt_net $dmz_net $gw_srv } \
	port { 9100 9101 9113 8081 } keep state
pass in quick on $srv_if proto icmp from $srv_net to any icmp-type $icmp_types_in keep state
# Internal servers never reach the client networks.
block drop in log quick on $srv_if from $srv_net to { $user_net $guest_net }
pass in on $srv_if from $srv_net to any keep state

# --- PROVISIONING: the install network ---------------------------------------
# vmd(8) switch "install" / veb2 (10.10.99.0/24).  An installing guest needs
# exactly four things.  Once every guest is built you can drop this whole
# block (and bring veb2 down); nothing else in the file references it.
pass in quick on $install_if proto udp from any port bootpc to any port bootps
pass out quick on $install_if proto udp from any port bootps to any port bootpc
pass in quick on $install_if proto { tcp udp } from $install_net to $install_gw port domain
pass in quick on $install_if proto tcp from $install_net to $install_gw port http keep state
pass in quick on $install_if proto udp from $install_net to $install_gw port ntp keep state
# The installer may need to reach the internet for a package at the end of the
# install; NAT covers it because $install_net is in $internal_nets.
block drop in log quick on $install_if from $install_net to $internal_nets

# --- logging ----------------------------------------------------------------
# Only rules marked "log" write to pflog0.  Read them with:
#	tcpdump -n -e -ttt -i pflog0
# or watch the counters per rule:
#	pfctl -vsr
