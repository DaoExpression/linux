# /etc/containers/containers.conf
# Hardened defaults for rootless podman on this host. See docs/08 §3.
# These are DEFAULTS: they apply to every container you run, which is the point - you cannot
# forget to harden a container you started at 3 a.m.

[containers]
# Drop every capability except binding a low port. Rootless containers cannot gain
# capabilities you do not have anyway; this closes the door on the rootful-socket mistake.
default_capabilities = ["CAP_NET_BIND_SERVICE"]

# Namespace isolation: one container cannot see another's processes, IPC or hostname.
ipcns = "private"
pidns = "private"
utsns = "private"
userns = "auto"
cgroupns = "private"

# Do not leak the host's /etc/hosts or environment into containers.
no_hosts = true
env_host = false
env_host_files = []

# Run a minimal init so signals and zombies are handled properly.
init = true

# Keep the default seccomp profile. Never set "unconfined".
seccomp_profile = "default"

# Publish ports on 127.0.0.1 by default. If you need a public port, say so explicitly per container.
# (nftables is the real gate anyway - docs/05.)
publish_ports = "127.0.0.1"

[network]
# Rootless networking via pasta/slirp4netns, subject to the host's egress rules.
default_network = "pasta:--no-map-gw"

[engine]
# Rootless only. Do NOT enable the system (rootful) socket: /run/podman/podman.sock is
# root-equivalent and a web app with access to it owns this machine.
# Podman in this build is used as an unprivileged user, never as a service.
runtime = "crun"
# Never pull from a registry without checking signatures where you can:
# use digest-pinned images:  podman run docker.io/library/nginx@sha256:<digest>
