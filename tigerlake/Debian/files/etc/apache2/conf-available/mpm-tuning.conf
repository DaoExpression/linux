# /etc/apache2/conf-available/mpm-tuning.conf
# MPM tuning. Small, bounded, predictable: a single-purpose HTTPS server on 4 cores/8 threads does
# not need Apache's defaults, and a smaller worker pool is a smaller resource-exhaustion target.
# See docs/06 §2 and §3.
#
# Requires mpm_event (a2dismod mpm_prefork mpm_worker; a2enmod mpm_event).
# Validate:  sudo apache2ctl -M | grep mpm   ->  mpm_event_module (shared)

<IfModule mpm_event_module>
    # Threads, not processes: event MPM keeps connections cheap.
    StartServers             2
    MinSpareThreads         16
    MaxSpareThreads         48
    ThreadsPerChild         16
    # Hard ceilings: 4 * 16 = 64 concurrent request workers, with 32 kept for TLS/keepalive.
    ServerLimit             4
    MaxRequestWorkers       64
    MaxConnectionsPerChild  1000     # periodic worker recycling: contains slow leaks
    # Graceful shutdown timing so a reload does not drop connections.
    GracefulShutdownTimeout 30
    # Do NOT raise these to "handle more traffic" without also raising nftables per-source limits
    # (docs/05 §2) and checking memory: each worker holds its own buffers.
</IfModule>

# Timeouts that pair with RequestReadTimeout in apache2.conf to blunt slow-client attacks.
TimeOut 30
