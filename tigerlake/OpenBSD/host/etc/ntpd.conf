#	/etc/ntpd.conf — gateway
#
#	Validate:  ntpd -n
#	Apply:     rcctl restart ntpd
#	Inspect:   ntpctl -s status ; ntpctl -s peers
#
#	The gateway is the lab's time source: dhcpd(8) and radvd(8) point every
#	client at it, and the guests sync to it.  It in turn syncs to public
#	pool servers over the WAN.

# --- serve the lab ------------------------------------------------------------
# Bind only on the lab addresses.  Listening on "*" would also open UDP/123 on
# the WAN; pf.conf drops that traffic anyway, but not binding at all is the
# cleaner choice.
listen on 127.0.0.1
listen on ::1
listen on 10.10.10.1
listen on 10.10.20.1
listen on 10.10.30.1
listen on 10.10.40.1
listen on 10.10.50.1

# --- upstream ----------------------------------------------------------------
# A pool spreads the load and survives one bad server.  If your ISP runs a
# stratum-2 close by, put it first and keep the pool as a fallback — it is
# usually worth 10–20ms of accuracy.
#server 10.0.0.1
servers pool.ntp.org

# --- local sensors -------------------------------------------------------------
# If the box has temperature sensors (many Tiger Lake boards do), ntpd can
# read them as a drift reference.  Harmless to leave commented on a machine
# without any: an empty sensor list is not an error, but a wrong one is noise.
sensor *

# --- validation ---------------------------------------------------------------
# ntpd(8) can validate the TLS certificates of an HTTPS time source, which
# makes the constraint much harder to spoof in transit.  Enable it only if the
# lab's resolver can reach the outside world during boot; otherwise ntpd will
# refuse to sync for the entire constraint interval.
#constraints from "https://www.google.com"
