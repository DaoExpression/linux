# =============================================================================
# sysctl.conf - kernel runtime hardening for the Tiger Lake i3 desktop
# (Gentoo, OpenRC)
#
# Install as /etc/sysctl.conf, or as /etc/sysctl.d/99-tigerlake.conf and make
# sure `sysctl --system` runs at boot (the OpenRC sysctl service does this).
# Apply without rebooting:  sysctl --system
#
# Every key below is backed by an option enabled in the kernel config in this
# directory (Yama, KEXEC, perf events, io_uring, IPv6, SECCOMP, BPF).
#
# Lines marked "TRADEOFF" change behaviour you may notice; each has a comment
# explaining how to relax it.
# =============================================================================

# --- Kernel attack surface / information leaks ------------------------------
kernel.randomize_va_space = 2
# 2 hides kernel pointers from all users (0 = visible). Leaving at 2 can make
# some bug reports less informative.
kernel.kptr_restrict = 2
# Only root can read the kernel ring buffer (unprivileged dmesg() fails).
kernel.dmesg_restrict = 1
# 3 = disallow perf(2) even for most users. TRADEOFF: perf/powertop profiling
# needs root; lower to 2 or 1 if you profile locally as a normal user.
kernel.perf_event_paranoid = 3
# kexec(2) can load a replacement kernel - close it. To use kexec later, write
# 0 here and reboot.
kernel.kexec_load_disabled = 1
# 1 = only a process's own descendants may be ptrace()d (needs CAP_SYS_PTRACE
# otherwise). TRADEOFF: attaching gdb/strace to an unrelated process, and some
# Wine/Proton debug paths, need 0. `sysctl kernel.yama.ptrace_scope=0` to relax.
kernel.yama.ptrace_scope = 1
# 2 = io_uring(2) disabled for everyone. TRADEOFF: a few high-throughput apps
# (some DBs, benchmark tools) use it; set to 1 to allow it only for root.
kernel.io_uring_disabled = 2
# SysRq restricted to sync (16) + remount-ro (32) + reboot (128) = 176, so the
# magic REISUB recovery still works on a hung laptop without the dangerous ops.
kernel.sysrq = 176
# eBPF is enabled (containers/network tooling need it); restrict it to root
# and harden the JIT. TRADEOFF: unprivileged bpftrace/ftrace tooling needs 0.
kernel.unprivileged_bpf_disabled = 1

# --- Filesystem / SUID protections -------------------------------------------
# Standard /proc/sys/fs hardening against symlink/hardlink/fifo races.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# Never write core dumps for set-uid/capability binaries.
fs.suid_dumpable = 0

# --- Kernel module / TTY surface --------------------------------------------
# Do not let anyone autoload TTY line disciplines (a privilege-escalation
# vector); modules must be loaded explicitly.
dev.tty.ldisc_autoload = 0

# --- Network (IPv4) ----------------------------------------------------------
# This is a workstation, not a router.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.forwarding = 0
net.ipv4.conf.default.forwarding = 0
# Ignore ICMP redirects and source-routed packets; never send redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
# Strict reverse-path filtering. TRADEOFF: strict (1) can drop packets on some
# VPN / policy-routing setups; use 2 (loose) if you see one-way traffic.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Log impossible (martian) source addresses, and ignore bogus ICMP.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# SYN-flood protection and RFC 1337 (drop RST for TIME_WAIT).
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
# Harden the eBPF JIT against spraying (2 = force blinding).
net.core.bpf_jit_harden = 2

# --- Network (IPv6) ----------------------------------------------------------
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Prefer temporary (privacy) addresses for outbound connections on this laptop.
# accept_ra is deliberately left at its default so SLAAC keeps working.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# --- Desktop / laptop tuning (not security) ----------------------------------
# Low swappiness keeps the 16 GiB of RAM in use instead of paging early.
vm.swappiness = 10
# Favour keeping dentry/inode cache over reclaiming it.
vm.vfs_cache_pressure = 50
# Flush dirty pages in smaller batches - friendlier latency, safer on a laptop.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
# Higher map count helps Wine/Proton games allocate their address space.
vm.max_map_count = 1048576
# More inotify watches for editors/file-watchers and dev tooling.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
