# /etc/apache2/mods-available/security2.conf
# mod_security3 wiring. Enabled by a2enmod security2 (harden-apache.sh does it).
# See docs/06 §8.
#
# Validate:  sudo apache2ctl configtest
# Tune:      read /var/log/apache2/modsec_audit.log for 24-48h, then narrow the rules you exclude.

<IfModule security2_module>
    # --- engine mode ---
    # 'On' is the destination. Start at 'DetectionOnly' for your first tuning pass ONLY, then switch.
    SecRuleEngine On

    # --- request handling ---
    SecRequestBodyAccess On
    SecRequestBodyLimit 131072              # 128 KiB: matches the LimitRequestBody intent
    SecRequestBodyNoFilesLimit 131072
    SecRequestBodyInMemoryLimit 131072
    SecRequestBodyLimitAction Reject        # do not just log an oversized body
    SecResponseBodyAccess Off               # response inspection is expensive, rarely pays off here
    #SecResponseBodyLimit 524288
    #SecResponseBodyMimeType text/plain text/html

    # --- ReDoS protection (PCRE limits) ---
    SecPcreMatchLimit 100000
    SecPcreMatchLimitRecursion 100000
    SecDebugLogLevel 0                      # NEVER debug-log request bodies on a public server
    SecDebugLog /var/log/apache2/modsec_debug.log

    # --- audit logging ---
    SecAuditEngine RelevantOnly
    SecAuditLogRelevantStatus "^(?:5|4(?!04))"   # 5xx and 4xx except 404 (404 floods are noise)
    # Parts: A=audit header, B=request headers, I=request body (intervention only), F=response
    # headers, H=audit trailer, Z=final boundary. Deliberately NO 'C'/'E' (full body content).
    SecAuditLogParts ABIFHZ
    SecAuditLogType Serial
    SecAuditLog /var/log/apache2/modsec_audit.log
    SecAuditLogStorageDir /var/log/apache2/audit

    # --- temporary/upload dirs: inside the unit's PrivateTmp-visible paths, root-only ---
    SecDataDir /var/cache/apache2/mod_security2
    SecTmpDir /var/cache/apache2/mod_security2
    SecUploadDir /var/cache/apache2/mod_security2
    SecUploadKeepFiles Off                  # never retain uploaded files

    # --- default action: deny and log, do not pass the request through ---
    SecDefaultAction "phase:1,log,auditlog,deny,status:403"
    SecDefaultAction "phase:2,log,auditlog,deny,status:403"

    # --- rule sources ---
    IncludeOptional /etc/modsecurity/modsecurity.conf
    IncludeOptional /usr/share/modsecurity-crs/*.load
    IncludeOptional /etc/modsecurity/crs/*.conf
</IfModule>
