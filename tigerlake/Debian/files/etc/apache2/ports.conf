# /etc/apache2/ports.conf
# Only 443 is open. See docs/06 §3 and docs/05 §2.

# The nftables ruleset (files/etc/nftables.conf) only allows 443 through; listening here is belt
# and braces so that a future config mistake cannot expose a plaintext port.
Listen 443

<IfModule ssl_module>
    # Nothing extra: TLS is configured per-vhost / in conf-available/tls-hardening.conf.
</IfModule>

# ---------------------------------------------------------------------------
# Port 80: NEEDED ONLY FOR HTTP-01 ACME VALIDATION.
# docs/06 §4 recommends DNS-01, which needs no inbound port at all. If you use DNS-01, leave this
# commented AND remove the port-80 rules from /etc/nftables.conf. A closed port 80 is strictly
# better: less attack surface, no plaintext redirect logic, one fewer vhost to get wrong.
# ---------------------------------------------------------------------------
#Listen 80
#
# If you do need it, keep the vhost to exactly one job: redirect to HTTPS, and serve
# /.well-known/acme-challenge/ from a dedicated directory. No content, no app, no headers.
