"apparmor\";\n        \"aide\";\n        \"fwupd\";\n        \"intel-microcode\";\n};\n\nUnattended-Upgrade::DevRelease \"false\";\nUnattended-Upgrade::AutoFixInterruptedDpkg \"true\";\nUnattended-Upgrade::MinimalSteps \"true\";\nUnattended-Upgrade::Remove-Unused-Kernel-Packages \"false\";\nUnattended-Upgrade::Remove-New-Unused-Dependencies \"true\";\nUnattended-Upgrade::Remove-Unused-Dependencies \"false\";\n\n// NEVER reboot automatically on a server: you cannot enter the LUKS passphrase from a cron job.\nUnattended-Upgrade::Automatic-Reboot \"false\";\nUnattended-Upgrade::Automatic-Reboot-WithUsers \"false\";\n\n// No mail daemon is installed by design; results land in the journal and /var/log/unattended-upgrades.\nUnattended-Upgrade::MailReport \"on-change\";\nUnattended-Upgrade::SyslogEnable \"true\";\nUnattended-Upgrade::SyslogFacility \"daemon\";\n\n// Read the changelogs before they are applied.\nUnattended-Upgrade::InstallOnShutdown \"false\";\n", "lines": 45, "purpose": "Security updates land automatically; everything else stays a human decision, and nothing reboots itself.", "notes": [{"n": 11, "why": "Kernel, web server, firewall, SSH and microcode updates wait for a human - these can break a boot or a service."}, {"n": 23, "why": "Deliberately attended: a microcode update changes CPU behaviour and is worth a reboot you are watching."}, {"n": 30, "why": "Does not silently remove packages you might be relying on."}, {"n": 31, "why": "Does not silently remove packages you might be relying on."}, {"n": 34, "why": "A server that reboots itself cannot be unlocked at the LUKS prompt - it would stay down."}, {"n": 38, "why": "Results are recorded locally because no mail daemon is installed by design."}, {"n": 39, "why": "Results are recorded locally because no mail daemon is installed by design."}], "annPrefix": "//", "isDoc": false}, "etc/apt/apt.conf.d/99-paranoid": {"path": "etc/apt/apt.conf.d/99-paranoid", "content": "// /etc/apt/apt.conf.d/99-paranoid\n// Package-manager hardening. See docs/04 §9 and docs/09 §2.\n// Inspect the effective settings with:  apt-config dump | grep -E 'Install-Recommends|Valid-Until'\n\n// --- \"install only necessary software\", enforced rather than promised ---\nAPT::Get::Install-Recommends \"false\";\nAPT::Get::Install-Suggests \"false\";\nAPT::Get::AllowUnauthenticated \"false\";\nAPT::Get::AutomaticRemove \"true\";\nBinary::apt::APT::Keep-Downloaded-Packages \"false\";\n\n// --- do not install from a repository whose metadata is stale or unsigned ---\nAcquire::AllowInsecureRepositories \"false\";\nAcquire::AllowDowngradeToInsecureRepositories \"false\";\nAcquire::Check-Valid-Until \"true\";\nAcquire::Max-ValidTime \"604800\";      // 7 days: refuse metadata older than this\nAcquire::Min-ValidTime \"0\";\nAcquire::Retries \"3\";\nAcquire::http::AllowRedirect \"false\";\nAcquire::https::Verify-Peer \"true\";\nAcquire::https::Verify-Host \"true\";\nAcquire::https::CaInfo \"/etc/ssl/certs/ca-certificates.crt\";\nAcquire::Languages \"none\";            // no translation files downloaded or stored\n\n// --- keep the environment clean (no LD_PRELOAD/APT_CONFIG injection via sudo) ---\nAPT::Sanitize-Environment \"true\";\n\n// --- never let apt/dpkg run a maintainer script with a poisoned PATH ---\nDPkg::Path \"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\";\nDPkg::Pre-Install-Pkgs { \"/usr/sbin/dpkg-preconfigure --apt || true\"; };\n\n// --- after every dpkg run, re-sign the UKI if the kernel changed (docs/03 §2 Path A) ---\nDPkg::Post-Invoke { \"/usr/local/sbin/sign-uki-hook || true\"; };\n", "lines": 34, "purpose": "Package-manager hardening: no unauthenticated packages, no stale metadata, no recommends-driven bloat, verified transport.", "notes": [{"n": 5, "why": "Enforces the 'only necessary software' policy mechanically instead of trusting memory."}, {"n": 6, "why": "Suggestions are the other half of the same bloat problem."}, {"n": 7, "why": "Refuses any package whose signature cannot be verified - no 'just this once'."}, {"n": 9, "why": "Downloaded .debs are discarded: one less place for a tampered package to wait."}, {"n": 12, "why": "No insecure repo and no deliberate downgrade to an unsigned one - both are classic supply-chain paths."}, {"n": 13, "why": "No insecure repo and no deliberate downgrade to an unsigned one - both are classic supply-chain paths."}, {"n": 14, "why": "Refuses metadata past its expiry, which defeats replay of an old, vulnerable index."}, {"n": 15, "why": "A seven-day ceiling makes stale-mirror attacks impractical."}, {"n": 18, "why": "A redirected package download is indistinguishable from a legitimate one; refusing makes it not happen."}, {"n": 19, "why": "Verifies the mirror's certificate and hostname, so a network attacker cannot serve you packages."}, {"n": 20, "why": "Verifies the mirror's certificate and hostname, so a network attacker cannot serve you packages."}, {"n": 21, "why": "Verifies the mirror's certificate and hostname, so a network attacker cannot serve you packages."}, {"n": 22, "why": "No translation files: smaller attack surface and fewer files to keep track of."}, {"n": 25, "why": "Clears APT_CONFIG and friends so sudo cannot be used to inject configuration."}, {"n": 28, "why": "A pinned PATH for maintainer scripts, which run as root."}, {"n": 32, "why": "Re-signs the kernel image after any package change, so an upgrade cannot leave you with an unbootable signed-boot machine."}], "annPrefix": "//", "isDoc": false}, "etc/audit/audisp-remote.conf": {"path": "etc/audit/audisp-remote.conf", "content": "# /etc/audit/audisp-remote.conf\n# Off-box audit shipping. Rationale (docs/01 T4, docs/10): an attacker with root on this machine\n# can edit or delete local logs. A copy that left the machine before they arrived cannot be edited.\n#\n# Set remote_server to YOUR collector, then flip au-remote.conf to active = yes and restart auditd.\n# The collector should be a different machine (a small VM elsewhere) that only accepts audit traffic.\n\nremote_server = 10.66.0.2\nport = 60\nlocal_port = 60\ntransport = tcp\nmode = immediate\nqueue_file = /var/spool/audit/remote.log\n## Keep local records if the network is down rather than dropping them:\nqueue_depth = 2048\nformat = managed\nnetwork_retry_time = 1\nmax_tries_per_record = 3\nmax_time_per_record = 5\nheartbeat_timeout = 0\n## Do not let a network outage block auditing:\ndisk_low_action = ignore\ndisk_full_action = stop\ndisk_error_action = warn_once_per_hour\nremote_ending_action = reconnect\ngeneric_error_action = syslog\ngeneric_warning_action = syslog\nqueue_error_action = stop\nverify = yes\n## TLS: enable it. The collector must present a certificate you trust.\nenable_krb5 = no\nkrb5_principal = auditd\nkrb5_key_file = /etc/audit/audisp-remote.key\n## For TLS, use a local wrapper/gssproxy or run the collector inside the WireGuard plane\n## (docs/05 §5) - that is the simple, auditable option we recommend here.\n", "lines": 36, "purpose": "Ships the audit trail off-box, where a root-level attacker on this machine cannot edit it.", "notes": [{"n": 7, "why": "Point this at a different machine: a copy that left this host cannot be edited by root on this host."}, {"n": 11, "why": "Ships events as they happen, which minimises what an attacker can destroy in the window before detection."}, {"n": 14, "why": "Events are queued when the network is down rather than dropped - the gap in the trail is the attacker's friend."}, {"n": 22, "why": "Fails closed rather than losing records silently."}, {"n": 27, "why": "Fails closed rather than losing records silently."}, {"n": 28, "why": "Refuses to send to a collector it cannot authenticate."}], "annPrefix": "#", "isDoc": false}, "etc/audit/auditd.conf": {"path": "etc/audit/auditd.conf", "content": "# /etc/audit/auditd.conf\n# Audit log handling. The important properties: never overwrite history, never silently drop,\n# keep the file root-only, and make overflow visible.\n#\n# Read with:  sudo ausearch -k apache-config -ts recent  /  sudo aureport --summary\n\nlog_file = /var/log/audit/audit.log\nlog_group = root\nlog_format = ENRICHED\nflush = incremental\nfreq = 100\nnum_logs = 12\nmax_log_file = 64\nmax_log_file_action = ROTATE\nspace_left = 512\nspace_left_action = email\nverify_email = yes\naction_mail_acct = root\nadmin_space_left = 128\nadmin_space_left_action = single\ndisk_full_action = single\ndisk_error_action = single\n## SUSPEND would stop logging without stopping the machine (silent gap). 'single' halts into\n## single-user mode instead: loud, and it requires a console + LUKS passphrase to continue.\nuse_libwrap = no\ntcp_listen_port = 0\ntcp_listen_queue = 5\ntcp_max_per_addr = 1\ntcp_client_max_idle = 0\ntransport = TCP\n## Distribution of the audit log to the remote collector is configured in audisp-remote.conf.\nname_format = HOSTNAME\nname = srv-01\ndisp_qos = lossy\ndispatcher = /sbin/audispd\noverflow_action = SYSLOG\nmax_restarts = 10\nplugin_dir = /etc/audit/plugins.d\nend_of_event_timeout = 2\n\n# Single-user mode with a locked root account is a bit of a contradiction; the intended recovery is\n# the physical console with the LUKS passphrase and the admin account. Verify you can actually get\n# in before relying on it (docs/10 §6).\n", "lines": 44, "purpose": "Never overwrite history, never silently drop events, and refuse to continue quietly when the disk fills.", "notes": [{"n": 7, "why": "Only root can read the audit trail - it contains usernames, paths and command lines."}, {"n": 9, "why": "Frequent flushes mean a crash does not take the last seconds of evidence with it."}, {"n": 11, "why": "Keeps twelve rotations on hand, which is the difference between investigating and guessing."}, {"n": 13, "why": "Rotates instead of overwriting: history is preserved rather than silently discarded."}, {"n": 15, "why": "Early warning before the log volume becomes an availability problem."}, {"n": 19, "why": "Refuses to keep running with almost no space to record what happens next."}, {"n": 20, "why": "When the disk fills, the machine stops loudly instead of continuing to run blind."}, {"n": 21, "why": "An I/O error on the log volume is a serious event, not something to shrug off."}, {"n": 25, "why": "This host does not accept audit logs from anywhere; no listening audit port at all."}, {"n": 33, "why": "Back-pressure rather than silent loss when the collector cannot keep up."}, {"n": 35, "why": "Back-pressure rather than silent loss when the collector cannot keep up."}], "annPrefix": "#", "isDoc": false}, "etc/audit/plugins.d/au-remote.conf": {"path": "etc/audit/plugins.d/au-remote.conf", "content": "# /etc/audit/plugins.d/au-remote.conf\n# Ships log events to /etc/audit/audisp-remote.conf's remote_server. ACTIVE BY DEFAULT ONLY IF YOU\n# SET THE DESTINATION - docs/04 §7 shows the two commands. Local logging continues regardless.\n\nactive = no\ndirection = out\npath = /sbin/audisp-remote\ntype = always\nformat = string\nargs =\n", "lines": 11, "purpose": "", "notes": [{"n": 4, "why": "Ships disabled by default: it is enabled deliberately once a collector is configured (docs/04 section 7)."}, {"n": 5, "why": "This host sends events; it never accepts audit data from anywhere."}, {"n": 7, "why": "Runs for the whole life of auditd, including during early boot events."}], "annPrefix": "#", "isDoc": false}, "etc/audit/rules.d/99-paranoid.rules": {"path": "etc/audit/rules.d/99-paranoid.rules", "content": "## /etc/audit/rules.d/99-paranoid.rules\n## Load with:  sudo augenrules --load ; sudo auditctl -s\n##\n## Design goal: catch (a) changes to the machine's trust roots, (b) the syscalls that turn a bug into\n## a compromise, (c) the Apache config/keys/webroot. Never drown in noise: rules that would log\n## every execve by every user are deliberately NOT here.\n##\n## NOTE: '-e 2' at the bottom makes this rule set IMMUTABLE until reboot. That is intentional\n## (an attacker who gets root cannot quietly disable auditing), and it means you edit this file\n## offline and reboot to change rules.\n\n## ---------------------------------------------------------------------------\n## 1. Trust roots: identity, authentication, configuration\n## ---------------------------------------------------------------------------\n-w /etc/passwd -p wa -k identity\n-w /etc/shadow -p wa -k identity\n-w /etc/gshadow -p wa -k identity\n-w /etc/group -p wa -k identity\n-w /etc/security/opasswd -p wa -k identity\n-w /etc/sudoers -p wa -k sudoers\n-w /etc/sudoers.d/ -p wa -k sudoers\n-w /etc/pam.d/ -p wa -k pam\n-w /etc/ssh/sshd_config -p wa -k sshd-config\n-w /etc/ssh/sshd_config.d/ -p wa -k sshd-config\n-w /etc/ssh/ssh_host_ed25519_key -p wa -k sshd-hostkey\n-w /etc/security/ -p wa -k security-config\n-w /etc/login.defs -p wa -k identity\n-w /etc/nsswitch.conf -p wa -k identity\n\n## Boot and integrity stack\n-w /boot/ -p wa -k boot\n-w /etc/default/grub -p wa -k boot\n-w /etc/kernel/ -p wa -k boot\n-w /etc/fstab -p wa -k mounts\n-w /etc/crypttab -p wa -k crypto\n-w /etc/cryptsetup-initramfs/ -p wa -k crypto\n-w /etc/modprobe.d/ -p wa -k modules\n-w /etc/modules-load.d/ -p wa -k modules\n-w /etc/systemd/system/ -p wa -k systemd-units\n-w /etc/audit/ -p wa -k audit-config\n\n## The web service plane (see docs/06)\n-w /etc/apache2/ -p wa -k apache-config\n-w /etc/modsecurity/ -p wa -k apache-config\n-w /etc/ssl/private/ -p rwa -k tls-keys\n-w /etc/letsencrypt/ -p rwa -k tls-keys\n-w /var/www/ -p wa -k webroot\n-w /srv/ -p wa -k webroot\n\n## Our own policy and monitoring state\n-w /etc/paranoid/ -p wa -k paranoid-policy\n-w /etc/aide/ -p wa -k integrity-config\n-w /etc/nftables.conf -p wa -k firewall\n-w /etc/wireguard/ -p wa -k vpn\n\n## ---------------------------------------------------------------------------\n## 2. Execution and privilege primitives\n## ---------------------------------------------------------------------------\n## Binaries and libraries must not change outside a package upgrade (which auditd will show, and\n## dpkg.log will corroborate: that correlation is the point).\n-w /usr/bin/ -p wa -k binaries\n-w /usr/sbin/ -p wa -k binaries\n-w /bin/ -p wa -k binaries\n-w /sbin/ -p wa -k binaries\n-w /usr/lib/systemd/system/ -p wa -k systemd-units\n-a always,exit -F arch=b64 -F dir=/etc -F perm=wa -k etc-write\n-a always,exit -F arch=b32 -F dir=/etc -F perm=wa -k etc-write\n\n## Module and kernel-interaction syscalls\n-a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k modules\n-a always,exit -F arch=b32 -S init_module,finit_module,delete_module -k modules\n-a always,exit -F arch=b64 -S kexec_load,kexec_file_load -k modules\n-a always,exit -F arch=b64 -S ptrace -k primitives\n-a always,exit -F arch=b32 -S ptrace -k primitives\n-a always,exit -F arch=b64 -S bpf -k primitives\n-a always,exit -F arch=b64 -S personality -F a0=0x0 -k primitives\n-a always,exit -F arch=b64 -S memfd_create -k primitives\n\n## Privilege escalation by unprivileged users\n-a always,exit -F arch=b64 -S setuid,setgid,setreuid,setregid,setresuid,setresgid -F auid>=1000 -F auid!=unset -k priv-esc\n-a always,exit -F arch=b32 -S setuid,setgid,setreuid,setregid,setresuid,setresgid -F auid>=1000 -F auid!=unset -k priv-esc\n-a always,exit -F arch=b64 -S chsh -F auid>=1000 -F auid!=unset -k priv-esc\n-a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat,renameat2 -F auid>=1000 -F auid!=unset -F dir=/var/www -k webroot-delete\n\n## Root's own commands: low volume, high signal (who is really administering this box?)\n-a always,exit -F arch=b64 -S execve -F euid=0 -F auid!=unset -k root-exec\n-a always,exit -F arch=b32 -S execve -F euid=0 -F auid!=unset -k root-exec\n\n## Time changes (an attacker shifting the clock hides their activity)\n-a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change\n-a always,exit -F arch=b64 -S clock_adjtime -F a0=0x1 -k time-change\n\n## Network configuration changes\n-a always,exit -F arch=b64 -S sethostname,setdomainname -k network-mod\n-w /etc/hosts -p wa -k network-mod\n-w /etc/nftables.conf -p wa -k network-mod\n-w /etc/network/ -p wa -k network-mod\n\n## USB / peripheral policy (pairs with USBGuard's LinuxAudit backend)\n-w /etc/usbguard/ -p wa -k usbguard\n\n## TIER 3, noisy - uncomment if you want a record of every outbound connect():\n#-a always,exit -F arch=b64 -S connect -k net-out\n\n## ---------------------------------------------------------------------------\n## 3. Make the rule set immutable and set sane failure mode\n## ---------------------------------------------------------------------------\n## -f 1: log failures rather than panic (2 = panic) or ignore them (0). A server should not reboot\n##       because auditd was briefly overwhelmed, but should tell us about it.\n-f 1\n--backlog_wait_time 60000\n## -e 2: immutable until reboot. Remove ONLY for staged rule changes.\n-e 2\n", "lines": 114, "purpose": "Kernel-level audit trail for the trust roots, privilege primitives and the web plane, made immutable for the life of the boot.", "notes": [{"n": 14, "why": "Any change to identity material is recorded - this is where persistence usually starts."}, {"n": 15, "why": "Any change to identity material is recorded - this is where persistence usually starts."}, {"n": 16, "why": "Any change to identity material is recorded - this is where persistence usually starts."}, {"n": 17, "why": "Any change to identity material is recorded - this is where persistence usually starts."}, {"n": 18, "why": "Any change to identity material is recorded - this is where persistence usually starts."}, {"n": 19, "why": "Changes to who may become root are logged."}, {"n": 20, "why": "Changes to who may become root are logged."}, {"n": 21, "why": "Authentication policy is a trust root; watching it catches both attackers and careless administrators."}, {"n": 22, "why": "A modified SSH configuration is a direct path back into the machine."}, {"n": 23, "why": "A modified SSH configuration is a direct path back into the machine."}, {"n": 24, "why": "Host key changes break trust for every client - worth an alert every time."}, {"n": 26, "why": "Account and name-resolution policy changes affect authentication itself."}, {"n": 27, "why": "Account and name-resolution policy changes affect authentication itself."}, {"n": 30, "why": "The boot chain is the root of trust; writes there must never be silent."}, {"n": 31, "why": "The boot chain is the root of trust; writes there must never be silent."}, {"n": 32, "why": "The boot chain is the root of trust; writes there must never be silent."}, {"n": 33, "why": "Mount options are a security control, so changes are findings until explained."}, {"n": 34, "why": "Changes here alter how your encrypted disk is unlocked."}, {"n": 35, "why": "Changes here alter how your encrypted disk is unlocked."}, {"n": 36, "why": "Adding a module can add a driver or a rootkit - both visible here."}, {"n": 37, "why": "Adding a module can add a driver or a rootkit - both visible here."}, {"n": 38, "why": "New or edited units are how persistence is most often installed on a systemd host."}, {"n": 39, "why": "Auditing the auditor: nobody gets to quietly rewrite the rules."}, {"n": 42, "why": "Web server configuration changes are an attack on the service itself."}, {"n": 43, "why": "Disabled WAF rules are a silent, common way to weaken a hardened server."}, {"n": 44, "why": "These hold your TLS private keys: read, write and attribute changes to them."}, {"n": 45, "why": "These hold your TLS private keys: read, write and attribute changes to them."}, {"n": 46, "why": "The served content: unexplained changes here are the definition of a web compromise."}, {"n": 47, "why": "The served content: unexplained changes here are the definition of a web compromise."}, {"n": 52, "why": "Someone editing the firewall is either an administrator or an attacker covering their tracks."}, {"n": 53, "why": "The admin plane's keys and peers."}, {"n": 60, "why": "Binaries must not change outside a package upgrade - auditd plus dpkg.log settle the question."}, {"n": 61, "why": "Binaries must not change outside a package upgrade - auditd plus dpkg.log settle the question."}, {"n": 62, "why": "Binaries must not change outside a package upgrade - auditd plus dpkg.log settle the question."}, {"n": 63, "why": "Binaries must not change outside a package upgrade - auditd plus dpkg.log settle the question."}, {"n": 64, "why": "New or edited units are how persistence is most often installed on a systemd host."}, {"n": 65, "why": "A catch-all on writes to /etc, so a path we forgot to watch still leaves a trace."}, {"n": 66, "why": "A catch-all on writes to /etc, so a path we forgot to watch still leaves a trace."}, {"n": 69, "why": "Every module load or unload, which is also how an in-kernel rootkit gets in."}, {"n": 70, "why": "Every module load or unload, which is also how an in-kernel rootkit gets in."}, {"n": 71, "why": "kexec bypasses the boot chain, so its use is always worth recording."}, {"n": 72, "why": "Tracing is process-injection territory; record who traced whom."}, {"n": 73, "why": "Tracing is process-injection territory; record who traced whom."}, {"n": 74, "why": "BPF programs can observe and manipulate kernel behaviour."}, {"n": 75, "why": "Used to disable ASLR for a process - a classic exploit prerequisite."}, {"n": 76, "why": "A standard fileless-execution primitive: create an anonymous executable in memory."}, {"n": 79, "why": "Privilege transitions by unprivileged users, which is where escalation starts."}, {"n": 80, "why": "Privilege transitions by unprivileged users, which is where escalation starts."}, {"n": 85, "why": "Every command run as root: low volume, very high signal - this is the audit trail of administration."}, {"n": 86, "why": "Every command run as root: low volume, very high signal - this is the audit trail of administration."}, {"n": 89, "why": "Shifting the clock hides activity and can make expired certificates look valid."}, {"n": 90, "why": "Shifting the clock hides activity and can make expired certificates look valid."}, {"n": 93, "why": "Network identity and configuration changes, which affect how this host is reached."}, {"n": 94, "why": "Network identity and configuration changes, which affect how this host is reached."}, {"n": 95, "why": "Someone editing the firewall is either an administrator or an attacker covering their tracks."}, {"n": 96, "why": "Network identity and configuration changes, which affect how this host is reached."}, {"n": 99, "why": "Peripheral policy changes; pairs with USBGuard's LinuxAudit backend."}, {"n": 109, "why": "Log audit failures rather than panicking or silently ignoring them."}, {"n": 112, "why": "Makes the rule set immutable until reboot: an attacker with root cannot turn auditing off."}], "annPrefix": "#", "isDoc": false}, "etc/chrony/chrony.conf": {"path": "etc/chrony/chrony.conf", "content": "# /etc/chrony/chrony.conf\n# Correct time is a security control here: TLS validity, audit timestamps, and certificate\n# revocation all depend on it. NTS (RFC 8915) authenticates the time source, which matters because\n# an unauthenticated NTP server can shift your clock and make expired certs look valid.\n#\n# Check:  chronyc tracking ; chronyc sources -v ; chronyc ntpdata | grep -i auth\n\n# NTS-authenticated public sources (Debian trixie chrony supports 'nts').\n# Add/remove servers as you like, but keep at least two independent operators.\nserver time.cloudflare.com iburst nts\nserver nts.netnod.se iburst nts\nserver ptbtime1.ptb.de iburst nts\nserver time.nrc.ca iburst nts\n\n# Fall back to normal authenticated-by-server-key NTP only if NTS is unavailable for you.\n#pool 2.debian.pool.ntp.org iburst\n\n# Our clock must be right before TLS/DNSSEC depend on it, but we never step a running server\n# backwards in a way that confuses logs: allow a step only early, then slew.\nmakestep 1.0 3\ndriftfile /var/lib/chrony/chrony.drift\nrtcsync\nlogdir /var/log/chrony\nlog tracking measurements statistics\n\n# Do NOT serve time to others: no 'allow' directive, and no broadcast/multicast server.\n# The nftables egress allowlist (docs/05 §4) also restricts who we may talk to.\nnoclientlog\nmaxupdateskew 100.0\nminsources 2\n# Refuse to sync if the offset is absurd (a big jump usually means an attacker or a broken VM).\nmaxdistance 16.0\n\n# Leapsect-related safety: on a server, prefer to be told about leaps via NTP.\nleapsectz right/UTC\n\n# Bind only where it is needed.\nbindaddress 127.0.0.1\nbindaddress ::1\n\n# Run as an unprivileged user (Debian does this by default).\nuser _chrony\n", "lines": 43, "purpose": "Authenticated time (NTS), because TLS validity and audit timestamps are only as trustworthy as the clock.", "notes": [{"n": 9, "why": "Authenticated time: without it, anyone who can reach the NTP path can shift your clock and undermine TLS validity and audit timestamps."}, {"n": 10, "why": "Authenticated time: without it, anyone who can reach the NTP path can shift your clock and undermine TLS validity and audit timestamps."}, {"n": 11, "why": "Authenticated time: without it, anyone who can reach the NTP path can shift your clock and undermine TLS validity and audit timestamps."}, {"n": 12, "why": "Authenticated time: without it, anyone who can reach the NTP path can shift your clock and undermine TLS validity and audit timestamps."}, {"n": 19, "why": "Steps the clock only in the first three updates, then slews - log timestamps stay coherent."}, {"n": 21, "why": "Keeps the hardware clock close enough that the boot-time clock is not wildly wrong."}, {"n": 23, "why": "Authenticated time: without it, anyone who can reach the NTP path can shift your clock and undermine TLS validity and audit timestamps."}, {"n": 29, "why": "Requires agreement between sources before trusting the result, which resists a single lying server."}, {"n": 31, "why": "Refuses absurd offsets, which are usually an attacker or a broken virtual clock."}, {"n": 37, "why": "Listens only on loopback: this host is a time client, never a time server."}, {"n": 38, "why": "Listens only on loopback: this host is a time client, never a time server."}, {"n": 41, "why": "Drops privileges after starting."}], "annPrefix": "#", "isDoc": false}, "etc/containers/containers.conf": {"path": "etc/containers/containers.conf", "content": "# /etc/containers/containers.conf\n# Hardened defaults for rootless podman on this host. See docs/08 §3.\n# These are DEFAULTS: they apply to every container you run, which is the point - you cannot\n# forget to harden a container you started at 3 a.m.\n\n[containers]\n# Drop every capability except binding a low port. Rootless containers cannot gain\n# capabilities you do not have anyway; this closes the door on the rootful-socket mistake.\ndefault_capabilities = [\"CAP_NET_BIND_SERVICE\"]\n\n# Namespace isolation: one container cannot see another's processes, IPC or hostname.\nipcns = \"private\"\npidns = \"private\"\nutsns = \"private\"\nuserns = \"auto\"\ncgroupns = \"private\"\n\n# Do not leak the host's /etc/hosts or environment into containers.\nno_hosts = true\nenv_host = false\nenv_host_files = []\n\n# Run a minimal init so signals and zombies are handled properly.\ninit = true\n\n# Keep the default seccomp profile. Never set \"unconfined\".\nseccomp_profile = \"default\"\n\n# Publish ports on 127.0.0.1 by default. If you need a public port, say so explicitly per container.\n# (nftables is the real gate anyway - docs/05.)\npublish_ports = \"127.0.0.1\"\n\n[network]\n# Rootless networking via pasta/slirp4netns, subject to the host's egress rules.\ndefault_network = \"pasta:--no-map-gw\"\n\n[engine]\n# Rootless only. Do NOT enable the system (rootful) socket: /run/podman/podman.sock is\n# root-equivalent and a web app with access to it owns this machine.\n# Podman in this build is used as an unprivileged user, never as a service.\nruntime = \"crun\"\n# Never pull from a registry without checking signatures where you can:\n# use digest-pinned images:  podman run docker.io/library/nginx@sha256:<digest>\n", "lines": 44, "purpose": "Hardened defaults for rootless containers, so the isolation is applied even to containers you start in a hurry.", "notes": [{"n": 8, "why": "Every container loses all capabilities except binding a low port, by default rather than by remembering."}, {"n": 11, "why": "Namespaces are private by default, so containers cannot see or signal each other."}, {"n": 12, "why": "Namespaces are private by default, so containers cannot see or signal each other."}, {"n": 13, "why": "Namespaces are private by default, so containers cannot see or signal each other."}, {"n": 14, "why": "User namespace mapping: container root is an unprivileged host user."}, {"n": 15, "why": "Namespaces are private by default, so containers cannot see or signal each other."}, {"n": 18, "why": "The host's /etc/hosts is not exposed to containers."}, {"n": 19, "why": "The host environment (which may contain secrets) is not inherited."}, {"n": 23, "why": "A minimal init reaps zombies and forwards signals, so containers behave predictably."}, {"n": 26, "why": "Keeps a syscall filter in place; 'unconfined' is never an option here."}, {"n": 30, "why": "Ports publish on loopback by default - making something public becomes an explicit act."}, {"n": 40, "why": "Rootless-only with a small OCI runtime; the rootful socket is deliberately not used."}], "annPrefix": "#", "isDoc": false}, "etc/crypttab.example": {"path": "etc/crypttab.example", "content": "# /etc/crypttab  (copy the line that matches your profile; see docs/03 §1)\n#\n# Column 1: mapping name used under /dev/mapper\n# Column 2: the block device (use the PARTUUID for stability)\n# Column 3: key file ('none' = interactive passphrase prompt in initramfs)\n# Column 4: options\n#\n# Validate with:  sudo systemd-cryptsetup-generator --generate-dependencies  (or just reboot)\n\n# ---------------------------------------------------------------------------\n# Profile P1 - embedded LUKS2 header (default, recommended for a laptop)\n# ---------------------------------------------------------------------------\ncryptroot PARTUUID=<your-luks-partition-partuuid> none luks,no-read-workqueue,no-write-workqueue\n\n# Note: NO 'discard' and NO 'tpm2-device=auto' here. See docs/03 §5 for why the firmware TPM on\n# this machine is not trusted for disk unlock, and docs/00 §5 for why TRIM is off.\n\n# ---------------------------------------------------------------------------\n# Profile P2 - detached header on a USB token (docs/03 §4 conversion)\n# Replace the by-id path with YOUR token's stable identifier:  ls -l /dev/disk/by-id/\n# ---------------------------------------------------------------------------\n#cryptroot PARTUUID=<your-luks-partition-partuuid> none luks,header=/dev/disk/by-id/usb-TOKEN_SERIAL-0:0-part1,x-systemd.device-timeout=30s\n\n# The header device is a boot dependency. If it is absent, the boot fails *loudly* at the\n# initramfs prompt - that is the intended behaviour, and docs/10 §6 tells you how to recover\n# with the offline header backup.\n", "lines": 27, "purpose": "How the encrypted root is unlocked: passphrase, no TRIM, and the detached-header variant for maximum paranoia.", "notes": [{"n": 12, "why": "The root filesystem is unlocked by a passphrase at boot - the key never exists on disk."}], "annPrefix": "#", "isDoc": false}, "etc/default/grub": {"path": "etc/default/grub", "content": "# /etc/default/grub\n#\n# IMPORTANT: if you boot via a Unified Kernel Image (layout=uki, docs/03 §2 Path A), GRUB is not in\n# the chain at all and the authoritative cmdline is /etc/kernel/cmdline. Keep the two IDENTICAL so a\n# fallback boot behaves like the normal one.\n\nGRUB_DEFAULT=0\nGRUB_TIMEOUT=3\nGRUB_DISTRIBUTOR=\"Debian\"\nGRUB_CMDLINE_LINUX_DEFAULT=\"\"\nGRUB_CMDLINE_LINUX=\"audit=1 audit_backlog_limit=8192 apparmor=1 security=apparmor lsm=landlock,lockdown,yama,integrity,apparmor,bpf iommu=on iommu.strict=1 intremap=on iommu.passthrough=0 init_on_alloc=1 init_on_free=1 slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none debugfs=off lockdown=confidentiality module.sig_enforce=1 oops=panic panic=-1 panic_on_oops=1 module_blacklist=nouveau,nvidia,nvidia_drm,btusb,bluetooth,intel_ish_ipc quiet loglevel=3\"\n\n# TIER 3 additions (uncomment deliberately, they cost real performance on a 4-core/8-thread part):\n#   mitigations=auto,nosmt      -> closes SMT side channels, ~30% capacity loss\n#   init_on_free=1              -> already above; also removes freed-object reuse primitives\n#   usbcore.authorized_default=0 -> blocks new USB devices at the kernel level. WARNING: this can\n#                                   block a keyboard plugged in after boot; only on racked machines.\n\n# Do not let grub-mkconfig hide the recovery path you may need.\nGRUB_DISABLE_RECOVERY=\"false\"\nGRUB_DISABLE_OS_PROBER=\"true\"\n# Refuse an unauthenticated boot menu (belt and braces with the firmware password).\nGRUB_DISABLE_SUBMENU=\"y\"\n# Set the menu password with: grub-mkpasswd-pbkdf2  (then GRUB_PASSWORD / superusers in\n# /etc/grub.d/40_custom). Not required when using UKI + Secure Boot, and easy to lock yourself\n# out of; read docs/10 §6 before enabling it.\n\n# Resize a possibly-broken BIOS console: harmless if unused.\nGRUB_TERMINAL=\"console\"\n", "lines": 30, "purpose": "Boot-time kernel policy (lockdown, IOMMU, module signing, memory zeroing) for the GRUB fallback path.", "notes": [{"n": 7, "why": "A short menu window, paired with a firmware password so nobody can pick a different entry."}, {"n": 10, "why": "Same boot-time policy as the UKI variant; the two must stay identical."}, {"n": 19, "why": "Keeps the recovery entry available, because a machine you cannot boot is also a machine you cannot secure."}, {"n": 20, "why": "No scanning for other operating systems: one boot chain, nothing to chain-load."}, {"n": 28, "why": "Console output only; no graphical boot path to attack."}], "annPrefix": "#", "isDoc": false}, "etc/default/ima-policy": {"path": "etc/default/ima-policy", "content": "# files/etc/default/ima-policy  ->  install as /etc/ima/ima-policy\n#\n# MEASUREMENT ONLY. Docs/03 §6 explains why: on this machine (firmware TPM, no attestation service,\n# no remote verifier) IMA can give you *evidence* that a file was measured before it executed, but it\n# cannot give you *enforcement* you can trust. Enforcement (ima_appraise) requires:\n#   * a key you control, enrolled before anything is measured\n#   * the same key available in the initramfs for the earliest measurements\n#   * an answer for what happens when a package upgrade changes a measured file\n# Get that wrong and the machine boots into a broken state or, worse, into permissive-fallback mode\n# that looks like it is working. So: measure now, decide about appraisal later, deliberately.\n#\n# Install:\n#   sudo install -d -m 0755 /etc/ima\n#   sudo cp files/etc/default/ima-policy /etc/ima/ima-policy\n#   echo 'ima_policy=tcb' | sudo tee -a /etc/kernel/cmdline    # or /etc/default/grub's cmdline\n#   sudo update-initramfs -u -k all\n#   sudo reboot\n# Read the results:\n#   sudo head /sys/kernel/security/ima/ascii_runtime_measurements\n#   sudo cat /sys/kernel/security/ima/policy\n#\n# The policy below measures: files read by privileged processes, files mapped for execution,\n# kernel modules, and the machine's own configuration-critical paths. It does NOT measure every\n# file read by every process (that is the 'tcb' vs 'all' distinction) because the volume would be\n# unmanageable and would fill the measurement log for no benefit.\n#\n# To measure more later, switch 'ima_policy=tcb' to 'ima_policy=appraise_tcb' ONLY after you have\n# read the whole of docs/03 §6 and tested in a VM.\n\ndont_measure fsmagic=0x9fa0\ndont_measure fsmagic=0x62656572\ndont_measure fsmagic=0x64626720\ndont_measure fsmagic=0x01021994\ndont_measure fsmagic=0x858458f6\ndont_measure fsmagic=0x73636673\ndont_measure fsmagic=0xf97cff8c\ndont_measure fsmagic=0x6e736673\ndont_measure fsmagic=0xde5e81e4\ndont_measure fsmagic=0x27e0eb\ndont_measure fsmagic=0x958458f6\ndont_measure fsmagic=0x1373\nmeasure func=MMAP_CHECK mask=MAY_EXEC\nmeasure func=BPRM_CHECK mask=MAY_EXEC\nmeasure func=FILE_CHECK mask=MAY_READ uid=0\nmeasure func=MODULE_CHECK\nmeasure func=FIRMWARE_CHECK\nmeasure func=POLICY_CHECK\nmeasure func=KEXEC_KERNEL_CHECK\n", "lines": 49, "purpose": "Measurement-only integrity evidence for what executed, without the breakage of enforcement before you have a verifier.", "notes": [{"n": 29, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 30, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 31, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 32, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 33, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 34, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 35, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 36, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 37, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 38, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 39, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 40, "why": "Volatile and synthetic filesystems are excluded so the log stays meaningful and bounded."}, {"n": 41, "why": "Catches code loaded via mmap - the library-injection path that never touches execve."}, {"n": 42, "why": "Every execution is measured, which is the record that answers 'what actually ran?' after an incident."}, {"n": 43, "why": "Files read by root are measured: the configuration and key material that matter."}, {"n": 44, "why": "Every module load is recorded in the measurement log."}, {"n": 45, "why": "Firmware loaded into devices is measured, which is your only visibility into that layer."}, {"n": 46, "why": "Changes to the measurement policy itself, and any kexec attempt, are recorded."}, {"n": 47, "why": "Changes to the measurement policy itself, and any kexec attempt, are recorded."}], "annPrefix": "\u0000", "isDoc": false}, "etc/fstab": {"path": "etc/fstab", "content": "# /etc/fstab  (reference layout - replace UUIDs/labels with your own; see docs/02 §3)\n#\n# Verify with:  sudo findmnt --verify && findmnt -o TARGET,SOURCE,FSTYPE,OPTIONS\n#\n# Notes that are load-bearing, not decoration:\n#  * NO 'discard' and no periodic fstrim on encrypted volumes: TRIM on full-disk encryption\n#    leaks which regions are in use (docs/00 §5). Accept the write slowdown.\n#  * /var/log and /var/tmp are nosuid,nodev,noexec: writable + executable is how a webshell\n#    survives a reboot. /tmp is tmpfs so it is wiped on reboot by construction.\n#  * /boot/efi is umask=0077 so nothing but root can read the ESP.\n#  * TIER 3: change /boot to 'ro' here and let remount-boot-ro.service own the remount logic.\n\n# <file system>            <mount point>  <type>  <options>                                          <dump> <pass>\nUUID=AAAA-BBBB             /boot/efi      vfat    umask=0077,shortname=winnt,noexec,nosuid,nodev         0      2\nUUID=1111-2222             /boot          ext4    defaults,nosuid,nodev                                 0      2\n/dev/mapper/vg0-root       /              ext4    defaults,nodev,errors=remount-ro,noatime              0      1\n/dev/mapper/vg0-var        /var           ext4    defaults,nosuid,nodev,noatime                         0      2\n/dev/mapper/vg0-varlog     /var/log       ext4    defaults,nosuid,nodev,noexec,noatime                  0      2\n/dev/mapper/vg0-vartmp     /var/tmp       ext4    defaults,nosuid,nodev,noexec,noatime                  0      2\n/dev/mapper/vg0-home       /home          ext4    defaults,nosuid,nodev,noexec,noatime                  0      2\n/dev/mapper/vg0-srv        /srv           ext4    defaults,nosuid,nodev,noatime                         0      2\n/dev/mapper/vg0-swap       none           swap    sw                                                    0      0\ntmpfs                      /tmp           tmpfs   rw,nosuid,nodev,noexec,relatime,size=2G,mode=1777    0      0\ntmpfs                      /dev/shm       tmpfs   rw,nosuid,nodev,noexec,size=512M,mode=1777            0      0\n\n# Optional extra hardening for /proc, applied via a mount unit + systemd (systemd >= 257 supports\n# hidepid=invisible, which does not break tools that legitimately read other processes' /proc):\n#   files/etc/systemd/system/proc-hidepid.mount  -> see docs/04 §5 for the caveats\n", "lines": 29, "purpose": "Denies execute/setuid/device nodes on the directories an attacker can write to - the difference between dropping a webshell and running one.", "notes": [{"n": 13, "why": "The EFI system partition is readable only by root: nothing can inspect or tamper with your bootloaders."}, {"n": 15, "why": "A filesystem error makes the volume read-only instead of letting corruption (or an attacker) continue writing."}, {"n": 16, "why": "Fewer metadata writes on an encrypted DRAM-less SSD - and no atime side channel."}, {"n": 17, "why": "Writable and executable is how a dropped webshell survives a reboot; noexec breaks that chain."}, {"n": 18, "why": "Same reasoning for the other writable scratch directory - it is a volume, not tmpfs, so it also survives reboots."}, {"n": 19, "why": "Fewer metadata writes on an encrypted DRAM-less SSD - and no atime side channel."}, {"n": 20, "why": "Fewer metadata writes on an encrypted DRAM-less SSD - and no atime side channel."}, {"n": 21, "why": "Swap is a logical volume inside LUKS, so swapped-out memory is never plaintext on the device."}, {"n": 22, "why": "/tmp is memory-backed, size-bounded and wiped on reboot - no persistence, no disk exhaustion."}, {"n": 23, "why": "Shared memory is executable by default and a favourite hiding place; noexec, nosuid and a size cap close it."}], "annPrefix": "#", "isDoc": false}, "etc/kernel/cmdline": {"path": "etc/kernel/cmdline", "content": "audit=1 audit_backlog_limit=8192 apparmor=1 security=apparmor lsm=landlock,lockdown,yama,integrity,apparmor,bpf iommu=on iommu.strict=1 intremap=on iommu.passthrough=0 init_on_alloc=1 init_on_free=1 slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none debugfs=off lockdown=confidentiality module.sig_enforce=1 oops=panic panic=-1 panic_on_oops=1 module_blacklist=nouveau,nvidia,nvidia_drm,btusb,bluetooth,intel_ish_ipc quiet loglevel=3\n", "lines": 2, "purpose": "The same boot-time policy, embedded in the signed Unified Kernel Image - the authoritative copy on a Secure Boot build.", "notes": [{"n": 0, "why": "The single highest-value boot parameter here: the kernel refuses kexec, /dev/mem, unsigned modules and most raw device access while Secure Boot is on."}], "annPrefix": "\u0000", "isDoc": false}, "etc/kernel/install.conf": {"path": "etc/kernel/install.conf", "content": "# /etc/kernel/install.conf\n# Consumed by kernel-install(8). Makes every kernel install emit a Unified Kernel Image that\n# contains kernel + initramfs + cmdline(/etc/kernel/cmdline) + os-release, which is what we sign.\n#\n# Debian 13 note: generating UKIs on Debian requires an initrd generator that supports it.\n# 'dracut' is the tested path here (apt-get install --no-install-recommends dracut systemd-ukify).\n# If you prefer to keep initramfs-tools, remove these lines and instead sign the kernel+initrd\n# directly with sbctl's sign glob (see docs/03 §2 Path A fallback note).\nlayout=uki\ninitrd_generator=dracut\nuki_generator=ukify\n\n# Where kernel-install writes entries and the ESP mount point.\n# (systemd-boot reads the ESP; bootctl install assumes /boot/efi unless you changed it.)\n# BOOT_ROOT=/boot/efi\n", "lines": 16, "purpose": "Makes every future kernel install produce a signed Unified Kernel Image instead of loose, sparsely protected files on /boot.", "notes": [{"n": 8, "why": "Every kernel becomes ONE signed Unified Kernel Image instead of loose files on /boot that an attacker could swap."}, {"n": 9, "why": "The initramfs that unlocks your disk is built into the signed image, so it cannot be replaced separately."}, {"n": 10, "why": "Pins the tool that assembles the image, so the build is reproducible and reviewable."}], "annPrefix": "#", "isDoc": false}, "etc/kernel/postinst.d/zz-sign-uki": {"path": "etc/kernel/postinst.d/zz-sign-uki", "content": "#!/bin/sh\n# /etc/kernel/postinst.d/zz-sign-uki\n# Runs after every kernel package install/removal. Without this, the first kernel upgrade after\n# enabling Secure Boot own-keys leaves you with an unsigned UKI and an unbootable machine\n# (until you sign it from a rescue environment).\n#\n# Exit non-zero on failure: a silent failure here means \"next reboot does not work\".\nset -eu\n\nVERSION=\"${1:-}\"\nif [ -z \"${VERSION}\" ]; then\n    echo \"zz-sign-uki: no kernel version supplied\" >&2\n    exit 1\nfi\n\nif [ ! -x /usr/bin/sbctl ]; then\n    echo \"zz-sign-uki: sbctl not installed; skipping\" >&2\n    exit 0\nfi\n\n# Sign every UKI and bootloader binary sbctl knows about, updating (not replacing) its db.\nif ! sbctl sign-all >/dev/null 2>&1; then\n    # sign-all only works if files were registered with `sbctl sign -s` earlier.\n    # Fall back to signing the UKI for this kernel explicitly.\n    MACHINE_ID=\"$(cat /etc/machine-id 2>/dev/null || true)\"\n    for f in /boot/efi/EFI/Linux/\"${MACHINE_ID}\"-\"${VERSION}\".efi \\\n             /boot/efi/EFI/Linux/*-\"${VERSION}\".efi; do\n        [ -e \"$f\" ] || continue\n        sbctl sign -s \"$f\" || { echo \"zz-sign-uki: failed to sign $f\" >&2; exit 1; }\n    done\nfi\n\n# Verify rather than assume.\nif command -v sbctl >/dev/null 2>&1; then\n    unver=\"$(sbctl verify 2>/dev/null | grep -ci 'not signed' || true)\"\n    if [ \"${unver}\" -gt 0 ]; then\n        echo \"zz-sign-uki: WARNING - $unver unsigned EFI file(s) remain (see 'sbctl verify')\" >&2\n        # Deliberately non-fatal: an unrelated unsigned EFI file should not break apt.\n    fi\nfi\n\n# If /boot is mounted read-only (Tier 3), the caller (scripts/install-hardening.sh\n# --unsafe-remount-boot) is responsible for remounting it read-write around apt runs.\necho \"zz-sign-uki: signed UKI for kernel ${VERSION}\"\nexit 0\n", "lines": 46, "purpose": "Signs the new kernel automatically, so the first upgrade after enabling Secure Boot cannot leave the machine unbootable.", "notes": [{"n": 7, "why": "Fails loudly: a signing hook that silently does nothing leaves an unbootable machine the next time you reboot."}, {"n": 12, "why": "A missing kernel version is an error, not something to skip."}, {"n": 21, "why": "Re-signs the new kernel automatically with your own key - the step people forget after the first upgrade."}, {"n": 28, "why": "Re-signs the new kernel automatically with your own key - the step people forget after the first upgrade."}, {"n": 34, "why": "Verifies rather than assumes, and reports unsigned EFI files while you can still fix them."}, {"n": 36, "why": "Verifies rather than assumes, and reports unsigned EFI files while you can still fix them."}], "annPrefix": "#", "isDoc": false}, "etc/logrotate.d/apache2": {"path": "etc/logrotate.d/apache2", "content": "# /etc/logrotate.d/apache2\n# Rotation for the case where you kept file-based logging instead of piping to journald\n# (docs/06 §9). /var/log is mounted nosuid,nodev,noexec, so a dropped webshell cannot run from here.\n#\n# If you use the journald CustomLog from docs/06, this file only needs to cover the mod_security\n# audit log (see logrotate.d/modsec separately).\n\n/var/log/apache2/*.log {\n    daily\n    missingok\n    rotate 30\n    compress\n    delaycompress\n    notifempty\n    create 0640 root adm\n    sharedscripts\n    # Reload, never restart: a failed restart at 03:00 is an outage nobody is awake to fix.\n    postrotate\n        if invoke-rc.d apache2 status > /dev/null 2>&1; then\n            invoke-rc.d apache2 reload > /dev/null 2>&1\n        fi\n    endscript\n    # Do not let the log volume fill: rotate the volume, do not just hope.\n    maxsize 200M\n}\n", "lines": 26, "purpose": "Rotation that reloads rather than restarts, with log modes that keep hostile request data out of world-readable files.", "notes": [{"n": 10, "why": "A month of history: enough to investigate, bounded enough not to be a liability."}, {"n": 14, "why": "Log files contain hostile request data and client addresses; they are not world-readable."}, {"n": 19, "why": "Reloads rather than restarts, so log rotation cannot become an outage at 03:00."}, {"n": 23, "why": "Size-based rotation with a daily floor - a log flood must not fill the volume."}], "annPrefix": "#", "isDoc": false}, "etc/logrotate.d/modsec": {"path": "etc/logrotate.d/modsec", "content": "# /etc/logrotate.d/modsec\n# The mod_security audit log contains hostile-looking requests and request metadata. It must NOT be\n# world-readable (it can contain sensitive parameter names), and it must rotate or your /var/log\n# volume fills up during an attack flood - which is itself a denial of service.\n\n/var/log/apache2/modsec_audit.log {\n    daily\n    missingok\n    rotate 14\n    compress\n    delaycompress\n    notifempty\n    create 0640 root adm\n    sharedscripts\n    postrotate\n        if invoke-rc.d apache2 status > /dev/null 2>&1; then\n            invoke-rc.d apache2 reload > /dev/null 2>&1\n        fi\n    endscript\n    maxsize 100M\n    # Under a heavy attack this file grows in bursts; size caps matter more than the daily timer.\n}\n", "lines": 23, "purpose": "Caps the mod_security audit log by size, because an attack flood is itself a denial-of-service against your disk.", "notes": [{"n": 12, "why": "The WAF audit log can contain sensitive parameter names; keep it out of world-readable scope."}, {"n": 19, "why": "Caps growth during an attack, which is itself a denial-of-service attempt against your disk."}], "annPrefix": "#", "isDoc": false}, "etc/modprobe.d/90-blacklist-paranoid.conf": {"path": "etc/modprobe.d/90-blacklist-paranoid.conf", "content": "# /etc/modprobe.d/90-blacklist-paranoid.conf\n# Every entry is a device on THIS machine (see TigerLake_PCI.txt / docs/00-hardware-profile.md)\n# that a headless HTTPS server does not need. Blacklisting removes the kernel code path AND the\n# device from the driver's reach; it does not power the hardware off (do that in the BIOS too).\n#\n# Check after reboot:  lsmod | grep -E '<module>'   -> no output\n\n# --- Discrete GPU: 01:00.0 NVIDIA TU117M [GeForce MX450] (driver: nouveau) --------------------\n# Extra firmware, extra DMA master, an option ROM, and its own CVE stream. Also disable\n# \"switchable/Optimus graphics\" in the Dell BIOS so the device is not even enumerated.\nblacklist nouveau\nblacklist nvidia\nblacklist nvidia_drm\nblacklist nvidia_modeset\nblacklist nvidiafb\nblacklist drm_ttm_helper\ninstall nouveau /bin/false\ninstall nvidia /bin/false\n\n# --- Audio: 00:1f.3 Smart Sound Technology ------------------------------------------------\n# sof-audio-pci-intel-tgl is loaded today. No speakers, no microphone, no ALSA surface.\nblacklist snd_sof_pci_intel_tgl\nblacklist snd_sof_intel_hda_common\nblacklist snd_sof\nblacklist snd_hda_intel\nblacklist snd_hda_codec\nblacklist snd_hda_core\nblacklist snd_pcm\nblacklist snd_timer\nblacklist soundcore\n\n# --- Intel Management Engine interface: 00:16.0 (driver: mei_me) ---------------------------\n# This does NOT stop the ME from running on Tiger Lake (Boot Guard fuses its region - see\n# docs/00 §4). It removes the OS<->ME HECI path and its privileged device nodes from the kernel.\nblacklist mei_me\nblacklist mei\nblacklist mei_hdcp\n\n# --- Radios: 00:14.3 Wi-Fi 6 AX201 ---------------------------------------------------------\n# Uncomment if this machine is WIRED-ONLY (blocked at rfkill as well).\n# Keep it commented if Wi-Fi is your only management path, or you will lose the machine.\n#blacklist iwlwifi\n#blacklist iwlmvm\nblacklist bluetooth\nblacklist btusb\nblacklist btintel\nblacklist btbcm\nblacklist btmtk\n\n# --- Thunderbolt 4: 00:07.0 root port, 00:0d.2 NHI -----------------------------------------\n# Uncomment only if the TB ports are genuinely never used. Firmware settings in docs/07 §1\n# (User Authorization + Kernel DMA Protection) are the primary control; this is the second.\n#blacklist thunderbolt\n#blacklist thunderbolt_net\n\n# --- Sensors: 00:12.0 Integrated Sensor Hub (driver: intel_ish_ipc) ------------------------\nblacklist intel_ish_ipc\nblacklist intel_ishtp\nblacklist intel_ishtp_hid\n\n# --- Vendor accelerators / telemetry -------------------------------------------------------\n# 00:08.0 GNA scoring accelerator (no driver loaded today, blacklisted for good measure)\nblacklist intel_gna\n# 00:0a.0 Telemetry aggregator (intel_vsec). TIER 2: only blacklist if `dmesg | grep -i thermal`\n# still shows DPTF/proc_thermal working after reboot - some firmware needs intel_vsec.\nblacklist intel_vsec\nblacklist pmt_telemetry\nblacklist pmt_class\n\n# --- Serial IO / SMBus / touchpad-less laptops ----------------------------------------------\n# Uncomment on a racked machine with no touchpad. Check the console works without them first.\n#blacklist intel_lpss_pci\n#blacklist i2c_i801\n#blacklist i2c_smbus\n\n# --- Cameras ----------------------------------------------------------------------------------\nblacklist uvcvideo\nblacklist videobuf2_common\nblacklist videobuf2_v4l2\nblacklist videodev\nblacklist v4l2_async\n\n# --- Storage-by-USB  **[TIER 3]** -------------------------------------------------------------\n# Only if you never plug in USB storage. Otherwise USBGuard (docs/07 §4) is the right control.\n#blacklist usb_storage\n#blacklist uas\n\n# --- The SPI controller (00:1f.5) must stay UNBOUND ------------------------------------------\n# Do not load intel-spi / spi-intel / mtd: those drivers can rewrite your firmware from the OS.\nblacklist intel_spi\nblacklist intel_spi_platform\nblacklist spi_intel\nblacklist spi_intel_pci\nblacklist mtd\n", "lines": 95, "purpose": "Keeps drivers for hardware this server does not use out of the kernel entirely, so their bugs are unreachable.", "notes": [{"n": 10, "why": "The discrete GPU is unused, DMA-capable and carries its own firmware and CVE stream; removing it removes all of that."}, {"n": 16, "why": "The discrete GPU is unused, DMA-capable and carries its own firmware and CVE stream; removing it removes all of that."}, {"n": 21, "why": "No audio on a headless server: a whole ALSA/SOF subsystem that only exists to be attacked."}, {"n": 22, "why": "No audio on a headless server: a whole ALSA/SOF subsystem that only exists to be attacked."}, {"n": 23, "why": "No audio on a headless server: a whole ALSA/SOF subsystem that only exists to be attacked."}, {"n": 24, "why": "No audio on a headless server: a whole ALSA/SOF subsystem that only exists to be attacked."}, {"n": 25, "why": "No audio on a headless server: a whole ALSA/SOF subsystem that only exists to be attacked."}, {"n": 26, "why": "No audio on a headless server: a whole ALSA/SOF subsystem that only exists to be attacked."}, {"n": 34, "why": "Cuts the OS-side path into the Intel Management Engine (see docs/00 section 4 on why the ME itself cannot be removed here)."}, {"n": 35, "why": "Cuts the OS-side path into the Intel Management Engine (see docs/00 section 4 on why the ME itself cannot be removed here)."}, {"n": 43, "why": "No radio, no pairing daemon, no BNEP - and one less way for data to leave the machine."}, {"n": 44, "why": "No radio, no pairing daemon, no BNEP - and one less way for data to leave the machine."}, {"n": 45, "why": "No radio, no pairing daemon, no BNEP - and one less way for data to leave the machine."}, {"n": 56, "why": "The sensor hub is not needed by a server and adds ACPI/AML code paths reachable from the OS."}, {"n": 57, "why": "The sensor hub is not needed by a server and adds ACPI/AML code paths reachable from the OS."}, {"n": 58, "why": "The sensor hub is not needed by a server and adds ACPI/AML code paths reachable from the OS."}, {"n": 62, "why": "A vendor AI accelerator with no purpose here - another DMA-capable device and driver."}, {"n": 65, "why": "Vendor telemetry interfaces expose more device state to the OS than a web server needs."}, {"n": 66, "why": "Vendor telemetry interfaces expose more device state to the OS than a web server needs."}, {"n": 76, "why": "No camera. Also switch it off in firmware; this is the second lock."}, {"n": 79, "why": "No camera. Also switch it off in firmware; this is the second lock."}, {"n": 89, "why": "Never load the SPI/MTD drivers: those can rewrite the machine's firmware from a running OS."}, {"n": 90, "why": "Never load the SPI/MTD drivers: those can rewrite the machine's firmware from a running OS."}, {"n": 91, "why": "Never load the SPI/MTD drivers: those can rewrite the machine's firmware from a running OS."}, {"n": 92, "why": "Never load the SPI/MTD drivers: those can rewrite the machine's firmware from a running OS."}, {"n": 93, "why": "Never load the SPI/MTD drivers: those can rewrite the machine's firmware from a running OS."}], "annPrefix": "#", "isDoc": false}, "etc/modprobe.d/95-options-paranoid.conf": {"path": "etc/modprobe.d/95-options-paranoid.conf", "content": "# /etc/modprobe.d/95-options-paranoid.conf\n# Module options that harden what remains. Every line has a reason; nothing is cargo-culted.\n\n# Wi-Fi (00:14.3 AX201) - only meaningful if you keep iwlwifi (docs/00 §2).\n#   disable_11ax=0 keeps 802.11ax enabled; add power_save=0 for lower latency/jitter.\noptions iwlwifi power_save=0\noptions iwlmvm power_scheme=1\n\n# USB storage: force the \"no FUA\" quirk only if you have a device that misbehaves.\n# Do not add blanket quirks; they change write-cache semantics (a data-integrity risk).\n# options usb_storage quirks=\n\n# DRM/i915: on this Dell the internal panel + efifb handoff is your emergency console.\n# These reduce the GPU's own attack/perf surface without removing the driver:\n#   enable_guc=0 disables GuC submission (also disables some firmware paths).\n# TRADE-OFF: some Tiger Lake panels need GuC for a stable console. Test before relying on it.\n# options i915 enable_guc=0 enable_fbc=0 enable_psr=0\n\n# Realtek/other NICs: not present on this machine.\n", "lines": 20, "purpose": "Options that harden the few drivers which DO stay loaded.", "notes": [{"n": 5, "why": "Disables Wi-Fi power saving, which removes a driver path and a source of timing surprises on an always-on host."}], "annPrefix": "#", "isDoc": false}, "etc/modsecurity/crs/paranoid-crs.conf": {"path": "etc/modsecurity/crs/paranoid-crs.conf", "content": "# /etc/modsecurity/crs/paranoid-crs.conf\n# OWASP Core Rule Set posture for this host. See docs/06 §8.\n#\n# Installed alongside the packaged CRS: the Debian package provides the rules under\n# /usr/share/modsecurity-crs; this file sets the *posture* and any narrow exclusions.\n#\n# Tuning procedure (do not skip to phase 2):\n#   1. PL1 + SecRuleEngine DetectionOnly for 24-48h with real traffic\n#   2. read /var/log/apache2/modsec_audit.log, classify each hit\n#   3. add NARROW exclusions below (by rule id AND path), never disable a whole category\n#   4. raise to PL2, switch SecRuleEngine to On, re-watch for a week\n\n# ---------------------------------------------------------------------------\n# Paranoia level and thresholds\n# ---------------------------------------------------------------------------\nSecAction \"id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=2\"\nSecAction \"id:900001,phase:1,nolog,pass,t:none,setvar:tx.detection_paranoia_level=2\"\n\n# Anomaly scoring thresholds. Lower than the CRS defaults because this host serves a narrow,\n# well-understood application: it does not need to be forgiving, it needs to fail closed.\nSecAction \"id:900110,phase:1,nolog,pass,t:none,\\\n  setvar:tx.inbound_anomaly_score_threshold=15,\\\n  setvar:tx.outbound_anomaly_score_threshold=8\"\n\n# Enforce strict body processing for urlencoded bodies.\nSecAction \"id:900130,phase:1,nolog,pass,t:none,setvar:tx.enforce_bodyproc_urlencoded=1\"\n\n# Do not accept so-called \"invalid\" UTF-8 silently.\nSecAction \"id:900140,phase:1,nolog,pass,t:none,setvar:tx.crs_validate_utf8_encoding=1\"\n\n# Restrict the methods the CRS expects - matches the <LimitExcept> rule in security-hardening.conf.\nSecAction \"id:900200,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'\"\n\n# Content types the application may send. Narrow this to exactly what you use; every extra type is\n# another parser reachable by attackers.\nSecAction \"id:900220,phase:1,nolog,pass,t:none,\\\n  setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded|multipart/form-data|application/json|text/plain|'\"\n\n# File extensions we never accept.\nSecAction \"id:900240,phase:1,nolog,pass,t:none,\\\n  setvar:'tx.restricted_extensions=.php .php3 .php4 .php5 .phtml .pl .py .rb .cgi .asp .aspx .jsp .sh .exe .dll .so .bin'\"\n\nSecAction \"id:900990,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=400\"\n\n# ---------------------------------------------------------------------------\n# Narrow exclusions (add yours here, with a comment saying WHY and WHEN)\n# ---------------------------------------------------------------------------\n# Format for a justified exclusion - one rule, one path, one reason:\n#   SecRule REQUEST_URI \"@beginsWith /api/v1/webhook\" \\\n#     \"id:1001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:payload\"\n#\n# Rules of thumb:\n#  * Never use 'ctl:ruleEngine=Off' for a path unless you have read every rule it disables.\n#  * Never exclude by IP: the attacker will use that IP.\n#  * Re-review exclusions at the quarterly audit (docs/10 §5) - exclusions accumulate and rot.\n#\n# Example (kept commented; enable only if your app genuinely posts JSON with a signature field):\n# SecRule REQUEST_URI \"@beginsWith /api/v1/hook\" \"id:1002,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942430\"\n", "lines": 59, "purpose": "OWASP CRS at paranoia level 2 with tighter anomaly thresholds, narrow exclusions only, and a method/content-type allowlist.", "notes": [{"n": 15, "why": "Paranoia level 2 catches more attacks than the default, at the cost of more tuning - the right trade for a narrow, well-understood service."}, {"n": 16, "why": "Detection matches blocking, so the log tells you what would have been blocked."}, {"n": 21, "why": "A lower threshold than CRS's default: this service fails closed rather than being forgiving."}, {"n": 25, "why": "Forces strict body processing so encoding tricks do not slip past inspection."}, {"n": 28, "why": "Rejects invalid UTF-8 rather than hoping the application handles it the same way the WAF does."}, {"n": 31, "why": "Only GET, HEAD, POST, OPTIONS at the rule level - two independent layers now agree on that."}, {"n": 36, "why": "An allowlist of content types: every extra type is another parser an attacker can reach."}, {"n": 40, "why": "Refuses requests for executable extensions outright."}], "annPrefix": "#", "isDoc": false}, "etc/modsecurity/modsecurity.conf": {"path": "etc/modsecurity/modsecurity.conf", "content": "# /etc/modsecurity/modsecurity.conf\n# Core mod_security settings. Apache-side wiring is in /etc/apache2/mods-available/security2.conf.\n# Keep this file small: it is included BY that file, and duplicated settings in two places is how\n# you end up debugging which one won.\n\nSecRuleEngine On\n\n# --- request body handling (authoritative copies of the Apache-side limits) ---\nSecRequestBodyAccess On\nSecRequestBodyLimit 131072\nSecRequestBodyNoFilesLimit 131072\nSecRequestBodyLimitAction Reject\nSecResponseBodyAccess Off\n\n# --- logging ---\nSecDebugLog /var/log/apache2/modsec_debug.log\nSecDebugLogLevel 0\nSecAuditEngine RelevantOnly\nSecAuditLogRelevantStatus \"^(?:5|4(?!04))\"\nSecAuditLogParts ABIFHZ\nSecAuditLogType Serial\nSecAuditLog /var/log/apache2/modsec_audit.log\n\n# --- working directories (must exist, be writable by Apache, and be inside the unit's sandbox) ---\nSecDataDir /var/cache/apache2/mod_security2\nSecTmpDir /var/cache/apache2/mod_security2\nSecUploadDir /var/cache/apache2/mod_security2\nSecUploadKeepFiles Off\n\n# --- PCRE limits: protect the engine itself from ReDoS ---\nSecPcreMatchLimit 100000\nSecPcreMatchLimitRecursion 100000\n\n# --- anomaly-free defaults: deny on the first phase-1 rule that fires ---\nSecDefaultAction \"phase:1,log,auditlog,deny,status:403\"\nSecDefaultAction \"phase:2,log,auditlog,deny,status:403\"\n\n# --- do not trust client-provided path information ---\nSecArgumentSeparator \"&\"\nSecCookieFormat 0\n\n# --- unicode/encoding: strict ---\nSecUnicodeMapFile unicode.mapping 20127\nSecValidateUTF8Encoding On\nSecDisableBackendCompression On\n", "lines": 46, "purpose": "The engine's own limits - ReDoS guards, strict UTF-8, no uploaded file retention.", "notes": [{"n": 5, "why": "Enforcement mode: the WAF blocks rather than observes."}, {"n": 8, "why": "What the engine inspects, and how much of it - both are attack surface for the engine itself."}, {"n": 9, "why": "What the engine inspects, and how much of it - both are attack surface for the engine itself."}, {"n": 10, "why": "What the engine inspects, and how much of it - both are attack surface for the engine itself."}, {"n": 11, "why": "What the engine inspects, and how much of it - both are attack surface for the engine itself."}, {"n": 12, "why": "What the engine inspects, and how much of it - both are attack surface for the engine itself."}, {"n": 18, "why": "The audit trail is separate, root-owned and rotated by logrotate."}, {"n": 19, "why": "The audit trail is separate, root-owned and rotated by logrotate."}, {"n": 20, "why": "The audit trail is separate, root-owned and rotated by logrotate."}, {"n": 21, "why": "The audit trail is separate, root-owned and rotated by logrotate."}, {"n": 24, "why": "Inspection artefacts are confined and discarded, never retained as files."}, {"n": 25, "why": "Inspection artefacts are confined and discarded, never retained as files."}, {"n": 26, "why": "Inspection artefacts are confined and discarded, never retained as files."}, {"n": 27, "why": "Inspection artefacts are confined and discarded, never retained as files."}], "annPrefix": "#", "isDoc": false}, "etc/modules-load.d/00-paranoid.conf": {"path": "etc/modules-load.d/00-paranoid.conf", "content": "# /etc/modules-load.d/00-paranoid.conf\n#\n# Intentionally EMPTY (comments only).\n#\n# Nothing is force-loaded at boot. Modules that are needed are loaded on demand by udev; modules\n# that are not needed are blacklisted in 90-blacklist-paranoid.conf. If you ever need to add a\n# module here, you are making a permanent, auditable statement about the machine - do it\n# deliberately and note why in /etc/paranoid/package-justifications.\n#\n# Verify nothing was slipped in:  ls /etc/modules-load.d/ && cat /etc/modules\n", "lines": 11, "purpose": "Deliberately empty: nothing is force-loaded at boot, so the module list is auditable.", "notes": [], "annPrefix": "#", "isDoc": false}, "etc/nftables.conf": {"path": "etc/nftables.conf", "content": "#!/usr/sbin/nft -f\n# /etc/nftables.conf - paranoid ingress AND egress policy for a single-purpose HTTPS server.\n#\n# ALWAYS check before loading:      sudo nft -c -f /etc/nftables.conf\n# Apply:                            sudo systemctl enable --now nftables   (or: nft -f)\n# Rollback from a console:          sudo nft flush ruleset\n#                                   sudo nft -f /var/backups/nft.<stamp>.ruleset\n#\n# See docs/05-network-and-firewall.md for the reasoning. Every rule below exists for a reason that\n# is written next to it; if you cannot explain a rule, delete it, do not keep it \"just in case\".\n\nflush ruleset\n\ndefine ADMIN_NET = 10.66.0.0/24      # your WireGuard admin subnet (docs/05 §5)\n\ntable inet filter {\n\n    # -----------------------------------------------------------------------\n    # Dynamic, self-expiring sets used for per-source rate limiting.\n    # -----------------------------------------------------------------------\n    set http4  { type ipv4_addr; flags dynamic, timeout; timeout 10m; }\n    set http6  { type ipv6_addr; flags dynamic, timeout; timeout 10m; }\n    set ssh4   { type ipv4_addr; flags dynamic, timeout; timeout 1h;  }\n\n    # Replace with the real upstreams from /etc/unbound/unbound.conf.d/paranoid.conf and\n    # /etc/chrony/chrony.conf. Keeping them as named sets means one place to edit.\n    set dns_upstreams { type ipv4_addr; elements = { 1.1.1.1, 9.9.9.9 } }\n    set ntp_upstreams { type ipv4_addr; elements = { 162.159.200.1, 216.239.35.0 } }\n\n    # -----------------------------------------------------------------------\n    # INGRESS - default DROP\n    # -----------------------------------------------------------------------\n    chain input {\n        type filter hook input priority filter; policy drop;\n\n        iif \"lo\" accept\n        ct state invalid drop\n        ct state established,related accept\n\n        # Malformed TCP flag combinations: scans, spoofing attempts, broken stacks.\n        tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0 drop\n        tcp flags fin,syn == fin,syn drop\n        tcp flags syn,rst == syn,rst drop\n        tcp flags fin,rst == fin,rst drop\n        tcp flags fin,psh,urg == fin,psh,urg drop\n        tcp flags syn,fin == syn,fin drop\n        tcp flags syn,psh == syn,psh drop\n\n        # --- SSH: ONLY over the admin tunnel (Tier 2). Never on the public interface. ---\n        iifname \"wg0\" tcp dport 22 ct state new accept\n        # Tier 1 alternative (SSH exposed, rate-limited - delete the line above if you use this):\n        iifname != \"wg0\" tcp dport 22 ct state new \\\n            update @ssh4 { ip saddr limit rate over 6/minute } drop\n\n        # --- HTTPS: reachable from anywhere, bounded per source address ---\n        tcp dport 443 ct state new update @http4 { ip saddr limit rate over 60/minute burst 30 packets } drop\n        tcp dport 443 ct state new update @http6 { ip6 saddr limit rate over 60/minute burst 30 packets } drop\n        tcp dport 443 accept\n\n        # --- HTTP: ONLY for HTTP-01 ACME validation. DELETE these two lines if you use DNS-01\n        #     (which docs/06 §4 recommends) - a closed port 80 is strictly better. ---\n        tcp dport 80 ct state new update @http4 { ip saddr limit rate over 10/minute } drop\n        tcp dport 80 accept\n\n        # --- WireGuard admin plane ---\n        udp dport 51820 ct state new accept\n\n        # --- ICMP: path MTU discovery, plus a rate-limited echo so you can diagnose ---\n        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept\n        icmp type echo-request limit rate 4/second accept\n        ipv6-icmp type { destination-unreachable, packet-too-big, time-exceeded,\n                         parameter-problem, nd-router-solicit, nd-router-advert,\n                         nd-neighbor-solicit, nd-neighbor-advert, nd-redirect } accept\n        ipv6-icmp type echo-request limit rate 4/second accept\n\n        # Everything else: one rate-limited log line, one counter, then silence.\n        limit rate 5/minute log prefix \"nft-drop-in: \" level info counter drop\n    }\n\n    # -----------------------------------------------------------------------\n    # FORWARD - guests/VMs get NOTHING unless you explicitly say so (docs/08 §4).\n    # -----------------------------------------------------------------------\n    chain forward {\n        type filter hook forward priority filter; policy drop;\n\n        # Uncomment ONLY for the bridge you deliberately built:\n        #iifname \"virbr0\" oifname \"virbr0\" accept\n        #iifname \"virbr0\" oifname \"eno1\" ct state new tcp dport { 80, 443 } accept\n        #iifname \"virbr0\" oifname \"eno1\" ct state established,related accept\n        #iifname \"eno1\" oifname \"virbr0\" ct state established,related accept\n\n        limit rate 5/minute log prefix \"nft-drop-fwd: \" level info counter drop\n    }\n\n    # -----------------------------------------------------------------------\n    # EGRESS - TIER 2 allowlist. This is what makes a compromised Apache useless\n    # for command-and-control and for exfiltration.\n    # -----------------------------------------------------------------------\n    chain output {\n        type filter hook output priority filter; policy drop;\n\n        oif \"lo\" accept\n        ct state invalid drop\n        ct state established,related accept\n\n        # The local validating resolver and chrony may reach their upstreams, nothing else may.\n        ip daddr @dns_upstreams meta l4proto { tcp, udp } th dport { 53, 853 } accept\n        ip daddr @ntp_upstreams meta l4proto udp th dport { 123, 4460 } accept\n\n        # Package management and firmware updates (TLS only).\n        meta skuid \"_apt\" tcp dport 443 accept\n        meta skuid \"root\" tcp dport 443 ct state new accept\n\n        # ACME DNS-01 (docs/06 §4): the certbot process only.\n        meta skuid \"root\" tcp dport 53 accept\n\n        # WireGuard handshake / keepalive.\n        udp dport 51820 accept\n\n        # Outbound echo replies are covered by 'established'. Allow traceroute answers.\n        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept\n        ipv6-icmp type { destination-unreachable, packet-too-big, time-exceeded,\n                         parameter-problem } accept\n\n        # Anything else leaving this machine is either a bug or a backdoor. Both are worth seeing.\n        limit rate 10/minute log prefix \"nft-drop-out: \" level info counter drop\n    }\n}\n\n# -----------------------------------------------------------------------------\n# OPTIONAL: drop-in fragments, e.g. extra allow rules for a container you add later.\n# Keep fragments small and reviewed; never let a fragment contain 'policy accept'.\n# -----------------------------------------------------------------------------\ninclude \"/etc/nftables.d/*.conf\"\n", "lines": 135, "purpose": "The only network control that matters at scale: default-deny in BOTH directions, per-source rate limiting, and an egress allowlist that makes a compromise far less useful.", "notes": [{"n": 26, "why": "DNS may only leave for the resolver you chose, so queries cannot be used as a covert channel."}, {"n": 27, "why": "Time may only come from the NTS servers you configured."}, {"n": 33, "why": "Default deny: everything not explicitly allowed is dropped, in both directions."}, {"n": 35, "why": "Loopback only - and note it is the ONLY unconditional accept in the whole ruleset."}, {"n": 36, "why": "Drops packets conntrack cannot make sense of, which is what malformed-scan traffic looks like."}, {"n": 37, "why": "Replies to connections you started, so the rest of the world does not need a rule."}, {"n": 40, "why": "Null flag scans, used to map a host without opening a connection."}, {"n": 41, "why": "Impossible flag combinations that only scanners and spoofers generate."}, {"n": 42, "why": "Impossible flag combinations that only scanners and spoofers generate."}, {"n": 43, "why": "Impossible flag combinations that only scanners and spoofers generate."}, {"n": 45, "why": "SYN+FIN is another impossible combination used in stealth scans."}, {"n": 49, "why": "SSH is reachable only over the WireGuard admin tunnel - port 22 does not exist on the internet."}, {"n": 51, "why": "Tier 1 alternative: if SSH must be public, it is at least rate-limited per source."}, {"n": 52, "why": "Per-source throttling for authentication attempts, enforced in the kernel rather than by a userspace daemon."}, {"n": 55, "why": "Per-source connection rate limit for HTTPS: you stay reachable without becoming a flood target."}, {"n": 57, "why": "The one public service. Everything else in this file exists to keep it the only one."}, {"n": 61, "why": "HTTP exists only for ACME validation - delete these rules if you validate over DNS-01 and the port disappears."}, {"n": 62, "why": "HTTP exists only for ACME validation - delete these rules if you validate over DNS-01 and the port disappears."}, {"n": 65, "why": "The WireGuard handshake port; without a valid key nothing is answered."}, {"n": 69, "why": "Rate-limited echo so you can diagnose reachability without offering a flood amplifier."}, {"n": 70, "why": "Path-MTU discovery must work or large TLS handshakes mysteriously fail."}, {"n": 71, "why": "IPv6 neighbour discovery is required for the stack to function at all."}, {"n": 72, "why": "IPv6 neighbour discovery is required for the stack to function at all."}, {"n": 73, "why": "Rate-limited echo so you can diagnose reachability without offering a flood amplifier."}, {"n": 76, "why": "What gets dropped is logged at a readable rate - a silent firewall teaches you nothing."}, {"n": 82, "why": "Guests and VMs get nothing unless you uncomment a specific rule: this is where 'the container escaped' stops."}, {"n": 83, "why": "Default deny: everything not explicitly allowed is dropped, in both directions."}, {"n": 99, "why": "Default deny: everything not explicitly allowed is dropped, in both directions."}, {"n": 102, "why": "Drops packets conntrack cannot make sense of, which is what malformed-scan traffic looks like."}, {"n": 103, "why": "Replies to connections you started, so the rest of the world does not need a rule."}, {"n": 106, "why": "DNS may only leave for the resolver you chose, so queries cannot be used as a covert channel."}, {"n": 107, "why": "Time may only come from the NTS servers you configured."}, {"n": 110, "why": "Package downloads are allowed by identity, not by port - a compromised web process is not _apt."}, {"n": 111, "why": "TLS out for administration and certificates, restricted to root."}, {"n": 114, "why": "Certificate validation over DNS-01 gets DNS; nothing else does."}, {"n": 117, "why": "The WireGuard handshake port; without a valid key nothing is answered."}, {"n": 121, "why": "Path-MTU discovery must work or large TLS handshakes mysteriously fail."}, {"n": 125, "why": "Anything else trying to leave is either a bug or a backdoor - and both are worth seeing."}, {"n": 133, "why": "Extension point for deliberate additions; the README in that directory explains why 'policy accept' must never appear there."}], "annPrefix": "#", "isDoc": false}, "etc/nftables.d/README.md": {"path": "etc/nftables.d/README.md", "content": "# /etc/nftables.d — drop-in ruleset fragments\n\n`/etc/nftables.conf` ends with:\n\n```\ninclude \"/etc/nftables.d/*.conf\"\n```\n\nso anything you put in this directory is loaded **after** the main ruleset. That is convenient and\nalso the easiest way to accidentally weaken the machine, so the rules for this directory are:\n\n1. **Never set a policy here.** A fragment that says `policy accept` (or an `accept` for a whole\n   port you did not intend) silently undoes the main file. Additions only.\n2. **Every fragment explains itself.** Header comment: what it allows, why, which document in\n   `docs/` authorises it, and the date
