#	/etc/pf.conf — mail guest
#
#	The DMZ guest with the widest inbound surface, so the rules here are the
#	most explicit in the tree.  Read them together with the gateway's pf.conf:
#	the gateway redirects 25/465/587/993/995 to this address, which means the
#	destination the gateway's filter sees is already this host.

set skip on lo
set block-policy drop
set state-policy floating
set reassembly yes
set fingerprints "/etc/pf.os"
set loginterface vio0

if		= "vio0"
me		= "10.10.40.21"

mgmt_net	= "10.10.10.0/24"
srv_net		= "10.10.50.0/24"
dmz_net		= "10.10.40.0/24"
vpn_net		= "10.10.60.0/24"
gw_dmz		= "10.10.40.1"
gw_srv		= "10.10.50.1"
dns		= "10.10.50.11"
monitor		= "10.10.50.14"
bastion		= "10.10.50.10"

icmp_types	= "{ echoreq echorep unreach timexceed paramprob }"

match in all scrub (no-df random-id max-mss 1440)

antispoof quick for $if
block all

# --- inbound: the world -------------------------------------------------------
# These ports are reachable from anywhere because the gateway redirects them
# here.  Source-restricting them is meaningless: mail comes from the internet.
# smtpd(8) and dovecot do the real access control (reverse-DNS filter, auth,
# TLS, recipient validation).
pass in quick proto tcp from any to $me port 25 keep state	# SMTP + STARTTLS
pass in quick proto tcp from any to $me port 465 keep state	# submissions (implicit TLS)
pass in quick proto tcp from any to $me port 587 keep state	# submission (STARTTLS)
pass in quick proto tcp from any to $me port 993 keep state	# IMAPS

# Port 143 (plaintext IMAP) is NOT opened.  dovecot's config still listens on
# it for localhost and for clients that STARTTLS over it, but nothing in the
# lab or from outside can reach it.  Enable deliberately if a device needs it.
#pass in quick proto tcp from any to $me port 143 keep state

# --- management ---------------------------------------------------------------
pass in quick proto tcp from $mgmt_net to $me port ssh keep state
pass in quick proto tcp from $bastion to $me port ssh keep state
pass in quick proto tcp from $vpn_net to $me port ssh keep state
pass in quick inet proto icmp from { $mgmt_net $srv_net $dmz_net } icmp-type $icmp_types keep state
pass in quick proto udp from any port bootpc to any port bootps
pass quick inet6 proto icmp6 all

# --- from the gateway ---------------------------------------------------------
# The gateway relays its own system mail to this guest over plain SMTP from
# the SRV address, which does not match the "from any" rules above by
# accident — keep this explicit so the flow is auditable.
pass in quick proto tcp from $gw_srv to $me port 25 keep state
# ACME: the challenge for this host's certificate is answered by httpd(8)
# here (see httpd.conf in this tree), reached through relayd(8) on the gateway.
# Only the gateway may ask, and only for this purpose.
pass in quick proto tcp from $gw_dmz to $me port 80 keep state
pass in quick proto udp from $gw_dmz to $me port ntp keep state
pass in quick proto { tcp udp } from $gw_dmz to $me port domain keep state

# --- monitoring ---------------------------------------------------------------
pass in quick proto udp from $monitor to $me port snmp keep state
pass in quick proto tcp from $monitor to $me port 9100 keep state
pass in quick proto udp from $monitor to $me port syslog keep state

# --- outbound -----------------------------------------------------------------
# The internet-facing dependency list.  A mail server needs to deliver to
# arbitrary hosts on port 25 — that is unavoidable and is exactly why outbound
# port 25 is the one to watch in a log.
pass out quick on $if proto tcp from $me to any port 25 keep state
pass out quick on $if proto { tcp udp } from $me to $dns port domain keep state
pass out quick on $if proto tcp from $me to $gw_dmz port http keep state	# acme
pass out quick on $if inet proto icmp from $me to { $dmz_net $srv_net } icmp-type $icmp_types keep state
# Anything else the guest originates (package updates, dns-over-tcp, ...).
pass out on $if from $me to any keep state

# ------------------------------------------------------------------ notes
# * Submission from USERS or VPN clients does not appear here: the gateway
#   redirects 587 to this host, so those flows arrive on the "from any" rules
#   above.  If you later want to restrict submission to lab clients, do it on
#   the gateway instead, where the source zone is known.
# * mailboxes live in /var/vmail on this guest and are excluded from the NFS
#   backup path on purpose — dovecot's own backup (doveadm backup) is the
#   correct tool for a maildir tree.
