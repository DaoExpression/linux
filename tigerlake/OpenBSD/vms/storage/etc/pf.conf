#	/etc/pf.conf — storage guest
#
#	Baseline rules plus the file services.  Two details make this guest
#	different from the others:
#
#	  * NFS needs *two* ports, and one of them (mountd's) is not fixed.  The
#	    rules below allow 111 and 2049, and pf.conf on the gateway carries the
#	    same comment: find the third port with "rpcinfo -p 10.10.50.13" and add
#	    it here and there, or pin mountd's port at start-up.
#	  * Samba must never be reachable from GUEST or from the internet.  445 is
#	    the single most- attacked port in any network; the rules keep it on the
#	    SRV and USERS segments only.

set skip on lo
set block-policy drop
set state-policy floating
set reassembly yes
set fingerprints "/etc/pf.os"
set loginterface vio0

if		= "vio0"
me		= "10.10.50.13"

mgmt_net	= "10.10.10.0/24"
user_net	= "10.10.20.0/24"
srv_net		= "10.10.50.0/24"
dmz_net		= "10.10.40.0/24"
vpn_net		= "10.10.60.0/24"
gw		= "10.10.50.1"
monitor		= "10.10.50.14"
bastion		= "10.10.50.10"

lab_clients	= "{ $mgmt_net $user_net $srv_net $dmz_net $vpn_net }"
nfs_ports	= "{ 111 2049 }"	# + mountd's port: see the note above
samba_ports	= "{ 137 138 139 445 }"
icmp_types	= "{ echoreq echorep unreach timexceed paramprob }"

match in all scrub (no-df random-id max-mss 1440)

antispoof quick for $if
block all

# --- inbound ------------------------------------------------------------------
pass in quick inet proto icmp from { $mgmt_net $srv_net $dmz_net } icmp-type $icmp_types keep state
pass in quick proto udp from any port bootpc to any port bootps
pass quick inet6 proto icmp6 all
pass in quick proto tcp from $mgmt_net to $me port ssh keep state
pass in quick proto tcp from $bastion to $me port ssh keep state
pass in quick proto tcp from $vpn_net to $me port ssh keep state

# --- NFS ----------------------------------------------------------------------
# Read-write from SRV and DMZ (the backup clients), read-only for everyone else
# is enforced by /etc/exports, not here: pf cannot tell a read-only mount from a
# writeable one, so the rules open the ports and the export options do the rest.
pass in quick proto { tcp udp } from { $srv_net $dmz_net } to $me port $nfs_ports keep state
pass in quick proto { tcp udp } from { $mgmt_net $user_net } to $me port $nfs_ports keep state
# mountd's dynamic port: add the real value here (and on the gateway) after
# checking "rpcinfo -p 10.10.50.13".
#pass in quick proto { tcp udp } from $lab_clients to $me port 1011 keep state

# --- Samba --------------------------------------------------------------------
# USERS may mount the media share; SRV has the writeable one.  Not GUEST, not
# the internet, and not the DMZ.
pass in quick proto { tcp udp } from { $user_net $srv_net } to $me port $samba_ports keep state
pass in quick proto { tcp udp } from $vpn_net to $me port $samba_ports keep state

# --- iSCSI --------------------------------------------------------------------
# Only if you enable the target; the runbook is vms/storage/docs/iscsi.md.
pass in quick proto tcp from 10.10.50.12 to $me port 3260 keep state

# --- monitoring ---------------------------------------------------------------
pass in quick proto udp from $monitor to $me port snmp keep state
pass in quick proto udp from $monitor to $me port syslog keep state
pass in quick proto udp from $gw to $me port ntp keep state
pass in quick proto { tcp udp } from $gw to $me port domain keep state

# --- outbound -----------------------------------------------------------------
# Backups pull from the guests, but the reverse happens too (verification);
# everything else is ordinary.
pass out on $if from $me to any keep state

# ------------------------------------------------------------------ notes
# * Do not add "pass in ... from $guest_net".  Guest devices must not see the
#   file services, and the gateway's pf.conf blocks GUEST from SRV anyway —
#   this rule would be the one that accidentally undoes that.
