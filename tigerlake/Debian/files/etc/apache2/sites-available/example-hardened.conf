# /etc/apache2/sites-available/example-hardened.conf
# TEMPLATE for a real site. Copy to <yoursite>.conf, replace example.com, then:
#   sudo a2ensite <yoursite>.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Every line is here for a reason; read docs/06 before deleting any of them.

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com
    ServerAdmin hostmaster@example.com      # used only in error documents; keep it generic

    # --- TLS ---------------------------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/example.com/privkey.pem
    # Protocol/ciphers come from conf-available/tls-hardening.conf (global). Do not override here
    # unless you have a specific, documented reason - two places to be wrong is one too many.
    # HTTP/2 (needs mod_http2; keep it only if you accept its own CVE stream):
    Protocols h2 http/1.1

    # --- isolation: this site's own directories, nothing above them ---------------------------
    DocumentRoot /srv/example.com/public
    <Directory /srv/example.com/public>
        Options -Indexes -ExecCGI -Includes -MultiViews -FollowSymLinks
        AllowOverride None                  # .htaccess forbidden globally too; this is the second lock
        Require all granted
        # No symlinks out of the webroot: a symlink is an escape primitive.
        # (FollowSymLinks is off in Options above; this documents the intent.)
    </Directory>

    # Application data that must NOT be servable, even by accident.
    <Directory /srv/example.com/data>
        Require all denied
    </Directory>

    # --- what this vhost will parse ------------------------------------------------------------
    # Explicitly no handlers: if a file has one of these extensions it is refused, not executed.
    <FilesMatch "\.(php|phtml|phar|pl|py|rb|cgi|sh|jsp|asp|aspx)$">
        Require all denied
    </FilesMatch>

    # --- methods ------------------------------------------------------------------------------
    <LimitExcept GET HEAD POST>
        Require all denied
    </LimitExcept>

    # --- uploads (only if you actually accept them) -------------------------------------------
    # Keep the global 1 MiB body limit unless you need more; if you raise it, raise it HERE only,
    # and make the upload directory non-executable and outside the document root.
    #LimitRequestBody 5242880
    #<Location /uploads>
    #    Require all granted
    #    Header always set Content-Disposition "attachment"
    #    # Serve uploads from a separate vhost/domain so that a stored XSS cannot touch your origin,
    #    # or better: store them outside the webroot and stream them through your application.
    #</Location>

    # --- application entry point (tighten to your exact routes) -------------------------------
    # A fail-closed default with explicit allowances is far better than a default-open app.
    #<Location />
    #    Require all denied
    #</Location>
    #<Location /api/v1/>
    #    Require all granted
    #</Location>

    # --- error documents: static, generic, no version information -----------------------------
    ErrorDocument 400 /error/400.html
    ErrorDocument 403 /error/403.html
    ErrorDocument 404 /error/404.html
    ErrorDocument 405 /error/405.html
    ErrorDocument 500 /error/500.html
    # Make sure the error pages cannot themselves be replaced by a request path.
    <Location /error/>
        Require all granted
    </Location>

    # --- logging ------------------------------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/example.com_error.log
    LogLevel  warn
    CustomLog ${APACHE_LOG_DIR}/example.com_access.log paranoid
    # Tier 2 alternative: pipe to journald (docs/06 §9) so events land in a sealed, shippable store:
    #CustomLog "|/usr/bin/logger -t apache_example -p local6.info" paranoid

    # --- per-vhost request limits -------------------------------------------------------------
    # Belt and braces with nftables (docs/05 §2): bound this vhost's own concurrency.
    <IfModule mod_reqtimeout.c>
        RequestReadTimeout header=10-20,MinRate=500 body=10-20,MinRate=500
    </IfModule>
</VirtualHost>
