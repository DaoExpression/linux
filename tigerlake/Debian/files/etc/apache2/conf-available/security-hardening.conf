# /etc/apache2/conf-available/security-hardening.conf
# Enabled with:  sudo a2enconf security-hardening   (docs/06 §3)
# Covers the global "fail closed and speak little" rules that the main config does not.
#
# Validate:  sudo apache2ctl configtest

# ---------------------------------------------------------------------------
# Never execute anything, no matter what a filename claims
# ---------------------------------------------------------------------------
# The host has no PHP/Perl/Python/CGI handler installed at all (that is the primary control). This
# rule is the second lock: if an attacker lands a file in the web root, and someone later installs a
# handler by mistake, this still refuses to serve it through that handler.
<FilesMatch "\.(php|php[0-9]|phtml|phar|phps|pl|py|pyc|rb|cgi|sh|bash|ksh|asp|aspx|jsp|jspx|exe|dll|so|bin|swf|htaccess)$">
    Require all denied
</FilesMatch>

# Same idea at the directory level: no AddHandler/SetHandler to sensitive directives.
<LocationMatch "^/(cgi-bin|server-status|server-info|\.git|\.svn|\.env|wp-admin|wp-login\.php)">
    Require all denied
</LocationMatch>

# ---------------------------------------------------------------------------
# Methods: only what a static/API HTTPS server needs
# ---------------------------------------------------------------------------
<LimitExcept GET HEAD POST OPTIONS>
    Require all denied
</LimitExcept>

# TRACK/TRACE cannot be enabled from here (TraceEnable Off is global), and OPTIONS is answered by
# Apache itself without leaking the method list beyond what is needed.

# ---------------------------------------------------------------------------
# Do not leak the filesystem layout through error documents
# ---------------------------------------------------------------------------
ServerSignature Off
<IfModule mod_negotiation.c>
    # 406/300 responses can reveal that related files exist. Disable the "MultiViews" variant.
    Options -MultiViews
</IfModule>

# ---------------------------------------------------------------------------
# Range requests and ETags: keep them simple
# ---------------------------------------------------------------------------
# Range requests have historically been used for amplification (byte-range DoS) and for leaking
# file sizes. Static sites generally want them off unless they serve large media.
<IfModule mod_headers.c>
    # Uncomment if you serve no large files:
    #Header unset Accept-Ranges
    Header always unset X-Powered-By
    Header always unset X-AspNet-Version
    Header always unset Server
</IfModule>

# ---------------------------------------------------------------------------
# mod_status / mod_info: localhost only, and only if you kept the module
# ---------------------------------------------------------------------------
<IfModule mod_status.c>
    ExtendedStatus Off          # ExtendedStatus leaks request URLs to every worker's status dump
    <Location /server-status>
        SetHandler server-status
        Require ip 127.0.0.1 ::1 10.66.0.1
    </Location>
</IfModule>
<IfModule mod_info.c>
    <Location /server-info>
        SetHandler server-info
        Require ip 127.0.0.1 ::1 10.66.0.1
    </Location>
</IfModule>

# ---------------------------------------------------------------------------
# Directory listings: off here as well as in the vhost (defaults matter)
# ---------------------------------------------------------------------------
<IfModule mod_autoindex.c>
    IndexOptions -FancyIndexing -FoldersFirst -IconsAreLinks
    # Even if mod_autoindex is somehow re-enabled, do not list anything.
    <Location />
        Options -Indexes
    </Location>
</IfModule>
