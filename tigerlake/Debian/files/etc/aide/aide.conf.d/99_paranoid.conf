# /etc/aide/aide.conf.d/99_paranoid.conf
# AIDE rules. docs/04 §8: take the baseline LAST, after all configuration is final, or every run
# is noise. Verify with: sudo aide --check --config /etc/aide/aide.conf

# Custom rule sets (content: permissions, inode, links, uid, gid, size, mtime, ctime, sha512)
# - p permissions, i inode, n number of links, u user, g group, s size, m mtime, c ctime, sha512 hash
STRONG = p+i+n+u+g+s+m+c+sha512
CONTENT = p+n+u+g+s+sha512
LOOSE = p+u+g

# Trust roots - anything changing here is a finding until proven otherwise
/etc STRONG
/boot STRONG
/usr/bin STRONG
/usr/sbin STRONG
/bin STRONG
/sbin STRONG
/usr/lib/systemd STRONG
/etc/ssl STRONG
/etc/letsencrypt STRONG
/etc/paranoid STRONG
/etc/audit STRONG
/etc/apache2 STRONG
/etc/modsecurity STRONG
/etc/nftables.conf STRONG
/etc/wireguard STRONG

# Content of the served material: integrity matters, mtime does not (deploys are legitimate)
/var/www CONTENT
/srv CONTENT

# Volatile by nature. Excluded so the daily diff stays readable (a diff nobody reads is useless).
!/var/cache
!/var/tmp
!/var/log
!/var/lib/aide
!/var/lib/systemd
!/var/lib/chrony
!/var/lib/unbound
!/var/lib/dpkg
!/var/lib/apt
!/run
!/proc
!/sys
!/dev
!/tmp
!/srv/.*tmp
!/etc/mtab
!/etc/adjtime
!/etc/resolv.conf
!/root/.bash_history
!/home/.*\.bash_history
!/etc/letsencrypt/.*\.pem\.new$
