# /etc/modprobe.d/95-options-paranoid.conf
# Module options that harden what remains. Every line has a reason; nothing is cargo-culted.

# Wi-Fi (00:14.3 AX201) - only meaningful if you keep iwlwifi (docs/00 §2).
#   disable_11ax=0 keeps 802.11ax enabled; add power_save=0 for lower latency/jitter.
options iwlwifi power_save=0
options iwlmvm power_scheme=1

# USB storage: force the "no FUA" quirk only if you have a device that misbehaves.
# Do not add blanket quirks; they change write-cache semantics (a data-integrity risk).
# options usb_storage quirks=

# DRM/i915: on this Dell the internal panel + efifb handoff is your emergency console.
# These reduce the GPU's own attack/perf surface without removing the driver:
#   enable_guc=0 disables GuC submission (also disables some firmware paths).
# TRADE-OFF: some Tiger Lake panels need GuC for a stable console. Test before relying on it.
# options i915 enable_guc=0 enable_fbc=0 enable_psr=0

# Realtek/other NICs: not present on this machine.
