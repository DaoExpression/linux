#	/etc/httpd.conf — web guest
#
#	Validate:  httpd -n
#	Apply:     rcctl reload httpd
#	Test:      curl -H 'Host: lab.example.org' http://10.10.40.20:8080/
#
#	This server is a backend: it speaks plain HTTP on 8080 to relayd(8) on the
#	gateway and knows nothing about TLS.  The X-Forwarded-Proto header set by
#	relayd is what tells the application the client's connection was secure.

chroot "/var/www"

# ------------------------------------------------------------------ static site
server "lab.example.org" {
	listen on 10.10.40.20 port 8080
	root "/htdocs/lab"

	# The relay forwards the public hostname, so the vhost matches on it.  A
	# direct request with a different Host header gets a 404 rather than
	# someone else's content.
	directory index "index.html"

	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}

	# Static assets: let clients keep them, and make sure a stale HTML page is
	# not paired with fresh CSS after a deploy.
	location "/css/*"	{ root "/htdocs/lab" }
	location "/js/*"	{ root "/htdocs/lab" }
	location "/img/*"	{ root "/htdocs/lab" }

	# No directory listings, no CGI, no .ht* leakage.
	location "/.ht*" { block }
	location "*.php"  { block }

	log style combined
	log access
}

# ------------------------------------------------------------------ application
# Where the application goes, and where it does not.
#
# httpd(8) serves static files, CGI and FastCGI — it is not a reverse proxy.
# An application therefore runs as its own daemon on this guest (under its own
# uid, not www) and httpd talks to it over a FastCGI socket.  Add it to the
# site server above:
#
#	location "/api/*" {
#		fastcgi socket "/run/app.sock"
#	}
#
# and on loopback if the app speaks HTTP instead:
#
#	location "/api/*" {
#		fastcgi socket tcp 127.0.0.1 9000
#	}
#
# The app's daemon needs its own rc.conf.local entry:
#	app_flags=""
# and it must listen on a unix socket in /var/www/run (inside the chroot) or
# on loopback, never on 10.10.40.20 — nothing but relayd should reach this
# guest's network address.

# ------------------------------------------------------------------ notes
# * Files under /var/www/htdocs must be readable by www:_www.  For the site
#   content, deploy it with:
#	rsync -a --chown=www:_www site/ web.lab.example.org:/var/www/htdocs/lab/
# * If the application needs to read environment-specific settings, put them in
#   /var/www/etc/ (inside the chroot) rather than /etc — httpd cannot see
#   outside its chroot.
# * httpd(8) has no built-in logging rotation; newsyslog.conf on this guest
#   handles /var/www/logs/*.
