#	/etc/ntpd.conf — lab guest baseline
#
#	Guests sync to the gateway (10.10.50.1), which is the lab's time source.
#	They do not talk to public pool servers: when every log line is correlated
#	across seven machines, all of them agreeing with one clock matters more
#	than each of them being independently right.
#
#	ntpd(8) does not listen by default — which is exactly what we want here, so
#	no "listen on" line appears in this file.

server 10.10.50.1

# If the gateway is ever unreachable, fall back to the pool rather than letting
# the clock drift unbounded.  Uncomment and set a local stratum-2 first if your
# segment has one.
#servers pool.ntp.org

# Read the CPU temperature sensor as a drift reference where one exists.
# Left off on guests: virtio guests have no meaningful thermal sensors, and an
# empty sensor list is not an error but a wrong one is noise in the log.
