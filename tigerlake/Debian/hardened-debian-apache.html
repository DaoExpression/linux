<script>
const DATA = {"pages": [{"slug": "README", "title": "Overview &amp; threat model", "html": "<h1 id=\"paranoid-debian-apache-server-build-harden-verify\">Paranoid Debian + Apache Server — Build, Harden, Verify<a class=\"anchor\" href=\"#paranoid-debian-apache-server-build-harden-verify\" aria-label=\"link\">#<\/a><\/h1>\n<p>Target machine: <strong>Dell laptop, Intel 11th Gen (Tiger Lake-UP3/H35, 4 cores)<\/strong> as reported by <code>lspci<\/code> in <span class=\"nolit\" title=\"in the repository, not embedded in this page: TigerLake_PCI.txt\"><code>TigerLake_PCI.txt<\/code><\/span>.<\/p>\n<p>Role: <strong>single-purpose, headless HTTPS server<\/strong> (Apache httpd). No GUI, no desktop, no development toolchain on the host, no unrelated daemons.<\/p>\n<p>This repository contains two things:<\/p>\n<ol>\n<li><strong>A guide<\/strong> (<code>docs/<\/code>) — do this, in this order, and why.<\/li>\n<\/li>\n<li><strong>The actual artefacts<\/strong> (<code>files/<\/code>, <code>preseed/<\/code>, <code>scripts/<\/code>) — every config file, rule set, profile and script the guide references. Nothing in the guide asks you to \"create a file\" by hand; the file already exists here.<\/li>\n<\/li>\n<\/ol>\n<hr>\n<h2 id=\"1-the-security-model-in-one-page\">1. The security model in one page<a class=\"anchor\" href=\"#1-the-security-model-in-one-page\" aria-label=\"link\">#<\/a><\/h2>\n<p><strong>Threats we take seriously<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">#<\/th>\n<th style=\"text-align:left\">Threat<\/th>\n<th style=\"text-align:left\">Primary control<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">T1<\/td>\n<td style=\"text-align:left\">Offline theft of the disk/laptop<\/td>\n<td style=\"text-align:left\">LUKS2 full-disk encryption, Argon2id, <strong>detached header<\/strong>, no TPM auto-unlock<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T2<\/td>\n<td style=\"text-align:left\">Evil-maid / bootkit (modified kernel or initramfs)<\/td>\n<td style=\"text-align:left\">Secure Boot with <strong>your own keys<\/strong>, signed Unified Kernel Image, kernel lockdown <code>confidentiality<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T3<\/td>\n<td style=\"text-align:left\">Remote compromise of the web service<\/td>\n<td style=\"text-align:left\">Minimal attack surface (few modules), TLS 1.3 only, mod_security3 + OWASP CRS, per-service sandboxing, AppArmor, nftables ingress + egress filtering<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T4<\/td>\n<td style=\"text-align:left\">Compromise of the host <em>from<\/em> the web service<\/td>\n<td style=\"text-align:left\">systemd sandboxing of the Apache unit, per-security-domain users, AppArmor, no shell for the web user, read-only root, no compiler on host<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T5<\/td>\n<td style=\"text-align:left\">Malicious/rogue PCIe or Thunderbolt device (DMA attack)<\/td>\n<td style=\"text-align:left\">Intel VT-d + IOMMU strict mode, Thunderbolt security level + <code>boltctl<\/code> authorization, NVIDIA dGPU bound away/disabled, unused devices blacklisted<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T6<\/td>\n<td style=\"text-align:left\">Malicious USB device<\/td>\n<td style=\"text-align:left\">USBGuard in <code>deny<\/code> default policy, <code>usbcore<\/code> authorization, no X11/automount, unused USB controllers blacklisted if the machine is racked<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T7<\/td>\n<td style=\"text-align:left\">Firmware/Management Engine persistence<\/td>\n<td style=\"text-align:left\">BIOS password + firmware lock, <code>fwupdmgr<\/code> updates, <strong>Intel ME interface driver disabled and ME disabled via <code>me_cleaner<\/code> (optional, high risk)<\/strong>, microcode from <code>intel-microcode<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T8<\/td>\n<td style=\"text-align:left\">Supply chain / driver abuse<\/td>\n<td style=\"text-align:left\"><code>module.sig_enforce=1<\/code>, no <code>testing<\/code>/<code>sid<\/code>, <code>--no-install-recommends<\/code> only, apt signature + <code>Valid-Until<\/code> checks, AIDE + debsums integrity monitoring<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T9<\/td>\n<td style=\"text-align:left\">Privilege escalation on the host<\/td>\n<td style=\"text-align:left\"><code>noexec,nosuid,nodev<\/code> mounts, sysctl/tier-1 hardening, auditd rules, sudo hardening, <code>kernel.perf_event_paranoid<\/code>, userns/bpf restrictions<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T10<\/td>\n<td style=\"text-align:left\">Data exfiltration by a compromised service<\/td>\n<td style=\"text-align:left\">Egress firewall allowlist, Apache in its own namespace/user, per-vhost separation, outbound DNS pinned to local validating resolver<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">T11<\/td>\n<td style=\"text-align:left\">Third-party software demanding host privileges<\/td>\n<td style=\"text-align:left\"><strong>Virtualization/isolation instead of host packages<\/strong> — see <code>docs/09<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>What we explicitly refuse to do (and why)<\/strong><\/p>\n<ul>\n<li>No TPM-based disk unlock on this machine: it only has <strong>Intel PTT (firmware TPM)<\/strong> — see the hardware profile. Passphrase + detached header on a separate physical token is stronger against the threats that matter here. TPM2 is still used for <em>sealing audit/IMA state<\/em>, which is optional.<\/li>\n<\/li>\n<li>No Secure Boot using Microsoft's third-party CA and Debian's shim in \"trust whatever MOK\" mode: we own the platform keys. The shim path is documented as a fallback only.<\/li>\n<\/li>\n<li>No Docker/podman daemon running as root, no rootful libvirt, no host PHP/Python/Node.<\/li>\n<\/li>\n<li>No <code>discard<\/code>/<code>fstrim<\/code> on encrypted volumes (leaks allocation patterns), no hibernate (cold-boot + swap-exposure risk), no <code>nosmt<\/code> unless you accept the ~30% capacity loss.<\/li>\n<\/li>\n<li>No <code>testing<\/code>, no <code>sid<\/code>, no backports for anything security-relevant.<\/li>\n<\/li>\n<\/ul>\n<p><strong>The cost of this posture<\/strong> — state it plainly before you start:<\/p>\n<ul>\n<li>Losing the LUKS header USB key <strong>and<\/strong> the passphrase = total data loss. Keep the header backup.<\/li>\n<\/li>\n<li>Losing your custom Secure Boot keys = you must clear the firmware and re-enrol; on a Dell that means a BIOS reset. Keep <code>keys/<\/code> offline.<\/li>\n<\/li>\n<li>Egress filtering means package installs are manual and annoying. That is the point.<\/li>\n<\/li>\n<li>Some paranoia tiers (<code>mitigations=auto,nosmt<\/code>, strict egress, module signing) cost performance or convenience. Each is labelled <strong>[TIER 2]<\/strong> or <strong>[TIER 3]<\/strong> so you can decide deliberately.<\/li>\n<\/li>\n<\/ul>\n<hr>\n<h2 id=\"2-directory-layout\">2. Directory layout<a class=\"anchor\" href=\"#2-directory-layout\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>README.md                        this file\nhardened-debian-apache.html      the whole guide + every artefact in ONE offline dark-theme page\ntools/                           generator for that page (markdown converter, annotations, HTML shell)\ndocs/\n  00-hardware-profile.md         what YOUR machine has, what to keep/blacklist, firmware\n  01-threat-model.md             assets, adversaries, assumptions, explicit non-goals\n  02-debian-install.md           debian installer walkthrough (encrypted, minimal, offline-first)\n  03-boot-integrity.md           Secure Boot own-keys, UKI, LUKS detached header, TPM stance\n  04-base-hardening.md           sysctl, modules, users, sudo, PAM, AppArmor, auditd, AIDE, apt\n  05-network-and-firewall.md     nftables ingress+egress, DNS, SSH, WireGuard admin plane\n  06-apache-hardening.md         Apache hardening, TLS 1.3, mod_security3+CRS, sandboxing, CLI ACME\n  07-physical-and-firmware.md    BIOS, ME, Thunderbolt, USBGuard, sensors/camera/mic\n  08-isolation-and-virtualization.md  KVM/nspawn/podman patterns for anything not essential\n  09-software-policy.md          \"install only what is necessary\" decision procedure\n  10-audit-and-maintenance.md    daily/weekly/monthly/quarterly runbook + verification\n  11-incident-response.md        compromise response, key rotation, recovery drills\nfiles/etc/…                      the artefacts (drop-in ready)\nfiles/usr/local/sbin/…           helper scripts the units call (boot record, cert check)\nfiles/keys/README.md             how to create and store your Secure Boot keys\npreseed/paranoid-preseed.cfg     unattended encrypted+minimal install (fully hands-off)\nscripts/\n  install-hardening.sh           idempotent: copies files/, enables everything\n  harden-apache.sh               Apache module prune + config install + validation\n  verify-hardening.sh            read-only checker: PASS/FAIL/WARN per control (run this!)\n  make-luks-detached.sh          detached-header LUKS setup helper used by the installer\n  Makefile                       make help / dry-run / install / verify<\/code><\/pre><\/div>\n<p>Every file under <code>files/<\/code> mirrors the absolute path it belongs at. <code>scripts/install-hardening.sh<\/code> walks that tree and installs it, so paths never drift.<\/p>\n<h2 id=\"2b-the-offline-single-file-reference\">2b. The offline single-file reference<a class=\"anchor\" href=\"#2b-the-offline-single-file-reference\" aria-label=\"link\">#<\/a><\/h2>\n<p><code>hardened-debian-apache.html<\/code> is a self-contained dark-theme page that presents all 13 documents as separate pages <strong>and<\/strong> embeds all 72 configuration artefacts with per-option annotations (<code>⟵ why this matters<\/code>). It needs no network and no server: open it with a browser, from a USB stick, from the machine you are building. Nothing is fetched at runtime — a browser refuses to read local files from a <code>file://<\/code> page, which is why the content is embedded at build time.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>python3 tools/build-docs-html.py          # rebuild after changing any doc or artefact\nmake -f scripts/Makefile docs-html        # same thing\nmake -f scripts/Makefile docs-html-verify # fails if the committed page is stale<\/code><\/pre><\/div>\n<p>The build <strong>fails<\/strong> rather than silently degrading: it recomputes the fence and table counts of every document and compares them with what was rendered. Change a document, rebuild, and the page cannot drift from the repository.<\/p>\n<hr>\n<h2 id=\"3-order-of-operations\">3. Order of operations<a class=\"anchor\" href=\"#3-order-of-operations\" aria-label=\"link\">#<\/a><\/h2>\n<ol>\n<li>Read <a href=\"#/page/01-threat-model\"><code>docs/01-threat-model.md<\/code><\/a>. Decide your tier (1 = pragmatic paranoia, 2 = recommended, 3 = maximum, with real convenience costs).<\/li>\n<\/li>\n<li><a href=\"#/page/00-hardware-profile\"><code>docs/00-hardware-profile.md<\/code><\/a> — know what you are disabling before you disable it.<\/li>\n<\/li>\n<li><a href=\"#/page/02-debian-install\"><code>docs/02-debian-install.md<\/code><\/a> — install (interactive or <code>preseed/paranoid-preseed.cfg<\/code>).<\/li>\n<\/li>\n<li><a href=\"#/page/03-boot-integrity\"><code>docs/03-boot-integrity.md<\/code><\/a> — Secure Boot own keys, UKI, verify LUKS header is detached.<\/li>\n<\/li>\n<li><code>bash scripts/install-hardening.sh --dry-run<\/code> then without <code>--dry-run<\/code>.<\/li>\n<\/li>\n<li><a href=\"#/page/05-network-and-firewall\"><code>docs/05-network-and-firewall.md<\/code><\/a> — nftables last, or you will lock yourself out.<\/li>\n<\/li>\n<li><a href=\"#/page/06-apache-hardening\"><code>docs/06-apache-hardening.md<\/code><\/a> + <code>bash scripts/harden-apache.sh<\/code>.<\/li>\n<\/li>\n<li><a href=\"#/page/07-physical-and-firmware\"><code>docs/07-physical-and-firmware.md<\/code><\/a> — BIOS/ME/Thunderbolt/USBGuard.<\/li>\n<\/li>\n<li><a href=\"#/page/10-audit-and-maintenance\"><code>docs/10-audit-and-maintenance.md<\/code><\/a> — install timers, run <code>scripts/verify-hardening.sh<\/code>.<\/li>\n<\/li>\n<li>Anything else you want → <a href=\"#/page/09-software-policy\"><code>docs/09-software-policy.md<\/code><\/a>, then <a href=\"#/page/08-isolation-and-virtualization\"><code>docs/08-isolation-and-virtualization.md<\/code><\/a>.<\/li>\n<\/li>\n<\/ol>\n<p><strong>Safe-mode rule:<\/strong> do all of steps 4–7 over the physical console or an <code>ssh -o ServerAliveInterval=15<\/code> session with a second root shell already open. Every network step in this repo applies rules with <code>nft -f<\/code> only after <code>nft -c -f<\/code> (check) passes.<\/p>\n<hr>\n<h2 id=\"4-verification\">4. Verification<a class=\"anchor\" href=\"#4-verification\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>bash scripts/verify-hardening.sh          # full read-only audit, exits non-zero on FAIL\nbash scripts/verify-hardening.sh --tier 1 # only checks the tier you chose\nsudo systemd-analyze security apache2 nftables\nsudo lynis audit system                   # optional extra opinion, not required<\/code><\/pre><\/div>\n<p><code>verify-hardening.sh<\/code> checks the guide's own claims (LUKS header location, Secure Boot state, sysctl values, module blacklists, Apache directives, nftables policy, timers, file modes). A green run is the definition of \"this build matches the guide\".<\/p>", "files": ["etc/nftables.conf", "etc/paranoid/README.md", "usr/local/sbin/paranoid-boot-record", "usr/local/sbin/paranoid-cert-check"], "toc": [{"lvl": 1, "id": "paranoid-debian-apache-server-build-harden-verify", "text": "Paranoid Debian + Apache Server — Build, Harden, Verify"}, {"lvl": 2, "id": "1-the-security-model-in-one-page", "text": "1. The security model in one page"}, {"lvl": 2, "id": "2-directory-layout", "text": "2. Directory layout"}, {"lvl": 2, "id": "2b-the-offline-single-file-reference", "text": "2b. The offline single-file reference"}, {"lvl": 2, "id": "3-order-of-operations", "text": "3. Order of operations"}, {"lvl": 2, "id": "4-verification", "text": "4. Verification"}], "fences": 3, "tables": 1}, {"slug": "00-hardware-profile", "title": "00 · Hardware profile", "html": "<h1 id=\"00-hardware-profile-of-this-machine\">00 — Hardware profile of <em>this<\/em> machine<a class=\"anchor\" href=\"#00-hardware-profile-of-this-machine\" aria-label=\"link\">#<\/a><\/h1>\n<p>Source: <span class=\"nolit\" title=\"in the repository, not embedded in this page: ../TigerLake_PCI.txt\"><code>TigerLake_PCI.txt<\/code><\/span> (<code>lspci -nnk<\/code>, unprivileged user, so <code>Capabilities: &lt;access denied&gt;<\/code> — that line is a <em>permissions<\/em> artifact, not a device property).<\/p>\n<h2 id=\"1-what-the-dump-says\">1. What the dump says<a class=\"anchor\" href=\"#1-what-the-dump-says\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Address<\/th>\n<th style=\"text-align:left\">Device<\/th>\n<th style=\"text-align:left\">Driver in use<\/th>\n<th style=\"text-align:left\">Keep?<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\"><code>00:00.0<\/code><\/td>\n<td style=\"text-align:left\">11th Gen Core Host Bridge/DRAM (<code>igen6_edac<\/code>)<\/td>\n<td style=\"text-align:left\">—<\/td>\n<td style=\"text-align:left\">keep (EDAC error reporting)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:02.0<\/code><\/td>\n<td style=\"text-align:left\"><strong>Iris Xe Graphics<\/strong> TigerLake-LP GT2<\/td>\n<td style=\"text-align:left\"><code>i915<\/code><\/td>\n<td style=\"text-align:left\">keep (console only) or blacklist if fully headless<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:04.0<\/code><\/td>\n<td style=\"text-align:left\">Dynamic Tuning Processor Participant (DPTF)<\/td>\n<td style=\"text-align:left\"><code>proc_thermal<\/code><\/td>\n<td style=\"text-align:left\"><strong>keep<\/strong> — thermal control, removing it risks throttling/burn<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:06.0<\/code><\/td>\n<td style=\"text-align:left\">PCIe controller → NVIDIA dGPU<\/td>\n<td style=\"text-align:left\"><code>pcieport<\/code><\/td>\n<td style=\"text-align:left\">keep the bridge, kill the dGPU (below)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:07.0<\/code><\/td>\n<td style=\"text-align:left\"><strong>Thunderbolt 4 Root Port #0<\/strong><\/td>\n<td style=\"text-align:left\"><code>pcieport<\/code><\/td>\n<td style=\"text-align:left\">keep + lock down (seen below)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:08.0<\/code><\/td>\n<td style=\"text-align:left\"><strong>GNA Scoring Accelerator<\/strong> (AI gadget)<\/td>\n<td style=\"text-align:left\"><em>none<\/em><\/td>\n<td style=\"text-align:left\"><strong>blacklist<\/strong> — unnecessary attack surface<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:0a.0<\/code><\/td>\n<td style=\"text-align:left\">Telemetry Aggregator (<code>intel_vsec<\/code>)<\/td>\n<td style=\"text-align:left\"><code>intel_vsec<\/code><\/td>\n<td style=\"text-align:left\">blacklist <strong>[TIER 2]<\/strong> — telemetry/PMT bus exposed to OS<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:0d.0<\/code><\/td>\n<td style=\"text-align:left\"><strong>TB4 xHCI USB controller<\/strong><\/td>\n<td style=\"text-align:left\"><code>xhci_hcd<\/code><\/td>\n<td style=\"text-align:left\">keep only if you need USB-C; otherwise blacklist<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:0d.2<\/code><\/td>\n<td style=\"text-align:left\"><strong>TB4 NHI (USB4 host interface)<\/strong><\/td>\n<td style=\"text-align:left\"><code>thunderbolt<\/code><\/td>\n<td style=\"text-align:left\"><strong>blacklist + BIOS disable<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:12.0<\/code><\/td>\n<td style=\"text-align:left\"><strong>Integrated Sensor Hub<\/strong><\/td>\n<td style=\"text-align:left\"><code>intel_ish_ipc<\/code><\/td>\n<td style=\"text-align:left\"><strong>blacklist<\/strong> — sensors are not needed on a server<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:14.0<\/code><\/td>\n<td style=\"text-align:left\">USB 3.2 xHCI (main)<\/td>\n<td style=\"text-align:left\"><code>xhci_hcd<\/code><\/td>\n<td style=\"text-align:left\">keep (keyboard/console, USBGuard)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:14.2<\/code><\/td>\n<td style=\"text-align:left\">Shared SRAM<\/td>\n<td style=\"text-align:left\">—<\/td>\n<td style=\"text-align:left\">none<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:14.3<\/code><\/td>\n<td style=\"text-align:left\"><strong>Wi-Fi 6 AX201<\/strong><\/td>\n<td style=\"text-align:left\"><code>iwlwifi<\/code><\/td>\n<td style=\"text-align:left\">keep only if wired Ethernet is impossible<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:15.0/1<\/code><\/td>\n<td style=\"text-align:left\">Serial IO I²C #0/#1<\/td>\n<td style=\"text-align:left\"><code>intel-lpss<\/code><\/td>\n<td style=\"text-align:left\">blacklist if no touchpad needed<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:16.0<\/code><\/td>\n<td style=\"text-align:left\"><strong>Intel Management Engine interface<\/strong><\/td>\n<td style=\"text-align:left\"><code>mei_me<\/code><\/td>\n<td style=\"text-align:left\"><strong>blacklist<\/strong> (see §4)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:1c.0<\/code><\/td>\n<td style=\"text-align:left\">PCIe Root Port → NVMe<\/td>\n<td style=\"text-align:left\"><code>pcieport<\/code><\/td>\n<td style=\"text-align:left\">keep<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:1f.0<\/code><\/td>\n<td style=\"text-align:left\">LPC controller<\/td>\n<td style=\"text-align:left\">—<\/td>\n<td style=\"text-align:left\">keep (essential)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:1f.3<\/code><\/td>\n<td style=\"text-align:left\">Smart Sound audio<\/td>\n<td style=\"text-align:left\"><code>sof-audio-pci-intel-tgl<\/code><\/td>\n<td style=\"text-align:left\"><strong>blacklist<\/strong> (no audio on a server)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:1f.4<\/code><\/td>\n<td style=\"text-align:left\">SMBus<\/td>\n<td style=\"text-align:left\"><code>i801_smbus<\/code><\/td>\n<td style=\"text-align:left\">blacklist <strong>[TIER 2]<\/strong> — SMBus is a classic side channel<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>00:1f.5<\/code><\/td>\n<td style=\"text-align:left\"><strong>SPI controller<\/strong><\/td>\n<td style=\"text-align:left\"><em>none<\/em><\/td>\n<td style=\"text-align:left\">keep unbound — do <strong>not<\/strong> load <code>intel-spi<\/code>/<code>spi-intel<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>01:00.0<\/code><\/td>\n<td style=\"text-align:left\"><strong>NVIDIA TU117M [GeForce MX450]<\/strong><\/td>\n<td style=\"text-align:left\"><code>nouveau<\/code><\/td>\n<td style=\"text-align:left\"><strong>blacklist + BIOS disable<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>3a:00.0<\/code><\/td>\n<td style=\"text-align:left\">ADATA IM2P33F3 NVMe (DRAM-less)<\/td>\n<td style=\"text-align:left\"><code>nvme<\/code><\/td>\n<td style=\"text-align:left\">keep, wrap in LUKS<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Two useful facts fall straight out of this dump:<\/p>\n<ul>\n<li><strong><code>IOMMU group N<\/code> is printed for every device<\/strong> → VT-d is on and usable. Groups are granular (the NVMe is alone in group 16, the dGPU alone in group 15), so passthrough/isolation is clean.<\/li>\n<\/li>\n<li>The machine is a <strong>Dell<\/strong> with <strong>Intel PTT firmware TPM<\/strong> (not a discrete TPM — no TPM header on a laptop like this). This drives the LUKS/TPM decision in <code>docs/03<\/code>.<\/li>\n<\/li>\n<\/ul>\n<p>The host bridge subsystem string <code>Dell Tiger Lake-UP3/H35 4 cores<\/code> means: <strong>4 physical cores<\/strong> (8 threads), 11th-gen UP3 part. Expect ~8–16 GB RAM in this class — size the swap LV accordingly.<\/p>\n<h2 id=\"2-drivers-to-remove-the-artefact\">2. Drivers to remove — the artefact<a class=\"anchor\" href=\"#2-drivers-to-remove-the-artefact\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/modprobe.d/90-blacklist-paranoid.conf\"><code>files/etc/modprobe.d/90-blacklist-paranoid.conf<\/code><\/a> implements §1. Summary of what it does and why:<\/p>\n<ul>\n<li><code>nouveau<\/code> + <code>nvidia*<\/code> — a discrete GPU on a server is pure liability: extra firmware, extra kernel attack surface, DMA master, and its <code>Expansion ROM<\/code> is a boot-time code path. Disable it in the Dell BIOS (<strong>Video → disable switchable/Optimus graphics<\/strong>) <em>and<\/em> blacklist it. Belt and braces.<\/li>\n<\/li>\n<li><code>snd_sof_pci_intel_tgl<\/code>, <code>snd_hda_intel<\/code>, <code>snd_hda_codec*<\/code> — no audio. Removes a whole ALSA/SOF attack surface and 2 devices from the DMA picture.<\/li>\n<\/li>\n<li><code>mei_me<\/code>, <code>mei<\/code>, <code>mei_hdcp<\/code> — the kernel modules that talk to the Management Engine. See §4.<\/li>\n<\/li>\n<li><code>bluetooth<\/code>, <code>btusb<\/code>, <code>btintel<\/code> — no radio management daemons, no pairing, no BNEP.<\/li>\n<\/li>\n<li><code>intel_ish_ipc<\/code> — sensor hub; also often the source of noisy ACPI/AML code paths.<\/li>\n<\/li>\n<li><code>intel_gna<\/code>, <code>intel_vsec<\/code>, <code>pmt_telemetry<\/code> — vendor \"value-add\" engines. <strong>[TIER 2]<\/strong> Only add <code>intel_vsec<\/code> to the blacklist if <code>processor_thermal_device<\/code> still loads correctly (check <code>dmesg | grep -i thermal<\/code> after reboot); DPTF needs it on some firmware revisions.<\/li>\n<\/li>\n<li><code>uvcvideo<\/code>, <code>videobuf2_*<\/code>, <code>v4l2*<\/code> — webcam. Also covered by the BIOS camera/mic switch.<\/li>\n<\/li>\n<li><code>thunderbolt<\/code>, <code>thunderbolt_net<\/code> — see §3.<\/li>\n<\/li>\n<li><code>uvcvideo<\/code>/<code>i2c_i801<\/code>/<code>intel_lpss_pci<\/code> — <strong>[TIER 2]<\/strong><\/li>\n<\/li>\n<li><code>usb_storage<\/code>, <code>uas<\/code>, <code>firewire*<\/code> — <strong>[TIER 3]<\/strong>, only if the machine is racked and you never plug in storage. Otherwise USBGuard (see <code>docs/07<\/code>) is the right control — you still want USB for install media and a console keyboard.<\/li>\n<\/li>\n<\/ul>\n<p>Keep the module <strong>loaded for i915<\/strong> unless the machine truly has no console use: on a Dell, the internal panel + <code>efifb<\/code> handoff is also your recovery console if SSH dies. If you <em>do<\/em> blacklist <code>i915<\/code>, keep <code>efifb<\/code> (<code>video=efifb:off<\/code> is not set) so you still get boot messages.<\/p>\n<h2 id=\"3-thunderbolt-4-the-single-biggest-physical-attack-surface\">3. Thunderbolt 4 — the single biggest physical attack surface<a class=\"anchor\" href=\"#3-thunderbolt-4-the-single-biggest-physical-attack-surface\" aria-label=\"link\">#<\/a><\/h2>\n<p><code>00:07.0<\/code> + <code>00:0d.2<\/code> = full TB4/USB4 with DMA-capable PCIe tunneling. On this class of machine, <strong>Thunderbolt is the easiest way to root the OS from a malicious dock<\/strong> (DMA before the IOMMU policy settles, or PCIe device spoofing).<\/p>\n<p>Do all four:<\/p>\n<ol>\n<li>BIOS: <strong>Thunderbolt → Security Level = \"User Authorization\"<\/strong> (never \"No Security\"), and enable <strong>Kernel DMA Protection<\/strong>. Disable \"Thunderbolt Boot Support\" and \"Pre-boot DMA\".<\/li>\n<\/li>\n<li><code>blacklist thunderbolt<\/code> in <code>90-blacklist-paranoid.conf<\/code> if the machine is permanently wired.<\/li>\n<\/li>\n<li>If you need TB ports, keep the driver and run <code>boltctl<\/code> — only pre-authorized devices appear; <code>boltctl monitor<\/code> in an audit session shows what gets attached. Never click \"authorize\" for something you did not plug in yourself.<\/li>\n<\/li>\n<li>Independent of TB: <code>iommu=on iommu.strict=1<\/code> (in <a href=\"#/file/etc/default/grub\"><code>files/etc/default/grub<\/code><\/a> and <a href=\"#/file/etc/kernel/cmdline\"><code>files/etc/kernel/cmdline<\/code><\/a>) makes the IOMMU flush after <em>every<\/em> DMA mapping instead of lazily. This is the real DMA-attack mitigation for a machine with a firmware TPM and no believable attestation.<\/li>\n<\/li>\n<\/ol>\n<h2 id=\"4-intel-management-engine-00-16-0\">4. Intel Management Engine (<code>00:16.0<\/code>)<a class=\"anchor\" href=\"#4-intel-management-engine-00-16-0\" aria-label=\"link\">#<\/a><\/h2>\n<p>The ME is a separate CPU with its own network access to the chipset, running unauditable firmware, reachable over the same PCI device you see at <code>00:16.0<\/code>.<\/p>\n<ul>\n<li>Loaded driver today: <code>mei_me<\/code>. <strong>Blacklisting it removes the OS↔ME communication path<\/strong> for the parts ME exposes to the OS (AMT HECI, HDCP, etc.). Note honestly: this does <strong>not<\/strong> stop the ME from running — it only stops <em>your OS<\/em> talking to it. It is still worth doing: it removes a privileged, memory-mapped interface from the kernel's device list.<\/li>\n<\/li>\n<li>BIOS: <strong>disable AMT / vPro / Capability Licensing Service<\/strong> if the menu exposes it (Dell business models often do; consumer models hide it). Check <code>sudo dmidecode -t 2<\/code> for the exact model.<\/li>\n<\/li>\n<li><code>me_cleaner<\/code> can shrink/neutralise the ME region on <strong>some<\/strong> SKUs. On Tiger Lake with Boot Guard fused in, <strong>the ME region is signed and cannot be neutralised<\/strong> — attempting it bricks the machine or, worse, silently trips the Boot Guard fuse policy and stops your Secure Boot keys from working. <strong>[TIER 3 / NOT RECOMMENDED]<\/strong> Skip <code>me_cleaner<\/code> here. Document the residual risk instead:<\/li>\n<\/li>\n<\/ul>\n<blockquote><p>Residual risk R-ME: an attacker with persistent ME firmware access (obtained via a vendor toolchain or a compromised BIOS update) is outside our detection boundary. Compensating controls: firmware locked with a BIOS password, <code>fwupd<\/code> verified updates, Guard Extension / Boot Guard enabled, and the OS-side MEI driver disabled.<\/p><\/blockquote>\n<h2 id=\"5-storage-adata-dram-less-nvme-crypto-notes\">5. Storage: ADATA DRAM-less NVMe — crypto notes<a class=\"anchor\" href=\"#5-storage-adata-dram-less-nvme-crypto-notes\" aria-label=\"link\">#<\/a><\/h2>\n<p><code>3a:00.0 ADATA IM2P33F3 NVMe SSD (DRAM-less)<\/code>:<\/p>\n<ul>\n<li><strong>Do not trust its self-encryption (OPAL/TCG)<\/strong>, even if <code>nvme id-ctrl<\/code> reports it. DRAM-less consumer drives have repeated firmware-key-handling vulnerabilities, and the controller can be coerced into revealing the media key. Use <strong>LUKS2<\/strong> (<code>docs/03<\/code>) and treat the drive as a dumb block device.<\/li>\n<\/li>\n<li>Consequences for LUKS parameters: DRAM-less drives have poor sustained random write throughput, so keep <code>--iter-time<\/code> sane (3000–5000 ms) and <strong>do not<\/strong> use <code>--pbkdf argon2id<\/code> with absurd memory cost; the default in <code>scripts/make-luks-detached.sh<\/code> is <code>--pbkdf-memory 1048576<\/code> (1 GiB) which is a good balance. Verify unlock time after install — it must stay under ~10 s.<\/li>\n<\/li>\n<li><strong>No <code>discard<\/code> for LUKS and no <code>fstrim<\/code><\/strong> on encrypted volumes: TRIM on a full-disk-encrypted volume reveals which filesystem regions are in use, weakening plausible deniability and leaking structure. The trade-off is slower writes over time; accept it, or enable <code>discard<\/code> only if you understand you are trading away a real (if modest) secrecy property.<\/li>\n<\/li>\n<li><a href=\"#/file/etc/fstab\"><code>/etc/fstab<\/code><\/a> therefore uses <code>noatime<\/code> (fewer metadata writes) plus <code>nosuid,nodev,noexec<\/code> on the usual directories, and <code>errors=remount-ro<\/code> on <code>/<\/code>.<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"6-firmware-packages-trixie-non-free-firmware-is-enabled-by-default\">6. Firmware packages (trixie: <code>non-free-firmware<\/code> is enabled by default)<a class=\"anchor\" href=\"#6-firmware-packages-trixie-non-free-firmware-is-enabled-by-default\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Package<\/th>\n<th style=\"text-align:left\">Why here<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\"><code>intel-microcode<\/code><\/td>\n<td style=\"text-align:left\"><strong>mandatory.<\/strong> Tiger Lake has a long CVE history; without current microcode, mitigations like <code>verw<\/code>/<code>eIBRS<\/code> behaviour are wrong. Loads early via initramfs.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>firmware-misc-nonfree<\/code><\/td>\n<td style=\"text-align:left\"><code>i915<\/code> GuC/HuC firmware (needed for a stable console on TGL) and other misc blobs.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>firmware-linux-free<\/code><\/td>\n<td style=\"text-align:left\">free firmware for the remaining in-use devices.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>firmware-iwlwifi<\/code><\/td>\n<td style=\"text-align:left\"><strong>only if you must use Wi-Fi<\/strong> (<code>00:14.3<\/code>). Skip it and blacklist <code>iwlwifi<\/code> if the machine is wired.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>firmware-sof-signed<\/code><\/td>\n<td style=\"text-align:left\"><strong>skip<\/strong> — audio is blacklisted.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><code>fwupd<\/code><\/td>\n<td style=\"text-align:left\">Dell publishes BIOS/EC/Thunderbolt/USB-C dock firmware to LVFS. <code>fwupdmgr refresh &amp;&amp; fwupdmgr get-updates<\/code> before any hardening is declared done. Keep it installed for ongoing firmware updates, but <code>fwupd<\/code> pulls <code>polkit<\/code> — see <code>docs/09<\/code> for the trade-off and tighter alternative (<code>fwupdtool<\/code>, run manually, no daemon).<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Verify what is actually needed instead of guessing:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo dmesg | grep -iE 'firmware|microcode|i915.*(firmware|GuC|HuC)'\nsudo apt-get install --no-install-recommends firmware-linux-free firmware-misc-nonfree intel-microcode\nsudo update-initramfs -u -k all\nsudo reboot\ndmesg | grep -i microcode          # must show an early microcode revision newer than BIOS<\/code><\/pre><\/div>\n<h2 id=\"7-microcode-mitigations-and-the-bios-update-loop\">7. Microcode, mitigations and the BIOS update loop<a class=\"anchor\" href=\"#7-microcode-mitigations-and-the-bios-update-loop\" aria-label=\"link\">#<\/a><\/h2>\n<p><code>intel-microcode<\/code> + <code>fwupd<\/code> are the two things that must never drift:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>grep -m1 microcode /proc/cpuinfo\nsudo dmesg | grep -i 'microcode: updated early'\nsudo fwupdmgr refresh --force &amp;&amp; sudo fwupdmgr get-updates<\/code><\/pre><\/div>\n<p>If <code>fwupdmgr<\/code> offers a <strong>UEFI dbx<\/strong> update, apply it — it revokes known-bad bootloader hashes and is part of keeping your Secure Boot chain meaningful (<code>docs/03<\/code>).<\/p>\n<h2 id=\"8-quick-sanity-commands-used-to-build-this-profile\">8. Quick sanity commands used to build this profile<a class=\"anchor\" href=\"#8-quick-sanity-commands-used-to-build-this-profile\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>lspci -nnk                       # what was captured in TigerLake_PCI.txt\nsudo dmidecode -t system -t bios # Dell model, BIOS version/date, Secure Boot capability\nsudo dmesg | grep -iE 'iommu|DMAR|VT-d'\nls /sys/kernel/iommu_groups/ -d1 | wc -l\nsudo lspci -vv -s 00:0d.2 | grep -i -A2 kernel     # who drives TB4\ncat /sys/firmware/efi/efivars/SecureBoot-* | xxd | tail -1   # 01 = on\nsudo bootctl status                                # firmware, bootloader, Secure Boot signer<\/code><\/pre><\/div>", "files": ["etc/modprobe.d/90-blacklist-paranoid.conf", "etc/modprobe.d/95-options-paranoid.conf", "etc/modules-load.d/00-paranoid.conf"], "toc": [{"lvl": 1, "id": "00-hardware-profile-of-this-machine", "text": "00 — Hardware profile of this machine"}, {"lvl": 2, "id": "1-what-the-dump-says", "text": "1. What the dump says"}, {"lvl": 2, "id": "2-drivers-to-remove-the-artefact", "text": "2. Drivers to remove — the artefact"}, {"lvl": 2, "id": "3-thunderbolt-4-the-single-biggest-physical-attack-surface", "text": "3. Thunderbolt 4 — the single biggest physical attack surface"}, {"lvl": 2, "id": "4-intel-management-engine-00-16-0", "text": "4. Intel Management Engine (00:16.0)"}, {"lvl": 2, "id": "5-storage-adata-dram-less-nvme-crypto-notes", "text": "5. Storage: ADATA DRAM-less NVMe — crypto notes"}, {"lvl": 2, "id": "6-firmware-packages-trixie-non-free-firmware-is-enabled-by-default", "text": "6. Firmware packages (trixie: non-free-firmware is enabled by default)"}, {"lvl": 2, "id": "7-microcode-mitigations-and-the-bios-update-loop", "text": "7. Microcode, mitigations and the BIOS update loop"}, {"lvl": 2, "id": "8-quick-sanity-commands-used-to-build-this-profile", "text": "8. Quick sanity commands used to build this profile"}], "fences": 3, "tables": 2}, {"slug": "01-threat-model", "title": "01 · Threat model", "html": "<h1 id=\"01-threat-model\">01 — Threat model<a class=\"anchor\" href=\"#01-threat-model\" aria-label=\"link\">#<\/a><\/h1>\n<p>Scope: one physical machine in a non-datacenter location (a laptop sitting in an office or home), serving HTTPS on 443 to the internet.<\/p>\n<h2 id=\"1-assets-in-priority-order\">1. Assets, in priority order<a class=\"anchor\" href=\"#1-assets-in-priority-order\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Asset<\/th>\n<th style=\"text-align:left\">Impact if lost<\/th>\n<th style=\"text-align:left\">Where it lives<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">TLS private keys (<code>/etc/ssl/private<\/code>)<\/td>\n<td style=\"text-align:left\">Impersonation of every site on the box; forged certs for your users<\/td>\n<td style=\"text-align:left\">encrypted root, mode 0600 root:root<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Application data / user data under <code>/var/www<\/code><\/td>\n<td style=\"text-align:left\">Confidentiality + integrity liability<\/td>\n<td style=\"text-align:left\">encrypted <code>/var<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">The OS itself<\/td>\n<td style=\"text-align:left\">Persistence, botnet, use as a pivot<\/td>\n<td style=\"text-align:left\">encrypted root + signed boot chain<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Audit logs<\/td>\n<td style=\"text-align:left\">Loss of non-repudiation, no forensics<\/td>\n<td style=\"text-align:left\"><code>/var/log<\/code>, shipped off-host<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">LUKS header backup + Secure Boot keys<\/td>\n<td style=\"text-align:left\">Total, unrecoverable loss<\/td>\n<td style=\"text-align:left\">offline (paper + two USB devices)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Availability<\/td>\n<td style=\"text-align:left\">Downtime<\/td>\n<td style=\"text-align:left\">not the priority here — security is<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"2-adversaries-we-design-against\">2. Adversaries we design against<a class=\"anchor\" href=\"#2-adversaries-we-design-against\" aria-label=\"link\">#<\/a><\/h2>\n<ol>\n<li><strong>Opportunistic internet scanner<\/strong> — automated HTTP/SSH exploit attempts. Nearly 100% of real traffic to a new public IP. Controlled by minimal surface + updates + rate limits.<\/li>\n<\/li>\n<li><strong>Skilled remote attacker<\/strong> targeting your web stack — needs a real vulnerability in Apache, a module, or the app. Controlled by module pruning, mod_security/CRS, per-service sandboxing, AppArmor, and <strong>egress filtering<\/strong> so a shell cannot phone home.<\/li>\n<\/li>\n<li><strong>Physical/offline attacker<\/strong> with the powered-off laptop. Controlled by LUKS + Secure Boot own keys + BIOS password; the reason we do <strong>not<\/strong> trust the firmware TPM for unlock.<\/li>\n<\/li>\n<li><strong>Malicious peripheral<\/strong> (USB stick, Thunderbolt dock, PCIe device). Controlled by IOMMU strict mode, USBGuard, TB \"User Authorization\", disabled unused controllers.<\/li>\n<\/li>\n<li><strong>Malicious insider / stolen credentials.<\/strong> Controlled by key-only SSH, no shared accounts, per-action sudo logging, OOB admin plane on WireGuard.<\/li>\n<\/li>\n<li><strong>Supply chain<\/strong> (a bad package or driver update). Controlled by pinned repos, signature checks, <code>module.sig_enforce<\/code>, AIDE/debsums, and a staged update procedure.<\/li>\n<\/li>\n<\/ol>\n<h2 id=\"3-explicit-assumptions\">3. Explicit assumptions<a class=\"anchor\" href=\"#3-explicit-assumptions\" aria-label=\"link\">#<\/a><\/h2>\n<ul>\n<li>The machine's <strong>firmware and ME are trusted enough<\/strong>: we cannot audit them and cannot meaningfully neutralise ME on TGL (see <code>docs/00<\/code> §4). We reduce OS-side exposure and update firmware; we do not claim to defend against a compromised ME.<\/li>\n<\/li>\n<li>Physical access <em>before<\/em> your first boot is assumed hostile — hence Secure Boot key enrollment yourself, and re-flashing the BIOS from a trusted source before you start.<\/li>\n<\/li>\n<li>The site's <strong>application<\/strong> is out of scope for this repo; this repo secures the platform. An insecure PHP app on an otherwise perfect host is still an insecure service (see <code>docs/09<\/code>).<\/li>\n<\/li>\n<li>You have at least one <strong>second machine<\/strong> to hold backups and keys, and a <strong>second network path<\/strong> (a phone hotspot is enough) to fix a remote-lockout mistake.<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"4-non-goals-be-honest-with-yourself\">4. Non-goals (be honest with yourself)<a class=\"anchor\" href=\"#4-non-goals-be-honest-with-yourself\" aria-label=\"link\">#<\/a><\/h2>\n<ul>\n<li>Not anti-forensics. <code>make noatime<\/code>, no TRIM, and LUKS do not hide the <em>existence<\/em> of the OS.<\/li>\n<\/li>\n<li>Not deniable encryption against a state-level adversary who can image both the disk and the USB header. It raises cost; it is not magic.<\/li>\n<\/li>\n<li>Not covert: a hidden Tor/I2P host, an exit node, or a censorship-circumvention endpoint would need a different design (bridges, traffic shaping, and an entirely different legal review).<\/li>\n<\/li>\n<li>Not a hardened multi-tenant platform. If you need tenants, you need separate VMs per tenant (<code>docs/08<\/code>) and probably separate hardware.<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"5-security-tiers-pick-one-deliberately\">5. Security tiers — pick one deliberately<a class=\"anchor\" href=\"#5-security-tiers-pick-one-deliberately\" aria-label=\"link\">#<\/a><\/h2>\n<p>Every hardening item in this repo is labelled. You <strong>must<\/strong> state your tier now, because <code>scripts/verify-hardening.sh<\/code> and the install script behave differently per tier.<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Tier<\/th>\n<th style=\"text-align:left\">Name<\/th>\n<th style=\"text-align:left\">What it means<\/th>\n<th style=\"text-align:left\">Costs<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\"><strong>1<\/strong><\/td>\n<td style=\"text-align:left\">Pragmatic<\/td>\n<td style=\"text-align:left\">All integrity/confidentiality controls, no performance sacrifice, no fragile tricks<\/td>\n<td style=\"text-align:left\">Almost none. Default.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>2<\/strong><\/td>\n<td style=\"text-align:left\">Recommended<\/td>\n<td style=\"text-align:left\">Adds egress allowlist, stricter sysctls, <code>iommu.strict=1<\/code>, upstream repo pinning, USBGuard deny-all, TPM2 sealing of audit state<\/td>\n<td style=\"text-align:left\">Manual package installs (egress), occasional friction<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>3<\/strong><\/td>\n<td style=\"text-align:left\">Maximum<\/td>\n<td style=\"text-align:left\">Adds <code>mitigations=auto,nosmt<\/code>, <code>module.sig_enforce=1<\/code> with own-signed modules, <code>/boot<\/code> read-only, USB storage blacklisted, detached LUKS header, single-user mode disabled, watchdog auto-recovery after tamper<\/td>\n<td style=\"text-align:left\">~30% CPU loss, no hibernation, boot requires the header USB, kernel updates require re-signing<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>This repo's default is Tier 2<\/strong> (the sweet spot for the threat list above). Tier 3 items are all marked <code>[TIER 3]<\/code>; do not enable one \"for fun\" without reading its cost line.<\/p>\n<h2 id=\"6-attack-path-walkthrough-why-the-order-in-the-readme-matters\">6. Attack-path walkthrough (why the order in the README matters)<a class=\"anchor\" href=\"#6-attack-path-walkthrough-why-the-order-in-the-readme-matters\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>Internet\n  │  ① nftables inet filter: default DROP, only 443 (and SSH on wg0) reachable\n  ▼\nApache httpd  ──② sandboxed systemd unit: no caps, strict fs, syscall filter, AppArmor\n  │            ③ TLS 1.3 only, mod_security3 + CRS, headers, per-vhost user\n  ▼\nApplication  ──④ runs as www-data, no shell, no home, cannot write outside /var/www/&lt;site&gt;\n  │            ⑤ even if RCE: egress allowlist blocks C2, /tmp noexec+tmpfs\n  ▼\nKernel/host  ──⑥ no compiler, no python, minimal packages, auditd watching /etc and execve\n  │            ⑦ LSM stack: landlock, yama, apparmor; sysctl hardening; user namespaces tightened\n  ▼\nBoot chain   ──⑧ Secure Boot (own keys) → signed UKI → LUKS2 (Argon2id) → locked kernel\n  │            ⑨ firmware/BIOS password, MEI disabled, TB locked, USBGuard\n  ▼\nData at rest<\/code><\/pre><\/div>\n<p>Each numbered control has a section in <code>docs/04<\/code>–<code>docs/07<\/code> and an artefact under <code>files/<\/code>. If a control is missing at verification time, <code>verify-hardening.sh<\/code> says so and exits non-zero.<\/p>", "files": [], "toc": [{"lvl": 1, "id": "01-threat-model", "text": "01 — Threat model"}, {"lvl": 2, "id": "1-assets-in-priority-order", "text": "1. Assets, in priority order"}, {"lvl": 2, "id": "2-adversaries-we-design-against", "text": "2. Adversaries we design against"}, {"lvl": 2, "id": "3-explicit-assumptions", "text": "3. Explicit assumptions"}, {"lvl": 2, "id": "4-non-goals-be-honest-with-yourself", "text": "4. Non-goals (be honest with yourself)"}, {"lvl": 2, "id": "5-security-tiers-pick-one-deliberately", "text": "5. Security tiers — pick one deliberately"}, {"lvl": 2, "id": "6-attack-path-walkthrough-why-the-order-in-the-readme-matters", "text": "6. Attack-path walkthrough (why the order in the README matters)"}], "fences": 1, "tables": 2}, {"slug": "02-debian-install", "title": "02 · Debian install", "html": "<h1 id=\"02-installing-debian-minimal-encrypted-offline-first\">02 — Installing Debian (minimal, encrypted, offline-first)<a class=\"anchor\" href=\"#02-installing-debian-minimal-encrypted-offline-first\" aria-label=\"link\">#<\/a><\/h1>\n<p>Target: <strong>Debian 13 \"trixie\", amd64<\/strong>, netinst or full CD ISO verified by signature. Reference hardware: see <code>docs/00<\/code>. No desktop environment will be installed, ever.<\/p>\n<blockquote><p>Verify the ISO before writing it. This first step is the one people skip.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>gpg --keyserver keyring.debian.org --recv-keys 0x&lt;keyid from https://www.debian.org/CD/verify&gt;\nsha512sum debian-13.x.y-amd64-netinst.iso\ngpg --verify SHA512SUMS.sign SHA512SUMS<\/code><\/pre><\/div><\/blockquote>\n<h2 id=\"1-before-you-boot-the-installer-firmware-prep\">1. Before you boot the installer (firmware prep)<a class=\"anchor\" href=\"#1-before-you-boot-the-installer-firmware-prep\" aria-label=\"link\">#<\/a><\/h2>\n<ol>\n<li><strong>Flash the latest Dell BIOS first<\/strong>, from Dell's site, over a trusted network, before any OS exists. Note the version string; <code>docs/00<\/code> §7 covers keeping it current with <code>fwupd<\/code>.<\/li>\n<\/li>\n<li>Set a <strong>BIOS password<\/strong> (long, distinct from every other password you own) and lock firmware settings so an attacker with 5 minutes cannot flip Secure Boot off or boot foreign media. Enable <strong>Kernel DMA Protection<\/strong> and set <strong>Thunderbolt Security = User Authorization<\/strong>.<\/li>\n<\/li>\n<li><strong>Disable<\/strong>: camera, microphone, Bluetooth, WWAN (if present), Wake-on-LAN, \"enable legacy ROM option\", PXE/network boot, USB boot <em>after<\/em> the install is complete.<\/li>\n<\/li>\n<li>Decide Wi-Fi vs Ethernet <strong>now<\/strong>:<\/li>\n<ul>\n<li>Wired Ethernet available → during install, do not load <code>iwlwifi<\/code>; blacklist it later (<code>docs/00<\/code> §2). Simplest and best.<\/li>\n<\/li>\n<li>Wi-Fi only → you will need <code>firmware-iwlwifi<\/code> from <code>non-free-firmware<\/code> at install time, and you accept that radio firmware is unaudited. Strongly prefer a USB-Ethernet adapter instead.<\/li>\n<\/li>\n<\/ul>\n<\/li>\n<li>Decide your <strong>profile<\/strong> (<code>docs/03<\/code> §1): P1 embedded LUKS header (recommended, simplest) or P2 detached header (maximum, boot requires a USB token).<\/li>\n<\/li>\n<\/ol>\n<h2 id=\"2-interactive-install-the-exact-choices\">2. Interactive install — the exact choices<a class=\"anchor\" href=\"#2-interactive-install-the-exact-choices\" aria-label=\"link\">#<\/a><\/h2>\n<p>Boot the netinst. Choose <strong>\"Advanced options → Expert install\"<\/strong> (not graphical). Expert mode is what lets you turn <em>off<\/em> the parts that add packages.<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Installer step<\/th>\n<th style=\"text-align:left\">Choice<\/th>\n<th style=\"text-align:left\">Why<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">Language/locale<\/td>\n<td style=\"text-align:left\"><code>en_US.UTF-8<\/code> only, do not install additional locales<\/td>\n<td style=\"text-align:left\">fewer files, fewer surprises<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Keyboard<\/td>\n<td style=\"text-align:left\">your layout, no dead keys<\/td>\n<td style=\"text-align:left\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Network<\/td>\n<td style=\"text-align:left\"><strong>disable autoconfiguration if you have a local mirror<\/strong>, else keep DHCP<\/td>\n<td style=\"text-align:left\">no unnecessary services<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Hostname<\/td>\n<td style=\"text-align:left\">a <em>boring<\/em> name, e.g. <code>srv-01<\/code> (not <code>mail<\/code>, not <code>db<\/code>)<\/td>\n<td style=\"text-align:left\">hostname leaks role to scanners via banners<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Domain<\/td>\n<td style=\"text-align:left\">leave empty or use a non-public name<\/td>\n<td style=\"text-align:left\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Root password<\/td>\n<td style=\"text-align:left\"><strong>set a long passphrase now<\/strong>; it will be locked in <code>docs/04<\/code><\/td>\n<td style=\"text-align:left\">installers require it; we lock it after<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">User<\/td>\n<td style=\"text-align:left\">full name, username <code>admin<\/code>, <strong>strong passphrase<\/strong>. Do not reuse your LUKS passphrase<\/td>\n<td style=\"text-align:left\">single unprivileged admin account<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Clock<\/td>\n<td style=\"text-align:left\">UTC, NTP later via <code>chrony<\/code> + NTS<\/td>\n<td style=\"text-align:left\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Partitioning<\/td>\n<td style=\"text-align:left\"><strong>Manual<\/strong> → see §3<\/td>\n<td style=\"text-align:left\">necessary for the layout we want<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Package manager<\/td>\n<td style=\"text-align:left\">your mirror; enable <code>main<\/code>, <code>non-free-firmware<\/code>; <strong>disable <code>contrib<\/code><\/strong><\/td>\n<td style=\"text-align:left\"><code>contrib<\/code> pulls non-free userland rarely needed<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Tasksel<\/td>\n<td style=\"text-align:left\"><strong>uncheck everything<\/strong> — including \"standard system utilities\" <strong>[TIER 3]<\/strong><\/td>\n<td style=\"text-align:left\">tier 3 = truly minimal; tier 2 keeps standard utils for a workable console<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Install GRUB<\/td>\n<td style=\"text-align:left\"><strong>no<\/strong> if you plan Secure Boot with your own keys + <code>systemd-boot<\/code> (<code>docs/03<\/code>). Yes = fallback path<\/td>\n<td style=\"text-align:left\">grub-efi is signed by Debian, not by you<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Popularity contest<\/td>\n<td style=\"text-align:left\"><strong>no<\/strong><\/td>\n<td style=\"text-align:left\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Snapshots/backports<\/td>\n<td style=\"text-align:left\"><strong>no<\/strong><\/td>\n<td style=\"text-align:left\"><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote><p>If you keep \"standard system utilities\": it brings ~120 packages (less, vim-tiny, apt-utils, cron, logrotate, isc-dhcp-client, openssh-client, …). That is acceptable at Tier 2 and is assumed by the rest of this repo — several artefacts use <code>rsync<\/code>, <code>less<\/code>, <code>curl<\/code>. At Tier 3 uncheck it and install only what you truly use; <code>verify-hardening.sh<\/code> will list what it expects.<\/p><\/blockquote>\n<h2 id=\"3-partitioning-manual-encrypted\">3. Partitioning (manual, encrypted)<a class=\"anchor\" href=\"#3-partitioning-manual-encrypted\" aria-label=\"link\">#<\/a><\/h2>\n<p>Layout used throughout this repo. Sizes assume a 512 GB NVMe; scale down but keep <code>/var/log<\/code> separate and keep swap present (small).<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>/dev/nvme0n1\n  p1  1 GiB   FAT32   EFI System Partition   /boot/efi   (umask=0077, ro after setup)\n  p2  1 GiB   ext4    /boot                  (Tier 2: rw, remounted ro for updates;\n                                              Tier 3: ro permanently)\n  p3  rest    (nothing)  → LUKS2 container, no filesystem\n       └─ crypt   LVM VG \"vg0\"\n            ├─ root   24 GiB  ext4  /\n            ├─ var    16 GiB  ext4  /var\n            ├─ varlog  6 GiB  ext4  /var/log\n            ├─ vartmp  4 GiB  ext4  /var/tmp\n            ├─ home    4 GiB  ext4  /home        (barely used, but keeps tools happy)\n            ├─ swap    4 GiB  swap               (no hibernate; justified below)\n            └─ srv    rest    ext4  /srv         (may be where vhost data lives)<\/code><\/pre><\/div>\n<p>Rules that matter:<\/p>\n<ul>\n<li><strong><code>/boot/efi<\/code> 1 GiB, <code>/boot<\/code> 1 GiB.<\/strong> A separate <code>/boot<\/code> is <em>required<\/em> for our read-only-<code>/boot<\/code> tier and makes signing/UKI handling far cleaner. <code>/boot/efi<\/code> &gt; 512 MiB because UKIs + backups add up quickly on FAT32.<\/li>\n<\/li>\n<li><strong>Do not encrypt <code>/boot<\/code>.<\/strong> It must be readable by firmware. It is protected by Secure Boot (signature) and by measurement, not by secrecy. Accept that.<\/li>\n<\/li>\n<li><strong>Swap is on the encrypted LVM<\/strong> — it is therefore never plaintext. Keep it small: with 8–16 GB RAM, 4 GB swap is enough to avoid OOM panics and does not tempt hibernation.<\/li>\n<\/li>\n<li><strong><code>/var/tmp<\/code> is its own LV, not tmpfs<\/strong> — a 4 GB tmpfs on a RAM-constrained machine is a self-inflicted OOM. It gets <code>noexec,nosuid,nodev<\/code>.<\/li>\n<\/li>\n<li><strong>No separate <code>/tmp<\/code> LV<\/strong>: <code>/tmp<\/code> is <code>tmpfs<\/code> with <code>noexec,nosuid,nodev,size=2G,mode=1777<\/code> (fstab artefact provided).<\/li>\n<\/li>\n<li>At the partitioner, when it asks about the encrypted volume: <strong>LUKS2<\/strong>, cipher <code>aes-xts-plain64<\/code>, 512-bit key, hash <code>sha512<\/code>, and a <strong>long passphrase<\/strong> (≥ 6 random words). Do not preseed/reuse it anywhere else. Never store it in a file on this machine.<\/li>\n<\/li>\n<\/ul>\n<p>If you are doing <strong>P2 (detached header)<\/strong> you cannot use the installer's partitioner for <code>p3<\/code>; install with the embedded header first (P1) and convert in place afterwards using the audited procedure in <code>docs/03<\/code> §4. That conversion is deliberate: it is far less error-prone than a hand-built LUKS stack from the installer's TTY2, and it is reversible.<\/p>\n<h2 id=\"4-first-boot-after-install\">4. First boot after install<a class=\"anchor\" href=\"#4-first-boot-after-install\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># 1. confirm the crypto stack is what you think it is\nsudo cryptsetup luksDump /dev/nvme0n1p3 | head -30   # LUKS2, argon2id, aes-xts-plain64\nsudo lvs &amp;&amp; lsblk -o NAME,FSTYPE,SIZE,MOUNTPOINT\nfindmnt -o TARGET,SOURCE,FSTYPE,OPTIONS\n\n# 2. bring the repo onto the box (USB, or scp over the LAN, your choice)\nsudo apt-get install --no-install-recommends git   # only if you will clone; otherwise rsync the tree\n# USB route (preferred: no network needed):\n#   mount -o ro,noexec /dev/sdX1 /mnt &amp;&amp; cp -a /mnt/debian-hardened-apache ~/ &amp;&amp; umount /mnt\n\ncd ~/debian-hardened-apache\nsudo bash scripts/install-hardening.sh --dry-run --tier 2   # see EXACTLY what will change\nsudo bash scripts/install-hardening.sh --tier 2             # now do it\nsudo reboot<\/code><\/pre><\/div>\n<p>Then follow, in order: <code>docs/03<\/code> (boot integrity) → <code>docs/05<\/code> (network, <strong>last<\/strong>) → <code>docs/06<\/code> (Apache). Read <code>docs/10<\/code> §\"Order-of-operations safety\" before doing anything over SSH.<\/p>\n<h2 id=\"5-minimal-but-complete-package-set\">5. Minimal-but-complete package set<a class=\"anchor\" href=\"#5-minimal-but-complete-package-set\" aria-label=\"link\">#<\/a><\/h2>\n<p>This is the <em>entire<\/em> host package list the build target needs at Tier 2. Everything else must be justified per <code>docs/09<\/code>.<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code># integrity of the OS itself\nintel-microcode firmware-linux-free firmware-misc-nonfree\napparmor apparmor-utils auditd audispd-plugins aide debsums unattended-upgrades needrestart\napt-listchanges chrony unbound sshguard\n\n# serving\napache2 apache2-utils libapache2-mod-security2 modsecurity-crs libapache2-mod-macro\nssl-cert openssl ca-certificates\n\n# admin plane (Tier 2)\nwireguard-tools nftables usbguard<\/code><\/pre><\/div>\n<p>Notes / justifications:<\/p>\n<ul>\n<li><code>unbound<\/code> here is a <strong>local validating resolver<\/strong> on <code>127.0.0.1<\/code> (DNSSEC), not a public resolver. It replaces whatever <code>resolv.conf<\/code> you have and removes cleartext DNS as an exfil/poisoning path. If you prefer <code>systemd-resolved<\/code> with DNS-over-TLS instead, that works too — <code>docs/05<\/code> §4.<\/li>\n<\/li>\n<li><code>sshguard<\/code> (a ~100 KB C daemon) is chosen over <code>fail2ban<\/code> (Python + a daemon with a config language) purely for surface area. Both are acceptable; fail2ban is documented in <code>docs/05<\/code> §6.<\/li>\n<\/li>\n<li><code>apache2-utils<\/code> brings <code>htpasswd<\/code>, <code>ab<\/code>, <code>apache2ctl<\/code>. Keep it: <code>apache2ctl configtest<\/code> is a safety net. <code>ab<\/code> is harmless but if you want it gone: <code>apt-mark auto apache2-utils<\/code>.<\/li>\n<\/li>\n<li><code>fwupd<\/code> is intentionally <strong>not<\/strong> in the list. Install it only when you are doing a firmware update (<code>apt-get install --no-install-recommends fwupd<\/code>, update, then <code>apt-get purge --auto-remove fwupd<\/code>). This is the \"install only necessary software\" policy in practice.<\/li>\n<\/li>\n<li><code>python3<\/code> is pulled in by <code>unattended-upgrades<\/code>/<code>needrestart<\/code>/<code>usbguard<\/code>/<code>apparmor-utils<\/code> on Debian. Accept it (it is the dependency graph, not a choice) but do <strong>not<\/strong> install <code>python3-pip<\/code>, <code>build-essential<\/code>, <code>git<\/code>, <code>curl<\/code> on the host unless the task needs it — a compiler on a web server turns a memory-corruption bug into trivial code execution.<\/li>\n<\/li>\n<\/ul>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get update\nsudo apt-get install --no-install-recommends \\\n  intel-microcode firmware-linux-free firmware-misc-nonfree apparmor apparmor-utils \\\n  auditd audispd-plugins aide debsums unattended-upgrades needrestart apt-listchanges \\\n  chrony unbound sshguard nftables usbguard wireguard-tools \\\n  apache2 apache2-utils libapache2-mod-security2 modsecurity-crs libapache2-mod-macro \\\n  ssl-cert openssl ca-certificates<\/code><\/pre><\/div>\n<p><code>install-hardening.sh<\/code> runs exactly this list, so you do not have to paste it.<\/p>", "files": [], "toc": [{"lvl": 1, "id": "02-installing-debian-minimal-encrypted-offline-first", "text": "02 — Installing Debian (minimal, encrypted, offline-first)"}, {"lvl": 2, "id": "1-before-you-boot-the-installer-firmware-prep", "text": "1. Before you boot the installer (firmware prep)"}, {"lvl": 2, "id": "2-interactive-install-the-exact-choices", "text": "2. Interactive install — the exact choices"}, {"lvl": 2, "id": "3-partitioning-manual-encrypted", "text": "3. Partitioning (manual, encrypted)"}, {"lvl": 2, "id": "4-first-boot-after-install", "text": "4. First boot after install"}, {"lvl": 2, "id": "5-minimal-but-complete-package-set", "text": "5. Minimal-but-complete package set"}], "fences": 5, "tables": 1}, {"slug": "03-boot-integrity", "title": "03 · Boot integrity", "html": "<h1 id=\"03-boot-integrity-secure-boot-your-keys-uki-luks\">03 — Boot integrity: Secure Boot (your keys), UKI, LUKS<a class=\"anchor\" href=\"#03-boot-integrity-secure-boot-your-keys-uki-luks\" aria-label=\"link\">#<\/a><\/h1>\n<p>Goal: an attacker who modifies your kernel, initramfs, or <code>/boot<\/code> contents <strong>cannot boot the machine<\/strong>, and an attacker who steals the disk gets nothing but ciphertext.<\/p>\n<p>Note the order: <strong>do this before the network hardening<\/strong>. Doing it wrong can leave the machine unbootable, and you want a working console when that happens.<\/p>\n<hr>\n<h2 id=\"1-choose-your-luks-profile\">1. Choose your LUKS profile<a class=\"anchor\" href=\"#1-choose-your-luks-profile\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\"><\/th>\n<th style=\"text-align:left\"><strong>P1 — Embedded header (default)<\/strong><\/th>\n<th style=\"text-align:left\"><strong>P2 — Detached header (maximum)<\/strong><\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">Header lives<\/td>\n<td style=\"text-align:left\">on the NVMe, in the partition<\/td>\n<td style=\"text-align:left\">on a <strong>USB token<\/strong>, disk has zero LUKS metadata<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Boot needs a USB device<\/td>\n<td style=\"text-align:left\">no<\/td>\n<td style=\"text-align:left\"><strong>yes, every boot<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Attacker with disk only<\/td>\n<td style=\"text-align:left\">sees LUKS2, can attempt offline KDF<\/td>\n<td style=\"text-align:left\">sees unpartitioned-looking entropy<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Crypto-erase<\/td>\n<td style=\"text-align:left\"><code>cryptsetup luksErase<\/code> / destroy keyslots<\/td>\n<td style=\"text-align:left\">cut the USB (but keep the backup!)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Failure mode<\/td>\n<td style=\"text-align:left\">lose passphrase → restore from backup<\/td>\n<td style=\"text-align:left\">lose the USB <strong>and<\/strong> passphrase → total loss<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Fits this laptop<\/td>\n<td style=\"text-align:left\">yes<\/td>\n<td style=\"text-align:left\">yes, if you accept a dongle at every boot<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Both use the same underlying crypto. P2 is a strictly better <em>offline adversary<\/em> posture and a strictly worse <em>availability<\/em> posture. Start with P1 (installed in <code>docs/02<\/code>), then convert if you want P2 — §4 shows how, verified and reversible.<\/p>\n<p>Verify your P1 parameters right now:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cryptsetup luksDump /dev/nvme0n1p3 | grep -E 'Version|Cipher|PBKDF|Memory|Time cost|Label'\n# expect: LUKS2, aes-xts-plain64, argon2id, memory ~1GiB, time cost 3-5\nsudo cryptsetup luksHeaderBackup /dev/nvme0n1p3 --header-backup-file luks-header-$(date +%F).img\nsha512sum luks-header-*.img    # record this hash offline, on paper<\/code><\/pre><\/div>\n<p><strong>Store the header backup on two physically separate offline devices<\/strong> (e.g. a USB stick in a safe and encrypted paper/QR in a drawer). The header is worthless without the passphrase, but without the header (P2) the data is gone.<\/p>\n<h2 id=\"2-secure-boot-with-your-own-keys\">2. Secure Boot with your own keys<a class=\"anchor\" href=\"#2-secure-boot-with-your-own-keys\" aria-label=\"link\">#<\/a><\/h2>\n<p>Two supported paths.<\/p>\n<h3 id=\"path-a-own-keys-systemd-boot-signed-unified-kernel-image-recommended\">Path A — own keys, <code>systemd-boot<\/code>, signed Unified Kernel Image (recommended)<a class=\"anchor\" href=\"#path-a-own-keys-systemd-boot-signed-unified-kernel-image-recommended\" aria-label=\"link\">#<\/a><\/h3>\n<p>This is the strongest chain on this hardware: firmware boots <code>systemd-boot<\/code> from the ESP, which loads a <strong>single signed UKI<\/strong> (kernel + initramfs + cmdline + os-release in one PE binary).<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># 1. tooling\nsudo apt-get install --no-install-recommends systemd-boot systemd-ukify sbsigntool sbctl dracut\n\n# 2. firmware must be in SETUP MODE (Dell: Security → Secure Boot → \"Custom Mode\"/\"Setup Mode\")\nsudo bootctl status | grep -i 'secure boot'\nsudo sbctl status                 # shows Setup Mode: Enabled, Secure Boot: Disabled\n\n# 3. create and enrol YOUR keys  (do this offline, then back up /var/lib/sbctl + /usr/share/secureboot)\nsudo sbctl create-keys\nsudo sbctl enroll-keys --microsoft      # only if you want signed option ROMs/dbx update to keep working\n#                                    # use --microsoft if the machine has an NVIDIA/dGPU option ROM you plan to use;\n#                                    # otherwise plain `enroll-keys` is stricter. We blacklist the dGPU anyway.\n\n# 4. ctrl-file: put sbctl in \"sign everything I tell it to\" mode\nsudo sbctl verify            # lists unsigned EFI binaries it can see\n\n# 5. sign the boot chain (paths depend on your install; the script below does the discovery)\nsudo sbctl sign -s /boot/efi/EFI/systemd/systemd-bootx64.efi\nsudo sbctl sign -s /boot/efi/EFI/BOOT/BOOTX64.EFI\nsudo sbctl list-files<\/code><\/pre><\/div>\n<p>Now the UKI. <a href=\"#/file/etc/kernel/cmdline\"><code>files/etc/kernel/cmdline<\/code><\/a> and <a href=\"#/file/etc/kernel/install.conf\"><code>files/etc/kernel/install.conf<\/code><\/a> configure <code>kernel-install<\/code> to emit a UKI per kernel version:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp files/etc/kernel/cmdline /etc/kernel/cmdline\nsudo cp files/etc/kernel/install.conf /etc/kernel/install.conf\nsudo kernel-install add \"$(uname -r)\" /boot/vmlinuz-\"$(uname -r)\"\nls -l /boot/efi/EFI/Linux/            # one &lt;machine-id&gt;-&lt;version&gt;.efi per kernel\nsudo sbctl sign -s /boot/efi/EFI/Linux/&lt;machine-id&gt;-&lt;version&gt;.efi\nsudo bootctl list                     # confirm the UKI entry is what will boot<\/code><\/pre><\/div>\n<p>Add a <strong><code>sbctl<\/code> pacman-hook equivalent<\/strong> so future kernel updates sign automatically — on Debian that is a <code>kernel-install<\/code> plugin plus an apt hook. This repo ships <a href=\"#/file/etc/kernel/postinst.d/zz-sign-uki\"><code>files/etc/kernel/postinst.d/zz-sign-uki<\/code><\/a> and <a href=\"#/file/etc/apt/apt.conf.d/99-paranoid\"><code>files/etc/apt/apt.conf.d/99-paranoid<\/code><\/a> (which calls it via <code>DPkg::Post-Invoke<\/code>) so you cannot forget. Verify after the first kernel upgrade:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --reinstall linux-image-amd64\nsudo sbctl verify | grep -i 'not signed'    # must print nothing<\/code><\/pre><\/div>\n<h3 id=\"path-b-debian-shim-mok-fallback\">Path B — Debian shim + MOK (fallback)<a class=\"anchor\" href=\"#path-b-debian-shim-mok-fallback\" aria-label=\"link\">#<\/a><\/h3>\n<p>If firmware Setup Mode is not exposed (some Dell consumer BIOSes), boot Debian's signed shim and sign your own kernel with a <strong>MOK<\/strong> key (<code>mokutil --import<\/code>). Weaker: you still trust Microsoft's CA and the vendor shim, and any MOK-enrolled key can be added by whoever reaches the MOK Manager at boot. If you must use this, also set a <strong>firmware \"Boot Menu / MOK\" password<\/strong> if the BIOS offers one, and re-check <code>mokutil --list-enrolled<\/code> after every firmware update.<\/p>\n<h2 id=\"3-kernel-lockdown-and-module-policy\">3. Kernel lockdown and module policy<a class=\"anchor\" href=\"#3-kernel-lockdown-and-module-policy\" aria-label=\"link\">#<\/a><\/h2>\n<p><a href=\"#/file/etc/default/grub\"><code>files/etc/default/grub<\/code><\/a> (and the UKI cmdline, kept identical) adds:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\"><code>lockdown=confidentiality module.sig_enforce=1 iommu=on iommu.strict=1 intremap=on iommu.passthrough=0\ninit_on_alloc=1 init_on_free=1 slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on\nvsyscall=none debugfs=off oops=panic panic=-1 panic_on_oops=1\nlsm=landlock,lockdown,yama,integrity,apparmor,bpf apparmor=1 security=apparmor\naudit=1 audit_backlog_limit=8192\nmodule_blacklist=nouveau,nvidia,nvidia_drm,nvidia_modeset,btusb,bluetooth,intel_ish_ipc<\/code><\/pre><\/div>\n<p>What each cluster buys you:<\/p>\n<ul>\n<li><code>lockdown=confidentiality<\/code> — kernel refuses <code>kexec<\/code>, <code>/dev/mem<\/code> access, unsigned module loading, and most raw PCI/IO access from userspace while Secure Boot is on. This is the single highest-value boot param on a laptop with a TPM-free threat model.<\/li>\n<\/li>\n<li><code>module.sig_enforce=1<\/code> — <strong>[TIER 3]<\/strong> every module must be signed by a key in the kernel keyring. All Debian stock modules are signed by Debian, so this works out of the box; it only breaks out-of-tree modules you build yourself (you would sign them with your own key and enroll it). Combined with <code>lockdown<\/code>, this removes the \"load a rootkit module\" step.<\/li>\n<\/li>\n<li><code>iommu=on iommu.strict=1 intremap=on<\/code> — see <code>docs/00<\/code> §3. <code>iommu.strict=1<\/code> forces an IOTLB flush after every map/unmap instead of batching. Slower, meaningfully stronger against DMA races.<\/li>\n<\/li>\n<li><code>init_on_alloc=1 init_on_free=1 slab_nomerge<\/code> — zero-fill memory on alloc/free and stop slab merging: kills a large class of uninitialised-memory info leaks and heap-shaping primitives. Measurable throughput cost (~3–8%) — a defensible price.<\/li>\n<\/li>\n<li><code>vsyscall=none debugfs=off<\/code> — removes legacy kernel entry points. <code>debugfs=off<\/code> also makes a debugfs-based rootkit noticeably harder.<\/li>\n<\/li>\n<li><code>oops=panic panic=-1 panic_on_oops=1<\/code> — a kernel oops reboots rather than limping on, and reboots forever rather than sitting at a prompt. On a headless server this converts \"silently half-compromised\" into \"visibly down\". Combine with a hardware/cloud watchdog if you have one.<\/li>\n<\/li>\n<li><code>randomize_kstack_offset=on<\/code>, <code>page_alloc.shuffle=1<\/code> — cheap entropy gains.<\/li>\n<\/li>\n<li><code>audit=1 audit_backlog_limit=8192<\/code> — auditd must never drop events at boot.<\/li>\n<\/li>\n<li><strong>[TIER 3]<\/strong> <code>mitigations=auto,nosmt<\/code> — on a 4-core/8-thread TGL part this costs real capacity but closes SMT-based side channels. Only add it if your workload tolerates ~30% less CPU.<\/li>\n<\/li>\n<li><strong>[TIER 3]<\/strong> <code>init_on_free=1<\/code> also slows things; drop it to <code>init_on_alloc=1<\/code> only if you need speed.<\/li>\n<\/li>\n<\/ul>\n<p>Apply and verify:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp files/etc/default/grub /etc/default/grub\nsudo cp files/etc/kernel/cmdline /etc/kernel/cmdline   # keep the two synthetic-identical\nsudo update-grub 2&gt;/dev/null || sudo update-initramfs -u -k all\n# if using UKI (Path A), regenerate the UKI instead and sign it:\n#   sudo kernel-install add \"$(uname -r)\" /boot/vmlinuz-\"$(uname -r)\" &amp;&amp; sudo sbctl sign -s &lt;the .efi&gt;\nsudo reboot\ncat /sys/kernel/security/lockdown          # -&gt; [integrity] confidentiality  (confidentiality active)\nsudo dmesg | grep -iE 'IOMMU|DMAR'         # DMAR-IR, strict mode\ncat /proc/cmdline<\/code><\/pre><\/div>\n<h2 id=\"4-p1-p2-conversion-detached-luks-header-verified-and-reversible\">4. P1 → P2 conversion (detached LUKS header), verified and reversible<a class=\"anchor\" href=\"#4-p1-p2-conversion-detached-luks-header-verified-and-reversible\" aria-label=\"link\">#<\/a><\/h2>\n<p><code>scripts/make-luks-detached.sh<\/code> implements this. Read it before running it; here is the reasoning.<\/p>\n<p>The LUKS2 header occupies the <strong>first 16 MiB<\/strong> of the container; the encrypted data area starts <em>after<\/em> it. So a header backup can be moved to a USB token and the on-disk copy wiped without touching a single byte of your filesystem. Safety properties of the script:<\/p>\n<ol>\n<li>It refuses to run unless the header backup file exists, is ≥ 16 MiB, and **successfully opens the device** with <code>cryptsetup open --test-passphrase --header &lt;backup&gt;<\/code>.<\/li>\n<\/li>\n<li>It records the backup's SHA512 and writes a restore recipe next to it.<\/li>\n<\/li>\n<li>It only zeroes the first 16 MiB <em>after<\/em> step 1 passes.<\/li>\n<\/li>\n<li>It updates <code>/etc/crypttab<\/code> to <code>header=/dev/disk/by-id/&lt;usb&gt;<\/code> and regenerates the initramfs.<\/li>\n<\/li>\n<li>It prints the exact recovery command for the case where the USB is lost.<\/li>\n<\/li>\n<\/ol>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo bash scripts/make-luks-detached.sh --device /dev/nvme0n1p3 \\\n     --token /dev/disk/by-id/usb-YOUR_TOKEN-0:0 --confirm-i-have-two-header-backups<\/code><\/pre><\/div>\n<p>Grub/UKI must no longer need to find the header on disk — with systemd's cryptsetup generator, the <code>header=<\/code> field in <code>/etc/crypttab<\/code> is honoured (<a href=\"#/file/etc/crypttab.example\"><code>files/etc/crypttab.example<\/code><\/a>). <strong>Test the recovery path<\/strong> before you rely on it: boot with the token removed and confirm you get a clean \"cannot find header\" and can boot with <code>cryptsetup open --header /path/to/backup.img<\/code> from a rescue ISO.<\/p>\n<h2 id=\"5-tpm2-what-we-do-and-do-not-use-it-for\">5. TPM2 — what we do and do not use it for<a class=\"anchor\" href=\"#5-tpm2-what-we-do-and-do-not-use-it-for\" aria-label=\"link\">#<\/a><\/h2>\n<p>This machine exposes <strong>Intel PTT<\/strong> (firmware TPM), visible in the BIOS as <code>PTT<\/code> / <code>Security Device Support<\/code>. Our stance:<\/p>\n<ul>\n<li><strong>Not<\/strong> for disk unlock. A firmware TPM's PCR values are only as trustworthy as the firmware that extends them, and a laptop with no discrete TPM and no attestation service cannot detect a firmware-level attacker. A 6-word passphrase is stronger here.<\/li>\n<\/li>\n<li><strong>Optional, for sealing audit state<\/strong>: journald FSS sealing (<code>Seal=yes<\/code>) and IMA measurement logging. These use the TPM to make tampering with <em>logs<\/em> detectable; if the TPM is absent or cleared, sealing degrades to \"no sealing\" rather than blocking boot.<\/li>\n<\/li>\n<li>If you insist on convenience (unattended reboot), use <code>systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+7 --tpm2-with-pin=yes<\/code>. The <strong>PIN<\/strong> is what makes this defensible; without it, a thief who takes the whole laptop gets a system that boots itself. Document it as an explicit downgrade.<\/li>\n<\/li>\n<\/ul>\n<p>Check the state:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo apt-get install --no-install-recommends tpm2-tools\nsudo tpm2_getcap properties-fixed 2&gt;/dev/null | grep -iE 'MANUFACTURER|VENDOR' # expect IFX / INTC\ncat /sys/class/tpm/tpm0/tpm_version_major 2&gt;/dev/null                        # 2<\/code><\/pre><\/div>\n<h2 id=\"6-ima-measurement-optional-tier-2\">6. IMA / measurement (optional, Tier 2+)<a class=\"anchor\" href=\"#6-ima-measurement-optional-tier-2\" aria-label=\"link\">#<\/a><\/h2>\n<p><code>auditd<\/code> + AIDE cover \"did files change\". IMA covers \"was this binary measured before it executed\". On this hardware, enable only the appraisal-light configuration — full <code>ima_appraise=enforce<\/code> will break package upgrades and unattended reboots if keys are wrong:<\/p>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo cp files/etc/default/ima-policy /etc/ima/ima-policy    # provided; measurement-only by default\nsudo systemctl enable --now ima-measure.service 2&gt;/dev/null || true<\/code><\/pre><\/div>\n<p>Do not enable enforcement until you have run a full update cycle with measurement-only and read <code>/sys/kernel/security/ima/ascii_runtime_measurements<\/code> yourself. Be honest about the value: on a machine where you cannot verify the TPM's PCRs against a known-good quote, IMA mainly adds <em>audit evidence<\/em>, not prevention.<\/p>\n<h2 id=\"7-verification-checklist-for-this-document\">7. Verification checklist for this document<a class=\"anchor\" href=\"#7-verification-checklist-for-this-document\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code>sudo bootctl status                       # Secure Boot: enabled, signer = your key\nsgdisk -p /dev/nvme0n1                    # 3 partitions: ESP, boot, LUKS\nsudo cryptsetup luksDump /dev/nvme0n1p3   # LUKS2/argon2id   (P2: \"Device is not a valid LUKS device\" after wipe — expected)\ncat /pro
