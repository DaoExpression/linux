#	/etc/pf.conf — lab guest baseline
#
#	A guest does not route, so this ruleset is short: default deny, the
#	management access it needs, and nothing else.  The *zone* firewall lives on
#	the gateway, which sees traffic switched across veb0/veb1; this one exists
#	so that a guest is still defended if the gateway's rules are ever reloaded
#	badly, and so that a stray service is not exposed by accident.
#
#	Validate:  pfctl -nf /etc/pf.conf
#	Apply:     pfctl -f /etc/pf.conf
#
#	Per-guest trees add the rules their services need (postgresql, imaps, ...)
#	to the marked section at the bottom.

set skip on lo
set block-policy drop
set state-policy floating
set reassembly yes
set fingerprints "/etc/pf.os"
set loginterface vio0

# --- macros -------------------------------------------------------------------
# @ADDRESS@ is replaced per guest by scripts/deploy.sh with the guest's own
# address, so that the rules below describe "this host" without editing.
if		= "vio0"
me		= "@ADDRESS@"

mgmt_net	= "10.10.10.0/24"
srv_net		= "10.10.50.0/24"
dmz_net		= "10.10.40.0/24"
vpn_net		= "10.10.60.0/24"
gw		= "10.10.50.1"
monitor		= "10.10.50.14"
bastion		= "10.10.50.10"

icmp_types	= "{ echoreq echorep unreach timexceed paramprob }"

# --- normalization ------------------------------------------------------------
match in all scrub (no-df random-id max-mss 1440)

# --- filtering ----------------------------------------------------------------
antispoof quick for $if
block all

# ICMP that a host needs to make progress, from anywhere in the lab.
pass in quick inet proto icmp from $srv_net icmp-type $icmp_types keep state
pass in quick inet proto icmp from $mgmt_net icmp-type $icmp_types keep state
pass in quick inet proto icmp from $monitor icmp-type $icmp_types keep state

# Local DHCP (guests are static, but a rebuild starts on the install network
# and dhclient may still be running) and IPv6 autoconfiguration.
pass in quick proto udp from any port bootpc to any port bootps
pass quick inet6 proto icmp6 all

# Management: ssh from the admin networks, and from the bastion.
pass in quick proto tcp from $mgmt_net to $me port ssh keep state
pass in quick proto tcp from $bastion to $me port ssh keep state
pass in quick proto tcp from $vpn_net to $me port ssh keep state

# Monitoring: agentless SNMP from the mon guest only, plus the exporter ports
# if you run one.
pass in quick proto udp from $monitor to $me port snmp keep state
pass in quick proto tcp from $monitor to $me port 9100 keep state
pass in quick proto udp from $monitor to $me port syslog keep state

# Time and DNS: the gateway answers both, and nothing else in the lab does.
pass in quick proto udp from $gw to $me port ntp keep state
pass in quick proto { tcp udp } from $gw to $me port domain keep state

# --- per-guest services -------------------------------------------------------
# Deploy adds service rules below this line.  Keep them "quick" and narrow:
# anything added here is reachable from the whole source network listed.

# --- outbound -----------------------------------------------------------------
# Replies are already covered by the state created above; this rule covers what
# the guest itself originates (DNS, package updates, backups, log shipping).
pass out on $if from $me to any keep state
