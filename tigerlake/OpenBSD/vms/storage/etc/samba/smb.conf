#	/etc/samba/smb.conf — storage guest
#
#	Install:  pkg_add samba
#	Check:    testparm
#	Apply:    rcctl restart samba
#	Accounts: smbpasswd -a <user>      (creates/updates the Samba password)
#
#	Samba serves the guests and workstations that cannot do NFS (Windows, macOS
#	without rpcbind).  It shares the *same* directories as /etc/exports where
#	possible, so there is one copy of the data and one place to back it up.

[global]
	# --- identity ------------------------------------------------------------
	workgroup = LAB
	server string = lab storage (10.10.50.13)
	netbios name = STORAGE
	server role = standalone server
	# SMB1 is off (and gone from modern Samba anyway): it is unauthenticated by
	# default and there is no device in the lab old enough to need it.
	server min protocol = SMB2

	# --- authentication -------------------------------------------------------
	# Local accounts only: the lab has no directory service.  "map to guest =
	# bad user" turns an unknown username into a guest, which is what makes the
	# read-only [media] share workable without accounts for every visitor.
	security = user
	passdb backend = tdbsam
	map to guest = Bad User
	guest account = nobody
	# Samba's own user list is /var/db/samba4/private/passdb.tdb, created by
	# smbpasswd.  Never point this at /etc/master.passwd.

	# --- interfaces -----------------------------------------------------------
	# Bind only the SRV address.  "bind interfaces only" is what stops Samba
	# from also answering on fd00:... and on any future interface.
	interfaces = 10.10.50.13/24
	bind interfaces only = yes

	# --- logging --------------------------------------------------------------
	log file = /var/log/samba/log.%m
	max log size = 1000
	log level = 1
	# Guest logins write a lot of noise; keep them out of the main log.
	# log level = 1 auth:2

	# --- hardening ------------------------------------------------------------
	# Refuse anything that makes a Windows client think it can write metadata.
	# Unix extensions keep permissions predictable for NFS+Windows sharing the
	# same directory.
	unix extensions = yes
	# Hide files that start with a dot EXCEPT .well-known style directories is
	# a per-share decision; the default here is to show everything, because an
	# admin's rsync of a homedir should not silently skip hidden files.
	hide dot files = no
	# Disable the printer stack: this guest has no print server and cups is not
	# installed, so browsing for printers would fail.
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	# --- performance ----------------------------------------------------------
	# virtio on the host's NVMe: big socket buffers are worth it, and the
	# dataset is small enough that an aggressive cache costs nothing.
	socket options = TCP_NODELAY
	read raw = yes
	write raw = yes
	aio read size = 16384
	aio write size = 16384
	use sendfile = yes

	# --- veto ----------------------------------------------------------------
	# Veto files that clients create and only hate later.
	veto files = /Thumbs.db/Desktop.ini/.DS_Store/lost+found/

[shared]
	comment = Lab shared space
	path = /export/shared
	browseable = yes
	read only = no
	# Only lab accounts, never guests: this is the writeable share.
	valid users = @wheel,@staff
	force group = staff
	create mask = 0660
	directory mask = 0770
	# Keep the two protocols honest: Samba writes files that NFS clients also
	# see, so the modes must not depend on which one wrote them.
	inherit permissions = yes

[media]
	comment = Read-only media library
	path = /export/media
	browseable = yes
	read only = yes
	guest ok = yes
	# No accounts needed to read; the pf rules still keep GUEST and the
	# internet away from 445 entirely.
	guest only = yes

[backup]
	comment = Read-only access to the backup archives
	path = /export/backup
	browseable = yes
	read only = yes
	valid users = @wheel
	# Backups are the one dataset where "restore it over the live copy"
	# must be a deliberate act: read-only for everyone over SMB.
	guest ok = no
