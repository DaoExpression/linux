# /etc/modsecurity/modsecurity.conf
# Core mod_security settings. Apache-side wiring is in /etc/apache2/mods-available/security2.conf.
# Keep this file small: it is included BY that file, and duplicated settings in two places is how
# you end up debugging which one won.

SecRuleEngine On

# --- request body handling (authoritative copies of the Apache-side limits) ---
SecRequestBodyAccess On
SecRequestBodyLimit 131072
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off

# --- logging ---
SecDebugLog /var/log/apache2/modsec_debug.log
SecDebugLogLevel 0
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIFHZ
SecAuditLogType Serial
SecAuditLog /var/log/apache2/modsec_audit.log

# --- working directories (must exist, be writable by Apache, and be inside the unit's sandbox) ---
SecDataDir /var/cache/apache2/mod_security2
SecTmpDir /var/cache/apache2/mod_security2
SecUploadDir /var/cache/apache2/mod_security2
SecUploadKeepFiles Off

# --- PCRE limits: protect the engine itself from ReDoS ---
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# --- anomaly-free defaults: deny on the first phase-1 rule that fires ---
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# --- do not trust client-provided path information ---
SecArgumentSeparator "&"
SecCookieFormat 0

# --- unicode/encoding: strict ---
SecUnicodeMapFile unicode.mapping 20127
SecValidateUTF8Encoding On
SecDisableBackendCompression On
