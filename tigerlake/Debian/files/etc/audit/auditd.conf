# /etc/audit/auditd.conf
# Audit log handling. The important properties: never overwrite history, never silently drop,
# keep the file root-only, and make overflow visible.
#
# Read with:  sudo ausearch -k apache-config -ts recent  /  sudo aureport --summary

log_file = /var/log/audit/audit.log
log_group = root
log_format = ENRICHED
flush = incremental
freq = 100
num_logs = 12
max_log_file = 64
max_log_file_action = ROTATE
space_left = 512
space_left_action = email
verify_email = yes
action_mail_acct = root
admin_space_left = 128
admin_space_left_action = single
disk_full_action = single
disk_error_action = single
## SUSPEND would stop logging without stopping the machine (silent gap). 'single' halts into
## single-user mode instead: loud, and it requires a console + LUKS passphrase to continue.
use_libwrap = no
tcp_listen_port = 0
tcp_listen_queue = 5
tcp_max_per_addr = 1
tcp_client_max_idle = 0
transport = TCP
## Distribution of the audit log to the remote collector is configured in audisp-remote.conf.
name_format = HOSTNAME
name = srv-01
disp_qos = lossy
dispatcher = /sbin/audispd
overflow_action = SYSLOG
max_restarts = 10
plugin_dir = /etc/audit/plugins.d
end_of_event_timeout = 2

# Single-user mode with a locked root account is a bit of a contradiction; the intended recovery is
# the physical console with the LUKS passphrase and the admin account. Verify you can actually get
# in before relying on it (docs/10 §6).
