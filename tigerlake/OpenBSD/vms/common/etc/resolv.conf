#	/etc/resolv.conf — lab guest baseline
#
#	Every guest resolves through the dns VM (unbound: recursion plus the
#	lab.example.org zone), not through the gateway, whose unwind(8) answers on
#	localhost only.
#
#	The dns guest overrides this file with 127.0.0.1 — see vms/dns/etc/resolv.conf.
#	On the guests this file is static; resolvd(8) only rewrites it for
#	interfaces using autoconf, and guests are statically addressed.
nameserver 10.10.50.11
nameserver 10.10.10.1
lookup file bind
