 short-precise &gt; /var/log/paranoid/ir-journal.txt<\/code><\/pre><\/div>\n<div class=\"cb-wrap\"><pre class=\"code\" class=\"lang-bash\"><code># 2. Contain the network WITHOUT losing access (allow your admin path, drop everything else)\nsudo nft -f - &lt;&lt;'EOF'\ntable inet ir {\n  chain input { type filter hook input priority -10; policy accept;\n                ip saddr != 10.66.0.0/24 tcp dport 443 drop\n                ip saddr != 10.66.0.0/24 tcp dport 80  drop }\n  chain output { type filter hook output priority -10; policy accept;\n                 ct state new ip daddr != 10.66.0.2 drop }\n}\nEOF\n# this is a *temporary overlay*: it blocks the internet while leaving your WireGuard admin path alive.\n# Once you have the evidence you need, the machine's own ruleset should be tightened further.<\/code><\/pre><\/div>\n<p>Then, in most cases: <strong>rebuild<\/strong>. The sequence:<\/p>\n<ol>\n<li>Rotate everything the machine held — see §4.<\/li>\n<\/li>\n<li>Image the disk for forensics if you care about attribution (<code>dd<\/code> to external storage, or <code>dc3dd<\/code>).<\/li>\n<\/li>\n<li>Wipe and reinstall per <code>docs/02<\/code>, with the fixes for whatever let it in.<\/li>\n<\/li>\n<li>Restore <em>data only<\/em> from a backup predating the compromise. <strong>Verify the date.<\/strong> Restoring the infected <code>/var/www<\/code> is how the compromise survives the rebuild.<\/li>\n<\/li>\n<li>Re-baseline AIDE, re-check with <code>verify-hardening.sh<\/code>, and write down the root cause.<\/li>\n<\/li>\n<\/ol>\n<h2 id=\"3-investigation-notes-for-this-specific-build\">3. Investigation notes for this specific build<a class=\"anchor\" href=\"#3-investigation-notes-for-this-specific-build\" aria-label=\"link\">#<\/a><\/h2>\n<ul>\n<li><strong>Where to look first<\/strong>: <code>/var/log/apache2/*<\/code>, <code>modsec_audit.log<\/code>, the sealed journal, auditd (<code>ausearch -ts recent<\/code>), AIDE diffs, and <code>systemd-analyze security<\/code> changes.<\/li>\n<\/li>\n<li><strong>The web root is not the only candidate<\/strong>: a compromised <em>application<\/em> in a container/VM has its own logs. Check the container's <code>/var/log<\/code> and its process list (<code>machinectl<\/code>/<code>podman<\/code>), and remember the isolation means the host's <code>/var/www<\/code> may be untouched while the app is owned.<\/li>\n<\/li>\n<li><strong>Check the egress log<\/strong> (<code>nft-drop-out<\/code>). A compromised service that suddenly tries to reach a hardcoded IP is a <em>gift<\/em> — it tells you the C2 infrastructure and confirms the compromise. This is why egress filtering is in <code>docs/05<\/code> §4.<\/li>\n<\/li>\n<li><strong>Check the MEI/Thunderbolt/USB state<\/strong> for physical indicators (<code>docs/07<\/code> §7): <code>lsmod<\/code>, `usbguard list-devices<code>, <\/code>boltctl list<code>, <\/code>/var/log/paranoid/boots`.<\/li>\n<\/li>\n<li><strong>Firmware-level persistence is the worst case.<\/strong> If you find reason to believe ME/firmware was flashed: re-flash a known-good Dell BIOS (<code>fwupdmgr<\/code> from a <em>trusted<\/em> network or a BIOS recovery USB), then re-enroll Secure Boot keys from offline, then rebuild the OS. Do not trust any measurement taken <em>before<\/em> the re-flash.<\/li>\n<\/li>\n<\/ul>\n<h2 id=\"4-key-rotation-checklist-do-this-after-any-confirmed-compromise\">4. Key rotation checklist (do this after any confirmed compromise)<a class=\"anchor\" href=\"#4-key-rotation-checklist-do-this-after-any-confirmed-compromise\" aria-label=\"link\">#<\/a><\/h2>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Secret<\/th>\n<th style=\"text-align:left\">Rotate how<\/th>\n<th style=\"text-align:left\">Also<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">TLS private key / cert<\/td>\n<td style=\"text-align:left\">re-issue with <code>certbot<\/code> (new key: <code>--force-renewal<\/code> after revoking, or new ACME order), and revoke the old cert<\/td>\n<td style=\"text-align:left\">check CT logs for unexpected issuance<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">SSH host keys<\/td>\n<td style=\"text-align:left\"><code>rm /etc/ssh/ssh_host_*<\/code> + <code>ssh-keygen -A<\/code>, then update <code>known_hosts<\/code> on your admin machines<\/td>\n<td style=\"text-align:left\">key-only auth means no password rotations needed<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">SSH user keys<\/td>\n<td style=\"text-align:left\">generate new keys on <strong>your<\/strong> machines, replace <code>authorized_keys<\/code><\/td>\n<td style=\"text-align:left\">if you used a FIDO key, it did not leak<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">LUKS passphrase<\/td>\n<td style=\"text-align:left\"><code>cryptsetup luksChangeKey<\/code> (and re-generate the detached header if P2)<\/td>\n<td style=\"text-align:left\">verify the new passphrase boots the machine<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">WireGuard keys<\/td>\n<td style=\"text-align:left\"><code>wg genkey<\/code> on both ends, new <code>wg0.conf<\/code><\/td>\n<td style=\"text-align:left\">Tunnel downtime is part of the cost.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">ACME account &amp; DNS API tokens<\/td>\n<td style=\"text-align:left\">revoke/reissue at your DNS provider<\/td>\n<td style=\"text-align:left\">audit what else that token could do<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Backup repository password/key<\/td>\n<td style=\"text-align:left\"><code>restic key add<\/code>/<code>key remove<\/code>, or new repository<\/td>\n<td style=\"text-align:left\">verify a restore with the new key <strong>before<\/strong> removing the old<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Secure Boot / MOK keys<\/td>\n<td style=\"text-align:left\">regenerate with <code>sbctl<\/code>, re-enroll, re-sign the UKI<\/td>\n<td style=\"text-align:left\">keep the offline copy in sync<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Any app credentials, DB passwords, API keys<\/td>\n<td style=\"text-align:left\">rotate at the source<\/td>\n<td style=\"text-align:left\">assume everything on disk was read<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">GPG/signing keys on the machine<\/td>\n<td style=\"text-align:left\">revoke + replace<\/td>\n<td style=\"text-align:left\">if you signed anything with them, announce the revocation<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"5-post-incident-don-t-repeat-it\">5. Post-incident: don't repeat it<a class=\"anchor\" href=\"#5-post-incident-don-t-repeat-it\" aria-label=\"link\">#<\/a><\/h2>\n<p>Write a short document — five lines is fine:<\/p>\n<ol>\n<li><strong>Timeline<\/strong>: first known-bad event, detection, containment, rebuild.<\/li>\n<\/li>\n<li><strong>Root cause<\/strong>: the actual one, not \"the internet\".<\/li>\n<\/li>\n<li><strong>What would have prevented it<\/strong>: map to a control in <code>docs/01<\/code> §1 (T1–T11). If the answer is \"none of them\", the threat model needs updating, not the config.<\/li>\n<\/li>\n<li><strong>What detection would have caught it sooner<\/strong>: usually log shipping, a tighter AIDE rule, or an egress alert. Add it.<\/li>\n<\/li>\n<li><strong>What you are changing in this repo<\/strong>, so the fix is not just in your head: update the relevant <code>docs/*.md<\/code> and <code>files/*<\/code> here, then re-run <code>scripts/install-hardening.sh<\/code> and <code>verify-hardening.sh<\/code> on the rebuilt host.<\/li>\n<\/li>\n<\/ol>\n<h2 id=\"6-lockout-self-inflicted-the-other-kind-of-incident\">6. Lockout (self-inflicted) — the other kind of incident<a class=\"anchor\" href=\"#6-lockout-self-inflicted-the-other-kind-of-incident\" aria-label=\"link\">#<\/a><\/h2>\n<p>Different problem, same discipline: fix it from the console, then document the trap.<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th style=\"text-align:left\">Lockout<\/th>\n<th style=\"text-align:left\">Fix from the physical console<\/th>\n<\/tr><\/thead><tbody>\n<tr>\n<td style=\"text-align:left\">nftables dropped your admin path<\/td>\n<td style=\"text-align:left\"><code>sudo nft flush ruleset<\/code> (or <code>nft delete table inet ir<\/code> for the overlay), then restore <code>/var/backups/nft.*.ruleset<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">sshd will not start<\/td>\n<td style=\"text-align:left\"><code>sudo sshd -t<\/code> to see the error; comment the offending drop-in in <code>/etc/ssh/sshd_config.d/<\/code>; <code>systemctl start ssh<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Apache will not start<\/td>\n<td style=\"text-align:left\"><code>apache2ctl configtest<\/code>; <code>harden-apache.sh<\/code> keeps <code>/var/backups/apache2-&lt;stamp&gt;/<\/code> — restore the failing file from it<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Boot fails after Secure Boot signing<\/td>\n<td style=\"text-align:left\">boot the old kernel from the systemd-boot menu, re-sign the UKI (<code>sbctl sign<\/code>), verify with <code>bootctl status<\/code><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">LUKS token (P2) missing<\/td>\n<td style=\"text-align:left\">boot from the header backup: rescue ISO → <code>cryptsetup open --header /media/usb/header.img /dev/nvme0n1p3 cryptroot<\/code> → mount and boot manually, or restore the header to disk if you decide to abandon P2<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">firmware TPM/PCR change broke journal sealing<\/td>\n<td style=\"text-align:left\">sealing degrades safely by design (<code>docs/04<\/code> §10); re-run <code>journalctl --setup-keys<\/code> if you want sealing back<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>And the meta-rule: every lockout you cause becomes a note in <code>docs/10<\/code> §6, so the next person (possibly future-you at 3 a.m.) has the fix written down.<\/p>", "files": [], "toc": [{"lvl": 1, "id": "11-incident-response-compromise-lockout-or-something-is-wrong", "text": "11 — Incident response (compromise, lockout, or \"something is wrong\")"}, {"lvl": 2, "id": "1-triage-is-it-actually-a-compromise", "text": "1. Triage — is it actually a compromise?"}, {"lvl": 2, "id": "2-if-you-decide-it-is-a-real-incident-containment", "text": "2. If you decide it is a real incident — containment"}, {"lvl": 2, "id": "3-investigation-notes-for-this-specific-build", "text": "3. Investigation notes for this specific build"}, {"lvl": 2, "id": "4-key-rotation-checklist-do-this-after-any-confirmed-compromise", "text": "4. Key rotation checklist (do this after any confirmed compromise)"}, {"lvl": 2, "id": "5-post-incident-don-t-repeat-it", "text": "5. Post-incident: don't repeat it"}, {"lvl": 2, "id": "6-lockout-self-inflicted-the-other-kind-of-incident", "text": "6. Lockout (self-inflicted) — the other kind of incident"}], "fences": 2, "tables": 3}], "artefacts": {"etc/aide/aide.conf.d/99_paranoid.conf": {"path": "etc/aide/aide.conf.d/99_paranoid.conf", "content": "# /etc/aide/aide.conf.d/99_paranoid.conf\n# AIDE rules. docs/04 §8: take the baseline LAST, after all configuration is final, or every run\n# is noise. Verify with: sudo aide --check --config /etc/aide/aide.conf\n\n# Custom rule sets (content: permissions, inode, links, uid, gid, size, mtime, ctime, sha512)\n# - p permissions, i inode, n number of links, u user, g group, s size, m mtime, c ctime, sha512 hash\nSTRONG = p+i+n+u+g+s+m+c+sha512\nCONTENT = p+n+u+g+s+sha512\nLOOSE = p+u+g\n\n# Trust roots - anything changing here is a finding until proven otherwise\n/etc STRONG\n/boot STRONG\n/usr/bin STRONG\n/usr/sbin STRONG\n/bin STRONG\n/sbin STRONG\n/usr/lib/systemd STRONG\n/etc/ssl STRONG\n/etc/letsencrypt STRONG\n/etc/paranoid STRONG\n/etc/audit STRONG\n/etc/apache2 STRONG\n/etc/modsecurity STRONG\n/etc/nftables.conf STRONG\n/etc/wireguard STRONG\n\n# Content of the served material: integrity matters, mtime does not (deploys are legitimate)\n/var/www CONTENT\n/srv CONTENT\n\n# Volatile by nature. Excluded so the daily diff stays readable (a diff nobody reads is useless).\n!/var/cache\n!/var/tmp\n!/var/log\n!/var/lib/aide\n!/var/lib/systemd\n!/var/lib/chrony\n!/var/lib/unbound\n!/var/lib/dpkg\n!/var/lib/apt\n!/run\n!/proc\n!/sys\n!/dev\n!/tmp\n!/srv/.*tmp\n!/etc/mtab\n!/etc/adjtime\n!/etc/resolv.conf\n!/root/.bash_history\n!/home/.*\\.bash_history\n!/etc/letsencrypt/.*\\.pem\\.new$\n", "lines": 54, "purpose": "Defines what 'unchanged' means for the trust roots, with volatile paths excluded so the diff stays readable.", "notes": [{"n": 6, "why": "Defines a strong change-detection rule: permissions, ownership, size, times and a SHA-512 digest."}, {"n": 7, "why": "For served content: integrity matters, but timestamps change on legitimate deploys."}, {"n": 11, "why": "The configuration and the boot chain are the highest-value targets for persistence."}, {"n": 12, "why": "The configuration and the boot chain are the highest-value targets for persistence."}, {"n": 13, "why": "Binaries must match what dpkg installed; any drift is a finding."}, {"n": 14, "why": "Binaries must match what dpkg installed; any drift is a finding."}, {"n": 15, "why": "Binaries must match what dpkg installed; any drift is a finding."}, {"n": 16, "why": "Binaries must match what dpkg installed; any drift is a finding."}, {"n": 18, "why": "TLS key material: unauthorised access or replacement is a full impersonation."}, {"n": 19, "why": "TLS key material: unauthorised access or replacement is a full impersonation."}, {"n": 21, "why": "Auditing configuration and the web server's own policy - both are things an attacker weakens first."}, {"n": 22, "why": "Auditing configuration and the web server's own policy - both are things an attacker weakens first."}, {"n": 28, "why": "Content integrity without failing on every deploy artifact's timestamp."}, {"n": 29, "why": "Content integrity without failing on every deploy artifact's timestamp."}, {"n": 32, "why": "Excluding genuinely volatile paths keeps the daily diff readable - a diff nobody reads protects nothing."}, {"n": 34, "why": "Excluding genuinely volatile paths keeps the daily diff readable - a diff nobody reads protects nothing."}, {"n": 35, "why": "Without this exclusion the database changes itself and every run reports noise."}, {"n": 41, "why": "Excluding genuinely volatile paths keeps the daily diff readable - a diff nobody reads protects nothing."}, {"n": 42, "why": "Excluding genuinely volatile paths keeps the daily diff readable - a diff nobody reads protects nothing."}, {"n": 43, "why": "Excluding genuinely volatile paths keeps the daily diff readable - a diff nobody reads protects nothing."}, {"n": 45, "why": "Excluding genuinely volatile paths keeps the daily diff readable - a diff nobody reads protects nothing."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/apache2.conf": {"path": "etc/apache2/apache2.conf", "content": "# /etc/apache2/apache2.conf\n# Hardened main configuration. Differences from Debian's stock file are deliberate and commented;\n# see docs/06-apache-hardening.md §3.\n#\n# Validate after ANY edit:  sudo apache2ctl configtest   (must print \"Syntax OK\")\n# The install script backs up the original to /var/backups/paranoid/<stamp>/ before replacing this.\n\n# ---------------------------------------------------------------------------\n# Server identity and runtime\n# ---------------------------------------------------------------------------\nServerRoot \"/etc/apache2\"\n\n# Mutex and pid paths come from /etc/apache2/envvars (not from this file) so that extra instances\n# (docs/06 §7) get their own. Do not hardcode them here.\nMutex file:${APACHE_LOCK_DIR} default\nPidFile ${APACHE_PID_FILE}\nDefaultRuntimeDir ${APACHE_RUN_DIR}\n\nUser ${APACHE_RUN_USER}\nGroup ${APACHE_RUN_GROUP}\n# Debian's default is www-data with no shell and no home directory. Keep it that way; never give the\n# web user a login shell, and never add it to any group that owns application data.\n\n# ---------------------------------------------------------------------------\n# Exposure control: say as little as possible\n# ---------------------------------------------------------------------------\nServerTokens Prod            # \"Server: Apache\" - no version, no modules\nServerSignature Off          # no version string on error pages or directory listings\nTraceEnable Off              # TRACE/TRACK off (cross-site tracing)\nHostnameLookups Off          # no reverse DNS: no latency, no DNS traffic, no timing leak\nUseCanonicalName Off         # never trust the Host: header for self-referential URLs\nFileETag None                # ETags can leak inode numbers; we do not use conditional GETs on a\n                             # static-by-design server\n\n# ---------------------------------------------------------------------------\n# Connection handling - tight, because we serve one purpose\n# ---------------------------------------------------------------------------\nTimeout 30\nKeepAlive On\nMaxKeepAliveRequests 64\nKeepAliveTimeout 5\n\n# Request-size limits are a first line of defence: an oversized request never reaches a parser.\nLimitRequestFields 40\nLimitRequestFieldSize 4096\nLimitRequestLine 4096\nLimitRequestBody 1048576          # 1 MiB ceiling on request bodies\nLimitXMLRequestBody 0             # no XML bodies at all: kills XXE/Billion-Laughs before a parser\n                                  # sees them\n\n# Slowloris / slow-POST: require progress. This is why we do not need a separate anti-DoS daemon\n# for header trickling.\nRequestReadTimeout header=10-20,MinRate=500 body=10-20,MinRate=500\n\n# ---------------------------------------------------------------------------\n# Logging\n# ---------------------------------------------------------------------------\nErrorLog ${APACHE_LOG_DIR}/error.log\nLogLevel warn\n\n# Extended format: vhost, client, time, request, status, bytes, microseconds, TLS protocol+cipher,\n# UA and Referer. Enough to investigate, without request bodies (never log those).\nLogFormat \"%v %h %l %u %t \\\"%r\\\" %>s %b %D %{SSL_PROTOCOL}x %{SSL_CIPHER}x \\\"%{User-Agent}i\\\" %{Referer}i\" paranoid\nLogFormat \"%v %h %l %u %t \\\"%r\\\" %>s %b %D\" paranoid-minimal\n# Tier 2: pipe to journald so events land in a persistent, sealed, remotely shippable store\n# (docs/06 §9). Comment these two lines and use the file-based CustomLog below if you prefer files.\nCustomLog \"|/usr/bin/logger -t apache_access -p local6.info\" paranoid\nErrorLog  \"|/usr/bin/logger -t apache_error  -p local6.err\"\n# CustomLog ${APACHE_LOG_DIR}/access.log paranoid\n\n# ---------------------------------------------------------------------------\n# Modules and the rest of the configuration\n# ---------------------------------------------------------------------------\nIncludeOptional mods-enabled/*.load\nIncludeOptional mods-enabled/*.conf\n\n# Only 443 (and possibly 80). See files/etc/apache2/ports.conf.\nInclude ports.conf\n\n# ---------------------------------------------------------------------------\n# Default deny, then explicit permission\n# ---------------------------------------------------------------------------\n<Directory />\n    Options None\n    AllowOverride None\n    Require all denied\n<\/Directory>\n\n<Directory /var/www/>\n    Options -Indexes -ExecCGI -Includes -MultiViews -FollowSymLinks\n    AllowOverride None\n    Require all granted\n<\/Directory>\n\n# .htaccess is an attacker-writable configuration file in the web root. Forbid it, and forbid\n# serving it or any other dotfile.\nAccessFileName .htaccess\n<FilesMatch \"^\\.ht\">\n    Require all denied\n<\/FilesMatch>\nRedirectMatch 404 /\\.(?!well-known/).*$\n\n# Server version in error documents is already off; keep error pages generic and static.\n# (Configure ErrorDocument per site - see sites-available/example-hardened.conf.)\n\n# Include the security/tls/headers fragments (shipped in conf-available, enabled via a2enconf).\nIncludeOptional conf-enabled/*.conf\n\n# Sites last: a vhost can then refine, but cannot unset, the global defaults above.\nIncludeOptional sites-enabled/*.conf\n", "lines": 111, "purpose": "The web server's global posture: minimal information disclosure, bounded request parsing, default-deny directories.", "notes": [{"n": 26, "why": "Advertises only 'Apache': no version to match against a CVE list."}, {"n": 27, "why": "Error pages and listings carry no version string."}, {"n": 28, "why": "TRACE enables cross-site tracing, letting a scripted client read headers it should not."}, {"n": 29, "why": "No reverse DNS on every request: no latency, no DNS traffic generated by visitors, no timing leak."}, {"n": 30, "why": "Never trusts the Host: header to construct self-referential URLs."}, {"n": 31, "why": "ETags can leak inode numbers, which help map a filesystem remotely."}, {"n": 43, "why": "Hard caps on request parsing: an oversized request never reaches a parser."}, {"n": 44, "why": "Hard caps on request parsing: an oversized request never reaches a parser."}, {"n": 45, "why": "Hard caps on request parsing: an oversized request never reaches a parser."}, {"n": 46, "why": "A 1 MiB body ceiling means upload-based memory exhaustion is not the first thing that happens."}, {"n": 47, "why": "XML bodies are refused outright, which removes XXE and entity-expansion attacks entirely."}, {"n": 52, "why": "Requires progress from slow clients, which is the real Slowloris defence - no extra daemon needed."}, {"n": 58, "why": "Quiet enough not to fill a disk, verbose enough to investigate."}, {"n": 62, "why": "Records vhost, status, timing and the TLS protocol/cipher - enough to investigate, no request bodies."}, {"n": 63, "why": "Records vhost, status, timing and the TLS protocol/cipher - enough to investigate, no request bodies."}, {"n": 67, "why": "Logs go to journald, which is persistent, size-bounded and sealed (docs/04)."}, {"n": 82, "why": "Everything is denied unless a directory is explicitly opened below."}, {"n": 83, "why": "For the root directory: no listings, no CGI, no includes."}, {"n": 84, "why": "A .htaccess in the web root is a writable configuration file for an attacker; this forbids it globally."}, {"n": 85, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 89, "why": "No listings, no CGI execution, no server-side includes and no content-negotiation guessing."}, {"n": 90, "why": "A .htaccess in the web root is a writable configuration file for an attacker; this forbids it globally."}, {"n": 91, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 97, "why": "Refuses to serve .htaccess and friends even if a handler is misconfigured."}, {"n": 98, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 99, "why": "Requests are refused by pattern, so a stray file type cannot be executed or served."}, {"n": 100, "why": "Dotfiles and dot-directories do not exist as far as the web is concerned."}, {"n": 106, "why": "Pulls in the security, TLS and header fragments - they are the substance of this build."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/conf-available/headers-hardening.conf": {"path": "etc/apache2/conf-available/headers-hardening.conf", "content": "# /etc/apache2/conf-available/headers-hardening.conf\n# Security response headers. Enabled with:  sudo a2enconf headers-hardening\n# See docs/06 §5. Requires mod_headers (enabled in the module list).\n#\n# Validate:  sudo apache2ctl configtest\n# Verify (from off-box):  curl -sI https://<server>/ | grep -iE 'strict-transport|content-security'\n\n<IfModule mod_headers.c>\n\n    # -----------------------------------------------------------------------\n    # Transport and framing\n    # -----------------------------------------------------------------------\n    # HSTS: 2 years, subdomains included. 'preload' is included so you *can* submit to the preload\n    # list, but only do that when you are certain every subdomain will always be HTTPS.\n    # env=HTTPS makes it apply only over TLS (so a future port-80 redirect is not poisoned).\n    Header always set Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" env=HTTPS\n\n    Header always set X-Content-Type-Options \"nosniff\"\n    Header always set X-Frame-Options \"DENY\"\n    Header always set Referrer-Policy \"strict-origin-when-cross-origin\"\n\n    # -----------------------------------------------------------------------\n    # Cross-origin isolation (blocks a class of side-channel and CSRF-ish attacks)\n    # -----------------------------------------------------------------------\n    Header always set Cross-Origin-Opener-Policy \"same-origin\"\n    Header always set Cross-Origin-Resource-Policy \"same-origin\"\n    # Uncomment when you have verified every embedded resource is same-origin:\n    #Header always set Cross-Origin-Embedder-Policy \"require-corp\"\n\n    # -----------------------------------------------------------------------\n    # Feature policy: deny browser features this site has no business using\n    # -----------------------------------------------------------------------\n    Header always set Permissions-Policy \"accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()\"\n\n    # -----------------------------------------------------------------------\n    # Content-Security-Policy\n    # -----------------------------------------------------------------------\n    # ADJUST THIS TO YOUR APPLICATION. 'default-src self' will break a site that loads scripts,\n    # fonts or styles from a CDN. The correct fix is to serve those assets yourself or list the exact\n    # origins - NOT to add 'unsafe-inline' / 'unsafe-eval', which throw away most of the benefit.\n    # This policy is strict enough that an injected script cannot exfiltrate anything.\n    Header always set Content-Security-Policy \"default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests\"\n\n    # -----------------------------------------------------------------------\n    # Do not leak server-side technology, ever\n    # -----------------------------------------------------------------------\n    Header always unset X-Powered-By\n    Header always unset X-Generator\n    Header always unset X-Drupal-Cache\n    Header always unset X-Runtime\n    Header always unset Server\n\n    # -----------------------------------------------------------------------\n    # Cookies: force the flags that stop the two most common app-level session thefts.\n    # -----------------------------------------------------------------------\n    # WARNING: if your application already sets HttpOnly/Secure/SameSite itself, this line produces\n    # DUPLICATED attributes. Browsers ignore the duplicates, but some clients/apps are fussy.\n    # Test with your app; comment the line out if it causes trouble - the app setting them itself is\n    # equally good and cleaner.\n    Header edit Set-Cookie ^(?i)(.*)$ \"$1; HttpOnly; Secure; SameSite=Strict\"\n\n<\/IfModule>\n\n# If mod_headers is missing, the config should fail loudly rather than silently serve without the\n# security headers. a2enconf does not check this, so we assert it here.\n<IfModule !mod_headers.c>\n    # Deliberately invalid directive: refuses to start if headers are not available.\n    # Comment this out only if you have replaced mod_headers with equivalent functionality.\n    HeaderHardeningRequiresModHeaders\n<\/IfModule>\n", "lines": 71, "purpose": "Browser-side defences (HSTS, CSP, COOP/CORP, Permissions-Policy, cookie flags) that limit what a bug in your application can do to a visitor.", "notes": [{"n": 15, "why": "Forces HTTPS for two years including subdomains, which closes the downgrade window on the first visit."}, {"n": 17, "why": "Stops browsers second-guessing content types, which is how an uploaded 'image' becomes script."}, {"n": 18, "why": "No framing: clickjacking against your users is not possible."}, {"n": 19, "why": "Limits how much of your URL structure leaks to third parties."}, {"n": 24, "why": "Isolates your origin, blocking cross-origin reads and a class of side-channel attacks."}, {"n": 25, "why": "Isolates your origin, blocking cross-origin reads and a class of side-channel attacks."}, {"n": 32, "why": "Explicitly denies camera, microphone, geolocation, USB and payment to your own pages - a compromised script cannot ask for them."}, {"n": 41, "why": "No framing: clickjacking against your users is not possible."}, {"n": 46, "why": "Removes banners that tell a scanner which framework and version to attack."}, {"n": 47, "why": "Removes banners that tell a scanner which framework and version to attack."}, {"n": 49, "why": "Removes banners that tell a scanner which framework and version to attack."}, {"n": 50, "why": "Removes banners that tell a scanner which framework and version to attack."}, {"n": 59, "why": "Adds HttpOnly, Secure and SameSite=Strict so a stolen cookie is not trivially reused - test with your app, it can duplicate attributes."}, {"n": 68, "why": "A deliberate invalid directive: the server refuses to start without the security headers rather than serving silently without them."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/conf-available/mpm-tuning.conf": {"path": "etc/apache2/conf-available/mpm-tuning.conf", "content": "# /etc/apache2/conf-available/mpm-tuning.conf\n# MPM tuning. Small, bounded, predictable: a single-purpose HTTPS server on 4 cores/8 threads does\n# not need Apache's defaults, and a smaller worker pool is a smaller resource-exhaustion target.\n# See docs/06 §2 and §3.\n#\n# Requires mpm_event (a2dismod mpm_prefork mpm_worker; a2enmod mpm_event).\n# Validate:  sudo apache2ctl -M | grep mpm   ->  mpm_event_module (shared)\n\n<IfModule mpm_event_module>\n    # Threads, not processes: event MPM keeps connections cheap.\n    StartServers             2\n    MinSpareThreads         16\n    MaxSpareThreads         48\n    ThreadsPerChild         16\n    # Hard ceilings: 4 * 16 = 64 concurrent request workers, with 32 kept for TLS/keepalive.\n    ServerLimit             4\n    MaxRequestWorkers       64\n    MaxConnectionsPerChild  1000     # periodic worker recycling: contains slow leaks\n    # Graceful shutdown timing so a reload does not drop connections.\n    GracefulShutdownTimeout 30\n    # Do NOT raise these to \"handle more traffic\" without also raising nftables per-source limits\n    # (docs/05 §2) and checking memory: each worker holds its own buffers.\n<\/IfModule>\n\n# Timeouts that pair with RequestReadTimeout in apache2.conf to blunt slow-client attacks.\nTimeOut 30\n", "lines": 27, "purpose": "Small, bounded worker pool - a smaller resource-exhaustion target, with slow-client timeouts doing the anti-DoS work.", "notes": [{"n": 15, "why": "Bounds how far the worker count can grow, making the ceiling real rather than advisory."}, {"n": 16, "why": "A hard ceiling: 64 concurrent request workers, so a traffic spike cannot consume the machine."}, {"n": 17, "why": "Periodic worker recycling contains slow memory leaks instead of letting them accumulate."}, {"n": 19, "why": "A reload drains connections instead of dropping them - config changes are not an outage."}, {"n": 25, "why": "Ties in with RequestReadTimeout: slow clients are cut off rather than held indefinitely."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/conf-available/security-hardening.conf": {"path": "etc/apache2/conf-available/security-hardening.conf", "content": "# /etc/apache2/conf-available/security-hardening.conf\n# Enabled with:  sudo a2enconf security-hardening   (docs/06 §3)\n# Covers the global \"fail closed and speak little\" rules that the main config does not.\n#\n# Validate:  sudo apache2ctl configtest\n\n# ---------------------------------------------------------------------------\n# Never execute anything, no matter what a filename claims\n# ---------------------------------------------------------------------------\n# The host has no PHP/Perl/Python/CGI handler installed at all (that is the primary control). This\n# rule is the second lock: if an attacker lands a file in the web root, and someone later installs a\n# handler by mistake, this still refuses to serve it through that handler.\n<FilesMatch \"\\.(php|php[0-9]|phtml|phar|phps|pl|py|pyc|rb|cgi|sh|bash|ksh|asp|aspx|jsp|jspx|exe|dll|so|bin|swf|htaccess)$\">\n    Require all denied\n<\/FilesMatch>\n\n# Same idea at the directory level: no AddHandler/SetHandler to sensitive directives.\n<LocationMatch \"^/(cgi-bin|server-status|server-info|\\.git|\\.svn|\\.env|wp-admin|wp-login\\.php)\">\n    Require all denied\n<\/LocationMatch>\n\n# ---------------------------------------------------------------------------\n# Methods: only what a static/API HTTPS server needs\n# ---------------------------------------------------------------------------\n<LimitExcept GET HEAD POST OPTIONS>\n    Require all denied\n<\/LimitExcept>\n\n# TRACK/TRACE cannot be enabled from here (TraceEnable Off is global), and OPTIONS is answered by\n# Apache itself without leaking the method list beyond what is needed.\n\n# ---------------------------------------------------------------------------\n# Do not leak the filesystem layout through error documents\n# ---------------------------------------------------------------------------\nServerSignature Off\n<IfModule mod_negotiation.c>\n    # 406/300 responses can reveal that related files exist. Disable the \"MultiViews\" variant.\n    Options -MultiViews\n<\/IfModule>\n\n# ---------------------------------------------------------------------------\n# Range requests and ETags: keep them simple\n# ---------------------------------------------------------------------------\n# Range requests have historically been used for amplification (byte-range DoS) and for leaking\n# file sizes. Static sites generally want them off unless they serve large media.\n<IfModule mod_headers.c>\n    # Uncomment if you serve no large files:\n    #Header unset Accept-Ranges\n    Header always unset X-Powered-By\n    Header always unset X-AspNet-Version\n    Header always unset Server\n<\/IfModule>\n\n# ---------------------------------------------------------------------------\n# mod_status / mod_info: localhost only, and only if you kept the module\n# ---------------------------------------------------------------------------\n<IfModule mod_status.c>\n    ExtendedStatus Off          # ExtendedStatus leaks request URLs to every worker's status dump\n    <Location /server-status>\n        SetHandler server-status\n        Require ip 127.0.0.1 ::1 10.66.0.1\n    <\/Location>\n<\/IfModule>\n<IfModule mod_info.c>\n    <Location /server-info>\n        SetHandler server-info\n        Require ip 127.0.0.1 ::1 10.66.0.1\n    <\/Location>\n<\/IfModule>\n\n# ---------------------------------------------------------------------------\n# Directory listings: off here as well as in the vhost (defaults matter)\n# ---------------------------------------------------------------------------\n<IfModule mod_autoindex.c>\n    IndexOptions -FancyIndexing -FoldersFirst -IconsAreLinks\n    # Even if mod_autoindex is somehow re-enabled, do not list anything.\n    <Location />\n        Options -Indexes\n    <\/Location>\n<\/IfModule>\n", "lines": 81, "purpose": "Fail-closed behaviour: no handler execution, no directory listings, a closed method set, localhost-only status pages.", "notes": [{"n": 12, "why": "A file called 'evil.php.jpg' or a stray uploaded script is refused, not executed - defence in depth over having no handler at all."}, {"n": 13, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 14, "why": "Requests are refused by pattern, so a stray file type cannot be executed or served."}, {"n": 17, "why": "Never expose CGI, version-control directories, .env files or the WordPress login path."}, {"n": 18, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 19, "why": "Requests are refused by pattern, so a stray file type cannot be executed or served."}, {"n": 24, "why": "A closed method set: PUT, DELETE, CONNECT and friends get a refusal, so a proxy or copy/paste mistake cannot become writable."}, {"n": 25, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 37, "why": "MultiViews guesses filenames, which leaks the existence of related files and forces filesystem walks."}, {"n": 57, "why": "Extended status would show request URLs to anyone who reaches the status page."}, {"n": 60, "why": "server-status and server-info are reachable only from the machine or the admin tunnel."}, {"n": 66, "why": "server-status and server-info are reachable only from the machine or the admin tunnel."}, {"n": 77, "why": "No directory listing, at any level, even if the default changes."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/conf-available/tls-hardening.conf": {"path": "etc/apache2/conf-available/tls-hardening.conf", "content": "# /etc/apache2/conf-available/tls-hardening.conf\n# Global TLS policy: TLS 1.3 only, strong ciphers, post-quantum hybrid key exchange.\n# See docs/06 §4 for the reasoning, the client-compatibility cost, and the OCSP/2026 note.\n#\n# Requires: mod_ssl, OpenSSL 3.5 (Debian 13 trixie). Check with: openssl version\n# Validate:  sudo apache2ctl configtest\n# Verify (off-box):  sslscan <server>:443 ; openssl s_client -connect <server>:443 -tls1_2\n\n# ---------------------------------------------------------------------------\n# Protocol: 1.3 only. This removes CBC/RC4/3DES, renegotiation, weak DH groups,\n# downgrade attacks and RSA key exchange (no forward secrecy) in one line.\n# ---------------------------------------------------------------------------\nSSLProtocol -all +TLSv1.3\n\n# Client-compatibility escape hatch: if you must serve legacy clients, use the *next* line instead\n# and list only AEAD ECDHE suites. Never enable TLS 1.1/1.0.\n#SSLProtocol -all +TLSv1.3 +TLSv1.2\n#SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256\n\n# TLS 1.3 cipher suites (Apache has no directive for these other than SSLOpenSSLConfCmd).\nSSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256\n\n# ---------------------------------------------------------------------------\n# Key exchange: post-quantum hybrid FIRST, then classical curves.\n# X25519MLKEM768 is the ML-KEM-768 + X25519 hybrid from OpenSSL 3.5. \"Harvest now, decrypt later\"\n# is a real threat for long-lived TLS sessions/logs, and this costs nothing measurable.\n# ---------------------------------------------------------------------------\nSSLOpenSSLConfCmd Groups X25519MLKEM768:X25519:P-384:P-256\nSSLOpenSSLConfCmd Curves X25519MLKEM768:X25519:P-384\nSSLOpenSSLConfCmd SignatureAlgorithms ecdsa_secp256r1_sha256:ed25519:ecdsa_secp384r1_sha384:rsa_pss_rsae_sha256\nSSLOpenSSLConfCmd MinProtocol TLSv1.3\nSSLOpenSSLConfCmd Options -SessionTicket,-Compression\n\n# ---------------------------------------------------------------------------\n# Session and renegotiation policy\n# ---------------------------------------------------------------------------\nSSLCompression off\nSSLSessionTickets off        # no ticket keys to rotate or leak; FS comes from the KEX\nSSLHonorCipherOrder off      # no-op for 1.3; kept explicit so audits do not wonder\nSSLOptions +StrictRequire    # a vhost without a certificate refuses to serve instead of failing open\nSSLInsecureRenegotiation off\nSSLRenegBufferSize 131072\n# Client certificates are NOT requested globally; admin vhosts turn them on explicitly (docs/06 §5).\nSSLVerifyClient none\nSSLVerifyDepth 2\n\n# ---------------------------------------------------------------------------\n# OCSP stapling - DISABLED ON PURPOSE (2026)\n# ---------------------------------------------------------------------------\n# Let's Encrypt discontinued its OCSP responders in 2025; stapling a Let's Encrypt certificate now\n# staples nothing. Leave this commented unless your CA still runs OCSP, and if you enable it, watch\n# that the stapling cache does not force extra outbound connections your egress allowlist blocks.\n#SSLUseStapling on\n#SSLStaplingCache shmcb:/run/apache2/stapling(128000)\n#SSLStaplingResponderTimeout 5\n#SSLStaplingReturnResponderErrors off\n#SSLStaplingStandardCacheTimeout 3600\n\n# ---------------------------------------------------------------------------\n# HSTS lives in headers-hardening.conf (it is a header, and it belongs with the other headers).\n# Certificates, keys and per-vhost TLS material live in the vhost files, not here.\n# ---------------------------------------------------------------------------\n", "lines": 63, "purpose": "TLS 1.3 only, AEAD-only suites, post-quantum hybrid key exchange, no session tickets.", "notes": [{"n": 12, "why": "TLS 1.3 only removes CBC/RC4/3DES, renegotiation, weak DH groups, downgrade attacks and RSA key exchange in one line."}, {"n": 20, "why": "AEAD-only suites; the two that matter, with no legacy fallback."}, {"n": 27, "why": "Post-quantum hybrid key exchange first, so traffic recorded today stays confidential later."}, {"n": 28, "why": "Same idea for the curve list, with classical curves as fallback."}, {"n": 29, "why": "Pins modern signatures; no SHA-1 or weak-parameter certificates can be negotiated."}, {"n": 31, "why": "Turns off session tickets and compression at the library level."}, {"n": 36, "why": "Compression before encryption is a CRIME-style oracle against secrets in the stream."}, {"n": 37, "why": "No ticket keys to rotate, leak or abuse; forward secrecy comes from the key exchange instead."}, {"n": 39, "why": "A vhost without a usable certificate refuses to serve rather than falling back to plaintext."}, {"n": 40, "why": "Refuses the legacy renegotiation path that enables prefix-injection attacks."}, {"n": 43, "why": "Client certificates are not requested globally - the admin vhost turns them on deliberately (docs/06 section 5)."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/instances/site1.conf": {"path": "etc/apache2/instances/site1.conf", "content": "# /etc/apache2/instances/site1.conf\n# Configuration for the apache2@site1 instance (docs/06 §7, docs/08).\n#\n# This is a COMPLETE, standalone server configuration: it does not include /etc/apache2/sites-enabled\n# or conf-enabled, because a second instance must not inherit vhosts that belong to the first one.\n# It DOES include the same hardening fragments, deliberately: an instance that is less hardened than\n# the main one is how isolation quietly becomes a downgrade.\n#\n# Validate:  sudo apache2ctl -f /etc/apache2/instances/site1.conf -t\n# Start:     sudo systemctl enable --now apache2@site1\n# Inspect:   sudo systemd-analyze security apache2@site1 | tail -3\n#            sudo ss -tulpn | grep 8443\n\nServerRoot \"/etc/apache2\"\nMutex file:${APACHE_LOCK_DIR} default\nPidFile ${APACHE_PID_FILE}\nDefaultRuntimeDir ${APACHE_RUN_DIR}\n\n# User/Group come from /etc/apache2/instances/site1.envvars (a dedicated unprivileged user).\nUser ${APACHE_RUN_USER}\nGroup ${APACHE_RUN_GROUP}\n\n# --- same exposure discipline as the main instance (docs/06 §3) ------------\nServerTokens Prod\nServerSignature Off\nTraceEnable Off\nHostnameLookups Off\nUseCanonicalName Off\nFileETag None\n\nTimeout 30\nKeepAlive On\nMaxKeepAliveRequests 64\nKeepAliveTimeout 5\nLimitRequestFields 40\nLimitRequestFieldSize 4096\nLimitRequestLine 4096\nLimitRequestBody 1048576\nLimitXMLRequestBody 0\nRequestReadTimeout header=10-20,MinRate=500 body=10-20,MinRate=500\n\n# --- modules: load only what this instance needs ---------------------------\n# mod_proxy is NOT loaded. If you need a front-end proxy, that is a deliberate architectural\n# decision with its own review (docs/06 §7 option 3), not a line you add while debugging.\nLoadModule mpm_event_module          /usr/lib/apache2/modules/mod_mpm_event.so\nLoadModule authn_core_module         /usr/lib/apache2/modules/mod_authn_core.so\nLoadModule authz_core_module         /usr/lib/apache2/modules/mod_authz_core.so\nLoadModule authz_host_module         /usr/lib/apache2/modules/mod_authz_host.so\nLoadModule auth_basic_module         /usr/lib/apache2/modules/mod_auth_basic.so\nLoadModule unixd_module              /usr/lib/apache2/modules/mod_unixd.so\nLoadModule mime_module               /usr/lib/apache2/modules/mod_mime.so\nLoadModule log_config_module         /usr/lib/apache2/modules/mod_log_config.so\nLoadModule setenvif_module           /usr/lib/apache2/modules/mod_setenvif.so\nLoadModule dir_module                /usr/lib/apache2/modules/mod_dir.so\nLoadModule alias_module              /usr/lib/apache2/modules/mod_alias.so\nLoadModule headers_module            /usr/lib/apache2/modules/mod_headers.so\nLoadModule filter_module             /usr/lib/apache2/modules/mod_filter.so\nLoadModule deflate_module            /usr/lib/apache2/modules/mod_deflate.so\nLoadModule reqtimeout_module         /usr/lib/apache2/modules/mod_reqtimeout.so\nLoadModule ssl_module                /usr/lib/apache2/modules/mod_ssl.so\nLoadModule socache_shmcb_module      /usr/lib/apache2/modules/mod_socache_shmcb.so\nLoadModule security2_module          /usr/lib/apache2/modules/mod_security2.so\n#LoadModule http2_module             /usr/lib/apache2/modules/mod_http2.so\n\n# --- shared hardening fragments (same policy as the main instance) ---------\nInclude /etc/apache2/conf-available/security-hardening.conf\nInclude /etc/apache2/conf-available/headers-hardening.conf\nInclude /etc/apache2/conf-available/tls-hardening.conf\nInclude /etc/apache2/conf-available/mpm-tuning.conf\n\n# --- module configuration that the fragments above expect ------------------\nInclude /etc/apache2/mods-available/security2.conf\n<IfModule ssl_module>\n    SSLRandomSeed startup builtin\n    SSLRandomSeed connect builtin\n<\/IfModule>\nTypesConfig /etc/mime.types\nAddDefaultCharset UTF-8\nDirectoryIndex index.html\n\n# --- listen: a HIGH port, on purpose --------------------------------------\n# The instance does not need a privileged port; publishing it publicly is an nftables decision\n# (files/etc/nftables.d/README.md), which keeps the \"who can reach this\" question in one place.\n# 443 stays with the main instance; this one is reachable only if you deliberately map it.\nListen 127.0.0.1:8443\n\nErrorLog  ${APACHE_LOG_DIR}/site1_error.log\nLogLevel  warn\nLogFormat \"%v %h %l %u %t \\\"%r\\\" %>s %b %D \\\"%{User-Agent}i\\\"\" paranoid\nCustomLog ${APACHE_LOG_DIR}/site1_access.log paranoid\n\n<Directory />\n    Options None\n    AllowOverride None\n    Require all denied\n<\/Directory>\n\n<VirtualHost 127.0.0.1:8443>\n    ServerName site1.internal\n    SSLEngine on\n    SSLCertificateFile    /etc/ssl/private/site1.crt\n    SSLCertificateKeyFile /etc/ssl/private/site1.key\n\n    DocumentRoot /srv/site1/public\n    <Directory /srv/site1/public>\n        Options -Indexes -ExecCGI -Includes -MultiViews -FollowSymLinks\n        AllowOverride None\n        Require all granted\n    <\/Directory>\n    <Directory /srv/site1/data>\n        Require all denied\n    <\/Directory>\n    <LocationMatch \"^/(cgi-bin|server-status|server-info|\\..*)\">\n        Require all denied\n    <\/LocationMatch>\n    ErrorDocument 404 /error/404.html\n<\/VirtualHost>\n", "lines": 118, "purpose": "A fully independent second instance - own user, own config, own ports, same hardening, so a bug in one site cannot read another.", "notes": [{"n": 44, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 45, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 46, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 47, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 48, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 49, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 50, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 51, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 52, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 53, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 54, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 55, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 56, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 57, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 58, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 59, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 60, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 61, "why": "Only the modules this instance needs - mod_proxy is deliberately absent, so no vhost here can become an open proxy."}, {"n": 65, "why": "The second instance gets the same hardening fragments: an instance that is less hardened turns isolation into a downgrade."}, {"n": 66, "why": "The second instance gets the same hardening fragments: an instance that is less hardened turns isolation into a downgrade."}, {"n": 67, "why": "The second instance gets the same hardening fragments: an instance that is less hardened turns isolation into a downgrade."}, {"n": 68, "why": "The second instance gets the same hardening fragments: an instance that is less hardened turns isolation into a downgrade."}, {"n": 84, "why": "A high port on loopback: publishing it publicly becomes an explicit nftables decision, in one place."}, {"n": 93, "why": "Forbids .htaccess: a writable configuration file inside the web root is a privilege-escalation path."}, {"n": 94, "why": "Same default-deny root as the first instance."}, {"n": 101, "why": "The private key is read by the root master process only; the www-data children never see it."}, {"n": 105, "why": "No directory listings to reveal the structure of your filesystem."}, {"n": 106, "why": "Forbids .htaccess: a writable configuration file inside the web root is a privilege-escalation path."}, {"n": 107, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 110, "why": "Same default-deny root as the first instance."}, {"n": 112, "why": "Requests are refused by pattern, so a stray file type cannot be executed or served."}, {"n": 113, "why": "Same default-deny root as the first instance."}, {"n": 114, "why": "Requests are refused by pattern, so a stray file type cannot be executed or served."}, {"n": 115, "why": "Generic error pages: nothing that reveals paths, versions or stack traces."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/instances/site1.envvars": {"path": "etc/apache2/instances/site1.envvars", "content": "# /etc/apache2/instances/site1.envvars   (mode 0640 root:root)\n# Environment for the apache2@site1 instance. See files/etc/systemd/system/apache2@.service.\n# The critical lines are the unprivileged user/group and the private pid dir: each instance must\n# run under its OWN user, or the isolation in docs/06 §7 is fiction.\n\nexport APACHE_RUN_USER=site1\nexport APACHE_RUN_GROUP=site1\n\nexport APACHE_PID_FILE=/run/apache2-site1/apache2.pid\nexport APACHE_RUN_DIR=/run/apache2-site1\nexport APACHE_LOCK_DIR=/var/lock/apache2-site1\nexport APACHE_LOG_DIR=/var/log/apache2-site1\nexport APACHE_CACHE_DIR=/var/cache/apache2-site1\n\n# Never propagate environment into the server: mod_cgi/env leakage is a classic.\nexport APACHE_ARGUMENTS='-D NO_DETACH'\n\n# Locale: keep minimal and deterministic.\nexport LANG=C\nexport LC_ALL=C\n", "lines": 21, "purpose": "Per-instance runtime identity: its own unprivileged user, pid, lock and log directories.", "notes": [{"n": 5, "why": "Its own unprivileged identity: a bug in one site cannot read the other's files."}, {"n": 6, "why": "Its own unprivileged identity: a bug in one site cannot read the other's files."}, {"n": 8, "why": "Its own runtime directories, matching the unit's ReadWritePaths sandbox."}, {"n": 9, "why": "Its own runtime directories, matching the unit's ReadWritePaths sandbox."}, {"n": 10, "why": "Its own runtime directories, matching the unit's ReadWritePaths sandbox."}, {"n": 15, "why": "Explicit startup arguments rather than environment inheritance."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/mods-available/security2.conf": {"path": "etc/apache2/mods-available/security2.conf", "content": "# /etc/apache2/mods-available/security2.conf\n# mod_security3 wiring. Enabled by a2enmod security2 (harden-apache.sh does it).\n# See docs/06 §8.\n#\n# Validate:  sudo apache2ctl configtest\n# Tune:      read /var/log/apache2/modsec_audit.log for 24-48h, then narrow the rules you exclude.\n\n<IfModule security2_module>\n    # --- engine mode ---\n    # 'On' is the destination. Start at 'DetectionOnly' for your first tuning pass ONLY, then switch.\n    SecRuleEngine On\n\n    # --- request handling ---\n    SecRequestBodyAccess On\n    SecRequestBodyLimit 131072              # 128 KiB: matches the LimitRequestBody intent\n    SecRequestBodyNoFilesLimit 131072\n    SecRequestBodyInMemoryLimit 131072\n    SecRequestBodyLimitAction Reject        # do not just log an oversized body\n    SecResponseBodyAccess Off               # response inspection is expensive, rarely pays off here\n    #SecResponseBodyLimit 524288\n    #SecResponseBodyMimeType text/plain text/html\n\n    # --- ReDoS protection (PCRE limits) ---\n    SecPcreMatchLimit 100000\n    SecPcreMatchLimitRecursion 100000\n    SecDebugLogLevel 0                      # NEVER debug-log request bodies on a public server\n    SecDebugLog /var/log/apache2/modsec_debug.log\n\n    # --- audit logging ---\n    SecAuditEngine RelevantOnly\n    SecAuditLogRelevantStatus \"^(?:5|4(?!04))\"   # 5xx and 4xx except 404 (404 floods are noise)\n    # Parts: A=audit header, B=request headers, I=request body (intervention only), F=response\n    # headers, H=audit trailer, Z=final boundary. Deliberately NO 'C'/'E' (full body content).\n    SecAuditLogParts ABIFHZ\n    SecAuditLogType Serial\n    SecAuditLog /var/log/apache2/modsec_audit.log\n    SecAuditLogStorageDir /var/log/apache2/audit\n\n    # --- temporary/upload dirs: inside the unit's PrivateTmp-visible paths, root-only ---\n    SecDataDir /var/cache/apache2/mod_security2\n    SecTmpDir /var/cache/apache2/mod_security2\n    SecUploadDir /var/cache/apache2/mod_security2\n    SecUploadKeepFiles Off                  # never retain uploaded files\n\n    # --- default action: deny and log, do not pass the request through ---\n    SecDefaultAction \"phase:1,log,auditlog,deny,status:403\"\n    SecDefaultAction \"phase:2,log,auditlog,deny,status:403\"\n\n    # --- rule sources ---\n    IncludeOptional /etc/modsecurity/modsecurity.conf\n    IncludeOptional /usr/share/modsecurity-crs/*.load\n    IncludeOptional /etc/modsecurity/crs/*.conf\n<\/IfModule>\n", "lines": 54, "purpose": "mod_security3 wiring: request inspection on, request bodies capped, no response bodies, audit log that never stores credentials.", "notes": [{"n": 10, "why": "Enforcement, not observation: detected attacks are blocked, not merely logged."}, {"n": 13, "why": "The engine can see the body, which is where most application attacks live."}, {"n": 14, "why": "A hard ceiling on inspected body size - and the body is rejected, not silently truncated."}, {"n": 15, "why": "A hard ceiling on inspected body size - and the body is rejected, not silently truncated."}, {"n": 17, "why": "Refuses oversized bodies instead of passing them through un-inspected."}, {"n": 18, "why": "Response inspection is expensive and rarely pays off here; keeping it off preserves capacity for actual defence."}, {"n": 23, "why": "Regex limits protect the WAF itself from ReDoS - a WAF that hangs is a WAF that stops defending."}, {"n": 24, "why": "Regex limits protect the WAF itself from ReDoS - a WAF that hangs is a WAF that stops defending."}, {"n": 25, "why": "Debug logging on a public server would record request data you do not want on disk."}, {"n": 29, "why": "Logs 5xx and 4xx-except-404: signal without the 404 noise that attackers love to generate."}, {"n": 30, "why": "Logs 5xx and 4xx-except-404: signal without the 404 noise that attackers love to generate."}, {"n": 33, "why": "Deliberately excludes full request bodies from the audit log, so credentials posted to your app are not written to disk."}, {"n": 39, "why": "Temporary state lives in the unit's own sandboxed directory, not in a shared /tmp."}, {"n": 40, "why": "Temporary state lives in the unit's own sandboxed directory, not in a shared /tmp."}, {"n": 41, "why": "Temporary state lives in the unit's own sandboxed directory, not in a shared /tmp."}, {"n": 42, "why": "Uploaded content is discarded after inspection - it is not a file store."}, {"n": 45, "why": "Anything that triggers gets a 403 by default, rather than passing through with a note."}, {"n": 46, "why": "Anything that triggers gets a 403 by default, rather than passing through with a note."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/ports.conf": {"path": "etc/apache2/ports.conf", "content": "# /etc/apache2/ports.conf\n# Only 443 is open. See docs/06 §3 and docs/05 §2.\n\n# The nftables ruleset (files/etc/nftables.conf) only allows 443 through; listening here is belt\n# and braces so that a future config mistake cannot expose a plaintext port.\nListen 443\n\n<IfModule ssl_module>\n    # Nothing extra: TLS is configured per-vhost / in conf-available/tls-hardening.conf.\n<\/IfModule>\n\n# ---------------------------------------------------------------------------\n# Port 80: NEEDED ONLY FOR HTTP-01 ACME VALIDATION.\n# docs/06 §4 recommends DNS-01, which needs no inbound port at all. If you use DNS-01, leave this\n# commented AND remove the port-80 rules from /etc/nftables.conf. A closed port 80 is strictly\n# better: less attack surface, no plaintext redirect logic, one fewer vhost to get wrong.\n# ---------------------------------------------------------------------------\n#Listen 80\n#\n# If you do need it, keep the vhost to exactly one job: redirect to HTTPS, and serve\n# /.well-known/acme-challenge/ from a dedicated directory. No content, no app, no headers.\n", "lines": 22, "purpose": "One listening port, HTTPS only - a plaintext port is a redirect you do not need if you validate ACME over DNS.", "notes": [{"n": 5, "why": "One listening port, TLS only. Fewer ports is fewer parsers reachable from the internet."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/sites-available/000-default.conf": {"path": "etc/apache2/sites-available/000-default.conf", "content": "# /etc/apache2/sites-available/000-default.conf\n# The DEFAULT vhost. What it does here is important: it serves NOTHING.\n#\n# Rationale (docs/06 §3): any request that does not match a real VirtualHost - by Host: header, by\n# IP, or by TLS SNI fallback - lands here. If this vhost had content, that content would be reachable\n# by every wrong-hostname scan on the internet, under a certificate name that does not match, which\n# is both an information leak and a phishing surface.\n#\n# A minimal, generic 404 with no server identification is the correct behaviour.\n\n<VirtualHost *:443>\n    ServerName default.invalid\n    # No certificate is configured here on purpose: with SSLOptions +StrictRequire (tls-hardening.conf)\n    # Apache will refuse to serve rather than fail open. Browsers reaching the default vhost get a\n    # TLS failure - which is exactly right, because they are not asking for a site we host.\n\n    DocumentRoot /var/www/default\n    <Directory /var/www/default>\n        Options None\n        AllowOverride None\n        Require all denied\n    <\/Directory>\n\n    # Generic, static error page: no version, no paths, no stack traces.\n    ErrorDocument 400 /error/400.html\n    ErrorDocument 403 /error/403.html\n    ErrorDocument 404 /error/404.html\n    ErrorDocument 500 /error/500.html\n\n    ErrorLog ${APACHE_LOG_DIR}/default_error.log\n    LogLevel warn\n    CustomLog ${APACHE_LOG_DIR}/default_access.log paranoid\n<\/VirtualHost>\n\n# NOTE: no port-80 vhost. If you use HTTP-01 ACME instead of DNS-01, you need one - but it must do\n# exactly two things: answer /.well-known/acme-challenge/ and redirect everything else to HTTPS.\n# docs/06 §4 explains why DNS-01 (and therefore no port 80 at all) is the better choice here.\n", "lines": 38, "purpose": "The catch-all vhost serves nothing: any request that misses a real site gets a refusal, not content.", "notes": [{"n": 11, "why": "A name that cannot resolve, so it can never accidentally match a real site."}, {"n": 19, "why": "Forbids .htaccess: a writable configuration file inside the web root is a privilege-escalation path."}, {"n": 20, "why": "The catch-all vhost serves nothing, so wrong-hostname scans get a refusal instead of content under a mismatched certificate."}, {"n": 24, "why": "Generic static error pages: no version, no paths, no stack traces."}, {"n": 25, "why": "Generic static error pages: no version, no paths, no stack traces."}, {"n": 26, "why": "Generic static error pages: no version, no paths, no stack traces."}, {"n": 27, "why": "Generic static error pages: no version, no paths, no stack traces."}, {"n": 30, "why": "Quiet enough not to fill a disk, verbose enough to investigate."}], "annPrefix": "#", "isDoc": false}, "etc/apache2/sites-available/example-hardened.conf": {"path": "etc/apache2/sites-available/example-hardened.conf", "content": "# /etc/apache2/sites-available/example-hardened.conf\n# TEMPLATE for a real site. Copy to <yoursite>.conf, replace example.com, then:\n#   sudo a2ensite <yoursite>.conf\n#   sudo apache2ctl configtest && sudo systemctl reload apache2\n#\n# Every line is here for a reason; read docs/06 before deleting any of them.\n\n<VirtualHost *:443>\n    ServerName example.com\n    ServerAlias www.example.com\n    ServerAdmin hostmaster@example.com      # used only in error documents; keep it generic\n\n    # --- TLS ---------------------------------------------------------------------------------\n    SSLEngine on\n    SSLCertificateFile      /etc/letsencrypt/live/example.com/fullchain.pem\n    SSLCertificateKeyFile   /etc/letsencrypt/live/example.com/privkey.pem\n    # Protocol/ciphers come from conf-available/tls-hardening.conf (global). Do not override here\n    # unless you have a specific, documented reason - two places to be wrong is one too many.\n    # HTTP/2 (needs mod_http2; keep it only if you accept its own CVE stream):\n    Protocols h2 http/1.1\n\n    # --- isolation: this site's own directories, nothing above them ---------------------------\n    DocumentRoot /srv/example.com/public\n    <Directory /srv/example.com/public>\n        Options -Indexes -ExecCGI -Includes -MultiViews -FollowSymLinks\n        AllowOverride None                  # .htaccess forbidden globally too; this is the second lock\n        Require all granted\n        # No symlinks out of the webroot: a symlink is an escape primitive.\n        # (FollowSymLinks is off in Options above; this documents the intent.)\n    <\/Directory>\n\n    # Application data that must NOT be servable, even by accident.\n    <Directory /srv/example.com/data>\n        Require all denied\n    <\/Directory>\n\n    # --- what this vhost will parse ------------------------------------------------------------\n    # Explicitly no handlers: if a file has one of these extensions it is refused, not executed.\n    <FilesMatch \"\\.(php|phtml|phar|pl|py|rb|cgi|sh|jsp|asp|aspx)$\">\n        Require all denied\n    <\/FilesMatch>\n\n    # --- methods ------------------------------------------------------------------------------\n    <LimitExcept GET HEAD POST>\n        Require all denied\n    <\/LimitExcept>\n\n    # --- uploads (only if you actually accept them) -------------------------------------------\n    # Keep the global 1 MiB body limit unless you need more; if you raise it, raise it HERE only,\n    # and make the upload directory non-executable and outside the document root.\n    #LimitRequestBody 5242880\n    #<Location /uploads>\n    #    Require all granted\n    #    Header always set Content-Disposition \"attachment\"\n    #    # Serve uploads from a separate vhost/domain so that a stored XSS cannot touch your origin,\n    #    # or better: store them outside the webroot and stream them through your application.\n    #<\/Location>\n\n    # --- application entry point (tighten to your exact routes) -------------------------------\n    # A fail-closed default with explicit allowances is far better than a default-open app.\n    #<Location />\n    #    Require all denied\n    #<\/Location>\n    #<Location /api/v1/>\n    #    Require all granted\n    #<\/Location>\n\n    # --- error documents: static, generic, no version information -----------------------------\n    ErrorDocument 400 /error/400.html\n    ErrorDocument 403 /error/403.html\n    ErrorDocument 404 /error/404.html\n    ErrorDocument 405 /error/405.html\n    ErrorDocument 500 /error/500.html\n    # Make sure the error pages cannot themselves be replaced by a request path.\n    <Location /error/>\n        Require all granted\n    <\/Location>\n\n    # --- logging ------------------------------------------------------------------------------\n    ErrorLog  ${APACHE_LOG_DIR}/example.com_error.log\n    LogLevel  warn\n    CustomLog ${APACHE_LOG_DIR}/example.com_access.log paranoid\n    # Tier 2 alternative: pipe to journald (docs/06 §9) so events land in a sealed, shippable store:\n    #CustomLog \"|/usr/bin/logger -t apache_example -p local6.info\" paranoid\n\n    # --- per-vhost request limits -------------------------------------------------------------\n    # Belt and braces with nftables (docs/05 §2): bound this vhost's own concurrency.\n    <IfModule mod_reqtimeout.c>\n        RequestReadTimeout header=10-20,MinRate=500 body=10-20,MinRate=500\n    <\/IfModule>\n<\/VirtualHost>\n", "lines": 92, "purpose": "A production vhost template with the same fail-closed defaults, ready to copy.", "notes": [{"n": 15, "why": "The private key is read by the root master process only; the www-data children never see it."}, {"n": 19, "why": "HTTP/2 over TLS 1.3, with HTTP/1.1 kept as an explicit fallback rather than an implicit one."}, {"n": 24, "why": "No listing, no execution, no includes, no filename guessing and no symlink escape from the document root."}, {"n": 25, "why": "Second lock on .htaccess, at the vhost level."}, {"n": 26, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 32, "why": "Application data is denied outright, which is how 'the web server served our database file' stops happening."}, {"n": 33, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 38, "why": "Refused rather than executed, regardless of what is installed later."}, {"n": 39, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 40, "why": "Requests are refused by pattern, so a stray file type cannot be executed or served."}, {"n": 44, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 68, "why": "Generic error pages: nothing that reveals paths, versions or stack traces."}, {"n": 69, "why": "Generic error pages: nothing that reveals paths, versions or stack traces."}, {"n": 70, "why": "Generic error pages: nothing that reveals paths, versions or stack traces."}, {"n": 71, "why": "Generic error pages: nothing that reveals paths, versions or stack traces."}, {"n": 72, "why": "Generic error pages: nothing that reveals paths, versions or stack traces."}, {"n": 75, "why": "Every access decision is explicit; there is no implicit 'allow' anywhere in this configuration."}, {"n": 81, "why": "Full investigation detail on this vhost, piped to the sealed journal."}, {"n": 88, "why": "Per-vhost slow-client limits, agreeing with the global ones."}], "annPrefix": "#", "isDoc": false}, "etc/apparmor.d/local/usr.sbin.apache2": {"path": "etc/apparmor.d/local/usr.sbin.apache2", "content": "# /etc/apparmor.d/local/usr.sbin.apache2\n# Added to Debian's shipped /etc/apparmor.d/usr.sbin.apache2 profile via its 'local/' include, so\n# package upgrades do not fight your changes.\n#\n# Philosophy: Debian's stock Apache profile is already good (it denies most of the filesystem). This\n# file TIGHTENS it for our layout and ADDS the denies that matter for a web server. Everything here\n# is a deny or a narrowly scoped allowance - never a blanket '/** rw'.\n#\n# Reload:  sudo apparmor_parser -r /etc/apparmor.d/usr.sbin.apache2\n# Check:   sudo aa-status --verbose | sed -n '/apache2/,+6p'\n\n# --- the web content this server is allowed to read ---\n/var/www/** r,\n/srv/** r,\n\n# --- denied, explicitly, even if the base profile would allow it -------------------------\n# Private keys beyond the certificate Apache must serve... actually Apache's master reads\n# /etc/letsencrypt/live/*/privkey.pem; keep that. Deny the ACME account keys and archives.\ndeny /etc/letsencrypt/accounts/** rwkl,\ndeny /etc/letsencrypt/archive/** w,\ndeny /etc/ssl/private/*.key w,\ndeny /root/** rwkl,\ndeny /home/** rwkl,\ndeny /etc/shadow r,\ndeny /etc/gshadow r,\ndeny /etc/sudoers r,\ndeny /etc/ssh/** rwkl,\ndeny /etc/wireguard/** rwkl,\ndeny /etc/nftables.conf rwkl,\ndeny /var/lib/aide/** rwkl,\ndeny /var/log/audit/** rwkl,\ndeny /proc/sys/** w,\ndeny /sys/** w,\ndeny /boot/** w,\ndeny /etc/systemd/** w,\ndeny /usr/lib/systemd/system/** w,\ndeny /usr/** w,\n\n# --- no shells, no interpreters, no compilers from the web process ------------------------\ndeny /bin/*sh ix,\ndeny /usr/bin/*sh ix,\ndeny /bin/dash ix,\ndeny /usr/bin/python3* ix,\ndeny /usr/bin/perl* ix,\ndeny /usr/bin/php* ix,\ndeny /usr/bin/node* ix,\ndeny /usr/bin/gcc* ix,\ndeny /usr/bin/cc ix,\ndeny /usr/bin/make ix,\n\n# --- capabilities: none needed beyond binding the port (Apache drops to www-data) ---------\ndeny capability sys_admin,\ndeny capability sys_module,\ndeny capability sys_ptrace,\ndeny capability sys_rawio,\ndeny capability dac_read_search,\ndeny capability net_raw,\ndeny capability bpf,\ndeny capability perfmon,\ndeny capability sys_chroot,\ndeny capability mknod,\n\n# --- network: outbound is filtered by nftables, but keep AppArmor honest too --------------\ndeny network raw,\ndeny network packet,\ndeny network netlink,\n\n# Notes on what is NOT denied on purpose:\n#  * /var/log/apache2/** w  -> Debian's profile grants it; required for logging.\n#  * /run/apache2/** rw      -> the pid/socket directory.\n#  * /etc/ssl/certs/** r      -> CA bundle for outbound TLS (ACME/OCSP if you use them).\n", "lines": 72, "purpose": "Mandatory access control for Apache: explicit denials for keys, shells, interpreters and raw capabilities.", "notes": [{"n": 18, "why": "ACME account credentials have nothing to do with serving traffic; the web process cannot reach them."}, {"n": 21, "why": "The document root is not the only thing a web process can reach - unless you say otherwise."}, {"n": 22, "why": "The document root is not the only thing a web process can reach - unless you say otherwise."}, {"n": 23, "why": "Blocks the classic 'read the hashes after RCE' step even if the process somehow had the privileges."}, {"n": 26, "why": "No path from a web compromise to persistent remote access through your own keys."}, {"n": 27, "why": "No path from a web compromise to persistent remote access through your own keys."}, {"n": 28, "why": "An attacker who cannot rewrite the firewall cannot open their own egress door."}, {"n": 29, "why": "The evidence and the integrity baseline are not writable by the service being watched."}, {"n": 30, "why": "The evidence and the integrity baseline are not writable by the service being watched."}, {"n": 31, "why": "No kernel-tuning writes from the web process."}, {"n": 32, "why": "No kernel-tuning writes from the web process."}, {"n": 33, "why": "No persistence: cannot stage a kernel or install a unit."}, {"n": 34, "why": "No persistence: cannot stage a kernel or install a unit."}, {"n": 36, "why": "System binaries and libraries stay read-only."}, {"n": 39, "why": "No shell - the single most effective thing after disabling uploads."}, {"n": 40, "why": "No shell - the single most effective thing after disabling uploads."}, {"n": 42, "why": "No interpreter: a one-line webshell cannot become a general-purpose tool."}, {"n": 43, "why": "No interpreter: a one-line webshell cannot become a general-purpose tool."}, {"n": 44, "why": "No interpreter: a one-line webshell cannot become a general-purpose tool."}, {"n": 45, "why": "No interpreter: a one-line webshell cannot become a general-purpose tool."}, {"n": 46, "why": "No compiler, so a dropped source cannot be built into a working exploit."}, {"n": 47, "why": "No compiler, so a dropped source cannot be built into a working exploit."}, {"n": 48, "why": "No compiler, so a dropped source cannot be built into a working exploit."}, {"n": 51, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 52, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 53, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 54, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 55, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 56, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 57, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 58, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 59, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 60, "why": "Drops the kernel capabilities that turn a web-process bug into a host-level one."}, {"n": 63, "why": "No raw sockets, no packet capture, no kernel netlink interface."}, {"n": 64, "why": "No raw sockets, no packet capture, no kernel netlink interface."}, {"n": 65, "why": "No raw sockets, no packet capture, no kernel netlink interface."}], "annPrefix": "#", "isDoc": false}, "etc/apparmor.d/tunables/paranoid-home.d/99-paranoid": {"path": "etc/apparmor.d/tunables/paranoid-home.d/99-paranoid", "content": "# /etc/apparmor.d/tunables/paranoid-home.d/99-paranoid\n#\n# AppArmor 'tunables' are variables that profiles use. The stock @{HOME} tunable expands to the home\n# directories of *all* users on the system, which means a profile written as \"@{HOME}/** r\" silently\n# grants access to every user's home - usually not what the author intended, and it changes as users\n# come and go.\n#\n# This file pins the value and keeps it deliberately empty for confined services on a server:\n# a headless system service has no business reading anybody's home directory. Profiles that\n# genuinely need a home (interactive logins, if you ever add one) should opt in explicitly.\n#\n# Reload after editing:  sudo apparmor_parser -r /etc/apparmor.d/tunables/ \\\n#                        sudo systemctl reload apparmor\n# Verify the effective value:  sudo apparmor_parser -p -d /etc/apparmor.d/usr.sbin.apache2 | grep HOME\n\n# No home directories for services. Do not replace this with @{HOMEDIRS}: on this machine the web\n# user is www-data with /var/www as its (unused) home, and the admin user's home is irrelevant to\n# every confined daemon here.\n@{HOME}=\n\n# If you ever need a specific service home, define it narrowly instead of re-enabling all homes, e.g.\n#   @{HOME_SITE1}=/srv/site1\n# and grant that in the site's own profile only.\n", "lines": 24, "purpose": "Stops AppArmor profiles from silently granting access to every user's home directory.", "notes": [{"n": 18, "why": "Pins the tunable to empty: a profile cannot silently inherit access to every user's home directory."}], "annPrefix": "#", "isDoc": false}, "etc/apt/apt.conf.d/20auto-upgrades": {"path": "etc/apt/apt.conf.d/20auto-upgrades", "content": "// /etc/apt/apt.conf.d/20auto-upgrades\n// Enables the periodic apt timers. The security policy itself lives in 50unattended-upgrades.\nAPT::Periodic::Enable \"1\";\nAPT::Periodic::Update-Package-Lists \"1\";\nAPT::Periodic::Download-Upgradeable-Packages \"1\";\nAPT::Periodic::Unattended-Upgrade \"1\";\nAPT::Periodic::AutocleanInterval \"7\";\nAPT::Periodic::Verbose \"1\";\n", "lines": 9, "purpose": "", "notes": [{"n": 3, "why": "The index is refreshed, so you are not deciding based on yesterday's vulnerability data."}, {"n": 5, "why": "Security updates apply themselves; the policy of what may be applied lives in 50unattended-upgrades."}, {"n": 6, "why": "Old package files do not accumulate in the cache."}], "annPrefix": "//", "isDoc": false}, "etc/apt/apt.conf.d/50unattended-upgrades": {"path": "etc/apt/apt.conf.d/50unattended-upgrades", "content": "// /etc/apt/apt.conf.d/50unattended-upgrades\n// SECURITY UPDATES ONLY. Everything else is a deliberate, attended decision (docs/10 §3).\n// Check with: sudo unattended-upgrade --dry-run -d | tail -20\n\nUnattended-Upgrade::Allowed-Origins {\n        \"${distro_id}:${distro_codename}-security\";\n        \"${distro_id}ESMApps:${distro_codename}-apps-security\";\n        \"${distro_id}ESM:${distro_codename}-infra-security\";\n};\n\n// Nothing from stable-updates, backports, or a third-party repo: those are not \"urgent by nature\".\nUnattended-Upgrade::Package-Blacklist {\n        // Anything that needs a human decision:\n        \"linux-image-amd64\";\n        \"apache2\";\n        \"modsecurity-crs\";\n        \"libapache2-mod-security2\";\n        \"nftables\";\n        \"openssh-server\";\n        \"systemd\";\n        \
