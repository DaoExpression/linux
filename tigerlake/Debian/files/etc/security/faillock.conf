# /etc/security/faillock.conf
# Lockout policy enforced by pam_faillock (see docs/04 §1 for the PAM wiring).
# Kept deliberately non-permanent so a fat-fingered admin is not locked out of their own server
# permanently; root_unlock_time is short because root is already password-locked.

deny = 5
fail_interval = 900
unlock_time = 900
root_unlock_time = 60
silent
audit
dir = /var/run/faillock
