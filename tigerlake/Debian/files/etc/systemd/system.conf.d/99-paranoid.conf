# /etc/systemd/system.conf.d/99-paranoid.conf
# Manager-level defaults. Reload: systemctl daemon-reexec
# See docs/04 §10 and docs/07 §7 (watchdog).

[Manager]
DumpCore=no
CrashShell=no
CtrlAltDelBurstAction=none      # an attached keyboard cannot reboot the machine by mashing keys
ShowStatus=yes
DefaultTimeoutStartSec=60s
DefaultTimeoutStopSec=20s
DefaultRestartSec=2s
DefaultTasksMax=512             # per-unit ceiling; a runaway service cannot fork-bomb the box
UnitPath=/etc/systemd/system /run/systemd/system /usr/local/lib/systemd/system /usr/lib/systemd/system

# Hardware watchdog: enable ONLY if your platform supports it reliably (spurious resets on
# unsupported hardware are a self-inflicted outage). A watchdog gives you "server recovers from a
# kernel hang" - at the cost of rebooting without your passphrase being entered. Since this machine
# requires an interactive LUKS passphrase to boot, a watchdog reboot can leave it sitting at the
# initramfs prompt. That is a deliberate trade-off; see docs/10 §6.
#RuntimeWatchdogSec=20
#RebootWatchdogSec=5min
