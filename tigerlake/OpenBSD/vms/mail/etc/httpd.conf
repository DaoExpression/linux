#	/etc/httpd.conf — mail guest
#
#	This is not a web server.  It exists so that acme-client(1) can answer an
#	HTTP-01 challenge for mail.lab.example.org from the host that holds the
#	private key, and it serves exactly one directory:
#
#	    /.well-known/acme-challenge/<token>  ->  /var/www/acme/<token>
#
#	Everything else returns 404, there is no index, and nothing under
#	/var/www/htdocs is referenced at all — so a mistake here cannot publish a
#	file that was not meant to be public.
#
#	Validate:  httpd -n
#	Enable:    rcctl enable httpd ; rcctl start httpd
#	Test:      printf 'test\n' > /var/www/acme/xyz
#	           curl -i http://10.10.40.21/.well-known/acme-challenge/xyz
#
#	Wiring: the gateway's pf.conf redirects only 25/465/587/993/995 to this
#	guest, so port 80 is *not* reachable from the internet yet.  See the note
#	in acme-client.conf in this tree: the gateway's relayd(8) has to forward
#	the challenge for this hostname here, and the matching inbound rule is in
#	this tree's pf.conf.

chroot "/var/www"

server "acme-mail" {
	listen on 10.10.40.21 port 80
	root "/acme"

	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}

	# Anything that is not a challenge is refused, including the root of the
	# chroot: there is no reason for this port to exist for any other request.
	location "*" {
		block return 404
	}

	log style combined
}

# ------------------------------------------------------------------ notes
# * If the certificate is issued by TLS-ALPN-01 instead (relayd on the gateway
#   presenting the challenge), this file can be removed entirely and the
#   challenge line in acme-client.conf changed to match — see
#   acme-client.conf(5) for the tls-alpn form.
# * /var/www/acme must be writable by the user acme-client runs as (root) and
#   readable by www inside the chroot.  acme-client sets the permissions it
#   needs; check them after the first run with:
#       ls -la /var/www/acme /var/www/acme/.well-known/acme-challenge
