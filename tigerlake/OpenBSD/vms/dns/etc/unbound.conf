#	/etc/unbound.conf — dns guest
#
#	Install with:  pkg_add unbound
#	Validate:      unbound-checkconf
#	Apply:         rcctl restart unbound
#	Test:          dig @10.10.50.11 www.lab.example.org
#	               dig @10.10.50.11 +dnssec cloudflare.com
#
#	Why unbound and not the base-system unwind(8): unwind binds 127.0.0.1 and
#	::1 only and cannot be told to answer on a LAN address, so it cannot serve
#	clients.  unbound can, and it does split horizon — recursion for the world,
#	a stub zone for lab.example.org pointing at the gateway's nsd(8).
#
#	Split horizon is the whole point of this guest: clients must never be able
#	to resolve the lab domain through a public resolver, and they must never
#	see stale public answers for names that only exist inside.

server:
	# --- identity -------------------------------------------------------------
	verbosity: 1
	hide-version: yes
	hide-identity: yes
	identity: "unbound.lab.example.org"
	version: "unknown"

	# --- interfaces -----------------------------------------------------------
	# The guest's own addresses.  Not 127.0.0.1: that would collide with
	# unwind(8), which this guest keeps for its own local lookups.
	interface: 10.10.50.11
	interface: fd00:10:10:50::11
	do-ip4: yes
	do-ip6: yes
	do-udp: yes
	do-tcp: yes
	port: 53

	# --- access control -------------------------------------------------------
	# The lab, and only the lab.  Without these lines unbound refuses by
	# default, which is the right failure mode: a misconfigured ACL here
	# breaks resolution instead of creating an open resolver.
	access-control: 10.10.10.0/24 allow
	access-control: 10.10.20.0/24 allow
	access-control: 10.10.30.0/24 allow
	access-control: 10.10.40.0/24 allow
	access-control: 10.10.50.0/24 allow
	access-control: 10.10.60.0/24 allow
	access-control: fd00:10:10::/48 allow
	access-control: 127.0.0.0/8 allow
	# Everything else is refused and logged; tune the log in the remote-control
	# section if it gets noisy.
	access-control: 0.0.0.0/0 refuse
	access-control: ::0/0 refuse

	# --- hardening ------------------------------------------------------------
	# Answer only what you are asked, and nothing clever.
	qname-minimisation: yes
	do-not-query-localhost: yes
	prefetch: yes
	prefetch-key: yes
	rrset-roundrobin: yes
	# No glue for dangling delegations, no empty-answer padding games.
	minimal-responses: yes
	aggressive-nsec: yes
	# Serve stale data during an upstream outage instead of failing: a lab
	# that cannot resolve anything is worse than a lab with 10-minute-old TTLs.
	serve-expired: yes
	serve-expired-ttl: 600

	# --- cache ----------------------------------------------------------------
	msg-cache-size: 64m
	rrset-cache-size: 128m
	key-cache-size: 32m
	neg-cache-size: 8m
	cache-min-ttl: 60

	# --- privacy --------------------------------------------------------------
	# No query logging by default.  Turn it on deliberately and briefly:
	#    log-queries: yes
	# and remember it writes every client's lookups to the log that is shipped
	# to the gateway's central syslog.
	log-queries: no

	# --- DNSSEC ---------------------------------------------------------------
	# unbound knows the root trust anchor from its built-in copy; auto-trust-anchor-file
	# makes it self-updating, which is one fewer manual step per year.
	auto-trust-anchor-file: "/var/unbound/db/root.key"
	val-clean-additional: yes
	val-permissive-mode: no
	# Trust the lab's own zone: it is signed by nobody, and it must not be
	# rejected by validation.  See the stub zone below.

remote-control:
	control-enable: yes
	control-interface: 127.0.0.1
	control-port: 8953
	server-key-file: "/var/unbound/etc/unbound_server.key"
	server-cert-file: "/var/unbound/etc/unbound_server.pem"
	control-key-file: "/var/unbound/etc/unbound_control.key"
	control-cert-file: "/var/unbound/etc/unbound_control.pem"
	# Generate these once with:  unbound-control-setup

# --- the lab zone --------------------------------------------------------------
# A stub zone: ask the gateway's nsd(8) and do not validate the answer, because
# the zone is unsigned (signing a private zone means running your own DNSSEC
# tooling for very little benefit — clients that validate would need the
# private ZSK as a trust anchor anyway).
stub-zone:
	name: "lab.example.org"
	stub-addr: 10.10.50.1
	stub-addr: 10.10.10.1
	stub-addr: fd00:10:10:50::1
	stub-first: yes

# The reverse zone for the SRV segment is served by the same nsd, so it needs
# the same treatment or "dig -x" would go to the public root and get NXDOMAIN.
stub-zone:
	name: "50.10.10.in-addr.arpa"
	stub-addr: 10.10.50.1
	stub-first: yes

# --- private zones -------------------------------------------------------------
# RFC 6303 already makes unbound answer these locally by default.  Anything the
# lab added itself belongs here rather than in the gateway's blocklist, because
# clients never talk to the gateway.
local-zone: "guest.lab.example.org" transparent

# --- upstream forwarding (optional) --------------------------------------------
# Recursion is fine from a lab that has a normal internet connection.  On a
# network where outbound DNS is forced through a filter, forward instead:
#forward-zone:
#	name: "."
#	forward-addr: 9.9.9.9
#	forward-tls-upstream: yes
#	forward-tls-upstream also needs:
#	forward-first: no
