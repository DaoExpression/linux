#	/etc/pf.conf — db guest
#
#	Baseline shape (vms/common/etc/pf.conf) plus the one inbound service.
#	Note what is NOT here: no rule lets anything reach 5432 except the web
#	guest and the monitoring guest.  The gateway's pf.conf carries a matching
#	rule; both must allow the flow, because the traffic crosses veb1 where the
#	gateway filters it as well.

set skip on lo
set block-policy drop
set state-policy floating
set reassembly yes
set fingerprints "/etc/pf.os"
set loginterface vio0

if		= "vio0"
me		= "10.10.50.12"

mgmt_net	= "10.10.10.0/24"
srv_net		= "10.10.50.0/24"
dmz_net		= "10.10.40.0/24"
vpn_net		= "10.10.60.0/24"
gw		= "10.10.50.1"
monitor		= "10.10.50.14"
bastion		= "10.10.50.10"
web		= "10.10.40.20"

icmp_types	= "{ echoreq echorep unreach timexceed paramprob }"

match in all scrub (no-df random-id max-mss 1440)

antispoof quick for $if
block all

# --- inbound ------------------------------------------------------------------
pass in quick inet proto icmp from { $mgmt_net $srv_net } icmp-type $icmp_types keep state
pass in quick proto udp from any port bootpc to any port bootps
pass quick inet6 proto icmp6 all

pass in quick proto tcp from $mgmt_net to $me port ssh keep state
pass in quick proto tcp from $bastion to $me port ssh keep state
pass in quick proto tcp from $vpn_net to $me port ssh keep state

# --- the database ---------------------------------------------------------------
# PostgreSQL, from the web guest only.  Port name "postgresql" is in
# /etc/services; 5432 is spelled out to keep this readable next to the
# gateway's rule for the same flow.
pass in quick proto tcp from $web to $me port 5432 keep state
# The monitoring guest does not connect to the database (that would need
# credentials on another host); it polls the exporter running next to it
# instead — see the mon tree for the postgres_exporter setup.
pass in quick proto tcp from $monitor to $me port 9187 keep state

# Monitoring, time and DNS.
pass in quick proto udp from $monitor to $me port snmp keep state
pass in quick proto udp from $monitor to $me port syslog keep state
pass in quick proto udp from $gw to $me port ntp keep state
pass in quick proto { tcp udp } from $gw to $me port domain keep state

# --- outbound -----------------------------------------------------------------
# Backups go to the storage guest over NFS; log shipping and package updates go
# through the gateway.  No other outbound path is allowed.
pass out quick on $if proto { tcp udp } from $me to 10.10.50.13 port "{ 111 2049 }" keep state
pass out on $if from $me to any keep state

# ------------------------------------------------------------------ notes
# * If you move to a connection pooler (pgbouncer) later, point the web guest at
#   the pooler's port here and leave 5432 closed to everything but the pooler.
