#	/etc/collectd.conf — mon guest
#
#	Install:  pkg_add collectd
#	Check:    collectd -t
#	Apply:    rcctl restart collectd
#
#	collectd polls the lab over SNMP and ICMP, keeps the time series locally,
#	and writes the data that the report script and the web dashboard read.
#	The lab deliberately has no external time-series database: everything here
#	can be rebuilt from an OpenBSD install plus this repository.

BaseDir    "/var/db/collectd"
PIDFile    "/var/run/collectd.pid"
PluginDir  "/usr/local/lib/collectd"
TypesDB    "/usr/local/share/collectd/types.db"
Interval   30
ReadThreads 2
Hostname   "mon.lab.example.org"
FQDNLookup false		# the resolver may be down; the name is static

LoadPlugin syslog
<Plugin syslog>
	LogLevel info
</Plugin>

LoadPlugin csv
<Plugin csv>
	DataDir "/var/db/collectd/csv"
	StoreRates true
</Plugin>

LoadPlugin rrdtool
<Plugin rrdtool>
	DataDir "/var/db/collectd/rrd"
	# One RRD per metric, "average" for everything, and a 1-minute heartbeat
	# so a 30s interval has room to miss one poll without a gap.
	CacheTimeout 120
	CacheFlush 900
	CreateFilesAsync false
</Plugin>

# --- poll the lab over SNMP -----------------------------------------------------
LoadPlugin snmp
<Plugin snmp>
	# The gateway: interfaces, pf state table, IPsec, vmd's own counters if you
	# enabled the agentx line in vm.conf.
	<Data "gw_if_octets">
		Type "if_octets"
		Table true
		Instance "IF-MIB::ifName"
		Values "IF-MIB::ifHCInOctets" "IF-MIB::ifHCOutOctets"
	</Data>
	<Data "gw_if_errors">
		Type "if_errors"
		Table true
		Instance "IF-MIB::ifName"
		Values "IF-MIB::ifInErrors" "IF-MIB::ifOutErrors"
	</Data>
	<Data "gw_pf_states">
		Type "gauge"
		Table false
		Instance "pfStates"
		Values "PF-MIB::pfStateCount"
	</Data>

	<Host "gw.lab.example.org">
		Address "10.10.50.1"
		Version 2
		Community "REPLACE-ME-COMMUNITY"
		Collect "gw_if_octets" "gw_if_errors" "gw_pf_states"
		Interval 30
	</Host>

	# Every guest runs snmpd(8) with the same community but a source
	# restriction; repeat this block per guest, or generate it from the
	# addressing plan with the script in /usr/local/sbin/.
	<Host "bastion.lab.example.org">
		Address "10.10.50.10"
		Version 2
		Community "REPLACE-ME-COMMUNITY"
		Collect "gw_if_octets" "gw_if_errors"
		Interval 30
	</Host>
	<Host "db.lab.example.org">
		Address "10.10.50.12"
		Version 2
		Community "REPLACE-ME-COMMUNITY"
		Collect "gw_if_octets" "gw_if_errors"
		Interval 30
	</Host>
	<Host "storage.lab.example.org">
		Address "10.10.50.13"
		Version 2
		Community "REPLACE-ME-COMMUNITY"
		Collect "gw_if_octets" "gw_if_errors"
		Interval 30
	</Host>
	<Host "web.lab.example.org">
		Address "10.10.40.20"
		Version 2
		Community "REPLACE-ME-COMMUNITY"
		Collect "gw_if_octets" "gw_if_errors"
		Interval 30
	</Host>
	<Host "mail.lab.example.org">
		Address "10.10.40.21"
		Version 2
		Community "REPLACE-ME-COMMUNITY"
		Collect "gw_if_octets" "gw_if_errors"
		Interval 30
	</Host>
</Plugin>

# --- latency and reachability ---------------------------------------------------
LoadPlugin ping
<Plugin ping>
	# The frontier: the gateway, every guest, and the ISP's first hop as soon
	# as the script below has run once and recorded it.
	Host "10.10.50.1"
	Host "10.10.10.1"
	Host "10.10.50.10"
	Host "10.10.50.11"
	Host "10.10.50.12"
	Host "10.10.50.13"
	Host "10.10.40.20"
	Host "10.10.40.21"
	Interval 10
	Timeout 2
	TTL 255
	SourceAddress "10.10.50.14"
</Plugin>

# --- local resources ------------------------------------------------------------
LoadPlugin cpu
LoadPlugin load
LoadPlugin memory
LoadPlugin df
<Plugin df>
	# Warn before a log volume fills: the collector stops writing, and then you
	# are blind exactly when you need the data.
	ReportByDevice true
	ValuesPercentage true
	FSType "ffs"
	IgnoreSelected false
</Plugin>
LoadPlugin disk
LoadPlugin interface
<Plugin interface>
	Interface "vio0"
	IgnoreSelected false
</Plugin>

# --- write the data somewhere useful -------------------------------------------
# The web guest reads the CSV/RRD trees over NFS from the storage guest; the
# "mount" line has to exist there first.  Keeping collection and presentation
# apart means the dashboard can be rebuilt without losing history.
#LoadPlugin network
#<Plugin network>
#	<Server "10.10.40.20" "25826">
#	</Server>
#</Plugin>

# --- notes ----------------------------------------------------------------------
# * Version 3 (v3) SNMP with per-host credentials is the upgrade path: replace
#   the Community lines with User/SecurityLevel/AuthProtocol/AuthPassword/
#   PrivProtocol/PrivPassword once the monitoring host has its own SNMPv3 user
#   on each agent (see the gateway's snmpd.conf for the syntax).
# * collectd's rrdtool plugin needs the "rrdtool" package; it is a dependency of
#   collectd in ports, so pkg_add handles it.
