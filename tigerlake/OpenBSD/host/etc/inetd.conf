#	/etc/inetd.conf — gateway
#
#	inetd(8) is enabled purely to serve ftpd(8) on the DMZ; everything else
#	the gateway runs is a supervised daemon started by rc(8).  Keep it that
#	way: a service that is not listed here is not reachable through inetd.
#
#	format: service	socket_type	proto	flags	user	server	args

# ftpd(8) for the internal mirror of OpenBSD install sets.
#	-ll  log every ftp/who command
#	-U   log all file transfers to /var/log/xferlog
#	-a   use /etc/ftpchroot (chroot anonymous/mirror users)
#	-t   idle timeout in seconds
ftp	stream	tcp	nowait	root	/usr/libexec/ftpd	ftpd -llUa -t 300

