#	/etc/doas.conf — validated on every doas(1) invocation.
#	A syntax error here means doas refuses *everything*, so check it with
#	"doas -C /etc/doas.conf" (or just run doas) after every edit.

# wheel members get a normal root shell with their own password.
permit persist :wheel

# Day-to-day privileged operations, no password.  Note that a permit line
# without "args" allows *any* arguments to that command.
permit nopass keepenv :wheel cmd /sbin/pfctl
permit nopass keepenv :wheel cmd /usr/sbin/rcctl
permit nopass keepenv :wheel cmd /usr/sbin/vmctl
permit nopass keepenv :wheel cmd /sbin/shutdown args -p now
permit nopass keepenv :wheel cmd /sbin/reboot
permit nopass keepenv :wheel cmd /usr/sbin/pkg_add
permit nopass keepenv :wheel cmd /usr/sbin/pkg_delete
permit nopass keepenv :wheel cmd /usr/sbin/pkg_info

# Configuration deployment: only the deploy script's own wrapper, so an
# operator cannot rewrite /etc by hand through doas.
permit nopass keepenv :wheel cmd /usr/local/sbin/deploy-config

# Read-only diagnostics used by the log-watch wrapper.
permit nopass keepenv :wheel cmd /usr/bin/tail args -f /var/log/messages
permit nopass keepenv :wheel cmd /usr/sbin/tcpdump args -n -e -ttt -i pflog0

# The backup account may only run rsync as a server/client, never a shell.
permit nopass :backup cmd /usr/bin/rsync

# Explicitly deny everything else for the monitor account.
deny :monitor
