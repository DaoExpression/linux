# =============================================================================
# /etc/portage/make.conf
#
# Target: Dell Tiger Lake laptop (11th Gen Core, Iris Xe + NVIDIA MX450),
#         Gentoo OpenRC, X11 desktop driven by i3. No GNOME/KDE/other DE.
#
# Profile to select (see make.conf.md):
#     eselect profile set default/linux/amd64/23.0/desktop
#
# The `desktop` profile is the DE-agnostic desktop profile: it is the
# documented choice for any graphical system (WM, X11/Wayland) and pulls in
# none of GNOME, Plasma or any other desktop environment.
# =============================================================================

# --- Toolchain / optimization ------------------------------------------------
# Prefer that CPU_FLAGS_X86 (below) and -march=native are reviewed; see
# https://wiki.gentoo.org/wiki/Safe_CFLAGS
COMMON_FLAGS="-O2 -pipe -march=native"
# Hardening: strong stack protector + no-PLT. Modern GCC defaults already
# enable PIE and SSP; this makes the intent explicit and portable.
CFLAGS="${COMMON_FLAGS} -fstack-protector-strong -fno-plt"
CXXFLAGS="${CFLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
# Full RELRO + immediate binding (bind now) for every linked binary.
LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,-z,relro,-z,now"

# Do not list CHOST: profile 23.0 sets it (and changing it needs a rebuild).

# --- Parallelism -------------------------------------------------------------
# 4 physical cores with Hyper-Threading (8 threads). Guideline: the smaller
# of thread count and RAM/2GiB. Adjust down if the machine has only 8GiB RAM.
MAKEOPTS="-j8 -l8"
EMERGE_DEFAULT_OPTS="--jobs=4 --load-average=8 --with-bdeps=y --quiet-build=y"

# --- Portage behaviour -------------------------------------------------------
# parallel-fetch: download while building. distlocks protects DISTDIR.
FEATURES="parallel-fetch"

# --- Licenses ----------------------------------------------------------------
# Free software, plus the binary-redistributable set needed for firmware
# (linux-firmware, intel-microcode, sof-firmware ...). Everything else, in
# particular EULAs, stays rejected.
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

# --- USE flags ---------------------------------------------------------------
# Kept deliberately small: the `desktop` profile already provides the desktop
# baseline. Here we pin the session/audio/device bits and ensure nothing pulls
# in a desktop environment.
USE="
	X
	alsa
	bluetooth
	dbus
	elogind
	policykit
	udisks
	upower
	udev
	-systemd
	-gnome
	-kde
	-plasma
"

# --- CPU features (Tiger Lake, no AVX-512 on UP3/H35 client parts) -----------
# Generated on the target with: emerge app-portage/cpuid2cpuflags && cpuid2cpuflags
# Current guidance prefers putting this in /etc/portage/package.use/00cpu-flags
# as "*/* CPU_FLAGS_X86: ..." instead; it is kept here so the whole build
# profile lives in one file.
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand rdseed sha sse sse2 sse3 sse4_1 sse4_2 ssse3"

# --- Video -------------------------------------------------------------------
# Intel Iris Xe (00:02.0) via Mesa `intel`; NVIDIA MX450 (01:00.0, Turing)
# via the in-tree `nouveau`, matching the kernel config in this directory.
VIDEO_CARDS="intel nouveau"

# --- Bootloader (GRUB on UEFI, matching the kernel's EFI stub) ---------------
GRUB_PLATFORMS="efi-64"

# --- Mirrors (optional; uncomment and tailor for your region) ---------------
GENTOO_MIRRORS="https://distfiles.gentoo.org"
