#	/etc/radvd.conf — gateway
#
#	Validate:  radvd -c            (config check, then exits)
#	Apply:     rcctl reload radvd
#
#	The WAN gets a real prefix by SLAAC from the ISP.  OpenBSD has no
#	DHCPv6-PD client in base, so the internal segments are numbered out of a
#	ULA prefix (fd00:10:10::/48, one /64 per VLAN — see the addressing plan)
#	and that is what gets advertised here.
#
#	IPv6 DNS is deliberately NOT announced (the RDNSS blocks are commented
#	below): clients take their resolvers from the DHCPv4 answer, which is
#	10.10.50.11.  If you enable RDNSS you must also allow the client networks
#	to reach fd00:10:10:50::11 on port 53 in /etc/pf.conf.

# ------------------------------------------------------------------ USERS
interface vlan20 {
	IgnoreIfMissing on;		# do not abort if the VLAN is not up yet
	AdvSendAdvert on;
	AdvLinkMTU 1500;

	# Advertise the router more often than the default 200s so that laptops
	# coming out of sleep renumber quickly.
	MinRtrAdvInterval 30;
	MaxRtrAdvInterval 100;
	AdvDefaultLifetime 300;

	# There is no DHCPv6 server: addresses are autonomous (SLAAC), and all
	# other information comes from DHCPv4.
	AdvManagedFlag off;
	AdvOtherConfigFlag off;

	prefix fd00:10:10:20::/64 {
		AdvOnLink on;
		AdvAutonomous on;
		AdvRouterAddr off;	# do not advertise the link-local address
		AdvValidLifetime 86400;
		AdvPreferredLifetime 14400;
	};

	# RDNSS fd00:10:10:50::11 {	# the dns VM (unbound)
	#	AdvRDNSSLifetime 600;
	# };
	# DNSSL lab.example.org {
	#	AdvDNSSLLifetime 600;
	# };
};

# ------------------------------------------------------------------ GUEST
interface vlan30 {
	IgnoreIfMissing on;
	AdvSendAdvert on;
	AdvLinkMTU 1500;
	MinRtrAdvInterval 30;
	MaxRtrAdvInterval 100;
	AdvDefaultLifetime 300;
	AdvManagedFlag off;
	AdvOtherConfigFlag off;

	prefix fd00:10:10:30::/64 {
		AdvOnLink on;
		AdvAutonomous on;
		AdvRouterAddr off;
		# Short lifetimes: guests are transient, and a smaller address
		# cache means less state to leak between visitors.
		AdvValidLifetime 7200;
		AdvPreferredLifetime 3600;
	};
};
